function BackupPage(){
  const [status,setStatus]=useState('');
  const [progress,setProgress]=useState(0);

  const tables=['jobs','batches','line_items','clients','firms','products','materials','suppliers','machines','outsource_agencies','delivery_boys','team_members','grn','print_logs','fab_logs','outsource_logs','dispatch_logs','expenses','client_notes'];

  const doBackup=async()=>{
    setStatus('Starting backup...');setProgress(0);
    const backup={exported_at:new Date().toISOString(),erp_version:'iPrint ERP v2.0',tables:{}};
    for(let i=0;i<tables.length;i++){
      const t=tables[i];
      setStatus(`Exporting ${t}...`);setProgress(Math.round((i/tables.length)*100));
      try{
        let all=[];let from=0;const size=1000;
        while(true){
          const {data,error}=await sb.from(t).select('*').range(from,from+size-1);
          if(error||!data||data.length===0)break;
          all=all.concat(data);
          if(data.length<size)break;
          from+=size;
        }
        backup.tables[t]={count:all.length,data:all};
      }catch(e){backup.tables[t]={count:0,data:[],error:e.message};}
    }
    setProgress(100);setStatus('Creating download file...');
    const json=JSON.stringify(backup,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date();
    a.href=url;a.download=`iprint-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
    a.click();URL.revokeObjectURL(url);
    const totalRows=Object.values(backup.tables).reduce((s,t)=>s+t.count,0);
    setStatus(`✅ Backup complete! ${tables.length} tables, ${totalRows.toLocaleString()} total rows exported.`);
  };

  const doCSVBackup=async()=>{
    setStatus('Starting CSV export...');setProgress(0);
    const csvFiles=[];
    for(let i=0;i<tables.length;i++){
      const t=tables[i];
      setStatus(`Exporting ${t}...`);setProgress(Math.round((i/tables.length)*100));
      try{
        let all=[];let from=0;const size=1000;
        while(true){
          const {data,error}=await sb.from(t).select('*').range(from,from+size-1);
          if(error||!data||data.length===0)break;
          all=all.concat(data);if(data.length<size)break;from+=size;
        }
        if(all.length>0){
          const headers=Object.keys(all[0]);
          const csv=[headers.join(','),...all.map(row=>headers.map(h=>{const v=row[h];if(v==null)return '';const s=typeof v==='object'?JSON.stringify(v):String(v);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;}).join(','))].join('\n');
          csvFiles.push({name:t+'.csv',content:csv});
        }
      }catch(e){}
    }
    setProgress(100);setStatus('Creating ZIP-like download...');
    // Download each CSV individually (simple approach)
    for(const f of csvFiles){
      const blob=new Blob([f.content],{type:'text/csv'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=f.name;a.click();URL.revokeObjectURL(url);
    }
    setStatus(`✅ CSV Export complete! ${csvFiles.length} files downloaded.`);
  };

  return <div style={{display:"flex",flexDirection:"column",gap:12,maxWidth:700}}>
    <div className="c" style={{padding:16}}>
      <h3 style={{fontSize:14,fontWeight:700,marginBottom:4}}>💾 Database Backup</h3>
      <p style={{fontSize:11,color:"#64748b",marginBottom:12}}>Export all iPrint ERP data as a backup file. This includes all jobs, batches, line items, clients, materials, GRN, expenses, and more.</p>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <button className="b bp" onClick={doBackup} style={{padding:"10px 20px",fontSize:12}}>📦 Full Backup (JSON)</button>
        <button className="b" onClick={doCSVBackup} style={{padding:"10px 20px",fontSize:12}}>📊 Export as CSV files</button>
      </div>
      {status&&<div style={{background:"#060810",border:"1px solid #1a2030",borderRadius:8,padding:12}}>
        {progress>0&&progress<100&&<div style={{height:4,background:"#1a2030",borderRadius:2,marginBottom:8,overflow:"hidden"}}><div style={{height:"100%",width:progress+"%",background:"#e3a008",borderRadius:2,transition:"width .3s"}}/></div>}
        <p style={{fontSize:11,color:status.startsWith('✅')?'#4ade80':'#e3a008'}}>{status}</p>
      </div>}
    </div>
    <div className="c" style={{padding:16}}>
      <h3 style={{fontSize:14,fontWeight:700,marginBottom:4}}>🔒 Security Status</h3>
      <p style={{fontSize:11,color:"#64748b",marginBottom:8}}>Row Level Security (RLS) protects your database from unauthorized access.</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
        {tables.map(t=><div key={t} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 8px",background:"#060810",borderRadius:5,border:"1px solid #1a2030"}}>
          <span style={{color:"#4ade80",fontSize:10}}>🛡️</span>
          <span style={{fontSize:10}}>{t}</span>
        </div>)}
      </div>
    </div>
    <div className="c" style={{padding:16}}>
      <h3 style={{fontSize:14,fontWeight:700,marginBottom:4}}>📋 Backup Best Practices</h3>
      <div style={{fontSize:11,color:"#8b949e",lineHeight:1.6}}>
        <p>• Take a backup <strong style={{color:"#e3a008"}}>every week</strong> — download the JSON file and save it to Google Drive or a USB drive</p>
        <p>• The JSON backup contains ALL data and can be used to restore if needed</p>
        <p>• CSV export is useful for opening in Excel for reports and analysis</p>
        <p>• Supabase also maintains automatic daily backups on their servers</p>
        <p>• Your data is stored on <strong style={{color:"#4ade80"}}>AWS cloud servers</strong> in Mumbai region</p>
      </div>
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════
function SalesCRMPage({activities,setActivities,jobs,clients,firms,team,user,show,sm}){
  const [tab,setTab]=useState('visits');
  const [showAdd,setShowAdd]=useState(false);
  const [sq,setSq]=useState('');
  const [dateFrom,setDateFrom]=useState('');
  const [dateTo,setDateTo]=useState('');
  const [repFilter,setRepFilter]=useState('All');
  const INDUSTRIES=['Architecture Firm','Interior Design Firm','Interior and Architecture Design Firm','Contractor','PMC','Tech Company','Finance Company','Design Agency','Developers/Building contractors','Other'];
  const PRODUCTS=['Vinyl','Glass Film','Signage','BENIF','Canvas','Frames','Wallpaper','3D Graphics','Acoustic','Suncontrol Film','PPF Film','Environmental Branding','Other'];
  const FEEDBACKS=['Yes','No','They will contact Us','Called Again Later','Followup Required','Referred to other team'];
  const RESPONSES=['Positive - Enquiry Started','Asked for Sample','Asked to Visit Again','Followup needed','Pricing too High','Have other vendor','Negative - Not using our products','Reference shared'];
  const STATUSES=['Open','Quoted','Follow-up','Sample Sent','Won','Lost','On Hold'];
  const PROJ_STATUSES=['Design Pending','Mockup Pending','Artwork approved','Cost approval Pending','Sampling done','Installation Pending','On hold','Completed'];
  const salesReps=[...new Set(activities.map(a=>a.rep_name).filter(Boolean))];
  if(!salesReps.includes('BATUL A'))salesReps.unshift('BATUL A');

  const [nf,setNf]=useState({date:td(),client_type:'New Client',firm_name:'',industry:INDUSTRIES[0],mobile:'',landline:'',email:'',address:'',contact_person:'',designation:'',feedback:FEEDBACKS[0],product_pitched:PRODUCTS[0],response:RESPONSES[0],action_taken:'',pipeline_project:'',pipeline_date:'',pipeline_product:'',pipeline_qty:'',ref_name1:'',ref_company1:'',ref_name2:'',ref_company2:'',remarks:'',revisit_date:'',estimated_value:'',actual_value:'',rep_name:user?.name?.includes('BATUL')?'BATUL A':user?.name||''});

  const filtered=useMemo(()=>{
    let f=activities;
    if(sq){const q=sq.toLowerCase();f=f.filter(a=>a.firm_name?.toLowerCase().includes(q)||a.contact_person?.toLowerCase().includes(q)||a.client_name?.toLowerCase().includes(q)||a.project?.toLowerCase().includes(q)||a.pipeline_project?.toLowerCase().includes(q)||a.product_pitched?.toLowerCase().includes(q));}
    if(repFilter!=='All')f=f.filter(a=>a.rep_name===repFilter);
    if(dateFrom)f=f.filter(a=>a.date>=dateFrom);
    if(dateTo)f=f.filter(a=>a.date<=dateTo);
    return f.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  },[activities,sq,repFilter,dateFrom,dateTo]);

  const visits=filtered.filter(a=>a.activity_type==='visit');
  const pipeline=filtered.filter(a=>a.activity_type==='project');

  // Stats
  const stats=useMemo(()=>{
    const thisMonth=td().slice(0,7);
    const today=td();
    const monthActs=activities.filter(a=>a.date?.startsWith(thisMonth));
    const todayActs=activities.filter(a=>a.date===today);
    const newClients=activities.filter(a=>a.client_type==='New Client');
    const pipelineActs=activities.filter(a=>a.activity_type==='project');
    const wonActs=pipelineActs.filter(a=>a.status==='Won'||a.status==='Completed');
    return {
      totalVisits:activities.filter(a=>a.activity_type==='visit').length,
      monthVisits:monthActs.filter(a=>a.activity_type==='visit').length,
      todayVisits:todayActs.filter(a=>a.activity_type==='visit').length,
      newClients:newClients.length,
      repeatClients:activities.filter(a=>a.client_type==='Old Client').length,
      totalPipeline:pipelineActs.length,
      activePipeline:pipelineActs.filter(a=>!['Won','Lost','Completed'].includes(a.status)).length,
      won:wonActs.length,
      products:{},
    };
  },[activities]);

  // Product breakdown
  const productStats=useMemo(()=>{
    const p={};activities.forEach(a=>{const pr=a.product_pitched||a.pipeline_product;if(pr)pr.split(',').forEach(x=>{const k=x.trim();if(k&&k!=='No Data Shared by Batul')p[k]=(p[k]||0)+1;});});
    return Object.entries(p).sort((a,b)=>b[1]-a[1]);
  },[activities]);

  const addVisit=async()=>{
    if(!nf.firm_name.trim()){alert('Enter firm name');return;}
    const id='SA'+Date.now()+Math.random().toString(36).slice(2,5);
    const rec={id,date:nf.date,activity_type:'visit',rep_name:nf.rep_name,client_type:nf.client_type,firm_name:nf.firm_name,client_name:nf.firm_name,industry:nf.industry,mobile:nf.mobile,landline:nf.landline,email:nf.email,address:nf.address,contact_person:nf.contact_person,designation:nf.designation,description:nf.feedback,product_pitched:nf.product_pitched,outcome:nf.response,follow_up_notes:nf.action_taken,pipeline_project:nf.pipeline_project,pipeline_date:nf.pipeline_date,pipeline_product:nf.pipeline_product,pipeline_qty:nf.pipeline_qty,ref_name1:nf.ref_name1,ref_company1:nf.ref_company1,ref_name2:nf.ref_name2,ref_company2:nf.ref_company2,remarks:nf.remarks,follow_up_date:nf.revisit_date,estimated_value:+nf.estimated_value||null,actual_value:+nf.actual_value||null,status:'Open',created_at:new Date().toISOString()};
    const {error}=await sb.from('sales_activities').insert(rec);
    if(!error){setActivities(p=>[rec,...p]);setShowAdd(false);show('Visit logged!');
      setNf(p=>({...p,firm_name:'',mobile:'',landline:'',email:'',address:'',contact_person:'',designation:'',feedback:FEEDBACKS[0],product_pitched:PRODUCTS[0],response:RESPONSES[0],action_taken:'',pipeline_project:'',pipeline_date:'',pipeline_product:'',pipeline_qty:'',ref_name1:'',ref_company1:'',ref_name2:'',ref_company2:'',remarks:'',revisit_date:'',estimated_value:'',actual_value:''}));
    } else show('Error: '+error.message,false);
  };

  const deleteAct=async(id)=>{
    const role=user?.role||'';
    if(!['admin','sales'].includes(role)){show('Only admin/sales can delete',false);return;}
    if(!confirm('Delete this activity?'))return;
    await sb.from('sales_activities').delete().eq('id',id);
    setActivities(p=>p.filter(a=>a.id!==id));show('Deleted');
  };

  const updateAct=async(id,field,value)=>{
    // 26 Apr 26 — added visible error toast. Was failing silently, masking write issues
    // (see Bundle 2A debug: ₹ inline edits weren't persisting and there was no way to see why).
    const {error}=await sb.from('sales_activities').update({[field]:value}).eq('id',id);
    if(error){show('⚠️ Save failed: '+(error.message||'unknown error'),false);console.error('updateAct failed',{id,field,value,error});return;}
    setActivities(p=>p.map(a=>a.id===id?{...a,[field]:value}:a));
    if(field==='estimated_value'||field==='actual_value')show('💰 ₹ saved');
  };

  const ins={className:"in",style:{fontSize:10,padding:'4px 6px'}};

  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    {/* Tabs + Actions */}
    <div style={{display:"flex",justifyContent:"space-between",gap:4,flexWrap:"wrap",alignItems:"center"}}>
      <div style={{display:"flex",gap:3}}>
        {[{id:'dashboard',l:'📊 Dashboard'},{id:'visits',l:'🚶 Site Visits'},{id:'pipeline',l:'📋 Pipeline'},{id:'reports',l:'📈 Reports'}].map(t=><button key={t.id} className={`b ${tab===t.id?'bp':''}`} onClick={()=>setTab(t.id)} style={{fontSize:10}}>{t.l}</button>)}
      </div>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <select className="in" value={repFilter} onChange={e=>setRepFilter(e.target.value)} style={{fontSize:10,padding:'4px',width:130}}><option value="All">All Reps</option>{salesReps.map(r=><option key={r}>{r}</option>)}</select>
        <input className="in" type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} style={{fontSize:9,padding:'3px',width:110}} title="From date"/>
        <input className="in" type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} style={{fontSize:9,padding:'3px',width:110}} title="To date"/>
        <div style={{position:"relative"}}><input className="in" placeholder="🔍 Search..." value={sq} onChange={e=>setSq(e.target.value)} style={{width:160,fontSize:10}}/></div>
        <button className="b bp" onClick={()=>setShowAdd(true)} style={{fontSize:10}}>➕ Log Visit</button>
      </div>
    </div>

    {/* DASHBOARD TAB */}
    {tab==='dashboard'&&<div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:7,marginBottom:12}}>
        <div className="c a" style={{padding:10}}><p style={{fontSize:8,color:"#64748b"}}>TOTAL VISITS</p><p style={{fontSize:22,fontWeight:800,color:"#3b82f6"}}>{stats.totalVisits}</p></div>
        <div className="c a" style={{padding:10}}><p style={{fontSize:8,color:"#64748b"}}>THIS MONTH</p><p style={{fontSize:22,fontWeight:800,color:"#8b5cf6"}}>{stats.monthVisits}</p></div>
        <div className="c a" style={{padding:10}}><p style={{fontSize:8,color:"#64748b"}}>TODAY</p><p style={{fontSize:22,fontWeight:800,color:"#e3a008"}}>{stats.todayVisits}</p></div>
        <div className="c a" style={{padding:10}}><p style={{fontSize:8,color:"#64748b"}}>NEW CLIENTS</p><p style={{fontSize:22,fontWeight:800,color:"#10b981"}}>{stats.newClients}</p></div>
        <div className="c a" style={{padding:10}}><p style={{fontSize:8,color:"#64748b"}}>REPEAT CLIENTS</p><p style={{fontSize:22,fontWeight:800,color:"#06b6d4"}}>{stats.repeatClients}</p></div>
        <div className="c a" style={{padding:10}}><p style={{fontSize:8,color:"#64748b"}}>PIPELINE</p><p style={{fontSize:22,fontWeight:800,color:"#f59e0b"}}>{stats.activePipeline}</p></div>
        <div className="c a" style={{padding:10}}><p style={{fontSize:8,color:"#64748b"}}>WON</p><p style={{fontSize:22,fontWeight:800,color:"#4ade80"}}>{stats.won}</p></div>
      </div>
      <div className="c" style={{padding:10}}>
        <p style={{fontSize:11,fontWeight:700,color:"#e3a008",marginBottom:8}}>🏷️ Products Pitched (Frequency)</p>
        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{productStats.map(([p,c])=><span key={p} className="bd" style={{background:"#3b82f620",color:"#3b82f6",fontSize:10,padding:"3px 8px"}}>{p} <b>{c}</b></span>)}</div>
      </div>
    </div>}

    {/* VISITS TAB */}
    {tab==='visits'&&<div className="c" style={{padding:0}}>
      <div style={{padding:"6px 8px",borderBottom:"2px solid #3b82f6",background:"#0a0f1a"}}><span style={{fontSize:10,fontWeight:700,color:"#3b82f6"}}>🚶 Site Visits — {visits.length} records{sq?` matching "${sq}"`:''}</span></div>
      <div style={{overflowX:"auto",maxHeight:"calc(100vh-200px)"}}><table><thead><tr><th>Date</th><th>New/Old</th><th>Firm</th><th>Industry</th><th>Contact</th><th>Phone</th><th>Feedback</th><th>Product</th><th>Response</th><th>Action</th><th>Pipeline</th><th>Est ₹</th><th>Act ₹</th><th>Re-visit</th><th>Rep</th><th></th></tr></thead><tbody>
        {visits.map(a=><tr key={a.id}>
          <td style={{fontSize:9,whiteSpace:"nowrap"}}>{a.date}</td>
          <td><span className="bd" style={{background:a.client_type==='New Client'?'#10b98120':'#06b6d420',color:a.client_type==='New Client'?'#10b981':'#06b6d4',fontSize:8}}>{a.client_type==='New Client'?'NEW':'OLD'}</span></td>
          <td style={{fontSize:10,fontWeight:600,maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={a.firm_name}>{a.firm_name}</td>
          <td style={{fontSize:8,color:"#64748b"}}>{a.industry?.slice(0,15)}</td>
          <td style={{fontSize:9}} title={a.designation}>{a.contact_person?.slice(0,15)}</td>
          <td style={{fontSize:8,color:"#64748b"}}>{a.mobile?.slice(0,12)}</td>
          <td style={{fontSize:8}}>{a.description?.slice(0,18)}</td>
          <td style={{fontSize:9,color:"#8b5cf6"}}>{a.product_pitched?.slice(0,15)}</td>
          <td style={{fontSize:8,color:a.outcome?.includes('Positive')?'#4ade80':a.outcome?.includes('Negative')?'#f47067':'#e3a008'}}>{a.outcome?.slice(0,20)}</td>
          <td style={{fontSize:8,color:"#64748b"}}>{a.follow_up_notes?.slice(0,15)}</td>
          <td style={{fontSize:8,color:"#f59e0b"}}>{a.pipeline_project?.slice(0,15)}</td>
          <td><input type="number" min="0" step="0.01" defaultValue={a.estimated_value||''} placeholder="—" onBlur={e=>{const raw=e.target.value;const v=raw===''?null:+raw;const cur=a.estimated_value==null||a.estimated_value===''?null:+a.estimated_value;if(v!==cur)updateAct(a.id,'estimated_value',v);}} style={{width:70,fontSize:9,padding:'2px 4px',background:'#0c1017',border:'1px solid #1a2030',color:'#10b981',textAlign:'right'}}/></td>
          <td><input type="number" min="0" step="0.01" defaultValue={a.actual_value||''} placeholder="—" onBlur={e=>{const raw=e.target.value;const v=raw===''?null:+raw;const cur=a.actual_value==null||a.actual_value===''?null:+a.actual_value;if(v!==cur)updateAct(a.id,'actual_value',v);}} style={{width:70,fontSize:9,padding:'2px 4px',background:'#0c1017',border:'1px solid #1a2030',color:'#4ade80',textAlign:'right'}}/></td>
          <td style={{fontSize:8}}>{a.follow_up_date||'—'}</td>
          <td style={{fontSize:8,color:"#64748b"}}>{a.rep_name?.slice(0,10)}</td>
          <td><button style={{background:"none",border:"none",color:"#f47067",cursor:"pointer",fontSize:9}} onClick={()=>deleteAct(a.id)}>✕</button></td>
        </tr>)}
        {visits.length===0&&<tr><td colSpan={16} style={{textAlign:"center",color:"#64748b",padding:20}}>No visits found</td></tr>}
      </tbody></table></div>
    </div>}

    {/* PIPELINE TAB */}
    {tab==='pipeline'&&<div className="c" style={{padding:0}}>
      <div style={{padding:"6px 8px",borderBottom:"2px solid #f59e0b",background:"#0a0f1a"}}><span style={{fontSize:10,fontWeight:700,color:"#f59e0b"}}>📋 Active Pipeline — {pipeline.length} projects</span></div>
      <div style={{overflowX:"auto",maxHeight:"calc(100vh-200px)"}}><table><thead><tr><th>Job#</th><th>Project</th><th>Client</th><th>Contact</th><th>Location</th><th>Product</th><th>Est ₹</th><th>Act ₹</th><th>Status</th><th>Phase</th><th>Updates</th><th>Start</th><th></th></tr></thead><tbody>
        {pipeline.map(a=><tr key={a.id}>
          <td style={{fontSize:10,color:"#e3a008",fontWeight:700}}>{a.job_id||'—'}</td>
          <td style={{fontSize:10,fontWeight:600,maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={a.project}>{a.project||a.pipeline_project}</td>
          <td style={{fontSize:10}}>{a.client_name?.slice(0,18)}</td>
          <td style={{fontSize:9}}>{a.contact_person?.slice(0,15)}</td>
          <td style={{fontSize:8,color:"#64748b"}}>{a.location?.slice(0,15)}</td>
          <td style={{fontSize:9,color:"#8b5cf6"}}>{a.product_pitched?.slice(0,18)}</td>
          <td><input type="number" min="0" step="0.01" defaultValue={a.estimated_value||''} placeholder="—" onBlur={e=>{const raw=e.target.value;const v=raw===''?null:+raw;const cur=a.estimated_value==null||a.estimated_value===''?null:+a.estimated_value;if(v!==cur)updateAct(a.id,'estimated_value',v);}} style={{width:80,fontSize:9,padding:'2px 4px',background:'#0c1017',border:'1px solid #1a2030',color:'#10b981',textAlign:'right'}}/></td>
          <td><input type="number" min="0" step="0.01" defaultValue={a.actual_value||''} placeholder="—" onBlur={e=>{const raw=e.target.value;const v=raw===''?null:+raw;const cur=a.actual_value==null||a.actual_value===''?null:+a.actual_value;if(v!==cur)updateAct(a.id,'actual_value',v);}} style={{width:80,fontSize:9,padding:'2px 4px',background:'#0c1017',border:'1px solid #1a2030',color:'#4ade80',textAlign:'right'}}/></td>
          <td><select className="in" value={a.status||'Open'} onChange={e=>updateAct(a.id,'status',e.target.value)} style={{fontSize:8,padding:"2px",width:90}}>{PROJ_STATUSES.map(s=><option key={s}>{s}</option>)}</select></td>
          <td style={{fontSize:8,color:"#64748b"}}>{a.outcome?.slice(0,20)}</td>
          <td style={{fontSize:8,color:"#64748b",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={a.remarks}>{a.remarks?.slice(0,25)}</td>
          <td style={{fontSize:8}}>{a.date}</td>
          <td><button style={{background:"none",border:"none",color:"#f47067",cursor:"pointer",fontSize:9}} onClick={()=>deleteAct(a.id)}>✕</button></td>
        </tr>)}
        {pipeline.length===0&&<tr><td colSpan={13} style={{textAlign:"center",color:"#64748b",padding:20}}>No pipeline projects</td></tr>}
      </tbody></table></div>
    </div>}

    {/* REPORTS TAB */}
    {tab==='reports'&&<div style={{display:"grid",gap:8}}>
      {/* 26 Apr 26: Revenue summary — respects rep + date-range filters via `filtered` */}
      <div className="c" style={{padding:10}}>
        <p style={{fontSize:12,fontWeight:700,color:"#10b981",marginBottom:8}}>💰 Revenue Summary {repFilter!=='All'?`— ${repFilter}`:''}{(dateFrom||dateTo)?` · ${dateFrom||'…'} to ${dateTo||'…'}`:''}</p>
        {(()=>{
          const pipelineSum=filtered.reduce((s,a)=>s+(+a.estimated_value||0),0);
          const wonSum=filtered.filter(a=>a.status==='Won'||a.status==='Completed').reduce((s,a)=>s+(+a.actual_value||0),0);
          const winRate=pipelineSum>0?Math.round((wonSum/pipelineSum)*100):0;
          const fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');
          return <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:7}}>
            <div className="c a" style={{padding:10,borderColor:"#10b98144"}}><p style={{fontSize:8,color:"#64748b"}}>PIPELINE VALUE (Est.)</p><p style={{fontSize:20,fontWeight:800,color:"#10b981"}}>{fmt(pipelineSum)}</p><p style={{fontSize:8,color:"#64748b",marginTop:2}}>Sum of Estimated ₹</p></div>
            <div className="c a" style={{padding:10,borderColor:"#4ade8044"}}><p style={{fontSize:8,color:"#64748b"}}>WON VALUE (Actual)</p><p style={{fontSize:20,fontWeight:800,color:"#4ade80"}}>{fmt(wonSum)}</p><p style={{fontSize:8,color:"#64748b",marginTop:2}}>Sum of Actual ₹ where Won/Completed</p></div>
            <div className="c a" style={{padding:10,borderColor:"#e3a00844"}}><p style={{fontSize:8,color:"#64748b"}}>WIN RATE BY ₹</p><p style={{fontSize:20,fontWeight:800,color:"#e3a008"}}>{winRate}%</p><p style={{fontSize:8,color:"#64748b",marginTop:2}}>Won ₹ ÷ Pipeline ₹</p></div>
          </div>;
        })()}
      </div>
      <div className="c" style={{padding:10}}>
        <p style={{fontSize:12,fontWeight:700,color:"#e3a008",marginBottom:8}}>📊 Visit Frequency by Month</p>
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{(()=>{
          const months={};activities.filter(a=>a.activity_type==='visit').forEach(a=>{const m=a.date?.slice(0,7);if(m)months[m]=(months[m]||0)+1;});
          return Object.entries(months).sort((a,b)=>a[0].localeCompare(b[0])).map(([m,c])=><div key={m} className="c a" style={{padding:"6px 10px",minWidth:80,textAlign:"center"}}><p style={{fontSize:8,color:"#64748b"}}>{m}</p><p style={{fontSize:16,fontWeight:800,color:"#3b82f6"}}>{c}</p></div>);
        })()}</div>
      </div>
      <div className="c" style={{padding:10}}>
        <p style={{fontSize:12,fontWeight:700,color:"#e3a008",marginBottom:8}}>🏢 New vs Repeat Clients</p>
        <div style={{display:"flex",gap:8}}>
          <div className="c a" style={{padding:10,flex:1,textAlign:"center",borderColor:"#10b98144"}}><p style={{fontSize:8,color:"#64748b"}}>NEW CLIENTS</p><p style={{fontSize:28,fontWeight:800,color:"#10b981"}}>{activities.filter(a=>a.client_type==='New Client').length}</p></div>
          <div className="c a" style={{padding:10,flex:1,textAlign:"center",borderColor:"#06b6d444"}}><p style={{fontSize:8,color:"#64748b"}}>REPEAT CLIENTS</p><p style={{fontSize:28,fontWeight:800,color:"#06b6d4"}}>{activities.filter(a=>a.client_type==='Old Client').length}</p></div>
        </div>
      </div>
      <div className="c" style={{padding:10}}>
        <p style={{fontSize:12,fontWeight:700,color:"#e3a008",marginBottom:8}}>🏷️ Top Products Pitched</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:4}}>{productStats.slice(0,12).map(([p,c])=><div key={p} className="c a" style={{padding:"6px 8px",display:"flex",justifyContent:"space-between"}}><span style={{fontSize:10}}>{p}</span><span style={{fontWeight:800,color:"#8b5cf6",fontSize:12}}>{c}</span></div>)}</div>
      </div>
      <div className="c" style={{padding:10}}>
        <p style={{fontSize:12,fontWeight:700,color:"#e3a008",marginBottom:8}}>📋 Response Breakdown</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:4}}>{(()=>{
          const r={};activities.forEach(a=>{const o=a.outcome;if(o&&!o.includes('No Data'))r[o]=(r[o]||0)+1;});
          return Object.entries(r).sort((a,b)=>b[1]-a[1]).map(([k,v])=><div key={k} className="c a" style={{padding:"6px 8px",display:"flex",justifyContent:"space-between"}}><span style={{fontSize:9,color:k.includes('Positive')?'#4ade80':k.includes('Negative')?'#f47067':'#e3a008'}}>{k.slice(0,30)}</span><span style={{fontWeight:800,fontSize:11}}>{v}</span></div>);
        })()}</div>
      </div>
      <button className="b" onClick={()=>{

// JOB NOTES PAGE — For Batul/Sales to add notes without seeing job details
// ═══════════════════════════════════════════════════════════
function JobNotesPage({jobs,user,show}){
  const [sq,setSq]=useState('');
  const [selJob,setSelJob]=useState(null);
  const [notes,setNotes]=useState([]);
  const [newNote,setNewNote]=useState('');
  const [loading,setLoading]=useState(false);

  const results=useMemo(()=>{
    if(sq.length<2)return [];
    const q=sq.toLowerCase();
    return jobs.filter(j=>j.id?.toLowerCase().includes(q)||j.client_name?.toLowerCase().includes(q)||j.project?.toLowerCase().includes(q)).slice(0,15);
  },[sq,jobs]);

  const openJob=async(j)=>{
    setSelJob(j);setLoading(true);
    const {data}=await sb.from('client_notes').select('*').eq('job_id',j.id).order('created_at',{ascending:false});
    setNotes(data||[]);setLoading(false);
  };

  const addNote=async()=>{
    if(!newNote.trim()||!selJob)return;
    const rec={id:'N'+Date.now(),job_id:selJob.id,dept:user?.name||'Unknown',text:newNote.trim(),created_at:new Date().toISOString()};
    const {error}=await sb.from('client_notes').insert(rec);
    if(error){show("⚠️ Failed to save note",false);return;}
    setNotes(p=>[rec,...p]);setNewNote('');show("✅ Note added!");
  };

  const fmtDate=(d)=>{if(!d)return '';const dt=new Date(d);return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' '+dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});};

  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    <div className="c" style={{padding:12}}>
      <input className="in" value={sq} onChange={e=>{setSq(e.target.value);setSelJob(null);}} placeholder="🔍 Search by Job#, Client, or Project..." style={{fontSize:12,padding:"8px 12px",width:"100%",boxSizing:"border-box"}}/>
      {sq.length>=2&&!selJob&&<div style={{marginTop:6}}>
        {results.length===0&&<p style={{fontSize:10,color:"#64748b",padding:8}}>No jobs found</p>}
        {results.map(j=><div key={j.id} style={{padding:"6px 10px",borderBottom:"1px solid #1a2030",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}} onClick={()=>openJob(j)}>
          <div><span className="mn" style={{color:"#e3a008",fontWeight:700,fontSize:11}}>{j.id}</span><span style={{fontSize:10,color:"#c9d1d9",marginLeft:8}}>{j.client_name?.slice(0,25)}</span></div>
          <div><span style={{fontSize:9,color:"#64748b"}}>{j.project?.slice(0,20)}</span><span className="bd" style={{marginLeft:6,fontSize:8,background:j.status==='Printing'?'#ef444420':j.status==='Fabrication'?'#dc262620':'#64748b20',color:j.status==='Printing'?'#ef4444':j.status==='Fabrication'?'#dc2626':'#64748b'}}>{j.status}</span></div>
        </div>)}
      </div>}
    </div>

    {selJob&&<div className="c" style={{padding:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,paddingBottom:8,borderBottom:"1px solid #1a2030"}}>
        <div>
          <span className="mn" style={{color:"#e3a008",fontWeight:700,fontSize:14}}>{selJob.id}</span>
          <span style={{fontSize:11,color:"#c9d1d9",marginLeft:8}}>{selJob.client_name}</span>
          <span style={{fontSize:10,color:"#64748b",marginLeft:8}}>{selJob.project}</span>
        </div>
        <span className="bd" style={{fontSize:9}}>{selJob.status}</span>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:12}}>
        <input className="in" value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Type your note here..." style={{flex:1,fontSize:11,padding:"8px 10px"}} onKeyDown={e=>{if(e.key==='Enter')addNote();}}/>
        <button className="b bp" onClick={addNote} style={{padding:"8px 16px",fontSize:11}}>📝 Add Note</button>
      </div>

      {loading?<p style={{textAlign:"center",color:"#64748b",padding:16}}>Loading notes...</p>
      :notes.length===0?<p style={{textAlign:"center",color:"#64748b",padding:16,fontSize:11}}>No notes yet for this job. Add the first one!</p>
      :<div style={{display:"flex",flexDirection:"column",gap:4}}>
        {notes.map(n=><div key={n.id} style={{padding:"8px 10px",background:n.dept==='SYSTEM'?"#060810":"#0a1520",borderRadius:8,border:n.dept==='SYSTEM'?"1px solid #1a2030":"1px solid #3b82f633"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
            <span style={{fontSize:9,fontWeight:700,color:n.dept==='SYSTEM'?"#64748b":"#3b82f6"}}>{n.dept==='SYSTEM'?'🤖 System':('👤 '+n.dept)}</span>
            <span style={{fontSize:8,color:"#64748b"}}>{fmtDate(n.created_at)}</span>
          </div>
          <p style={{fontSize:10.5,color:"#c9d1d9",margin:0,lineHeight:1.4,whiteSpace:"pre-wrap"}}>{n.text}</p>
        </div>)}
      </div>}
    </div>}
  </div>;
}

// CLIENT PORTAL — Dept login + status view + notes
// ═══════════════════════════════════════════════════════════
function ClientPortal({code}){
  const [jobs,setJobs]=useState([]);const [batches,setBatches]=useState([]);const [items,setItems]=useState([]);
  const [firm,setFirm]=useState(null);const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('all');const [selJob,setSelJob]=useState(null);
  const [dept,setDept]=useState(null);
  const [noteText,setNoteText]=useState({});const [notes,setNotes]=useState({});
  const [showNewJob,setShowNewJob]=useState(false);
  const [submittingJob,setSubmittingJob]=useState(false);
  const [poEdits,setPoEdits]=useState({});
  const [portalSearch,setPortalSearch]=useState('');
  const [showBOQ,setShowBOQ]=useState(false);
  const [boqStep,setBoqStep]=useState(1);
  const [boqItems,setBoqItems]=useState([]);
  const [boqFile,setBoqFile]=useState(null);
  const [boqPO,setBoqPO]=useState(null);
  const [boqForm,setBoqForm]=useState({project:'',po_number:'',contact_person:'',contact_no:'',delivery_address:'',remark:''});
  const [boqSubmitting,setBoqSubmitting]=useState(false);
  const [boqMsg,setBoqMsg]=useState('');
  const [cjf,setCjf]=useState({project:'',contact_person:'',contact_no:'',delivery_address:'',po_number:'',email:'',remark:'',wetransfer_links:'',site_contact_person:'',site_contact_no:'',design_coord_person:'',design_coord_no:''});
  const [cjItems,setCjItems]=useState([{id:Date.now()+'',type:'',desc:'',qty:1,width:'',height:'',size_unit:'MM',material:'',notes:''}]);
  const [cjFiles,setCjFiles]=useState([]);
  const [cjMsg,setCjMsg]=useState('');

  const portalConfigs={
    'ANA':{name:'ANA Designs',match:['ANA DESIGNS'],
      logo:'https://idjeniwznjiaanaxcjvg.supabase.co/storage/v1/object/public/Uploads/logos/ana-logo.jpg',
      depts:[
      {id:'design',name:'Design Team',icon:'🎨',st:['Designing - In House','Designing - Outsource','Recee','Quotation Sent','PO Pending'],seeAll:false},
      {id:'projects',name:'Projects & Installation',icon:'🏗️',st:['Printing · In-House','Printing · Outsource','Fabrication · In-House','Fabrication · Outsource','Installation WIP','Delivered'],seeAll:false},
      {id:'purchase',name:'Purchase Team',icon:'📦',st:null,seeAll:true,canEditPO:true},
      {id:'accounts',name:'Accounts & Billing',icon:'🧾',st:['Billing Pending','Given for Billing','Billing Done','Cash Received','Cash Pending','IC Pending','DC Pending'],seeAll:false},
    ]},
  };
  const config=portalConfigs[code.toUpperCase()];

  useEffect(()=>{
    if(!config||!dept)return;
    async function load(){
      setLoading(true);
      let allJobs=[];
      for(const pattern of config.match){
        const {data:j}=await sb.from('jobs').select('id,firm,client_name,project,delivery_address,contact_person,contact_no,client_email,po_number,status,status_dates,po_file_url,design_ref_urls,created_at').ilike('client_name','%'+pattern+'%').order('id',{ascending:false});
        if(j)allJobs=[...allJobs,...j];
      }
      const seen=new Set();allJobs=allJobs.filter(j=>{if(seen.has(j.id))return false;seen.add(j.id);return true;});
      setJobs(allJobs);
      const jids=allJobs.map(x=>x.id);
      if(jids.length>0){
        const {data:b}=await sb.from('batches').select('id,job_id,date,note,status').in('job_id',jids);
        if(b){setBatches(b);const bids=b.map(x=>x.id);
          if(bids.length){const {data:li}=await sb.from('line_items').select('id,batch_id,job_id,internal_name,client_name,media,width,height,size_unit,qty,img_url').in('batch_id',bids);if(li)setItems(li);}}
        if(allJobs[0]?.firm){const {data:f}=await sb.from('firms').select('code,name,short_name').eq('code',allJobs[0].firm).single();if(f)setFirm(f);}
      }
      try{const {data:n}=await sb.from('client_notes').select('*').in('job_id',jids).order('created_at',{ascending:false});
        if(n){const g={};n.forEach(x=>{if(!g[x.job_id])g[x.job_id]=[];g[x.job_id].push(x);});setNotes(g);}
      }catch(e){}
      setLoading(false);
    }
    load();
  },[code,dept]);

  const full=jobs.map(j=>({...j,batches:batches.filter(b=>b.job_id===j.id).map(b=>({...b,items:items.filter(i=>i.batch_id===b.id).sort((a,b)=>(a.id||'').localeCompare(b.id||''))}))}));
  const sc={'Draft':'#64748b','Quotation Sent':'#3b82f6','PO Pending':'#f47067','Recee':'#f59e0b','Designing - In House':'#8b5cf6','Designing - Outsource':'#c084fc','Printing · In-House':'#06b6d4','Printing · Outsource':'#f97316','Fabrication · In-House':'#dc2626','Fabrication · Outsource':'#ea580c','Delivered':'#3b82f6','Installation WIP':'#059669','Billing Pending':'#06b6d4','Given for Billing':'#06b6d4','Cash Pending':'#e3a008','IC Pending':'#f59e0b','DC Pending':'#f59e0b','Billing Done':'#4ade80','Cash Received':'#4ade80','No Bill':'#64748b','Cancelled':'#64748b'};
  const pipeline=[{k:'quotation_sent',l:'Quote',e:'📝'},{k:'designing_in_house',l:'Design',e:'🎨'},{k:'printing_in_house',l:'Print',e:'🖨️'},{k:'fabrication_in_house',l:'Fab',e:'🔧'},{k:'installation_wip',l:'Install',e:'🔩'},{k:'delivered',l:'Delivered',e:'🚚'},{k:'billing_done',l:'Billed',e:'✅'}];
  const pipeIdx=(st)=>({'Quotation Sent':0,'PO Pending':0,'Recee':0,'Designing - In House':1,'Designing - Outsource':1,'Printing · In-House':2,'Printing · Outsource':2,'Fabrication · In-House':3,'Fabrication · Outsource':3,'Delivered':4,'Installation WIP':4,'Billing Pending':5,'Given for Billing':5,'Cash Pending':5,'IC Pending':5,'DC Pending':5,'Billing Done':6,'Cash Received':6}[st]??-1);
  const deptTabs=dept?.seeAll?[{id:'all',l:'All Jobs',icon:'📋',st:null},...(config?.depts||[]).map(d=>({id:d.id,l:d.name,icon:d.icon,st:d.st}))]:[{id:dept?.id||'all',l:dept?.name||'Jobs',icon:dept?.icon||'📋',st:dept?.st||null}];
  const curTab=deptTabs.find(t=>t.id===tab)||deptTabs[0];
  const filtered=(()=>{let f=curTab?.st?full.filter(j=>curTab.st.includes(j.status)):full;if(portalSearch){const q=portalSearch.toLowerCase();f=f.filter(j=>j.id?.toLowerCase().includes(q)||j.project?.toLowerCase().includes(q)||j.client_name?.toLowerCase().includes(q)||j.delivery_address?.toLowerCase().includes(q)||j.po_number?.toLowerCase().includes(q));}return f;})();

  const addNote=async(jobId)=>{
    const text=noteText[jobId];if(!text?.trim())return;
    const note={id:'N'+Date.now(),job_id:jobId,dept:dept.name,text:text.trim(),created_at:new Date().toISOString()};
    try{await sb.from('client_notes').insert(note);}catch(e){}
    setNotes(p=>({...p,[jobId]:[note,...(p[jobId]||[])]}));
    setNoteText(p=>({...p,[jobId]:''}));
  };

  const savePO=async(jobId,poNum)=>{
    const {error}=await sb.from('jobs').update({po_number:poNum}).eq('id',jobId);
    if(!error){setJobs(p=>p.map(j=>j.id===jobId?{...j,po_number:poNum}:j));setPoEdits(p=>({...p,[jobId]:undefined}));}
  };

  // ── Client Job Submission ──
  const ITEM_TYPES=['Graphics (Vinyl)','Graphics (Canvas)','Glass Film (Clear)','Glass Film (Frosted)','Glass Film (UV)','Glass Film (PrePrinted)','Canvas Frames','Reception Logo','Signages','Other'];
  const addCjItem=()=>setCjItems(p=>[...p,{id:Date.now()+'',type:'',desc:'',qty:1,width:'',height:'',size_unit:'MM',material:'',notes:''}]);
  const removeCjItem=(i)=>setCjItems(p=>p.filter((_,x)=>x!==i));
  const updateCjItem=(i,k,v)=>setCjItems(p=>{const n=[...p];n[i]={...n[i],[k]:v};return n;});

  const submitClientJob=async()=>{
    const missing=[];
    if(!cjf.project.trim())missing.push('Project / Site Name');
    if(!cjf.contact_person.trim())missing.push('Contact Person');
    if(!cjf.contact_no.trim())missing.push('Contact Number');
    if(!cjf.delivery_address.trim())missing.push('Delivery Address');
    if(cjItems.every(it=>!it.desc.trim()&&!it.type))missing.push('At least one item (select type or enter description)');
    if(missing.length>0){alert('⚠️ Please fill:\n\n• '+missing.join('\n• '));return;}

    setSubmittingJob(true);
    try{
      // Generate job ID with CR- prefix (Client Request)
      const now=new Date();const m=now.getMonth(),y=now.getFullYear();
      const fy=m>=3?`${String(y).slice(2)}${String(y+1).slice(2)}`:`${String(y-1).slice(2)}${String(y).slice(2)}`;
      const {data:existing}=await sb.from('jobs').select('id').like('id','%-'+fy);
      const nums=(existing||[]).map(j=>{const p=j.id?.split('-')[0];return parseInt(p)||0;});
      const nextNum=String(Math.max(0,...nums)+1).padStart(4,'0');
      const jid=nextNum+'-'+fy;

      // Upload artwork files
      const artworkUrls=[];
      for(const file of cjFiles){
        const url=await uploadFile(file,'client-artworks');
        if(url)artworkUrls.push(url);
      }

      // Build remark with WeTransfer links
      let fullRemark='[CLIENT SUBMITTED via Portal — '+config.name+']';
      if(cjf.site_contact_person.trim()||cjf.site_contact_no.trim())fullRemark+='\n📍 Site Contact: '+cjf.site_contact_person+' ('+cjf.site_contact_no+')';

  const parseBOQFile=(e)=>{
    const file=e.target.files[0];if(!file)return;
    setBoqFile(file);
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=new Uint8Array(ev.target.result);
        const wb=XLSX.read(data,{type:'array'});
        const allItems=[];
        wb.SheetNames.forEach(sn=>{
          const ws=wb.Sheets[sn];
          const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
          if(rows.length<2)return;
          // Find header row
          let hRow=0;
          for(let i=0;i<Math.min(15,rows.length);i++){
            const txt=rows[i].map(c=>String(c||'').toLowerCase()).join(' ');
            if(/(description|particular)/.test(txt)&&/(qty|quantity|uom|unit)/.test(txt)){hRow=i;break;}
          }
          const headers=rows[hRow].map(x=>String(x||'').toLowerCase().replace(/[\s\n]/g,' ').trim());
          const find=(pats)=>{for(const p of pats){const idx=headers.findIndex(c=>p.test(c));if(idx>=0)return idx;}return -1;};
          const ci={desc:find([/description|particular/]),qty:find([/^qty|quantit/]),size:find([/size/]),width:find([/width/]),height:find([/height/]),uom:find([/uom|^unit$/]),spec:find([/specification|material/]),remarks:find([/remark/])};
          for(let r=hRow+1;r<rows.length;r++){
            const row=rows[r];if(!row||row.every(c=>!c&&c!==0))continue;
            const desc=ci.desc>-1?String(row[ci.desc]||'').replace(/\n/g,' ').trim():'';
            if(!desc||/^(sub\s*total|total|gst|note)/i.test(desc))continue;
            const qty=ci.qty>-1?(+row[ci.qty]||0):0;
            if(qty<=0)continue;
            let w='',h='';
            if(ci.width>-1&&ci.height>-1){w=String(row[ci.width]||'');h=String(row[ci.height]||'');}
            else if(ci.size>-1){const s=String(row[ci.size]||'');const m=s.match(/(\d+\.?\d*)\s*[x×]\s*(\d+\.?\d*)/i);if(m){w=m[1];h=m[2];}}
            const spec=ci.spec>-1?String(row[ci.spec]||'').replace(/\n/g,' ').slice(0,80):'';
            const rem=ci.remarks>-1?String(row[ci.remarks]||'').replace(/\n/g,' ').slice(0,60):'';
            allItems.push({id:'BI'+Date.now()+r,desc:desc.slice(0,100),qty,w,h,spec,remarks:rem,sheet:sn,include:true});
          }
        });
        setBoqItems(allItems);
        if(allItems.length>0)setBoqStep(2);
        else alert('No valid items found in the file. Check that it has Description and Qty columns.');
      }catch(ex){alert('Error reading file: '+ex.message);}
    };
    reader.readAsArrayBuffer(file);
  };

  const submitBOQ=async()=>{
    const incl=boqItems.filter(it=>it.include);
    if(incl.length===0){alert('Select at least one item');return;}
    if(!boqForm.project.trim()){alert('Enter project name');return;}
    setBoqSubmitting(true);
    try{
      const now=new Date();const m=now.getMonth(),y=now.getFullYear();
      const fy=m>=3?`${String(y).slice(2)}${String(y+1).slice(2)}`:`${String(y-1).slice(2)}${String(y).slice(2)}`;
      const {data:existing}=await sb.from('jobs').select('id').like('id','%-'+fy);
      const nums=(existing||[]).map(j=>{const p=j.id?.split('-')[0];return parseInt(p)||0;});
      const nextNum=String(Math.max(0,...nums)+1).padStart(4,'0');
      const jid=nextNum+'-'+fy;

      // Upload PO file
      let poUrl='';
      if(boqPO){poUrl=await uploadFile(boqPO,'po-uploads')||'';}

      const remark='[BOQ IMPORT via Client Portal — '+config.name+' Purchase]\nFile: '+(boqFile?.name||'—')+'\nItems: '+incl.length+(boqForm.remark?'\nNote: '+boqForm.remark:'');
      const clientMatch=config.match[0]||config.name;

        made_by:'CLIENT PORTAL (Purchase)',po_number:boqForm.po_number,billing_name:clientMatch,client_gst:'',

        internal_name:it.desc,client_name:it.desc,media:it.spec||'',
        width:it.w,height:it.h,size_unit:'MM',qty:+it.qty||1,rate_mode:'UNIT',rate:0,sqft:0,total:0,gst:0,gstPct:18,amount:0,
        area:'In-house',dept_estimate:false,dept_design:false,dept_production:false,dept_printing:false,
        dept_fabrication:false,dept_dispatch:false,dept_installation:false,dept_accounts:false,img_url:''}));
      if(lineItems.length)await sb.from('line_items').insert(lineItems);

      await sb.from('client_notes').insert({id:'N'+Date.now(),job_id:jid,dept:'PURCHASE — '+config.name,

        created_at:new Date().toISOString()});

      setBoqMsg('✅ Job '+jid+' created with '+incl.length+' items!'+(poUrl?' PO copy uploaded.':''));

          +'Job #: '+jid+'\n'
          +'Client: '+config.name+'\n'
          +'Project: '+boqForm.project+'\n'
          +'PO #: '+(boqForm.po_number||'—')+'\n'
          +'Items: '+incl.length+'\n'
          +(poUrl?'📎 PO Copy attached\n':'')
          +'\nPlease review in iPrint ERP.';

      }catch(e){console.log('WA notification error:',e);}

      // Refresh after delay
      setTimeout(()=>{setShowBOQ(false);setBoqStep(1);setBoqItems([]);setBoqFile(null);setBoqPO(null);setBoqMsg('');
        setBoqForm({project:'',po_number:'',contact_person:'',contact_no:'',delivery_address:'',remark:''});
        (async()=>{let allJobs=[];for(const pattern of config.match){const {data:j}=await sb.from('jobs').select('id,firm,client_name,project,delivery_address,contact_person,contact_no,client_email,po_number,status,status_dates,po_file_url,design_ref_urls,created_at').ilike('client_name','%'+pattern+'%').order('id',{ascending:false});if(j)allJobs=[...allJobs,...j];}
        const seen=new Set();allJobs=allJobs.filter(j=>{if(seen.has(j.id))return false;seen.add(j.id);return true;});setJobs(allJobs);
        const jids=allJobs.map(x=>x.id);if(jids.length>0){const {data:b}=await sb.from('batches').select('id,job_id,date,note,status').in('job_id',jids);
        if(b){setBatches(b);const bids=b.map(x=>x.id);if(bids.length){const {data:li}=await sb.from('line_items').select('id,batch_id,job_id,internal_name,client_name,media,width,height,size_unit,qty,img_url').in('batch_id',bids);if(li)setItems(li);}}}})();

  if(!config) return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#060810"}}><div style={{textAlign:"center",padding:40}}><p style={{fontSize:48}}>🔒</p><h2 style={{color:"#f47067",fontSize:18}}>Invalid Portal Link</h2><p style={{color:"#64748b",fontSize:12,marginTop:8}}>Contact your iPrint representative for access.</p></div></div>;

        <span style={{fontSize:22,color:"#475569",fontWeight:300}}>×</span>

                    {sd[s.k]&&<span style={{fontSize:5,color:"#64748b"}}>{String(sd[s.k]).split(' by')[0]?.slice(0,11)}</span>}
                  </div>
                </React.Fragment>;})}

            {isOpen&&<div style={{borderTop:"1px solid #1a2030",padding:"10px 14px",background:"#080c14"}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,fontSize:10,marginBottom:8}}>
                <div><span style={{color:"#64748b"}}>PO:</span> {dept?.canEditPO?<span style={{display:'inline-flex',gap:3,alignItems:'center'}}><input style={{padding:'3px 6px',borderRadius:4,border:'1px solid #1a2030',background:'#060810',color:'#4ade80',fontSize:10,width:120,outline:'none',fontFamily:'monospace'}} value={poEdits[j.id]!=null?poEdits[j.id]:(j.po_number||'')} onChange={e=>setPoEdits(p=>({...p,[j.id]:e.target.value}))} placeholder="Enter PO#" onKeyDown={e=>{if(e.key==='Enter')savePO(j.id,e.target.value);}}/>{poEdits[j.id]!=null&&poEdits[j.id]!==(j.po_number||'')&&<button onClick={()=>savePO(j.id,poEdits[j.id])} style={{padding:'2px 8px',borderRadius:4,border:'none',background:'#4ade80',color:'#060810',fontSize:8,fontWeight:700,cursor:'pointer'}}>Save</button>}</span>:<span style={{color:j.po_number?'#4ade80':'#f47067'}}>{j.po_number||'Pending'}</span>}</div>
                <div><span style={{color:"#64748b"}}>Items:</span> {allItems.length}</div>
                <div><span style={{color:"#64748b"}}>Contact:</span> {j.contact_person||'—'}</div>
                <div><span style={{color:"#64748b"}}>Date:</span> {j.created_at?new Date(j.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'}):'—'}</div>
              </div>
              {(()=>{const poUrls=Array.isArray(j.po_file_url)?j.po_file_url:j.po_file_url?[j.po_file_url]:[];return poUrls.length>0?<div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:8}}><span style={{fontSize:9,color:'#64748b',fontWeight:600}}>📎 PO:</span>{poUrls.map((u,i)=><a key={i} href={smartOpenUrl(u)} target="_blank" rel="noopener" style={{fontSize:9,color:'#3b82f6',background:'#3b82f615',padding:'2px 8px',borderRadius:4,border:'1px solid #3b82f633'}}>📄 PO Copy {poUrls.length>1?i+1:''} ↓</a>)}</div>:null;})()}
              {allItems.length>0&&<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",marginBottom:8}}><thead><tr style={{borderBottom:"1px solid #1a2030"}}><th style={{padding:"3px",fontSize:8,textAlign:"left",color:"#64748b"}}>#</th><th style={{padding:"3px",fontSize:8,textAlign:"left",color:"#64748b"}}>Item</th>{allItems.some(it=>it.img_url)&&<th style={{padding:"3px",fontSize:8,color:"#64748b"}}>Img</th>}<th style={{padding:"3px",fontSize:8,textAlign:"left",color:"#64748b"}}>Spec</th><th style={{padding:"3px",fontSize:8,textAlign:"left",color:"#64748b"}}>Size</th><th style={{padding:"3px",fontSize:8,textAlign:"left",color:"#64748b"}}>Qty</th></tr></thead><tbody>
                {allItems.map((it,i)=><tr key={it.id} style={{borderBottom:"1px solid #0c1017"}}><td style={{padding:"3px",fontSize:9}}>{i+1}</td><td style={{padding:"3px",fontSize:10,fontWeight:600,maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.client_name||it.internal_name}</td>{allItems.some(x=>x.img_url)&&<td style={{padding:"2px"}}>{it.img_url?<a href={it.img_url} target="_blank"><img src={it.img_url} style={{width:24,height:24,objectFit:"cover",borderRadius:3}}/></a>:'—'}</td>}<td style={{padding:"3px",fontSize:9,color:"#8b949e"}}>{it.media?.slice(0,20)||'—'}</td><td style={{padding:"3px",fontSize:9}}>{it.width&&it.height?it.width+'×'+it.height:''}</td><td style={{padding:"3px",fontSize:10,fontWeight:700}}>{it.qty}</td></tr>)}
              </tbody></table></div>}
              {allItems.some(it=>it.img_url)&&<div style={{marginTop:6,marginBottom:8}}><p style={{fontSize:9,color:"#64748b",fontWeight:600,marginBottom:4}}>Design References</p><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{allItems.filter(it=>it.img_url).map((it,i)=><a key={i} href={it.img_url} target="_blank" rel="noopener"><img src={it.img_url} style={{width:50,height:50,objectFit:"cover",borderRadius:4,border:"1px solid #1a2030"}}/></a>)}</div></div>}
              {(()=>{const visibleNotes=jN.filter(n=>n.dept!=='SYSTEM'&&!n.text?.includes('🗑️ Batch deleted'));return <div style={{borderTop:"1px solid #1a2030",paddingTop:8}}>
                <p style={{fontSize:9,fontWeight:700,color:"#8b5cf6",marginBottom:6}}>💬 Notes & Communication</p>
                {visibleNotes.map(n=><div key={n.id} style={{background:"#0c1017",border:"1px solid #1a2030",borderRadius:6,padding:"6px 8px",marginBottom:4}}>
                  <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:9,fontWeight:700,color:"#e3a008"}}>{n.dept}</span><span style={{fontSize:7,color:"#64748b"}}>{new Date(n.created_at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>
                  <p style={{fontSize:10,marginTop:2,color:"#c9d1d9",wordBreak:"break-word"}}>{n.text}</p>
                </div>)}
                {visibleNotes.length===0&&<p style={{fontSize:9,color:"#475569",marginBottom:4}}>No notes yet. Start the conversation below.</p>}
                <div style={{display:"flex",gap:4,marginTop:4}}>
                  <input style={{flex:1,padding:"7px 10px",borderRadius:6,border:"1px solid #1a2030",background:"#060810",color:"#c9d1d9",fontSize:11,outline:"none"}} placeholder={"Add note as "+dept.name+"..."} value={noteText[j.id]||''} onChange={e=>setNoteText(p=>({...p,[j.id]:e.target.value}))} onKeyDown={e=>{if(e.key==='Enter')addNote(j.id);}}/>
                  <button onClick={()=>addNote(j.id)} style={{padding:"6px 14px",borderRadius:6,border:"none",background:"#8b5cf6",color:"#fff",fontSize:10,fontWeight:700,cursor:"pointer"}}>Send</button>
                </div>
              </div>;})()}
            </div>}
          </div>;})}
        {filtered.length===0&&<div style={{textAlign:"center",padding:40,color:"#64748b"}}><p style={{fontSize:32}}>📋</p><p style={{fontSize:12}}>No projects in this view</p></div>}
      </div>
    </div>
    {showNewJob&&<NewJobForm/>}
    {showBOQ&&<BOQModal/>}
    <footer style={{textAlign:"center",padding:"14px 16px",borderTop:"1px solid #1a2030",marginTop:20}}><p style={{fontSize:8,color:"#333"}}>Powered by iPrint ERP · © {new Date().getFullYear()}</p></footer>
  </div>;
}

function HealthCheckPage(){
  const [checks,setChecks] = useState({
    react:    {status:'ok',     label:'React mounted',         detail:`v${React.version}`},
    supabase: {status:'pending',label:'Supabase connection',   detail:'Checking...'},
    counts:   {status:'pending',label:'Core table row counts', detail:'Checking...'},
    recent:   {status:'pending',label:'Most recent job write', detail:'Checking...'},
    file:     {status:'pending',label:'File fingerprint',      detail:'Checking...'}
  });

  const upd = (k,patch) => setChecks(c => ({...c, [k]: {...c[k], ...patch}}));

  useEffect(() => {
    // ── Check 2: Supabase connection (roundtrip ms) ───────────────
    (async () => {
      const t0 = performance.now();
      try {
        const {error,count} = await sb.from('firms').select('*',{count:'exact',head:true});
        const ms = Math.round(performance.now() - t0);
        if (error) throw error;
        upd('supabase', {status:'ok', detail:`Connected in ${ms} ms · firms table reachable (${count} rows)`});
      } catch (e) {
        upd('supabase', {status:'fail', detail:`Failed: ${e.message || String(e)}`});
      }
    })();

    // ── Check 3: Core table row counts (jobs, batches, line_items, clients) ──
    (async () => {
      const tables = ['jobs','batches','line_items','clients'];
      try {
        const results = await Promise.all(tables.map(t =>
          sb.from(t).select('*',{count:'exact',head:true})
            .then(r => ({t, error:r.error, count:r.count}))
        ));
        const failed = results.filter(r => r.error);
        if (failed.length) {
          upd('counts', {status:'fail', detail:`Failed: ${failed.map(f => `${f.t} (${f.error.message})`).join(', ')}`});
        } else {
          upd('counts', {status:'ok', detail: results.map(r => `${r.t}: ${(r.count||0).toLocaleString()}`).join(' · ')});
        }
      } catch (e) {
        upd('counts', {status:'fail', detail:`Failed: ${e.message || String(e)}`});
      }
    })();

    // ── Check 4: Most recent job write (jobs.id is the identifier; job_no does NOT exist) ──
    (async () => {
      try {
        const {data,error} = await sb.from('jobs')
          .select('id,client_name,created_at')
          .order('created_at',{ascending:false})
          .limit(1);
        if (error) throw error;
        if (!data || data.length === 0) {
          upd('recent', {status:'warn', detail:'No jobs found in table'});
          return;
        }
        const j = data[0];
        const ageMs = Date.now() - new Date(j.created_at).getTime();
        const min = Math.floor(ageMs / 60000);
        const hr  = Math.floor(ageMs / 3600000);
        const day = Math.floor(ageMs / 86400000);
        let ago;
        if (min < 1)        ago = 'just now';
        else if (min < 60)  ago = `${min}m ago`;
        else if (hr < 48)   ago = `${hr}h ago`;
        else                ago = `${day}d ago`;
        // Warn if the most recent write is suspiciously old (>7 days).
        const status = day > 7 ? 'warn' : 'ok';
        const cn = j.client_name ? ` · ${j.client_name.slice(0,30)}` : '';
        upd('recent', {status, detail:`Job ${j.id}${cn} · ${ago}`});
      } catch (e) {
        upd('recent', {status:'fail', detail:`Failed: ${e.message || String(e)}`});
      }
    })();

    // ── Check 5: File fingerprint (line count + KB of currently served '/' ) ──
    (async () => {
      const t0 = performance.now();
      try {
        const r = await fetch('/', {cache:'no-store'});
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const txt = await r.text();
        const ms = Math.round(performance.now() - t0);
        const lines = txt.split(`\n`).length;
        const kb = (txt.length / 1024).toFixed(1);
        upd('file', {status:'ok', detail:`${lines.toLocaleString()} lines · ${kb} KB · fetched in ${ms} ms`});
      } catch (e) {
        upd('file', {status:'fail', detail:`Failed: ${e.message || String(e)}`});
      }
    })();
  }, []);

  // ── Derived overall status ─────────────────────────────────────
  const order  = ['react','supabase','counts','recent','file'];
  const all    = order.map(k => checks[k]);
  const pending = all.some(c => c.status === 'pending');
  const failed  = all.some(c => c.status === 'fail');
  const warned  = all.some(c => c.status === 'warn');
  const overall      = pending ? 'CHECKING...' : (failed ? 'DEGRADED' : (warned ? 'DEGRADED' : 'HEALTHY'));
  const overallColor = pending ? '#64748b' : (failed ? '#ef4444' : (warned ? '#e3a008' : '#10b981'));
  const overallBg    = pending ? '#0c1017' : (failed ? '#1f0f12' : (warned ? '#1f1a0a' : '#0a1f15'));

  // ── Status indicator helpers ───────────────────────────────────
  const icon = s => {
    if (s === 'ok')   return <span style={{color:'#10b981',fontWeight:700}}>✓</span>;
    if (s === 'fail') return <span style={{color:'#ef4444',fontWeight:700}}>✗</span>;
    if (s === 'warn') return <span style={{color:'#e3a008',fontWeight:700}}>!</span>;
    return <span style={{color:'#64748b',display:'inline-block',animation:'hcSpin 1s linear infinite'}}>⟳</span>;
  };
  const rowAccent = s => s === 'fail' ? '#ef4444' : (s === 'warn' ? '#e3a008' : (s === 'ok' ? '#10b981' : '#1a2030'));

  return <div style={{minHeight:'100vh',background:'#060810',color:'#e2e8f0',fontFamily:`'DM Sans',system-ui,sans-serif`,padding:'24px 16px',overflowY:'auto'}}>
    <style>{`@keyframes hcSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}`}</style>
    <div style={{maxWidth:720,margin:'0 auto'}}>

      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:6}}>
        <div style={{width:40,height:40,borderRadius:8,background:'linear-gradient(135deg,#e3a008,#ca8a04)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:14,color:'#060810'}}>iP</div>
        <div>
          <h1 style={{margin:0,fontSize:20,fontWeight:700,letterSpacing:'-.01em'}}>iPrint ERP — Health Check</h1>
          <div style={{fontSize:11,color:'#64748b',marginTop:2}}>{new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</div>
        </div>
      </div>

      {/* Overall status badge */}
      <div style={{background:overallBg,border:`1px solid ${overallColor}`,borderRadius:10,padding:'16px 20px',margin:'18px 0',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <div style={{fontSize:11,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600}}>Overall status</div>
          <div style={{fontSize:24,fontWeight:800,color:overallColor,marginTop:4,letterSpacing:'-.01em'}}>{overall}</div>
        </div>
        <div style={{fontSize:34,opacity:.85}}>{icon(pending ? 'pending' : (failed ? 'fail' : (warned ? 'warn' : 'ok')))}</div>
      </div>

      {/* Per-check rows */}
      <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:24}}>
        {order.map(k => {
          const c = checks[k];
          const accent = rowAccent(c.status);
          return <div key={k} style={{background:'#0c1017',border:`1px solid ${accent}40`,borderLeft:`3px solid ${accent}`,borderRadius:8,padding:'12px 14px',display:'flex',alignItems:'flex-start',gap:12}}>
            <div style={{fontSize:18,lineHeight:'18px',width:18,textAlign:'center',flexShrink:0,marginTop:1}}>{icon(c.status)}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:'#e2e8f0'}}>{c.label}</div>
              <div style={{fontSize:11,color:'#94a3b8',marginTop:3,fontFamily:(k==='counts'||k==='recent'||k==='file')?`'JetBrains Mono',monospace`:'inherit',wordBreak:'break-word'}}>{c.detail}</div>
            </div>
          </div>;
        })}
      </div>

      {/* How-to-use footer */}
      <div style={{background:'#0c1017',border:'1px solid #1a2030',borderRadius:8,padding:'14px 16px',marginBottom:16}}>
        <div style={{fontSize:11,color:'#e3a008',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:700,marginBottom:8}}>How to use this page</div>
        <div style={{fontSize:12,color:'#94a3b8',lineHeight:1.55}}>
          Bookmark <code style={{background:'#060810',padding:'1px 5px',borderRadius:3,fontSize:11,color:'#e2e8f0'}}>{location.origin}/?health=1</code> and check it before starting work each day. If it shows <span style={{color:'#10b981',fontWeight:600}}>HEALTHY</span> you're good to go. If it shows <span style={{color:'#ef4444',fontWeight:600}}>DEGRADED</span> or any row is ✗, alert Jigar before doing data entry — there may be a database, deploy, or connectivity problem. The file fingerprint (line count + KB) tells you which deploy is currently live; cross-check against the latest GitHub commit if a stale deploy is suspected.
        </div>
      </div>

      {/* Bottom controls */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:11,color:'#64748b'}}>
        <a href="/" style={{color:'#e3a008',textDecoration:'none',fontWeight:600}}>← Back to ERP</a>
        <button onClick={() => location.reload()} className="b" style={{fontSize:11}}>↻ Re-run checks</button>
      </div>

    </div>
  </div>;
}

// Health check route — chosen OUTSIDE RootApp so the URL check is not
// inside any component (would violate React hooks rules).
const __isHealth = new URLSearchParams(window.location.search).get('health') === '1';
ReactDOM.createRoot(document.getElementById('root')).render(__isHealth ? <HealthCheckPage/> : <RootApp/>);
</script>
