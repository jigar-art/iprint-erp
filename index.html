  if(!file) return null;
  const ext = file.name.split('.').pop();
  const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,6)}.${ext}`;
  const {data,error} = await sb.storage.from('Uploads').upload(path, file);
  if(error){console.error('Upload error:',error);return null;}
  const {data:urlData} = sb.storage.from('Uploads').getPublicUrl(path);
  return urlData?.publicUrl || null;
};
const uploadMultiple = async (files, folder='general') => {
  const urls=[];

};

window._itemCache={};

document.addEventListener('click',function(e){

  const d=document.createElement('dialog');d.style.cssText='background:#0c1017;border:1px solid #e3a008;border-radius:12px;padding:16px;width:420px;max-width:92vw;color:#c9d1d9;z-index:999;';

    }catch(e){if(window._showToast)window._showToast("⚠️ Error: "+e.message,false);saveBtn.textContent='💾 Save Item';saveBtn.disabled=false;}

function Login({onLogin,team}){
  const [sel,setSel]=useState('');
  const [pin,setPin]=useState('');
  const [err,setErr]=useState('');
  const submit=()=>{
    const member=team.find(t=>t.name===sel);
    if(!member){setErr('Select your name');return;}
    if(member.pin&&member.pin!==pin){setErr('Wrong PIN');return;}
    onLogin(member);
    window.__currentUser=member;
  };
  return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#060810"}}>
    <div className="a" style={{width:340,padding:32,background:"#0c1017",border:"1px solid #1a2030",borderRadius:16,textAlign:"center"}}>
      <div style={{width:56,height:56,borderRadius:12,background:"linear-gradient(135deg,#e3a008,#ca8a04)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:20,color:"#060810",margin:"0 auto 16px"}}>iP</div>
      <h1 style={{fontSize:20,fontWeight:800,color:"#e3a008",marginBottom:4}}>iPrint ERP</h1>
      <p style={{fontSize:11,color:"#64748b",marginBottom:24}}>FY 2026-27 · Sign in to continue</p>
      <select className="in" value={sel} onChange={e=>{setSel(e.target.value);setErr('');}} style={{marginBottom:10,textAlign:"center",fontSize:13,padding:10}}>
        <option value="">Select your name...</option>
        {team.map(t=><option key={t.name} value={t.name}>{t.name} ({t.role})</option>)}
      </select>
      <input className="in mn" type="password" placeholder="Enter PIN" value={pin} onChange={e=>{setPin(e.target.value);setErr('');}} onKeyDown={e=>e.key==='Enter'&&submit()} style={{marginBottom:10,textAlign:"center",fontSize:16,padding:10,letterSpacing:8}}/>
      {err&&<p style={{color:"#f47067",fontSize:11,marginBottom:8}}>{err}</p>}
      <button className="b bp" onClick={submit} style={{width:"100%",padding:10,fontSize:13,justifyContent:"center"}}>Sign In</button>
      <p style={{fontSize:9,color:"#475569",marginTop:16}}>Jyoti Print · Juxtapose · Versahue</p>
    </div>
  </div>;
}

function MainApp({user,onLogout,masterData}){
  const {firms,clients,suppliers,products,materials,machines,agencies,delBoys} = masterData;

  const [expenses,setExpenses]=useState([]);
  const [salesActs,setSalesActs]=useState([]);
  const [osItems,setOsItems]=useState([]);
  const [reqs,setReqs]=useState([]);
  const [prs,setPrs]=useState([]);
  const [pg,setPgRaw]=useState(()=>{
    try{return localStorage.getItem('erp_pg')||'dash';}catch(e){return 'dash';}
  });
  const setPg=(p)=>{setPgRaw(p);try{localStorage.setItem('erp_pg',p);}catch(e){}};
  const [toast,setToast]=useState(null);
  const [search,setSearch]=useState("");
  const [col,setCol]=useState(false);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(null);
  const [fyFilter,setFyFilter]=useState('2627'); // default to current FY

  const show=useCallback((m,ok=true)=>{setToast({m,ok});setTimeout(()=>setToast(null),2500);},[]);
  window._showToast=show;
  window._forceItemRefresh=(itemId,updates)=>{setItems(p=>p.map(i=>i.id===itemId?{...i,...updates}:i));};

  // Helper: fetch ALL rows from a table (paginate past 1000 limit)
  const fetchAll = async (table, order=null, filter=null) => {
    let all=[], from=0, size=1000;
    while(true){
      let q=sb.from(table).select('*').order(order||'id',{ascending:true}).range(from,from+size-1);
      if(filter) q=filter(q);
      const {data,error}=await q;
      if(error||!data||data.length===0) break;
      all=all.concat(data);
      if(data.length<size) break;
      from+=size;
    }
    return all;
  };

  // Load data from Supabase — jobs first (fast), then items in background
  useEffect(()=>{
    async function load(){
      setLoading(true);
      // Determine current FY suffix
      const now=new Date();const m=now.getMonth(),y=now.getFullYear();
      const curFYSuffix=m>=3?`${String(y).slice(2)}${String(y+1).slice(2)}`:`${String(y-1).slice(2)}${String(y).slice(2)}`;
      
      // Phase 1: Load current FY jobs + essential small tables (fast)
      const [j,g,ex] = await Promise.all([
        fetchAll('jobs','id',q=>q.like('id','%-'+curFYSuffix)),
        fetchAll('grn','id'),
        fetchAll('expenses','id'),
      ]);
      setJobs(j); setGrnData(g); setExpenses(ex);
      console.log('Phase 1: Loaded',j.length,'current FY jobs');

    let finalJobData={...jobData};
    while(attempts<5){
      const {error:je} = await sb.from('jobs').insert(finalJobData);
      if(!je)break;
      if(je.message?.includes('duplicate key')||je.message?.includes('unique constraint')){
        attempts++;
        // Increment the number part
        const parts=finalJobData.id.split('-');
        const num=parseInt(parts[0])||0;
        const newId=String(num+attempts).padStart(4,'0')+'-'+parts.slice(1).join('-');
        finalJobData={...finalJobData,id:newId};
        // Also update batch and items with new job_id
        batchData={...batchData,job_id:newId};
        lineItemsData=lineItemsData.map(li=>({...li,job_id:newId}));
        continue;
      }
      show("Error: "+je.message,false);return;
    }
    if(attempts>=5){show("Error: Could not generate unique Job#. Please try again.",false);return;}
    const {error:be} = await sb.from('batches').insert(batchData);
    if(lineItemsData.length>0) await sb.from('line_items').insert(lineItemsData);

          {pg==="disp"&&<DispPage logs={dLogs} delBoys={delBoys} addLog={addDispatch}/>}

          {pg==="acc"&&<AccPage jobs={filteredJobs} batches={batches} items={items} saveBill={saveBill} firms={firms} updateJobStatus={updateJobStatus} updateJobFields={updateJobFields} updateJobFile={updateJobFile} appendJobFiles={appendJobFiles} removeJobFile={removeJobFile} show={show} addBatchToJob={addBatchToJob}/>}
          {pg==="expenses"&&<ExpensesPage expenses={expenses} addExpense={addExpense} deleteExpense={deleteExpense} team={masterData.team} firms={firms}/>}

          {pg==="jobnotes"&&<JobNotesPage jobs={fullJobs} user={user} show={show}/>}
          {pg==="appr"&&<ApprovalsPage prs={prs} setPrs={setPrs} jobs={fullJobs} user={user} show={show} firms={firms}/>}
          {pg==="po"&&<POPage prs={prs} setPrs={setPrs} jobs={fullJobs} user={user} show={show} firms={firms}/>}
          {pg==="grn2"&&<GRNReceivePage prs={prs} setPrs={setPrs} jobs={fullJobs} user={user} show={show}/>}
        </div>
      </main>

      {modal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"10px",overflowY:"auto"}} onClick={()=>setModal(null)}><div style={{background:"#0c1017",border:"1px solid #1a2030",borderRadius:12,width:"100%",maxWidth:1100,padding:16,margin:"10px 0",maxHeight:"calc(100vh - 20px)",overflowY:"auto",animation:"fi .2s"}} onClick={e=>e.stopPropagation()}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,position:"sticky",top:-16,background:"#0c1017",zIndex:2,padding:"8px 0",marginTop:-8}}><h3 style={{fontSize:13,fontWeight:700}}>{modal.t}</h3><button className="b bs" onClick={()=>setModal(null)}>✕</button></div>{modal.jobId?<JobDetail j={fullJobs.find(x=>x.id===modal.jobId)||modal.fallback} firms={firms} togDept={togDept} addBatchToJob={addBatchToJob} show={show} updateJobStatus={updateJobStatus} updateJobFields={updateJobFields} updateLineItem={updateLineItem} addLineItem={addLineItem} deleteLineItem={deleteLineItem} importBatches={importBatches} updateJobFile={updateJobFile} appendJobFiles={appendJobFiles} removeJobFile={removeJobFile} user={user} saveBill={saveBill} deleteBatch={deleteBatch} updateBatchNote={updateBatchNote} osItems={osItems} setOsItems={setOsItems} agencies={agencies} reqs={reqs} setReqs={setReqs} prs={prs} setPrs={setPrs}/>:modal.x}</div></div>}
      {toast&&<div style={{position:"fixed",bottom:12,right:12,background:toast.ok?"#238636":"#da3633",color:"#fff",padding:"6px 12px",borderRadius:6,fontWeight:600,fontSize:11,zIndex:200,animation:"sr .3s"}}>✓ {toast.m}</div>}
    </div>
  );

// ─── SMALL COMPONENTS ───────────────────────────────────────
function SC({l,v,s,c="#e3a008",d=0,delta}){return <div className="c a" style={{padding:"10px 12px",animationDelay:`${d}ms`}}><p style={{fontSize:8.5,color:"#64748b",textTransform:"uppercase",letterSpacing:".05em",fontWeight:600,marginBottom:2}}>{l}</p><div style={{display:"flex",alignItems:"baseline",gap:4}}><p className="mn" style={{fontSize:16,fontWeight:700,color:c}}>{v}</p>{delta!=null&&delta!==0&&<span style={{fontSize:9,fontWeight:700,color:delta>0?'#4ade80':'#f47067'}}>{delta>0?'▲ +'+delta:'▼ '+delta}</span>}</div>{s&&<p style={{fontSize:9,color:"#64748b"}}>{s}</p>}</div>;}
function FB({f,firms}){const fm=firms?.find(x=>x.code===f);return fm?<span className="bd" style={{background:fm.color+"20",color:fm.color}}>{fm.short_name}</span>:null;}
function Ck({on,onClick}){return <div className={`ck ${on?"on":""}`} onClick={onClick}>{on?"✓":""}</div>;}
function StatusTip({j,children}){
  const [show,setShow]=useState(false);
  const sd=j.status_dates||{};
  const entries=Object.entries(sd).filter(([k,v])=>v);
  const labels={draft:'Draft',active:'Active',quotation_sent:'Quotation Sent',po_pending:'PO Pending',po_received:'PO Received',recce_pending:'Recce Pending',designing:'Designing',printing:'Printing',fabrication:'Fabrication',installation:'Installation',delivered:'Delivered',billing_pending:'Billing Pending',given_for_billing:'Given for Billing',cash_pending:'Cash Pending',proforma_invoice:'Proforma Invoice',ic_pending:'IC Pending',billing_done:'Billing Done',cash_received:'Cash Received',no_bill:'No Bill',cancelled:'Cancelled'};
  const curKey=j.status?.replace(/\s+/g,'_').toLowerCase();
  const lastEntry=entries.length>0?entries[entries.length-1]:null;
  return <div style={{position:"relative",display:"inline-block",cursor:"pointer"}} onMouseEnter={()=>setShow(true)} onMouseLeave={()=>setShow(false)}>
    {children}
    {show&&entries.length>0&&<div style={{position:"absolute",left:0,top:"100%",zIndex:50,background:"#161d2eee",border:"1px solid #2a3548",borderRadius:10,padding:"10px 14px",minWidth:260,maxWidth:350,boxShadow:"0 12px 32px rgba(0,0,0,.6)",backdropFilter:"blur(8px)",pointerEvents:"none"}}>
      <p style={{fontSize:9,fontWeight:700,color:"#e3a008",marginBottom:2}}>📅 Status History — {j.id}</p>
      {lastEntry&&<p style={{fontSize:8,color:"#8b949e",marginBottom:6}}>Last: {lastEntry[1]}</p>}
      <div style={{borderTop:"1px solid #2a3548",paddingTop:4}}>
        {entries.map(([k,v])=>{const isCurrent=k===curKey;return <div key={k} style={{display:"flex",justifyContent:"space-between",gap:8,padding:"3px 0",borderBottom:"1px solid #1a2030",background:isCurrent?"#e3a00810":"transparent",marginLeft:-4,marginRight:-4,paddingLeft:4,paddingRight:4,borderRadius:isCurrent?4:0}}>
          <span style={{fontSize:9,fontWeight:isCurrent?700:500,color:isCurrent?"#e3a008":"#c9d1d9"}}>{isCurrent?"▸ ":""}{labels[k]||k}</span>
          <span style={{fontSize:8,color:isCurrent?"#e3a008":"#8b949e",textAlign:"right",maxWidth:160}}>{v}</span>
        </div>;})}
      </div>
    </div>}
  </div>;
}
function F({l,children}){return <div><label style={{fontSize:8.5,color:"#64748b",fontWeight:600,textTransform:"uppercase",display:"block",marginBottom:1}}>{l}</label>{children}</div>;}

// ═══════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════
function DashPage({s,stock,sp,jobs,firms,sm,updateJobStatus,updateJobFields,togDept,addBatchToJob,show,updateLineItem,addLineItem,deleteLineItem,importBatches,updateJobFile,appendJobFiles,removeJobFile}){
  const [dq,setDq]=useState("");
  const low=Object.entries(stock).filter(([,v])=>v<=2&&v>=0).slice(0,5);
  
  // Banking client patterns
  const BANKING_CLIENTS=['DIEBOLD','CMS','OKI','NCR','NUVAMA','NUVAMA WEALTH','J M FINANCE','JM FINANCE','J.M. FINANCE','HITACHI','EDELWEISS','NIDO'];
  const isBanking=(cn)=>{if(!cn)return false;const u=cn.toUpperCase();return BANKING_CLIENTS.some(b=>u.includes(b));};
  const bankJobs=jobs.filter(j=>isBanking(j.client_name));
  const nonBankJobs=jobs.filter(j=>!isBanking(j.client_name));
  const activeStatuses=['Billing Done','Cancelled','No Bill','Cash Received'];
  const bStats=(jl)=>({
    total:jl.length,
    active:jl.filter(j=>!activeStatuses.includes(j.status)).length,
    estimate:jl.filter(j=>['Quotation Sent','PO Pending','PO Received','Recce Pending','Active','Draft'].includes(j.status)).length,
    design:jl.filter(j=>j.status==='Designing').length,
    printing:jl.filter(j=>j.status==='Printing').length,
    fab:jl.filter(j=>j.status==='Fabrication').length,
    install:jl.filter(j=>j.status==='Installation').length,
    delivered:jl.filter(j=>j.status==='Delivered').length,
    billPend:jl.filter(j=>['Billing Pending','Given for Billing','Cash Pending','Proforma Invoice','IC Pending'].includes(j.status)).length,
    billed:jl.filter(j=>['Billing Done','Cash Received'].includes(j.status)).length,
  });
  const bk=bStats(bankJobs);const nb=bStats(nonBankJobs);
  const [indTab,setIndTab]=useState('all');
  const [cmpDays,setCmpDays]=useState(0); // 0=off, 7=week, 30=month

  // Calculate deltas: how many jobs were created in the comparison period
  const deltas=useMemo(()=>{
    if(!cmpDays) return {};
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-cmpDays);
    const cutStr=cutoff.toISOString();
    const recent=jobs.filter(j=>{const ca=j.created_at||'';return ca>=cutStr;});
    const recentCount=recent.length;
    // Count jobs that entered each status within the period (from status_dates)
    const statusDeltas={};
    const statusKeys={estimate:['quotation_sent','po_pending','po_received','recce_pending','active'],design:['designing'],printing:['printing'],fab:['fabrication'],install:['installation'],delivered:['delivered'],billPend:['billing_pending','given_for_billing','cash_pending','proforma_invoice','ic_pending'],billed:['billing_done','cash_received']};
    // Parse status_dates timestamps like "06 Apr 2026 04:26 pm by RUCHITA"
    const parseSD=(str)=>{if(!str)return null;const m=str.match(/(\d{1,2})\s+(\w+)\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(am|pm)/i);if(!m)return null;const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};let hr=+m[4];if(m[6].toLowerCase()==='pm'&&hr!==12)hr+=12;if(m[6].toLowerCase()==='am'&&hr===12)hr=0;return new Date(+m[3],months[m[2]]||0,+m[1],hr,+m[5]);};
    Object.entries(statusKeys).forEach(([key,sdKeys])=>{
      let count=0;
      jobs.forEach(j=>{
        const sd=j.status_dates||{};
        for(const sk of sdKeys){
          const ts=sd[sk];if(!ts)continue;
          const dt=parseSD(ts);
          if(dt&&dt>=cutoff)count++;
        }
      });
      statusDeltas[key]=count;
    });
    // For total jobs: new jobs created
    statusDeltas.jobs=recentCount;
    // For PO pending: count jobs that became PO pending (no PO) in the period
    statusDeltas.poPend=recent.filter(j=>!j.po_number&&!['Billing Done','Cancelled','No Bill','Cash Received','Draft'].includes(j.status)).length;
    return statusDeltas;
  },[cmpDays,jobs]);
  
  const results=useMemo(()=>{
    if(!dq||dq.length<2) return [];
    const q=dq.toLowerCase();
    return jobs.filter(j=>
      j.id?.toLowerCase().includes(q)||
      j.client_name?.toLowerCase().includes(q)||
      j.project?.toLowerCase().includes(q)||
      j.po_number?.toLowerCase().includes(q)||
      j.contact_person?.toLowerCase().includes(q)||
      (j.batches||[]).some(b=>b.bill_no?.toLowerCase().includes(q))
    ).slice(0,20);
  },[dq,jobs]);
  const sc={'Quotation Sent':'#3b82f6','Designing':'#8b5cf6','Printing':'#ef4444','Fabrication':'#dc2626','Installation':'#059669','Delivered':'#10b981','Billing Pending':'#06b6d4','Billing Done':'#4ade80','Cancelled':'#64748b','No Bill':'#64748b','Cash Received':'#4ade80','Recce Pending':'#f59e0b','PO Pending':'#f47067','Active':'#64748b'};
  const openJob=(j)=>sm({t:`Job ${j.id} — ${j.project}`,jobId:j.id,fallback:j});
  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    <div className="c" style={{padding:10}}>
      <div style={{position:"relative"}}><input className="in" placeholder="🔍 Search by Job#, Invoice#, Client, Project, PO#..." value={dq} onChange={e=>setDq(e.target.value)} style={{fontSize:12,padding:"8px 12px",paddingLeft:12}}/></div>
      {results.length>0&&<div style={{marginTop:6,maxHeight:300,overflowY:"auto"}}><table><thead><tr><th>Job</th><th>Firm</th><th>Client</th><th>Project</th><th>Status</th><th>Invoice</th></tr></thead><tbody>
        {results.map(j=>{const bn=(j.batches||[]).map(b=>b.bill_no).filter(Boolean).join(', ');return <tr key={j.id} style={{cursor:"pointer"}} onClick={()=>openJob(j)}><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700}}><StatusTip j={j}>{j.id}</StatusTip></td><td><FB f={j.firm} firms={firms}/></td><td style={{fontSize:10}}>{j.client_name?.slice(0,22)}</td><td style={{fontSize:10,color:"#64748b"}}>{j.project?.slice(0,20)}</td><td><StatusTip j={j}><span className="bd" style={{background:(sc[j.status]||'#64748b')+'20',color:sc[j.status]||'#64748b'}}>{j.status}</span></StatusTip></td><td className="mn" style={{fontSize:10,color:"#06b6d4"}}>{bn||'—'}</td></tr>})}
      </tbody></table></div>}
      {dq.length>=2&&results.length===0&&<p style={{fontSize:10,color:"#64748b",marginTop:4}}>No results found for "{dq}"</p>}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
      <div style={{display:"flex",gap:3}}>
        {[{d:0,l:'No Compare'},{d:7,l:'7 Days'},{d:30,l:'30 Days'}].map(p=><button key={p.d} className={`b bs ${cmpDays===p.d?'bp':''}`} onClick={()=>setCmpDays(p.d)} style={{fontSize:9,padding:"3px 8px"}}>{p.d?'📊 '+p.l:'—'}</button>)}
      </div>
      {cmpDays>0&&<span style={{fontSize:9,color:"#64748b"}}>Showing changes in last {cmpDays} days</span>}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:7}}>
      <SC l="Total Jobs" v={s.jobs} s={`${s.active} active`} delta={deltas.jobs}/><SC l="Estimate" v={s.estimate} c="#3b82f6" d={30} delta={deltas.estimate}/><SC l="Designing" v={s.design} c="#8b5cf6" d={60} delta={deltas.design}/><SC l="Printing" v={s.printing} c="#ef4444" d={90} delta={deltas.printing}/><SC l="Fabrication" v={s.fab} c="#dc2626" d={120} delta={deltas.fab}/><SC l="Installation" v={s.install} c="#059669" d={150} delta={deltas.install}/><SC l="Dispatch" v={s.delivered} c="#10b981" d={180} delta={deltas.delivered}/><SC l="Billing Pending" v={s.billPend} c="#06b6d4" d={210} delta={deltas.billPend}/><SC l="Billed" v={s.billed} c="#4ade80" d={240} delta={deltas.billed}/><SC l="PO Pending" v={s.poPend} c="#f47067" d={270} delta={deltas.poPend}/>{s.draft>0&&<SC l="Draft" v={s.draft} c="#64748b" d={300}/>}
    </div>

function JobsPage({jobs,s,firms,togDept,addBatchToJob,show,sp,sm,updateJobStatus,updateJobFields,updateLineItem,addLineItem,deleteLineItem,importBatches,updateJobFile,appendJobFiles,removeJobFile}){

  const openJob=(j)=>sm({t:`Job ${j.id} — ${j.project}`,jobId:j.id,fallback:j});

      <div style={{display:"flex",gap:2}}>

        <span style={{borderLeft:"1px solid #1a2030",margin:"0 4px"}}/>

      {fl.map(j=>{const sc={'Quotation Sent':'#3b82f6','Designing':'#8b5cf6','Printing':'#ef4444','Fabrication':'#dc2626','Installation':'#059669','Delivered':'#10b981','Billing Pending':'#06b6d4','Billing Done':'#4ade80','Cancelled':'#64748b','No Bill':'#64748b','Cash Received':'#4ade80','Recce Pending':'#f59e0b','PO Pending':'#f47067','Active':'#64748b'};

  </div>;
}

function JobDetail({j,firms,togDept,addBatchToJob,show,updateJobStatus,updateJobFields,updateLineItem,addLineItem,deleteLineItem,importBatches,updateJobFile,appendJobFiles,removeJobFile,user,saveBill,deleteBatch,updateBatchNote,osItems,setOsItems,agencies,reqs,setReqs,prs,setPrs}){
  const ALL_ST=['Draft','Quotation Sent','PO Pending','PO Received','Recce Pending','Designing','Printing','Fabrication','Installation','Delivered','Billing Pending','Given for Billing','Cash Pending','Proforma Invoice','IC Pending','Billing Done','Cash Received','No Bill','Cancelled'];
  const [vm,svm]=useState("internal");
  const [sa,ssa]=useState(false);const [nn,snn]=useState("");
  const [addingToBatch,setAddingToBatch]=useState(null); // batch id being added to
  const [copyBatch,setCopyBatch]=useState(null); // {batchId, bi, items:[{...item, selected:bool}]}
  const [pdfMode,setPdfMode]=useState(null); // 'estimate'|'production'|null
  const [pdfBatches,setPdfBatches]=useState({}); // {batchId: true/false}
  const [ni,setNi]=useState({internal_name:'',client_name:'',media:'',width:'',height:'',qty:1,rate:0,size_unit:'MM',rate_mode:'SqFt (INCH)',gstPct:18});
  const [osOpen,setOsOpen]=useState(null); // line_item_id whose OS panel is open
  const [osForm,setOsForm]=useState({task_type:'',vendor_name:'',rate:0,rate_mode:'UNIT',notes:''});
  const OS_TASKS=['Installation Charges','Coating Works','Router Cutting','Laser Cutting','Printing Charges','Frames','Signages (Internal)','Signages (External)'];
  const jobOsItems=(osItems||[]).filter(o=>o.job_id===j.id);
  const saveOsItem=async(lineItem)=>{
    if(!osForm.task_type){show('Select a task type',false);return;}
    if(!osForm.vendor_name){show('Enter vendor name',false);return;}
    const r=+osForm.rate||0;const rm=osForm.rate_mode;
    const q=+lineItem.qty||1;const sf=+lineItem.sqft||0;
    const total=rm==='SQFT'?Math.round(sf*r*100)/100:rm==='SQINCH'?Math.round(sf*144*r*100)/100:Math.round(q*r*100)/100;
    const rec={id:'OS'+Date.now(),line_item_id:lineItem.id,job_id:j.id,task_type:osForm.task_type,
      vendor_name:osForm.vendor_name,vendor_id:'',rate:r,rate_mode:rm,qty:q,sqft:sf,total,
      notes:osForm.notes,po_status:'Pending',po_number:'',created_by:user?.name||'',created_at:new Date().toISOString()};
    const {error}=await sb.from('outsource_items').insert(rec);
    if(error){show('⚠️ Save failed: '+error.message,false);return;}
    setOsItems(p=>[...p,rec]);
    show('✅ Outsource item added! PO pending for Shreya.');
    setOsForm({task_type:'',vendor_name:'',rate:0,rate_mode:'UNIT',notes:''});
    setOsOpen(null);
  };
  const deleteOsItem=async(osId)=>{
    if(!confirm('Delete this outsource entry?'))return;
    const {error}=await sb.from('outsource_items').delete().eq('id',osId);
    if(!error)setOsItems(p=>p.filter(o=>o.id!==osId));
  };
  const updateOsPO=async(osId,poNum)=>{
    const {error}=await sb.from('outsource_items').update({po_status:poNum?'PO Generated':'Pending',po_number:poNum}).eq('id',osId);
    if(!error)setOsItems(p=>p.map(o=>o.id===osId?{...o,po_status:poNum?'PO Generated':'Pending',po_number:poNum}:o));
  };
  // ─── DELIVERY CHALLAN GENERATOR ──
  const [dcMode,setDcMode]=useState(null); // batchId when DC modal is open
  const [dcForm,setDcForm]=useState({to_name:'',to_address:'',delivery_note:'',po_no:'',po_date:'',dc_date:td(),prepared_by:user?.name||'',delivered_by:''});
  const [dcSelectedItems,setDcSelectedItems]=useState(null); // null = all selected; Set of item ids when customised
  const openDCForm=(batch)=>{
    // Pre-fill from job + batch data
    setDcForm({
      to_name: j.billing_name || j.client_name || '',
      to_address: batch.delivery_address || j.delivery_address || '',
      delivery_note: batch.note || '',
      po_no: batch.po_number || j.po_number || '',
      po_date: '',
      dc_date: td(),
      prepared_by: user?.name || '',
      delivered_by: ''
    });
    setDcSelectedItems(null); // reset to all items selected
    setDcMode(batch.id);
  };
  const generateDCNumber=async(firmCode)=>{
    // Get current FY (e.g., 25-26, 26-27)
    const now=new Date(); const m=now.getMonth(), y=now.getFullYear();
    const fyStart=m>=3?y:y-1;
    const fy=String(fyStart).slice(2)+'-'+String(fyStart+1).slice(2);
    // Find highest DC# for this firm+FY
    const {data}=await sb.from('delivery_challans').select('dc_no').eq('firm_code',firmCode).eq('fy',fy);
    const nums=(data||[]).map(x=>{const m=x.dc_no?.match(/DC(\d+)$/);return m?+m[1]:0;});
    const next=String((Math.max(0,...nums,0))+1).padStart(3,'0');
    return {dcNo:`${firmCode}/${fy}/DC${next}`, fy};
  };

      <div class="dc-meta">
        <div class="dc-to"><div class="dc-label">To,</div><div class="dc-to-box">${(dcForm.to_name||'').replace(/\n/g,'<br>')}<br>${(dcForm.to_address||'').replace(/\n/g,'<br>')}</div></div>
        <div class="dc-job"><div class="row"><b>Job # :</b> <span>${j.id}</span></div><div class="row"><b>Delivery Note :</b> <span>${dcForm.delivery_note||''}</span></div><div class="row"><b>Date :</b> <span>${dcForm.dc_date}</span></div><div class="row"><b>PO. No :</b> <span>${dcForm.po_no||''}</span></div><div class="row"><b>Date :</b> <span>${dcForm.po_date||''}</span></div></div>

      <tbody>${dcItems.map(x=>`<tr><td>${x.sr}</td><td>${x.width?x.width+(x.size_unit?' '+x.size_unit:''):''}</td><td>${x.height||''}</td><td>${x.qty}</td><td>${x.sqft||'—'}</td><td class="desc">${x.description}</td></tr>`).join('')}

      <div class="dc-cheque">Cheque should be drawn under <strong>${firm.name||''}</strong></div>

    const html=`<html><head><title>Delivery Challan ${dcNo}</title><style>

    const w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),500);

      <label className="b" style={{cursor:"pointer"}}>📂 Import Job Sheet (Excel)
        <input type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={async(e)=>{
          const file=e.target.files[0];if(!file)return;
          try{
            const buf=await file.arrayBuffer();
            const wb=XLSX.read(buf,{type:'array'});
            const batchesWithItems=[];
            let skipped=0;
            for(const sName of wb.SheetNames){
              const ws=wb.Sheets[sName];
              const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
              if(!data||data.length<3){skipped++;continue;}
              // Find header row — scan for row with Sr No + Description/Job Description
              let hRow=-1;
              for(let i=0;i<Math.min(25,data.length);i++){
                const txt=data[i].map(c=>String(c||'').toLowerCase()).join(' ');
                if(/(sr\.?\s*no|sl\.?\s*no)/.test(txt)&&/(description|particular|job desc)/.test(txt)){hRow=i;break;}
                if(/(description|particular)/.test(txt)&&/(qty|quantity|unit|sqft|rate)/.test(txt)){hRow=i;break;}
              }
              if(hRow<0){skipped++;continue;}
              const headers=data[hRow].map(c=>String(c||'').toLowerCase().trim());
              // Also check sub-header row (row after header may have W/H)
              const subRow=hRow+1<data.length?data[hRow+1].map(c=>String(c||'').toLowerCase().trim()):[];
              const hasSubHeader=subRow.some(c=>/^[wh]$/.test(c))&&!subRow.some(c=>/^\d+$/.test(c));
              const dataStart=hasSubHeader?hRow+2:hRow+1;
              
              const findCol=(patterns)=>{for(const p of patterns){const idx=headers.findIndex(c=>p.test(c));if(idx>=0)return idx;}return -1;};
              const cDesc=findCol([/job desc|description|particular/]);
              const cQty=findCol([/^qty|quantit/]);
              const cRate=findCol([/rate\s*sqft|supply.*rate|^rate$/]);
              const cTotal=findCol([/^total$|total\s*amount|^total amount$/]);
              const cGst=findCol([/gst/]);
              const cMedia=findCol([/media|material|spec/]);
              const cSqft=findCol([/^sqft$/]);
              // W/H: check sub-header first, then main header, then "size in foot" pattern
              let cW=subRow.indexOf('w');if(cW<0)cW=findCol([/^w$/,/width/]);
              let cH=subRow.indexOf('h');if(cH<0)cH=findCol([/^h$/,/height/]);
              // If SIZE IN FOOT found and no W/H, assume W is that col and H is next
              if(cW<0){const sizeCol=findCol([/size.*foot|size.*in/]);if(sizeCol>=0){cW=sizeCol;cH=sizeCol+1;}}
              
              // Extract metadata from rows above header
              let poNum='',delivAddr='';
              for(let i=0;i<hRow;i++){
                const k=String(data[i][0]||'').toLowerCase().trim();
                const v=String(data[i][1]||'').trim();
                if(/po\s*number|po\s*no/.test(k))poNum=v;
                if(/delivery\s*address/.test(k))delivAddr=v;
              }
              
              const lineItems=[];
              const batchId="B"+uid();
              for(let r=dataStart;r<data.length;r++){
                const row=data[r];
                const srVal=String(row[0]||'').trim();
                // Skip total/summary/terms rows
                if(/^(total|sub\s*total|gst|terms|note|nan|basic|eastimate|general)/i.test(srVal))continue;
                if(!srVal)continue;
                
                const desc=cDesc>=0?String(row[cDesc]||''):'';
                // Must have a numeric sr# with a description, or at least a description
                const isNumSr=/^\d+$/.test(srVal);
                if(!desc&&!isNumSr)continue;
                
                const qty=cQty>=0?(+row[cQty]||0):1;

            <div><label style={{fontSize:8,color:"#64748b"}}>Delivery Note</label><input className="in" value={dcForm.delivery_note} onChange={e=>setDcForm(p=>({...p,delivery_note:e.target.value}))} style={{fontSize:10}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>Date</label><input className="in" type="date" value={dcForm.dc_date} onChange={e=>setDcForm(p=>({...p,dc_date:e.target.value}))} style={{fontSize:10}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>PO. No</label><input className="in mn" value={dcForm.po_no} onChange={e=>setDcForm(p=>({...p,po_no:e.target.value}))} style={{fontSize:10}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>PO Date</label><input className="in" type="date" value={dcForm.po_date} onChange={e=>setDcForm(p=>({...p,po_date:e.target.value}))} style={{fontSize:10}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>Prepared By</label><input className="in" value={dcForm.prepared_by} onChange={e=>setDcForm(p=>({...p,prepared_by:e.target.value}))} style={{fontSize:10}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>Delivered By</label><input className="in" value={dcForm.delivered_by} onChange={e=>setDcForm(p=>({...p,delivered_by:e.target.value}))} placeholder="Delivery person name" style={{fontSize:10}}/></div>
          </div>
          <div style={{marginTop:10,padding:8,background:"#060810",border:"1px solid #1a2030",borderRadius:6}}>
            {(()=>{
              const allItems=batch.items||[];
              const selSet=dcSelectedItems===null?new Set(allItems.map(x=>x.id)):dcSelectedItems;
              const selCount=dcSelectedItems===null?allItems.length:dcSelectedItems.size;
              const toggleItem=(id)=>{
                const current=dcSelectedItems===null?new Set(allItems.map(x=>x.id)):new Set(dcSelectedItems);
                if(current.has(id)) current.delete(id); else current.add(id);
                setDcSelectedItems(current.size===allItems.length?null:new Set(current));
              };
              const toggleAll=()=>setDcSelectedItems(dcSelectedItems===null?new Set():null);
              return <>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                  <p style={{fontSize:9,color:'#10b981',fontWeight:700}}>
                    ITEMS TO BE INCLUDED
                    <span style={{marginLeft:6,color:selCount<allItems.length?'#f59e0b':'#10b981'}}>
                      ({selCount} of {allItems.length} selected{selCount<allItems.length?' — PARTIAL DC':''})
                    </span>
                  </p>
                  <button onClick={toggleAll} style={{fontSize:8,padding:'2px 8px',background:'transparent',border:'1px solid #1a2030',borderRadius:4,color:'#64748b',cursor:'pointer'}}>
                    {dcSelectedItems===null?'Deselect All':'Select All'}
                  </button>
                </div>
                <div style={{fontSize:9,color:'#8b949e',maxHeight:160,overflowY:'auto'}}>
                  {allItems.map((it,i)=>{
                    const checked=selSet.has(it.id);
                    return <div key={it.id}
                      onClick={()=>toggleItem(it.id)}
                      style={{display:'flex',alignItems:'center',gap:8,padding:'5px 6px',borderBottom:'1px solid #1a2030',cursor:'pointer',background:checked?'rgba(16,185,129,0.05)':'transparent',borderRadius:3,transition:'background 0.1s'}}>
                      <div style={{width:14,height:14,borderRadius:3,border:'1.5px solid '+(checked?'#10b981':'#475569'),background:checked?'#10b981':'transparent',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                        {checked&&<span style={{color:'#000',fontSize:9,fontWeight:900,lineHeight:1}}>✓</span>}
                      </div>
                      <span style={{flex:1,color:checked?'#e2e8f0':'#64748b',textDecoration:checked?'none':'line-through'}}>
                        {i+1}. {it.internal_name||it.client_name}
                        {it.width&&it.height?' — '+it.width+'×'+it.height+(it.size_unit?''+it.size_unit:''):''}
                        <span style={{color:'#64748b',marginLeft:4}}>× {it.qty}</span>
                      </span>
                    </div>;
                  })}
                </div>
                {selCount===0&&<div style={{fontSize:9,color:'#f47067',marginTop:6,padding:'4px 6px',background:'rgba(244,112,103,0.08)',borderRadius:4}}>⚠️ No items selected — select at least 1 item to generate DC</div>}
              </>;
            })()}
          </div>
          <div style={{display:"flex",gap:6,marginTop:12,justifyContent:"flex-end"}}>
            <button className="b" onClick={()=>setDcMode(null)}>Cancel</button>
            {(()=>{const cnt=dcSelectedItems===null?(batch.items||[]).length:(dcSelectedItems?.size||0);return <button className="b bp" onClick={()=>{if(cnt===0){show('Select at least 1 item',false);return;}saveAndPrintDC(batch);}} style={{background:cnt===0?'#374151':'#10b981',borderColor:cnt===0?'#374151':'#10b981',fontSize:11,padding:'6px 16px',opacity:cnt===0?0.6:1}}>🖨️ Save & Print DC ({cnt} item{cnt!==1?'s':''}, 3 Copies)</button>;})()}
          </div>
        </div>
      </div>;
    })()}

  </div>;
}

function NewJobPage({firms,clients,products,team,machines,createJob,addNewClient,sp,jobs,user}){

  const GST_OPTS=[0,5,12,18,28];
  const uI=(i,k,v)=>{sIts(p=>{const n=[...p];const it={...n[i],[k]:v};const w=+it.w||0,h=+it.h||0,q=+it.qty||1,r=+it.rate||0;const gp=+(it.gstPct||18);const um=getUnitMode(it.rm);it.sqft=um.areaFn(w,h,q);it.tot=um.totalFn(it.sqft,q,r);it.gst=Math.round(it.tot*(gp/100)*100)/100;it.amt=Math.round((it.tot+it.gst)*100)/100;n[i]=it;return n;});};
  const aI=()=>sIts(p=>{const lastRm=p[p.length-1]?.rm||"SqFt (INCH)";return [...p,{id:uid(),sr:p.length+1,pi:0,int:products[0]?.internal_name||"",cli:products[0]?.client_name||"",m:"",w:"",h:"",qty:1,rm:lastRm,rate:"",sqft:0,tot:0,gst:0,amt:0,gstPct:18,mach:"In-house",imgUrl:""}];});
  const rI=i=>sIts(p=>p.filter((_,x)=>x!==i).map((it,x)=>({...it,sr:x+1})));

  // Sequential job numbering — FY auto-detect based on current date
  const curFY=useMemo(()=>{const n=new Date();const m=n.getMonth(),y=n.getFullYear();return m>=3?`${String(y).slice(2)}${String(y+1).slice(2)}`:`${String(y-1).slice(2)}${String(y).slice(2)}`;},[]); 
  const [dbMaxNum,setDbMaxNum]=useState(0);

    const batchId="B"+uid();

    const lineItems=its.map(it=>({id:"LI"+uid(),batch_id:batchId,job_id:jid,sr:it.sr,product_id:"",internal_name:it.int,client_name:it.cli,media:it.m,width:it.w,height:it.h,size_unit:getUnitMode(it.rm).dimUnit||'INCH',qty:+it.qty||1,rate_mode:it.rm,rate:+it.rate||0,sqft:it.sqft,total:it.tot,gst:it.gst,gstPct:+(it.gstPct||18),amount:it.amt,area:it.mach||"In-house",dept_estimate:false,dept_design:false,dept_production:false,dept_printing:false,dept_fabrication:false,dept_dispatch:false,dept_installation:false,dept_accounts:false,img_url:it.imgUrl||""}));

    <div className="c a" style={{padding:10}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><div><p style={{fontSize:8,color:"#64748b"}}>NEW JOB</p><p className="mn" style={{fontSize:16,fontWeight:800,color:"#e3a008"}}>{jid}</p></div><FB f={fm} firms={firms}/></div>
      <div className="fg f3">
        <F l="Made By"><select className="in" value={f.mb} onChange={e=>sF(p=>({...p,mb:e.target.value}))}>{team.map(t=><option key={t.name} value={t.name}>{t.name}</option>)}</select></F>
        <F l="Date"><input type="date" className="in" value={f.rd} onChange={e=>sF(p=>({...p,rd:e.target.value}))}/></F>

      <div style={{overflowX:"auto"}}><table><thead><tr><th>#</th><th>Internal</th><th>📷</th><th>Client(DC)</th><th>Material</th><th>Unit</th><th style={{minWidth:50,fontSize:8,color:"#94a3b8"}}>W</th><th style={{minWidth:50,fontSize:8,color:"#94a3b8"}}>H</th><th>Qty</th><th>Area/Qty</th><th>Rate ₹</th><th>Total</th><th>GST%</th><th>GST</th><th>Amt</th><th>Machine/Out</th><th></th></tr></thead>
        <tbody>{its.map((it,i)=><tr key={it.id}><td className="mn" style={{fontSize:9}}>{it.sr}</td>
          <td><select className="in" value={it.pi} onChange={e=>{const v=+e.target.value;if(v===-1){sIts(p=>{const n=[...p];n[i]={...n[i],pi:-1,int:"",cli:""};return n;});}else{selP(i,v);}}} style={{fontSize:9,padding:"2px",minWidth:90}}><option value={-1}>— New Material —</option>{products.map((p,pi)=><option key={pi} value={pi}>{p.internal_name}</option>)}</select>{(it.pi===-1||it.pi==="-1")&&<input className="in" value={it.int} onChange={e=>sIts(p=>{const n=[...p];n[i]={...n[i],int:e.target.value};return n;})} placeholder="Type name..." autoFocus style={{fontSize:9,padding:"2px 3px",marginTop:2}}/>}</td>
          <td style={{padding:"2px",minWidth:40}}>{it.imgUrl?<a href={it.imgUrl} target="_blank"><img src={it.imgUrl} style={{width:30,height:30,objectFit:"cover",borderRadius:3,border:"1px solid #1a2030"}}/></a>:<label style={{cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",width:30,height:30,borderRadius:3,border:"1px dashed #3b82f6",color:"#3b82f6",fontSize:11}}>+<input type="file" accept=".jpg,.png,.jpeg,.pdf" style={{display:"none"}} onChange={async e=>{const file=e.target.files[0];if(file){const url=await uploadFile(file,'item-images');if(url)sIts(p=>{const n=[...p];n[i]={...n[i],imgUrl:url};return n;});}}}/></label>}</td>

function DeptPage({jobs,s,togDept,updateJobStatus,sm}){
  const ALL_ST=['Draft','Quotation Sent','PO Pending','PO Received','Recce Pending','Designing','Printing','Fabrication','Installation','Delivered','Billing Pending','Given for Billing','Cash Pending','Proforma Invoice','IC Pending','Billing Done','Cash Received','No Bill','Cancelled'];
  const tabs=[
    {id:'Estimate',l:'Estimate',c:'#3b82f6',st:['Quotation Sent','PO Pending','PO Received','Recce Pending','Active','Draft']},
    {id:'Design',l:'Design',c:'#8b5cf6',st:['Designing']},
    {id:'Printing',l:'Printing',c:'#ef4444',st:['Printing']},
    {id:'Fabrication',l:'Fabrication',c:'#dc2626',st:['Fabrication']},
    {id:'Installation',l:'Installation',c:'#059669',st:['Installation']},
    {id:'Dispatch',l:'Dispatch',c:'#10b981',st:['Delivered']},
    {id:'Accounts',l:'Accounts',c:'#06b6d4',st:['Billing Pending','Given for Billing','Cash Pending','Proforma Invoice','IC Pending']},
  ];
  const [ad,sad]=useState(tabs[0].id);
  const cur=tabs.find(t=>t.id===ad);
  const pen=useMemo(()=>jobs.filter(j=>{if(s&&!j.id?.toLowerCase().includes(s.toLowerCase())&&!j.client_name?.toLowerCase().includes(s.toLowerCase()))return false;return cur.st.includes(j.status);}),[jobs,cur,s]);
  const sc={'Quotation Sent':'#3b82f6','Designing':'#8b5cf6','Recce Pending':'#f59e0b','PO Pending':'#f47067','PO Received':'#4ade80','Printing':'#ef4444','Fabrication':'#dc2626','Installation':'#059669','Delivered':'#10b981','Billing Pending':'#06b6d4','Given for Billing':'#06b6d4','Cash Pending':'#e3a008','Proforma Invoice':'#8b5cf6','IC Pending':'#f59e0b','Active':'#64748b'};
  const openJob=(j)=>sm({t:`Job ${j.id} — ${j.project}`,jobId:j.id,fallback:j});
  return <div style={{display:"flex",flexDirection:"column",gap:6}}><div style={{display:"flex",gap:2,flexWrap:"wrap"}}>{tabs.map(t=><button key={t.id} className={`b bs ${ad===t.id?"bp":""}`} onClick={()=>sad(t.id)} style={ad!==t.id?{borderColor:t.c+"55",color:t.c}:{}}>{t.l} ({jobs.filter(j=>t.st.includes(j.status)).length})</button>)}</div>
    <div className="c" style={{padding:0}}><div style={{padding:"6px 8px",borderBottom:`2px solid ${cur.c}`,background:"#0a0f1a"}}><span style={{fontSize:10,fontWeight:700,color:cur.c}}>{cur.l} — {pen.length} jobs</span></div>
    <div style={{overflowX:"auto",maxHeight:"calc(100vh-160px)"}}><table><thead><tr><th>Job</th><th>Date</th><th>Client</th><th>Product</th><th>Status</th><th>Project</th><th>Contact</th><th>Change Status</th></tr></thead><tbody>
      {pen.map((j,i)=>{const it=(j.batches||[])[0]?.items?.[0];const dt=j.created_at?new Date(j.created_at):null;const ds=dt?dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):'';return <tr key={i}><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700,cursor:"pointer",textDecoration:"underline",textDecorationColor:"#e3a00844"}} onClick={()=>openJob(j)}><StatusTip j={j}>{j.id}</StatusTip></td><td style={{fontSize:8,color:"#64748b",whiteSpace:"nowrap"}}>{ds}</td><td style={{fontSize:10}}>{j.client_name?.slice(0,22)}</td><td style={{fontSize:10,fontWeight:600}}>{it?.internal_name||''}</td><td><StatusTip j={j}><span className="bd" style={{background:(sc[j.status]||'#64748b')+'20',color:sc[j.status]||'#64748b'}}>{j.status}</span></StatusTip></td><td style={{fontSize:10,color:"#64748b"}}>{j.project?.slice(0,22)}</td><td style={{fontSize:10}}>{j.contact_person}</td>
        <td><select className="in" defaultValue="" onChange={e=>{const ns=e.target.value;if(!ns)return;if(confirm('Change "'+j.id+'" from "'+j.status+'" to "'+ns+'"?')){updateJobStatus(j.id,ns);}e.target.value='';}} style={{fontSize:9,padding:"2px 4px",width:120}}><option value="">Change →</option>{ALL_ST.filter(st=>st!==j.status).map(st=><option key={st} value={st}>{st}</option>)}</select></td></tr>})}
      {pen.length===0&&<tr><td colSpan={8} style={{textAlign:"center",color:"#4ade80",padding:20}}>🎉 All done!</td></tr>}
    </tbody></table></div></div></div>;

function GRNPage({grn,suppliers,materials,team,addGRN,updateGRN,deleteGRN,addNewMaterial,addNewSupplier}){const [sf,ssf]=useState(false);const [selGrn,setSelGrn]=useState(null);const [editGrn,setEditGrn]=useState(null);const [photoFile,setPhotoFile]=useState(null);const [poFile,setPoFile]=useState(null);const [saving,setSaving]=useState(false);const [f,sF]=useState({date:td(),supplier:suppliers[0]?.name||"",material:materials[0]?.name||"",code:"",size:"",length:"",qty:1,unit:"roll",sqft:"",rate:"",invoice_no:"",job_id:"",inward_type:"Stock",received_by:team[0]?.name||"",qc:"OK"});
  const [newMat,setNewMat]=useState("");const [newSup,setNewSup]=useState("");const [showNewMat,setShowNewMat]=useState(false);const [showNewSup,setShowNewSup]=useState(false);

    {showNewSup&&<div style={{display:"flex",gap:4,marginTop:6,padding:6,background:"#060810",borderRadius:6}}><input className="in" placeholder="New supplier name..." value={newSup} onChange={e=>setNewSup(e.target.value)} style={{flex:1}}/><button className="b bg bs" onClick={doAddSup}>Add Supplier</button><button className="b bs" onClick={()=>setShowNewSup(false)}>✕</button></div>}

    </tbody></table></div></div>
    {selGrn&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>{setSelGrn(null);setEditGrn(null);}}><div style={{background:"#0c1017",border:"1px solid #1a2030",borderRadius:12,width:"100%",maxWidth:650,padding:20,maxHeight:"calc(100vh - 40px)",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>

      {editGrn?<div>
        <div className="fg f3" style={{gap:6,fontSize:11}}>

          <F l="Supplier"><select className="in" value={editGrn.supplier||''} onChange={e=>setEditGrn(p=>({...p,supplier:e.target.value}))}>{suppliers.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}</select></F>
          <F l="Material"><select className="in" value={editGrn.material||''} onChange={e=>setEditGrn(p=>({...p,material:e.target.value}))}>{materials.map(m=><option key={m.id} value={m.name}>{m.name}</option>)}</select></F>
          <F l="Code#"><input className="in mn" value={editGrn.code||''} onChange={e=>setEditGrn(p=>({...p,code:e.target.value}))}/></F>
          <F l="Size"><input className="in mn" value={editGrn.size||''} onChange={e=>setEditGrn(p=>({...p,size:e.target.value}))}/></F>
          <F l="Length"><input className="in mn" value={editGrn.length||''} onChange={e=>setEditGrn(p=>({...p,length:e.target.value}))}/></F>
          <F l="Qty"><input className="in mn" type="number" value={editGrn.qty||''} onChange={e=>setEditGrn(p=>({...p,qty:+e.target.value}))}/></F>
          <F l="Unit"><select className="in" value={editGrn.unit||'roll'} onChange={e=>setEditGrn(p=>({...p,unit:e.target.value}))}>{MUNITS.map(u=><option key={u}>{u}</option>)}</select></F>
          <F l="SqFt"><input className="in mn" value={editGrn.sqft||''} onChange={e=>setEditGrn(p=>({...p,sqft:+e.target.value}))}/></F>
          <F l="Rate"><input className="in mn" value={editGrn.rate||''} onChange={e=>setEditGrn(p=>({...p,rate:+e.target.value}))}/></F>
          <F l="Invoice#"><input className="in mn" value={editGrn.invoice_no||''} onChange={e=>setEditGrn(p=>({...p,invoice_no:e.target.value}))}/></F>
          <F l="Job#"><input className="in mn" value={editGrn.job_id||''} onChange={e=>setEditGrn(p=>({...p,job_id:e.target.value}))}/></F>
          <F l="Type"><select className="in" value={editGrn.inward_type||'Stock'} onChange={e=>setEditGrn(p=>({...p,inward_type:e.target.value}))}><option>Stock</option><option>Job</option></select></F>
          <F l="Received By"><select className="in" value={editGrn.received_by||''} onChange={e=>setEditGrn(p=>({...p,received_by:e.target.value}))}>{team.map(t=><option key={t.name} value={t.name}>{t.name}</option>)}</select></F>
          <F l="QC"><select className="in" value={editGrn.qc||'OK'} onChange={e=>setEditGrn(p=>({...p,qc:e.target.value}))}><option>OK</option><option>Rejected</option></select></F>
        </div>
        <div style={{display:"flex",gap:4,marginTop:10,justifyContent:"flex-end"}}>
          <button className="b" onClick={()=>setEditGrn(null)}>Cancel</button>

      </div>

        <div><span style={{color:"#64748b",fontSize:9}}>SUPPLIER</span><p style={{fontWeight:600}}>{selGrn.supplier}</p></div>

        <div><span style={{color:"#64748b",fontSize:9}}>INVOICE / CHALLAN #</span><p className="mn">{selGrn.invoice_no||'—'}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>JOB #</span><p className="mn" style={{color:"#e3a008"}}>{selGrn.job_id||'—'}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>TYPE</span><p>{selGrn.inward_type}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>RECEIVED BY</span><p>{selGrn.received_by}</p></div>

        <div><span style={{color:"#64748b",fontSize:9}}>PHOTO</span><p>{selGrn.photo_url?<a href={selGrn.photo_url} target="_blank" style={{color:"#3b82f6"}}>📸 View Photo</a>:'No photo uploaded'}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>PO COPY</span><p>{selGrn.po_file_url?<a href={selGrn.po_file_url} target="_blank" style={{color:"#3b82f6"}}>📎 View PO</a>:'No PO uploaded'}</p></div>
      </div>}
    </div></div>}
    </div>;
}

// PRINTING — Analytics Dashboard (auto-logged via dept checkboxes)
function PrintPage({logs,machines,materials,team,stock,addLog,jobs,sm,updateJobStatus}){
  const [showQ,setShowQ]=useState(true);
  const [showDetail,setShowDetail]=useState(null); // log id being detailed
  const [df,setDf]=useState({machine:'',ink_cyan:0,ink_magenta:0,ink_yellow:0,ink_black:0,ink_white:0,waste:0,notes:''});
  const ALL_ST=['Draft','Quotation Sent','PO Pending','PO Received','Recce Pending','Designing','Printing','Fabrication','Installation','Delivered','Billing Pending','Given for Billing','Cash Pending','Proforma Invoice','IC Pending','Billing Done','Cash Received','No Bill','Cancelled'];
  const queue=(jobs||[]).filter(j=>j.status==='Printing');
  const openJob=(j)=>sm&&sm({t:`Job ${j.id} — ${j.project}`,jobId:j.id,fallback:j});
  // Analytics
  const today=td();
  const weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-7);const weekAgoStr=weekAgo.toISOString().slice(0,10);
  const logsToday=logs.filter(l=>l.date===today);
  const logsThisWeek=logs.filter(l=>l.date>=weekAgoStr);
  const totalSqftToday=logsToday.reduce((s,l)=>s+(+l.print_sqft||0),0);
  const totalSqftWeek=logsThisWeek.reduce((s,l)=>s+(+l.print_sqft||0),0);
  // Machine usage
  const byMachine={};logsThisWeek.forEach(l=>{const m=l.machine||'(unset)';byMachine[m]=(byMachine[m]||0)+1;});
  const machineRows=Object.entries(byMachine).sort((a,b)=>b[1]-a[1]);
  // Operator productivity
  const byOp={};logsThisWeek.forEach(l=>{const o=l.operator||'(unknown)';if(!byOp[o])byOp[o]={count:0,sqft:0};byOp[o].count++;byOp[o].sqft+=(+l.print_sqft||0);});
  const opRows=Object.entries(byOp).sort((a,b)=>b[1].count-a[1].count);
  // Save detail (machine+ink) for an auto-logged entry
  const saveDetail=async(logId)=>{
    const {error}=await sb.from('print_logs').update({machine:df.machine,ink_cyan:+df.ink_cyan||0,ink_magenta:+df.ink_magenta||0,ink_yellow:+df.ink_yellow||0,ink_black:+df.ink_black||0,ink_white:+df.ink_white||0,waste:+df.waste||0,notes:df.notes}).eq('id',logId);
    if(error){alert('Error: '+error.message);return;}
    setShowDetail(null);setDf({machine:'',ink_cyan:0,ink_magenta:0,ink_yellow:0,ink_black:0,ink_white:0,waste:0,notes:''});
    location.reload();
  };
  return <div style={{display:"flex",flexDirection:"column",gap:6}}>
    <div className="c a" style={{padding:10,background:"linear-gradient(90deg,#ef444422,#0a0f1a)",borderColor:"#ef444433"}}>
      <p style={{fontSize:11,fontWeight:700,color:"#ef4444",marginBottom:4}}>🖨️ PRINTING — AUTO-TRACKED</p>
      <p style={{fontSize:10,color:"#8b949e"}}>Logs are created <strong>automatically</strong> when you tick the <span style={{background:"#10b98122",color:"#10b981",padding:"1px 4px",borderRadius:3,fontWeight:700}}>PRI</span> checkbox on any line item. Click any log below to add machine name, ink consumed, and waste — all optional.</p>
    </div>
    {/* Stat cards */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
      <div className="c" style={{padding:10,textAlign:"center"}}><p style={{fontSize:8,color:"#64748b"}}>JOBS IN PRINTING</p><p style={{fontSize:18,fontWeight:800,color:"#ef4444"}}>{queue.length}</p></div>
      <div className="c" style={{padding:10,textAlign:"center"}}><p style={{fontSize:8,color:"#64748b"}}>ITEMS PRINTED TODAY</p><p style={{fontSize:18,fontWeight:800,color:"#e3a008"}}>{logsToday.length}</p></div>
      <div className="c" style={{padding:10,textAlign:"center"}}><p style={{fontSize:8,color:"#64748b"}}>SQFT PRINTED TODAY</p><p style={{fontSize:18,fontWeight:800,color:"#8b5cf6"}}>{totalSqftToday.toFixed(0)}</p></div>
      <div className="c" style={{padding:10,textAlign:"center"}}><p style={{fontSize:8,color:"#64748b"}}>SQFT THIS WEEK</p><p style={{fontSize:18,fontWeight:800,color:"#10b981"}}>{totalSqftWeek.toFixed(0)}</p></div>
    </div>
    {/* Queue */}
    <div className="c" style={{padding:0}}>
      <div style={{padding:"6px 10px",borderBottom:"2px solid #ef4444",background:"#0a0f1a",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>setShowQ(p=>!p)}>
        <span style={{fontSize:11,fontWeight:700,color:"#ef4444"}}>🖨️ Jobs in Printing Queue — {queue.length}</span><span style={{fontSize:9,color:"#64748b"}}>{showQ?'▾ Hide':'▸ Show'}</span>
      </div>
      {showQ&&<div style={{overflowX:"auto",maxHeight:250}}><table><thead><tr><th>Job</th><th>Client</th><th>Project</th><th>Items</th><th>Contact</th><th>Change Status</th></tr></thead><tbody>
        {queue.map(j=>{const itemCount=(j.batches||[]).reduce((s,b)=>(s+(b.items||[]).length),0);return <tr key={j.id}><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700,cursor:"pointer",textDecoration:"underline",textDecorationColor:"#e3a00844"}} onClick={()=>openJob(j)}>{j.id}</td><td style={{fontSize:10}}>{j.client_name?.slice(0,20)}</td><td style={{fontSize:10,color:"#64748b"}}>{j.project?.slice(0,20)}</td><td className="mn" style={{fontSize:10}}>{itemCount}</td><td style={{fontSize:10}}>{j.contact_person?.slice(0,15)}</td><td><select className="in" defaultValue="" onChange={e=>{const ns=e.target.value;if(!ns)return;if(confirm('Change "'+j.id+'" from "'+j.status+'" to "'+ns+'"?')){updateJobStatus(j.id,ns);}e.target.value='';}} style={{fontSize:9,padding:"2px 4px",width:110}}><option value="">Change →</option>{ALL_ST.filter(st=>st!==j.status).map(st=><option key={st} value={st}>{st}</option>)}</select></td></tr>})}
        {queue.length===0&&<tr><td colSpan={6} style={{textAlign:"center",color:"#64748b",padding:12}}>No jobs in Printing</td></tr>}
      </tbody></table></div>}
    </div>
    {/* Analytics: Machine + Operator */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
      <div className="c" style={{padding:0}}><div style={{padding:"6px 10px",borderBottom:"1px solid #1a2030",background:"#0a0f1a"}}><span style={{fontSize:10,fontWeight:700,color:"#ef4444"}}>📊 Machine Usage (7 days)</span></div>
        <table style={{width:"100%"}}><thead><tr><th style={{textAlign:"left"}}>Machine</th><th className="mn">Jobs</th></tr></thead><tbody>
        {machineRows.map(([m,c])=><tr key={m}><td style={{fontSize:10}}>{m}</td><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700}}>{c}</td></tr>)}
        {machineRows.length===0&&<tr><td colSpan={2} style={{textAlign:"center",color:"#64748b",padding:12,fontSize:10}}>No data yet</td></tr>}
      </tbody></table></div>
      <div className="c" style={{padding:0}}><div style={{padding:"6px 10px",borderBottom:"1px solid #1a2030",background:"#0a0f1a"}}><span style={{fontSize:10,fontWeight:700,color:"#10b981"}}>👷 Operator Productivity (7 days)</span></div>
        <table style={{width:"100%"}}><thead><tr><th style={{textAlign:"left"}}>Operator</th><th className="mn">Items</th><th className="mn">SqFt</th></tr></thead><tbody>
        {opRows.map(([o,d])=><tr key={o}><td style={{fontSize:10}}>{o}</td><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700}}>{d.count}</td><td className="mn" style={{fontSize:10,color:"#8b5cf6"}}>{d.sqft.toFixed(0)}</td></tr>)}
        {opRows.length===0&&<tr><td colSpan={3} style={{textAlign:"center",color:"#64748b",padding:12,fontSize:10}}>No data yet</td></tr>}
      </tbody></table></div>
    </div>
    {/* Auto-logged entries */}
    <div className="c" style={{padding:0}}>
      <div style={{padding:"6px 10px",borderBottom:"1px solid #1a2030",background:"#0a0f1a"}}><span style={{fontSize:10,fontWeight:700,color:"#ef4444"}}>📋 Recent Print Activity ({logs.length} total)</span><span style={{fontSize:8,color:"#64748b",marginLeft:8}}>Click any row to add machine + ink consumption details</span></div>

function DispPage({logs,delBoys,addLog}){const [sf,ssf]=useState(false);const [f,sF]=useState({date:td(),job_id:"",dispatch_type:"Delivery Only",delivery_boy:delBoys[0]?.name||"",vehicle:"",lr_no:"",challan_no:"",installer:"",install_date:""});

  return <div style={{display:"flex",flexDirection:"column",gap:6}}>
    <button className="b bp" onClick={()=>ssf(p=>!p)}>{sf?"▾":"🚚 New Dispatch"}</button>
    {sf&&<div className="c a" style={{padding:10}}><div className="fg f3">
      <F l="Date"><input type="date" className="in" value={f.date} onChange={e=>sF(p=>({...p,date:e.target.value}))}/></F>
      <F l="Job#"><input className="in mn" value={f.job_id} onChange={e=>sF(p=>({...p,job_id:e.target.value}))}/></F>
      <F l="Type"><select className="in" value={f.dispatch_type} onChange={e=>sF(p=>({...p,dispatch_type:e.target.value}))}><option>Delivery Only</option><option>Delivery + Install</option></select></F>
      <F l="Del Boy"><select className="in" value={f.delivery_boy} onChange={e=>sF(p=>({...p,delivery_boy:e.target.value}))}>{delBoys.map(d=><option key={d.id} value={d.name}>{d.name}</option>)}<option>Other</option></select></F>
      <F l="Vehicle/Courier"><input className="in" value={f.vehicle} onChange={e=>sF(p=>({...p,vehicle:e.target.value}))}/></F>
      <F l="LR/Track#"><input className="in mn" value={f.lr_no} onChange={e=>sF(p=>({...p,lr_no:e.target.value}))}/></F>
      <F l="Challan#"><input className="in mn" value={f.challan_no} onChange={e=>sF(p=>({...p,challan_no:e.target.value}))}/></F>
      <F l="📸 Challan"><input type="file" accept="image/*" className="in" style={{padding:2}}/></F>
      <F l="📸 POD"><input type="file" accept="image/*" className="in" style={{padding:2}}/></F>
      {f.dispatch_type.includes("Install")&&<><F l="Installer"><input className="in" value={f.installer} onChange={e=>sF(p=>({...p,installer:e.target.value}))}/></F><F l="Install Date"><input type="date" className="in" value={f.install_date} onChange={e=>sF(p=>({...p,install_date:e.target.value}))}/></F></>}

    <div className="c" style={{padding:0}}><div style={{overflowX:"auto"}}><table><thead><tr><th>Date</th><th>Job</th><th>Type</th><th>Boy</th><th>Vehicle</th><th>Challan</th><th>LR</th></tr></thead><tbody>
      {logs.map(l=><tr key={l.id}><td>{l.date}</td><td className="mn" style={{color:"#e3a008"}}>{l.job_id}</td><td><span className="bd" style={{background:l.dispatch_type?.includes("Install")?"#8b5cf620":"#10b98120",color:l.dispatch_type?.includes("Install")?"#c084fc":"#4ade80"}}>{l.dispatch_type}</span></td><td>{l.delivery_boy}</td><td>{l.vehicle}</td><td className="mn">{l.challan_no}</td><td className="mn">{l.lr_no}</td></tr>)}
      {logs.length===0&&<tr><td colSpan={7} style={{textAlign:"center",color:"#64748b",padding:16}}>None</td></tr>}
    </tbody></table></div></div></div>;
}

// STOCK
function StockPage({stock,grn,pl,fl}){const rows=Object.entries(stock).filter(([,v])=>v!==0||true).sort((a,b)=>a[0].localeCompare(b[0]));

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:6}}>

      {rows.map(([m,q])=><tr key={m}><td style={{fontWeight:600}}>{m}</td><td className="mn" style={{fontWeight:700}}>{q}</td><td>{q<=0?<span className="bd" style={{background:"#3b060720",color:"#f47067"}}>Out</span>:q<=2?<span className="bd" style={{background:"#3b250620",color:"#f59e0b"}}>Low</span>:<span className="bd" style={{background:"#05200e20",color:"#4ade80"}}>OK</span>}</td></tr>)}

async function sendWhatsApp(toNumber, message, campaign='iprint_notification') {
  if (META_WA_TOKEN && META_PHONE_NUMBER_ID) {
    try {
      const url = 'https://graph.facebook.com/v19.0/' + META_PHONE_NUMBER_ID + '/messages';
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + META_WA_TOKEN
        },
        body: JSON.stringify({
          messaging_product: 'whatsapp',
          to: toNumber,
          type: 'text',
          text: { body: message }
        })
      });
      const data = await res.json();
      if (data.messages && data.messages[0] && data.messages[0].id) {
        console.log('WA sent OK:', data.messages[0].id);
        return true;
      } else {
        console.warn('WA API issue:', JSON.stringify(data));
        window.open('https://wa.me/' + toNumber + '?text=' + encodeURIComponent(message), '_blank');
        return false;
      }
    } catch(e) {
      console.error('Meta WA API error:', e);
      window.open('https://wa.me/' + toNumber + '?text=' + encodeURIComponent(message), '_blank');
      return false;
    }
  }
  window.open('https://wa.me/' + toNumber + '?text=' + encodeURIComponent(message), '_blank');
  return false;
}

// Convert number to words (Indian format)
function numToWords(n) {
  if (!n || isNaN(n)) return 'Zero';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function convert(num) {
    if (num === 0) return '';
    if (num < 20) return ones[num] + ' ';
    if (num < 100) return tens[Math.floor(num/10)] + (num%10 ? ' ' + ones[num%10] : '') + ' ';
    if (num < 1000) return ones[Math.floor(num/100)] + ' Hundred ' + convert(num%100);
    if (num < 100000) return convert(Math.floor(num/1000)) + 'Thousand ' + convert(num%1000);
    if (num < 10000000) return convert(Math.floor(num/100000)) + 'Lakh ' + convert(num%100000);
    return convert(Math.floor(num/10000000)) + 'Crore ' + convert(num%10000000);
  }
  const [intPart, decPart] = (+n).toFixed(2).split('.');
  let words = convert(parseInt(intPart)).trim();
  if (decPart && parseInt(decPart) > 0) words += ' and ' + convert(parseInt(decPart)).trim() + ' Paise';
  return words + ' Only';
}

  };

    const list = filter === 'All' ? prs.filter(p=>['Approved','PO Generated','PO Sent','Completed'].includes(p.status))

    return [...list].sort((a,b) => b.created_at > a.created_at ? 1 : -1);

    const n = new Date(); const m = n.getMonth(), y = n.getFullYear();
    return m >= 3 ? `${String(y).slice(2)}-${String(y+1).slice(2)}` : `${String(y-1).slice(2)}-${String(y).slice(2)}`;

    const fy = getFY();

    const nums = (data||[]).map(r => { const m = r.po_no?.match(/\/(\d+)$/); return m ? +m[1] : 0; });
    const next = String(Math.max(0, ...nums) + 1).padStart(3, '0');
    return `${firmCode}/PO/${fy}/${next}`;

    const grandTotal = subtotal + gstTotal + transport;

    // GST breakdown per rate

      const base = (+x.qty||0)*(+x.rate||0);
      const gp = +x.gst_pct || 18;
      const key = gp;
      if (!gstGroups[key]) gstGroups[key] = {base:0, tax:0};
      gstGroups[key].base += base;
      gstGroups[key].tax += base * gp / 100;
    });

    const today = new Date();
    const dateStr = today.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'2-digit'});
