      </div>
    </div>}

    {/* ── Site Action Modal: Delete / Move ─────────────────────── */}
    {siteAction&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#0c1017',border:'1px solid #1a2030',borderRadius:10,padding:20,width:'100%',maxWidth:440}}>
        {/* Header */}
        <div style={{marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:14,color:siteAction.type==='delete'?'#f47067':siteAction.type==='move'?'#06b6d4':'#e3a008',marginBottom:4}}>
            {siteAction.type==='delete'?'🗑️ Delete Site':siteAction.type==='move'?'🔀 Move Site to Another Job':'⚠️ Confirm Action'}
          </div>
          <div style={{fontSize:11,color:'#64748b'}}>
            <span style={{color:'#8b5cf6',fontWeight:700}}>{siteAction.site.atm_id||'—'}</span>
            {siteAction.site.site_unique_id&&<span style={{color:'#06b6d4',marginLeft:6}}>{siteAction.site.site_unique_id}</span>}
            <span style={{marginLeft:6}}>{siteAction.site.site_address?.slice(0,50)||''}</span>
          </div>
          <div style={{fontSize:10,color:'#64748b',marginTop:2}}>Currently in Job <strong style={{color:'#e3a008'}}>#{siteAction.site.job_no||'—'}</strong></div>
        </div>

        {/* DELETE */}
        {siteAction.type==='delete'&&<div>
          <div style={{background:'rgba(244,112,103,0.08)',border:'1px solid rgba(244,112,103,0.3)',borderRadius:7,padding:10,fontSize:11,color:'#fca5a5',marginBottom:14}}>
            ⚠️ This will <strong>permanently delete</strong> this site entry from the Banking CRM. The linked job will not be affected. This cannot be undone.
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="b bs" onClick={()=>setSiteAction(null)} style={{fontSize:11}}>Cancel</button>
            <button className="b" onClick={()=>deleteSite(siteAction.site)} style={{fontSize:11,background:'#f47067',borderColor:'#f47067',color:'#fff',fontWeight:700}}>🗑️ Yes, Delete</button>
          </div>
        </div>}

        {/* MOVE */}
        {siteAction.type==='move'&&<div>
          <div style={{marginBottom:12}}>
            <label style={{fontSize:9,color:'#64748b',display:'block',marginBottom:4}}>MOVE TO JOB NUMBER</label>
            <input className="in" value={moveJobNo} onChange={e=>setMoveJobNo(e.target.value)}
              placeholder="e.g. 9932" autoFocus
              style={{fontSize:13,padding:'6px 10px',width:'100%',letterSpacing:1}}
              onKeyDown={e=>e.key==='Enter'&&moveSite(siteAction.site,moveJobNo)}/>
            <div style={{fontSize:9,color:'#64748b',marginTop:4}}>Enter the 4-digit job number (without FY suffix)</div>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="b bs" onClick={()=>{setSiteAction(null);setMoveJobNo('');}} style={{fontSize:11}}>Cancel</button>
            <button className="b bp" onClick={()=>moveSite(siteAction.site,moveJobNo)} style={{fontSize:11,background:'#06b6d4',borderColor:'#06b6d4',color:'#000',fontWeight:700}}>🔀 Move Site</button>
          </div>
        </div>}
      </div>
    </div>}

    {/* Sites Table */}
    {dupIds.size>0&&<div style={{margin:'0 0 6px',padding:'6px 12px',background:'rgba(245,158,11,0.1)',border:'1px solid rgba(245,158,11,0.35)',borderRadius:7,fontSize:11,color:'#fcd34d',display:'flex',alignItems:'center',gap:8}}>
      <span>⚠️</span>
      <span><strong>{dupIds.size/2} duplicate pair{dupIds.size>2?'s':''}</strong> detected — rows highlighted in amber. Use 🔀 to move or 🗑️ to delete the duplicate entry.</span>
    </div>}
    <div className="c" style={{overflow:'auto',maxHeight:'calc(100vh - 340px)'}}>
      <table><thead><tr>
        <th style={{width:30}}>#</th><th>Job#</th><th>Date</th><th>ATM ID</th><th>Site UID</th><th style={{minWidth:150}}>Address</th><th>City</th><th>State</th>
        <th>Vendor</th><th>V.Contact</th><th>Vendor PO#</th><th>Install</th><th>Photos</th><th>Billing</th><th>Category</th><th>Work</th><th style={{width:60,textAlign:'center'}}>Action</th>
      </tr></thead><tbody>
      {paged.map((s,i)=>{
        const billingColor=s.billing_category==='Invoiced'?'#4ade80':s.billing_category==='Given for Billing'?'#06b6d4':'#f59e0b';
        const isDup=dupIds.has(s.id);
        return <tr key={s.id} style={{background:isDup?'rgba(245,158,11,0.07)':''}}>
          <td className="mn" style={{fontSize:9}}>{page*pageSize+i+1}</td>
          <td className="mn" style={{fontSize:9,color:'#e3a008',cursor:s.job_no?'pointer':'default',fontWeight:600}} onClick={()=>{if(s.job_no){const j=jobs.find(j=>j.id?.includes(s.job_no));if(j)sm({t:`Job ${j.id}`,jobId:j.id,fallback:j});}}}>{s.job_no||'—'}</td>
          <td style={{fontSize:8,color:'#64748b',whiteSpace:'nowrap'}}>{(()=>{const d=s.created_at?new Date(s.created_at):null;return d?d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):'—';})()}</td>
          <td style={{fontSize:9,color:isDup?'#f59e0b':'#8b5cf6',maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:isDup?700:400}} title={s.atm_id}>{s.atm_id||'—'}{isDup&&<span title="Duplicate detected" style={{marginLeft:3,fontSize:8}}>⚠️</span>}</td>
          <td style={{fontSize:9,color:'#06b6d4',maxWidth:90,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={s.site_unique_id}>{s.site_unique_id||'—'}</td>
          <td style={{fontSize:9,maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={s.site_address}>{s.site_address?.slice(0,50)||'—'}</td>
          <td style={{fontSize:9}}>{s.city||s.district||'—'}</td>
          <td style={{fontSize:9,color:'#64748b'}}>{s.state?.slice(0,12)||'—'}</td>
          <td style={{fontSize:9,maxWidth:80,overflow:'hidden',textOverflow:'ellipsis'}} title={s.vendor_name}><input className="in" value={s.vendor_name||''} onChange={e=>{const v=e.target.value;setSites(p=>p.map(x=>x.id===s.id?{...x,vendor_name:v}:x));}} onBlur={e=>updateSite(s.id,'vendor_name',e.target.value)} style={{fontSize:8,padding:'2px 3px',width:80,background:'#0c1017',border:'1px solid #1a2030'}} placeholder="+ Vendor"/></td>
          <td><input className="in" value={s.vendor_contact||''} onChange={e=>{const v=e.target.value;setSites(p=>p.map(x=>x.id===s.id?{...x,vendor_contact:v}:x));}} onBlur={e=>updateSite(s.id,'vendor_contact',e.target.value)} style={{fontSize:8,padding:'2px 3px',width:72,background:'#0c1017',border:'1px solid #1a2030'}} placeholder="+ Contact"/></td>
          <td><input className="in mn" value={s.po_number||''} onChange={e=>{const v=e.target.value;setSites(p=>p.map(x=>x.id===s.id?{...x,po_number:v}:x));}} onBlur={e=>updateSiteWithJobSync(s.id,s.job_no,'po_number',e.target.value)} style={{fontSize:8,padding:'2px 3px',width:80,background:'#0c1017',border:'1px solid #1a2030',color:'#e3a008'}} placeholder="+ Vendor PO#"/></td>
          <td><select className="in" value={s.installation_status||''} onChange={e=>updateSite(s.id,'installation_status',e.target.value)} style={{fontSize:8,padding:'1px 2px',width:70,color:s.installation_status==='Completed'?'#4ade80':s.installation_status==='Duplicate'?'#64748b':'#f59e0b'}}>
            <option value="">—</option><option value="Completed">Completed</option><option value="Pending">Pending</option><option value="Duplicate">Duplicate</option><option value="In Progress">In Progress</option>
          </select></td>
          <td><select className="in" value={s.photo_status||''} onChange={e=>updateSite(s.id,'photo_status',e.target.value)} style={{fontSize:8,padding:'1px 2px',width:75,color:s.photo_status?.includes('Received')?'#4ade80':'#f59e0b'}}>
            <option value="">—</option><option value="Photo Received">Received</option><option value="Photo Pending">Pending</option><option value="Duplicate">Duplicate</option>
          </select></td>
          <td style={{fontSize:8,color:'#06b6d4'}}>{s.billing_status?.slice(0,12)||'—'}</td>
          <td><span className="bd" style={{background:billingColor+'20',color:billingColor,fontSize:8}}>{s.billing_category||'Pending'}</span></td>
          <td><select className="in" value={s.work_category||''} onChange={e=>updateSite(s.id,'work_category',e.target.value)} style={{fontSize:8,padding:'1px 2px',width:70,color:s.work_category==='Completed'?'#4ade80':'#f59e0b'}}>
            <option value="">—</option><option value="Completed">Completed</option><option value="Pending">Pending</option><option value="Duplicate">Duplicate</option>
          </select></td>
          <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
            <span title="Move to another job" onClick={()=>{setSiteAction({type:'move',site:s});setMoveJobNo('');}} style={{cursor:'pointer',fontSize:13,marginRight:4,opacity:0.7}} className="site-action-btn">🔀</span>
            <span title="Delete this site" onClick={()=>setSiteAction({type:'delete',site:s})} style={{cursor:'pointer',fontSize:13,opacity:0.7}} className="site-action-btn">🗑️</span>
          </td>
        </tr>;})}
      </tbody></table>
    </div>

    {/* Pagination */}
    {totalPages>1&&<div style={{display:'flex',justifyContent:'center',gap:4,alignItems:'center'}}>
      <button className="b bs" disabled={page===0} onClick={()=>setPage(p=>p-1)}>← Prev</button>
      <span className="mn" style={{fontSize:10,color:'#64748b'}}>Page {page+1} of {totalPages}</span>
      <button className="b bs" disabled={page>=totalPages-1} onClick={()=>setPage(p=>p+1)}>Next →</button>
    </div>}
  </div>;
}

// ═══════════════════════════════════════════════════════════
function BackupPage(){
  const [status,setStatus]=useState('');
  const [progress,setProgress]=useState(0);

  const tables=['jobs','batches','line_items','clients','firms','products','materials','suppliers','machines','outsource_agencies','delivery_boys','team_members','grn','print_logs','fab_logs','outsource_logs','dispatch_logs','expenses','client_notes'];

  const doBackup=async()=>{
    setStatus('Starting backup...');setProgress(0);
    const backup={exported_at:new Date().toISOString(),erp_version:'iPrint ERP v2.0',tables:{}};
    for(let i=0;i<tables.length;i++){
      const t=tables[i];
      setStatus(`Exporting ${t}...`);setProgress(Math.round((i/tables.length)*100));
      try{
        let all=[];let from=0;const size=1000;
        while(true){
          const {data,error}=await sb.from(t).select('*').range(from,from+size-1);
          if(error||!data||data.length===0)break;
          all=all.concat(data);
          if(data.length<size)break;
          from+=size;
        }
        backup.tables[t]={count:all.length,data:all};
      }catch(e){backup.tables[t]={count:0,data:[],error:e.message};}
    }
    setProgress(100);setStatus('Creating download file...');
    const json=JSON.stringify(backup,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date();
    a.href=url;a.download=`iprint-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
    a.click();URL.revokeObjectURL(url);
    const totalRows=Object.values(backup.tables).reduce((s,t)=>s+t.count,0);
    setStatus(`✅ Backup complete! ${tables.length} tables, ${totalRows.toLocaleString()} total rows exported.`);
  };

  const doCSVBackup=async()=>{
    setStatus('Starting CSV export...');setProgress(0);
    const csvFiles=[];
    for(let i=0;i<tables.length;i++){
      const t=tables[i];
      setStatus(`Exporting ${t}...`);setProgress(Math.round((i/tables.length)*100));
      try{
        let all=[];let from=0;const size=1000;
        while(true){
          const {data,error}=await sb.from(t).select('*').range(from,from+size-1);
          if(error||!data||data.length===0)break;
          all=all.concat(data);if(data.length<size)break;from+=size;
        }
        if(all.length>0){
          const headers=Object.keys(all[0]);
          const csv=[headers.join(','),...all.map(row=>headers.map(h=>{const v=row[h];if(v==null)return '';const s=typeof v==='object'?JSON.stringify(v):String(v);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;}).join(','))].join('\n');
          csvFiles.push({name:t+'.csv',content:csv});
        }
      }catch(e){}
    }
    setProgress(100);setStatus('Creating ZIP-like download...');
    // Download each CSV individually (simple approach)
    for(const f of csvFiles){
      const blob=new Blob([f.content],{type:'text/csv'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=f.name;a.click();URL.revokeObjectURL(url);
    }
    setStatus(`✅ CSV Export complete! ${csvFiles.length} files downloaded.`);
  };

  return <div style={{display:"flex",flexDirection:"column",gap:12,maxWidth:700}}>
    <div className="c" style={{padding:16}}>
      <h3 style={{fontSize:14,fontWeight:700,marginBottom:4}}>💾 Database Backup</h3>
      <p style={{fontSize:11,color:"#64748b",marginBottom:12}}>Export all iPrint ERP data as a backup file. This includes all jobs, batches, line items, clients, materials, GRN, expenses, and more.</p>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <button className="b bp" onClick={doBackup} style={{padding:"10px 20px",fontSize:12}}>📦 Full Backup (JSON)</button>
        <button className="b" onClick={doCSVBackup} style={{padding:"10px 20px",fontSize:12}}>📊 Export as CSV files</button>
      </div>
      {status&&<div style={{background:"#060810",border:"1px solid #1a2030",borderRadius:8,padding:12}}>
        {progress>0&&progress<100&&<div style={{height:4,background:"#1a2030",borderRadius:2,marginBottom:8,overflow:"hidden"}}><div style={{height:"100%",width:progress+"%",background:"#e3a008",borderRadius:2,transition:"width .3s"}}/></div>}
        <p style={{fontSize:11,color:status.startsWith('✅')?'#4ade80':'#e3a008'}}>{status}</p>
      </div>}
    </div>
    <div className="c" style={{padding:16}}>
      <h3 style={{fontSize:14,fontWeight:700,marginBottom:4}}>🔒 Security Status</h3>
      <p style={{fontSize:11,color:"#64748b",marginBottom:8}}>Row Level Security (RLS) protects your database from unauthorized access.</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
        {tables.map(t=><div key={t} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 8px",background:"#060810",borderRadius:5,border:"1px solid #1a2030"}}>
          <span style={{color:"#4ade80",fontSize:10}}>🛡️</span>
          <span style={{fontSize:10}}>{t}</span>
        </div>)}
      </div>
    </div>
    <div className="c" style={{padding:16}}>
      <h3 style={{fontSize:14,fontWeight:700,marginBottom:4}}>📋 Backup Best Practices</h3>
      <div style={{fontSize:11,color:"#8b949e",lineHeight:1.6}}>
        <p>• Take a backup <strong style={{color:"#e3a008"}}>every week</strong> — download the JSON file and save it to Google Drive or a USB drive</p>
        <p>• The JSON backup contains ALL data and can be used to restore if needed</p>
        <p>• CSV export is useful for opening in Excel for reports and analysis</p>
        <p>• Supabase also maintains automatic daily backups on their servers</p>
        <p>• Your data is stored on <strong style={{color:"#4ade80"}}>AWS cloud servers</strong> in Mumbai region</p>
      </div>
    </div>
  </div>;
}

function SalesCRMPage({activities,setActivities,jobs,clients,firms,team,user,show,sm}){

  const FEEDBACKS=['Yes','No','They will contact Us','Called Again Later','Followup Required','Referred to other team'];
  const RESPONSES=['Positive - Enquiry Started','Asked for Sample','Asked to Visit Again','Followup needed','Pricing too High','Have other vendor','Negative - Not using our products','Reference shared'];

  const salesReps=[...new Set(activities.map(a=>a.rep_name).filter(Boolean))];

  const [nf,setNf]=useState({date:td(),client_type:'New Client',firm_name:'',industry:INDUSTRIES[0],mobile:'',landline:'',email:'',address:'',contact_person:'',designation:'',feedback:FEEDBACKS[0],product_pitched:PRODUCTS[0],response:RESPONSES[0],action_taken:'',pipeline_project:'',pipeline_date:'',pipeline_product:'',pipeline_qty:'',ref_name1:'',ref_company1:'',ref_name2:'',ref_company2:'',remarks:'',revisit_date:'',rep_name:user?.name?.includes('BATUL')?'BATUL A':user?.name||''});

  const filtered=useMemo(()=>{

    if(repFilter!=='All')f=f.filter(a=>a.rep_name===repFilter);
    if(dateFrom)f=f.filter(a=>a.date>=dateFrom);
    if(dateTo)f=f.filter(a=>a.date<=dateTo);

  const visits=filtered.filter(a=>a.activity_type==='visit');

  // Stats

  // Product breakdown

    return Object.entries(p).sort((a,b)=>b[1]-a[1]);
  },[activities]);

    if(!error){setActivities(p=>[rec,...p]);setShowAdd(false);show('Visit logged!');
      setNf(p=>({...p,firm_name:'',mobile:'',landline:'',email:'',address:'',contact_person:'',designation:'',feedback:FEEDBACKS[0],product_pitched:PRODUCTS[0],response:RESPONSES[0],action_taken:'',pipeline_project:'',pipeline_date:'',pipeline_product:'',pipeline_qty:'',ref_name1:'',ref_company1:'',ref_name2:'',ref_company2:'',remarks:'',revisit_date:''}));

  const deleteAct=async(id)=>{

  const updateAct=async(id,field,value)=>{
    await sb.from('sales_activities').update({[field]:value}).eq('id',id);

        <div className="c a" style={{padding:10}}><p style={{fontSize:8,color:"#64748b"}}>THIS MONTH</p><p style={{fontSize:22,fontWeight:800,color:"#8b5cf6"}}>{stats.monthVisits}</p></div>
        <div className="c a" style={{padding:10}}><p style={{fontSize:8,color:"#64748b"}}>TODAY</p><p style={{fontSize:22,fontWeight:800,color:"#e3a008"}}>{stats.todayVisits}</p></div>

        {pipeline.map(a=><tr key={a.id}>

          <td style={{fontSize:8,color:"#64748b"}}>{a.location?.slice(0,15)}</td>

          <td style={{fontSize:8,color:"#64748b"}}>{a.outcome?.slice(0,20)}</td>

          <td><button style={{background:"none",border:"none",color:"#f47067",cursor:"pointer",fontSize:9}} onClick={()=>deleteAct(a.id)}>✕</button></td>
        </tr>)}
        {pipeline.length===0&&<tr><td colSpan={11} style={{textAlign:"center",color:"#64748b",padding:20}}>No pipeline projects</td></tr>}
      </tbody></table></div>
    </div>}

    {/* REPORTS TAB */}
    {tab==='reports'&&<div style={{display:"grid",gap:8}}>
      <div className="c" style={{padding:10}}>
        <p style={{fontSize:12,fontWeight:700,color:"#e3a008",marginBottom:8}}>📊 Visit Frequency by Month</p>
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{(()=>{
          const months={};activities.filter(a=>a.activity_type==='visit').forEach(a=>{const m=a.date?.slice(0,7);if(m)months[m]=(months[m]||0)+1;});
          return Object.entries(months).sort((a,b)=>a[0].localeCompare(b[0])).map(([m,c])=><div key={m} className="c a" style={{padding:"6px 10px",minWidth:80,textAlign:"center"}}><p style={{fontSize:8,color:"#64748b"}}>{m}</p><p style={{fontSize:16,fontWeight:800,color:"#3b82f6"}}>{c}</p></div>);

      </div>
      <div className="c" style={{padding:10}}>
        <p style={{fontSize:12,fontWeight:700,color:"#e3a008",marginBottom:8}}>🏢 New vs Repeat Clients</p>

        <p style={{fontSize:12,fontWeight:700,color:"#e3a008",marginBottom:8}}>🏷️ Top Products Pitched</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:4}}>{productStats.slice(0,12).map(([p,c])=><div key={p} className="c a" style={{padding:"6px 8px",display:"flex",justifyContent:"space-between"}}><span style={{fontSize:10}}>{p}</span><span style={{fontWeight:800,color:"#8b5cf6",fontSize:12}}>{c}</span></div>)}</div>

// JOB NOTES PAGE — For Batul/Sales to add notes without seeing job details
// ═══════════════════════════════════════════════════════════
function JobNotesPage({jobs,user,show}){
  const [sq,setSq]=useState('');
  const [selJob,setSelJob]=useState(null);
  const [notes,setNotes]=useState([]);
  const [newNote,setNewNote]=useState('');
  const [loading,setLoading]=useState(false);

  const results=useMemo(()=>{
    if(sq.length<2)return [];
    const q=sq.toLowerCase();
    return jobs.filter(j=>j.id?.toLowerCase().includes(q)||j.client_name?.toLowerCase().includes(q)||j.project?.toLowerCase().includes(q)).slice(0,15);
  },[sq,jobs]);

  const openJob=async(j)=>{
    setSelJob(j);setLoading(true);
    const {data}=await sb.from('client_notes').select('*').eq('job_id',j.id).order('created_at',{ascending:false});
    setNotes(data||[]);setLoading(false);
  };

  const addNote=async()=>{
    if(!newNote.trim()||!selJob)return;
    const rec={id:'N'+Date.now(),job_id:selJob.id,dept:user?.name||'Unknown',text:newNote.trim(),created_at:new Date().toISOString()};
    const {error}=await sb.from('client_notes').insert(rec);
    if(error){show("⚠️ Failed to save note",false);return;}
    setNotes(p=>[rec,...p]);setNewNote('');show("✅ Note added!");
  };

  const fmtDate=(d)=>{if(!d)return '';const dt=new Date(d);return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' '+dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});};

  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    <div className="c" style={{padding:12}}>
      <input className="in" value={sq} onChange={e=>{setSq(e.target.value);setSelJob(null);}} placeholder="🔍 Search by Job#, Client, or Project..." style={{fontSize:12,padding:"8px 12px",width:"100%",boxSizing:"border-box"}}/>
      {sq.length>=2&&!selJob&&<div style={{marginTop:6}}>
        {results.length===0&&<p style={{fontSize:10,color:"#64748b",padding:8}}>No jobs found</p>}
        {results.map(j=><div key={j.id} style={{padding:"6px 10px",borderBottom:"1px solid #1a2030",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}} onClick={()=>openJob(j)}>
          <div><span className="mn" style={{color:"#e3a008",fontWeight:700,fontSize:11}}>{j.id}</span><span style={{fontSize:10,color:"#c9d1d9",marginLeft:8}}>{j.client_name?.slice(0,25)}</span></div>
          <div><span style={{fontSize:9,color:"#64748b"}}>{j.project?.slice(0,20)}</span><span className="bd" style={{marginLeft:6,fontSize:8,background:j.status==='Printing'?'#ef444420':j.status==='Fabrication'?'#dc262620':'#64748b20',color:j.status==='Printing'?'#ef4444':j.status==='Fabrication'?'#dc2626':'#64748b'}}>{j.status}</span></div>
        </div>)}
      </div>}
    </div>

    {selJob&&<div className="c" style={{padding:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,paddingBottom:8,borderBottom:"1px solid #1a2030"}}>
        <div>
          <span className="mn" style={{color:"#e3a008",fontWeight:700,fontSize:14}}>{selJob.id}</span>
          <span style={{fontSize:11,color:"#c9d1d9",marginLeft:8}}>{selJob.client_name}</span>
          <span style={{fontSize:10,color:"#64748b",marginLeft:8}}>{selJob.project}</span>
        </div>
        <span className="bd" style={{fontSize:9}}>{selJob.status}</span>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:12}}>
        <input className="in" value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Type your note here..." style={{flex:1,fontSize:11,padding:"8px 10px"}} onKeyDown={e=>{if(e.key==='Enter')addNote();}}/>
        <button className="b bp" onClick={addNote} style={{padding:"8px 16px",fontSize:11}}>📝 Add Note</button>
      </div>

      {loading?<p style={{textAlign:"center",color:"#64748b",padding:16}}>Loading notes...</p>
      :notes.length===0?<p style={{textAlign:"center",color:"#64748b",padding:16,fontSize:11}}>No notes yet for this job. Add the first one!</p>
      :<div style={{display:"flex",flexDirection:"column",gap:4}}>
        {notes.map(n=><div key={n.id} style={{padding:"8px 10px",background:n.dept==='SYSTEM'?"#060810":"#0a1520",borderRadius:8,border:n.dept==='SYSTEM'?"1px solid #1a2030":"1px solid #3b82f633"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
            <span style={{fontSize:9,fontWeight:700,color:n.dept==='SYSTEM'?"#64748b":"#3b82f6"}}>{n.dept==='SYSTEM'?'🤖 System':('👤 '+n.dept)}</span>
            <span style={{fontSize:8,color:"#64748b"}}>{fmtDate(n.created_at)}</span>
          </div>
          <p style={{fontSize:10.5,color:"#c9d1d9",margin:0,lineHeight:1.4,whiteSpace:"pre-wrap"}}>{n.text}</p>
        </div>)}
      </div>}
    </div>}
  </div>;
}

// CLIENT PORTAL — Dept login + status view + notes
// ═══════════════════════════════════════════════════════════
function ClientPortal({code}){
  const [jobs,setJobs]=useState([]);const [batches,setBatches]=useState([]);const [items,setItems]=useState([]);
  const [firm,setFirm]=useState(null);const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('all');const [selJob,setSelJob]=useState(null);
  const [dept,setDept]=useState(null);
  const [noteText,setNoteText]=useState({});const [notes,setNotes]=useState({});
  const [showNewJob,setShowNewJob]=useState(false);
  const [submittingJob,setSubmittingJob]=useState(false);
  const [poEdits,setPoEdits]=useState({});
  const [portalSearch,setPortalSearch]=useState('');
  const [showBOQ,setShowBOQ]=useState(false);
  const [boqStep,setBoqStep]=useState(1);
  const [boqItems,setBoqItems]=useState([]);
  const [boqFile,setBoqFile]=useState(null);
  const [boqPO,setBoqPO]=useState(null);
  const [boqForm,setBoqForm]=useState({project:'',po_number:'',contact_person:'',contact_no:'',delivery_address:'',remark:''});
  const [boqSubmitting,setBoqSubmitting]=useState(false);
  const [boqMsg,setBoqMsg]=useState('');
  const [cjf,setCjf]=useState({project:'',contact_person:'',contact_no:'',delivery_address:'',po_number:'',email:'',remark:'',wetransfer_links:'',site_contact_person:'',site_contact_no:'',design_coord_person:'',design_coord_no:''});
  const [cjItems,setCjItems]=useState([{id:Date.now()+'',type:'',desc:'',qty:1,width:'',height:'',size_unit:'MM',material:'',notes:''}]);
  const [cjFiles,setCjFiles]=useState([]);
  const [cjMsg,setCjMsg]=useState('');

  const portalConfigs={
    'ANA':{name:'ANA Designs',match:['ANA DESIGNS'],
      logo:'https://idjeniwznjiaanaxcjvg.supabase.co/storage/v1/object/public/Uploads/logos/ana-logo.jpg',
      depts:[
      {id:'design',name:'Design Team',icon:'🎨',st:['Designing','Recce Pending','Active','Quotation Sent','PO Pending'],seeAll:false},
      {id:'projects',name:'Projects & Installation',icon:'🏗️',st:['Printing','Fabrication','Installation','Delivered'],seeAll:false},
      {id:'purchase',name:'Purchase Team',icon:'📦',st:null,seeAll:true,canEditPO:true},
      {id:'accounts',name:'Accounts & Billing',icon:'🧾',st:['Billing Pending','Given for Billing','Billing Done','Cash Received','Cash Pending','Proforma Invoice'],seeAll:false},
    ]},
  };
  const config=portalConfigs[code.toUpperCase()];

  useEffect(()=>{
    if(!config||!dept)return;
    async function load(){
      setLoading(true);
      let allJobs=[];
      for(const pattern of config.match){
        const {data:j}=await sb.from('jobs').select('*').ilike('client_name','%'+pattern+'%').order('id',{ascending:false});
        if(j)allJobs=[...allJobs,...j];
      }
      const seen=new Set();allJobs=allJobs.filter(j=>{if(seen.has(j.id))return false;seen.add(j.id);return true;});
      setJobs(allJobs);
      const jids=allJobs.map(x=>x.id);
      if(jids.length>0){
        const {data:b}=await sb.from('batches').select('*').in('job_id',jids);
        if(b){setBatches(b);const bids=b.map(x=>x.id);
          if(bids.length){const {data:li}=await sb.from('line_items').select('id,batch_id,job_id,internal_name,client_name,media,width,height,size_unit,qty,rate_mode,sqft,img_url,dept_estimate,dept_design,dept_production,dept_printing,dept_fabrication,dept_dispatch,dept_installation,dept_accounts').in('batch_id',bids);if(li)setItems(li);}}
        if(allJobs[0]?.firm){const {data:f}=await sb.from('firms').select('*').eq('code',allJobs[0].firm).single();if(f)setFirm(f);}
      }
      try{const {data:n}=await sb.from('client_notes').select('*').in('job_id',jids).order('created_at',{ascending:false});
        if(n){const g={};n.forEach(x=>{if(!g[x.job_id])g[x.job_id]=[];g[x.job_id].push(x);});setNotes(g);}
      }catch(e){}
      setLoading(false);
    }
    load();
  },[code,dept]);

  const full=jobs.map(j=>({...j,batches:batches.filter(b=>b.job_id===j.id).map(b=>({...b,items:items.filter(i=>i.batch_id===b.id).sort((a,b)=>(a.id||'').localeCompare(b.id||''))}))}));
  const sc={'Draft':'#64748b','Active':'#64748b','Quotation Sent':'#3b82f6','Designing':'#8b5cf6','Printing':'#ef4444','Fabrication':'#dc2626','Installation':'#059669','Delivered':'#10b981','Billing Pending':'#06b6d4','Given for Billing':'#06b6d4','Billing Done':'#4ade80','Cash Received':'#4ade80','Cancelled':'#64748b','PO Pending':'#f47067','Recce Pending':'#f59e0b'};
  const pipeline=[{k:'quotation_sent',l:'Quote',e:'📝'},{k:'designing',l:'Design',e:'🎨'},{k:'printing',l:'Print',e:'🖨️'},{k:'fabrication',l:'Fab',e:'🔧'},{k:'installation',l:'Install',e:'🔩'},{k:'delivered',l:'Done',e:'🚚'},{k:'billing_done',l:'Billed',e:'✅'}];
  const pipeIdx=(st)=>({'Quotation Sent':0,'PO Pending':0,'Active':0,'Recce Pending':0,'Designing':1,'Printing':2,'Fabrication':3,'Installation':4,'Delivered':5,'Billing Pending':5,'Given for Billing':5,'Billing Done':6,'Cash Received':6}[st]??-1);
  const deptTabs=dept?.seeAll?[{id:'all',l:'All Jobs',icon:'📋',st:null},...(config?.depts||[]).map(d=>({id:d.id,l:d.name,icon:d.icon,st:d.st}))]:[{id:dept?.id||'all',l:dept?.name||'Jobs',icon:dept?.icon||'📋',st:dept?.st||null}];
  const curTab=deptTabs.find(t=>t.id===tab)||deptTabs[0];
  const filtered=(()=>{let f=curTab?.st?full.filter(j=>curTab.st.includes(j.status)):full;if(portalSearch){const q=portalSearch.toLowerCase();f=f.filter(j=>j.id?.toLowerCase().includes(q)||j.project?.toLowerCase().includes(q)||j.client_name?.toLowerCase().includes(q)||j.delivery_address?.toLowerCase().includes(q)||j.po_number?.toLowerCase().includes(q));}return f;})();

  const addNote=async(jobId)=>{
    const text=noteText[jobId];if(!text?.trim())return;
    const note={id:'N'+Date.now(),job_id:jobId,dept:dept.name,text:text.trim(),created_at:new Date().toISOString()};
    try{await sb.from('client_notes').insert(note);}catch(e){}
    setNotes(p=>({...p,[jobId]:[note,...(p[jobId]||[])]}));
    setNoteText(p=>({...p,[jobId]:''}));
  };

  const savePO=async(jobId,poNum)=>{
    const {error}=await sb.from('jobs').update({po_number:poNum}).eq('id',jobId);
    if(!error){setJobs(p=>p.map(j=>j.id===jobId?{...j,po_number:poNum}:j));setPoEdits(p=>({...p,[jobId]:undefined}));}
  };

  // ── Client Job Submission ──
  const ITEM_TYPES=['Graphics (Vinyl)','Graphics (Canvas)','Glass Film (Clear)','Glass Film (Frosted)','Glass Film (UV)','Glass Film (PrePrinted)','Canvas Frames','Reception Logo','Signages','Other'];
  const addCjItem=()=>setCjItems(p=>[...p,{id:Date.now()+'',type:'',desc:'',qty:1,width:'',height:'',size_unit:'MM',material:'',notes:''}]);
  const removeCjItem=(i)=>setCjItems(p=>p.filter((_,x)=>x!==i));
  const updateCjItem=(i,k,v)=>setCjItems(p=>{const n=[...p];n[i]={...n[i],[k]:v};return n;});

  const submitClientJob=async()=>{
    const missing=[];
    if(!cjf.project.trim())missing.push('Project / Site Name');
    if(!cjf.contact_person.trim())missing.push('Contact Person');
    if(!cjf.contact_no.trim())missing.push('Contact Number');
    if(!cjf.delivery_address.trim())missing.push('Delivery Address');
    if(cjItems.every(it=>!it.desc.trim()&&!it.type))missing.push('At least one item (select type or enter description)');
    if(missing.length>0){alert('⚠️ Please fill:\n\n• '+missing.join('\n• '));return;}

    setSubmittingJob(true);
    try{
      // Generate job ID with CR- prefix (Client Request)
      const now=new Date();const m=now.getMonth(),y=now.getFullYear();
      const fy=m>=3?`${String(y).slice(2)}${String(y+1).slice(2)}`:`${String(y-1).slice(2)}${String(y).slice(2)}`;
      const {data:existing}=await sb.from('jobs').select('id').like('id','%-'+fy);
      const nums=(existing||[]).map(j=>{const p=j.id?.split('-')[0];return parseInt(p)||0;});
      const nextNum=String(Math.max(0,...nums)+1).padStart(4,'0');
      const jid=nextNum+'-'+fy;

      // Upload artwork files
      const artworkUrls=[];
      for(const file of cjFiles){
        const url=await uploadFile(file,'client-artworks');
        if(url)artworkUrls.push(url);
      }

      // Build remark with WeTransfer links
      let fullRemark='[CLIENT SUBMITTED via Portal — '+config.name+']';
      if(cjf.site_contact_person.trim()||cjf.site_contact_no.trim())fullRemark+='\n📍 Site Contact: '+cjf.site_contact_person+' ('+cjf.site_contact_no+')';
      if(cjf.design_coord_person.trim()||cjf.design_coord_no.trim())fullRemark+='\n🎨 Design Coordination: '+cjf.design_coord_person+' ('+cjf.design_coord_no+')';
      if(cjf.remark.trim())fullRemark+='\nClient Note: '+cjf.remark.trim();
      if(cjf.wetransfer_links.trim())fullRemark+='\n\n📎 ARTWORK LINKS:\n'+cjf.wetransfer_links.trim();
      if(artworkUrls.length)fullRemark+='\n\n📎 UPLOADED FILES ('+artworkUrls.length+'):\n'+artworkUrls.join('\n');

      // Find client matching portal config
      const clientMatch=config.match[0]||config.name;

      // Create job
      const jobData={id:jid,firm:'JXT',client_name:clientMatch,project:cjf.project,delivery_address:cjf.delivery_address,
        contact_person:cjf.contact_person,contact_no:cjf.contact_no,client_email:cjf.email,

  const parseBOQFile=(e)=>{
    const file=e.target.files[0];if(!file)return;
    setBoqFile(file);
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=new Uint8Array(ev.target.result);
        const wb=XLSX.read(data,{type:'array'});
        const allItems=[];
        wb.SheetNames.forEach(sn=>{
          const ws=wb.Sheets[sn];
          const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
          if(rows.length<2)return;
          // Find header row
          let hRow=0;
          for(let i=0;i<Math.min(15,rows.length);i++){
            const txt=rows[i].map(c=>String(c||'').toLowerCase()).join(' ');
            if(/(description|particular)/.test(txt)&&/(qty|quantity|uom|unit)/.test(txt)){hRow=i;break;}
          }
          const headers=rows[hRow].map(x=>String(x||'').toLowerCase().replace(/[\s\n]/g,' ').trim());
          const find=(pats)=>{for(const p of pats){const idx=headers.findIndex(c=>p.test(c));if(idx>=0)return idx;}return -1;};
          const ci={desc:find([/description|particular/]),qty:find([/^qty|quantit/]),size:find([/size/]),width:find([/width/]),height:find([/height/]),uom:find([/uom|^unit$/]),spec:find([/specification|material/]),remarks:find([/remark/])};
          for(let r=hRow+1;r<rows.length;r++){
            const row=rows[r];if(!row||row.every(c=>!c&&c!==0))continue;
            const desc=ci.desc>-1?String(row[ci.desc]||'').replace(/\n/g,' ').trim():'';
            if(!desc||/^(sub\s*total|total|gst|note)/i.test(desc))continue;
            const qty=ci.qty>-1?(+row[ci.qty]||0):0;
            if(qty<=0)continue;
            let w='',h='';
            if(ci.width>-1&&ci.height>-1){w=String(row[ci.width]||'');h=String(row[ci.height]||'');}
            else if(ci.size>-1){const s=String(row[ci.size]||'');const m=s.match(/(\d+\.?\d*)\s*[x×]\s*(\d+\.?\d*)/i);if(m){w=m[1];h=m[2];}}
            const spec=ci.spec>-1?String(row[ci.spec]||'').replace(/\n/g,' ').slice(0,80):'';
            const rem=ci.remarks>-1?String(row[ci.remarks]||'').replace(/\n/g,' ').slice(0,60):'';
            allItems.push({id:'BI'+Date.now()+r,desc:desc.slice(0,100),qty,w,h,spec,remarks:rem,sheet:sn,include:true});
          }
        });
        setBoqItems(allItems);
        if(allItems.length>0)setBoqStep(2);
        else alert('No valid items found in the file. Check that it has Description and Qty columns.');
      }catch(ex){alert('Error reading file: '+ex.message);}
    };
    reader.readAsArrayBuffer(file);
  };

  const submitBOQ=async()=>{
    const incl=boqItems.filter(it=>it.include);
    if(incl.length===0){alert('Select at least one item');return;}
    if(!boqForm.project.trim()){alert('Enter project name');return;}
    setBoqSubmitting(true);
    try{
      const now=new Date();const m=now.getMonth(),y=now.getFullYear();
      const fy=m>=3?`${String(y).slice(2)}${String(y+1).slice(2)}`:`${String(y-1).slice(2)}${String(y).slice(2)}`;
      const {data:existing}=await sb.from('jobs').select('id').like('id','%-'+fy);
      const nums=(existing||[]).map(j=>{const p=j.id?.split('-')[0];return parseInt(p)||0;});
      const nextNum=String(Math.max(0,...nums)+1).padStart(4,'0');
      const jid=nextNum+'-'+fy;

      // Upload PO file
      let poUrl='';
      if(boqPO){poUrl=await uploadFile(boqPO,'po-uploads')||'';}

      const remark='[BOQ IMPORT via Client Portal — '+config.name+' Purchase]\nFile: '+(boqFile?.name||'—')+'\nItems: '+incl.length+(boqForm.remark?'\nNote: '+boqForm.remark:'');
      const clientMatch=config.match[0]||config.name;
      const jobData={id:jid,firm:'JXT',client_name:clientMatch,project:boqForm.project,delivery_address:boqForm.delivery_address,
        contact_person:boqForm.contact_person,contact_no:boqForm.contact_no,
        made_by:'CLIENT PORTAL (Purchase)',po_number:boqForm.po_number,billing_name:clientMatch,client_gst:'',
        payment_terms:'',status:'Active',remark,po_file_url:poUrl?[poUrl]:[],design_ref_urls:[]};
      await sb.from('jobs').insert(jobData);

      const batchId='B'+Date.now()+Math.random().toString(36).slice(2,5);
      await sb.from('batches').insert({id:batchId,job_id:jid,date:td(),note:'BOQ Import — '+boqForm.project,bill_no:'',status:'New'});

      const lineItems=incl.map((it,i)=>({
        id:'LI'+Date.now()+i+Math.random().toString(36).slice(2,5),
        batch_id:batchId,job_id:jid,sr:i+1,product_id:'',
        internal_name:it.desc,client_name:it.desc,media:it.spec||'',
        width:it.w,height:it.h,size_unit:'MM',qty:+it.qty||1,rate_mode:'UNIT',rate:0,sqft:0,total:0,gst:0,gstPct:18,amount:0,
        area:'In-house',dept_estimate:false,dept_design:false,dept_production:false,dept_printing:false,
        dept_fabrication:false,dept_dispatch:false,dept_installation:false,dept_accounts:false,img_url:''}));
      if(lineItems.length)await sb.from('line_items').insert(lineItems);

      await sb.from('client_notes').insert({id:'N'+Date.now(),job_id:jid,dept:'PURCHASE — '+config.name,
        text:'📦 BOQ imported by Purchase Team.\nJob: '+jid+'\nProject: '+boqForm.project+'\nPO#: '+(boqForm.po_number||'—')+'\nItems: '+incl.length+(poUrl?'\n📎 PO Copy attached':''),
        created_at:new Date().toISOString()});

      setBoqMsg('✅ Job '+jid+' created with '+incl.length+' items!'+(poUrl?' PO copy uploaded.':''));
      setBoqStep(3);
      // Refresh after delay

                  <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:9,fontWeight:700,color:"#e3a008"}}>{n.dept}</span><span style={{fontSize:7,color:"#64748b"}}>{new Date(n.created_at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>
                  <p style={{fontSize:10,marginTop:2,color:"#c9d1d9"}}>{n.text}</p>
                </div>)}
                {jN.length===0&&<p style={{fontSize:9,color:"#475569",marginBottom:4}}>No notes yet. Add the first one below.</p>}
                <div style={{display:"flex",gap:4,marginTop:4}}>
                  <input style={{flex:1,padding:"7px 10px",borderRadius:6,border:"1px solid #1a2030",background:"#060810",color:"#c9d1d9",fontSize:11,outline:"none"}} placeholder={"Add note as "+dept.name+"..."} value={noteText[j.id]||''} onChange={e=>setNoteText(p=>({...p,[j.id]:e.target.value}))} onKeyDown={e=>{if(e.key==='Enter')addNote(j.id);}}/>
                  <button onClick={()=>addNote(j.id)} style={{padding:"6px 14px",borderRadius:6,border:"none",background:"#8b5cf6",color:"#fff",fontSize:10,fontWeight:700,cursor:"pointer"}}>Send</button>
                </div>
              </div>
            </div>}
          </div>;})}
        {filtered.length===0&&<div style={{textAlign:"center",padding:40,color:"#64748b"}}><p style={{fontSize:32}}>✨</p><p>No projects in this category</p></div>}
      </div>
    </div>
    {showNewJob&&<NewJobForm/>}
    {showBOQ&&<BOQModal/>}
    <footer style={{textAlign:"center",padding:"16px",borderTop:"1px solid #1a2030",marginTop:20}}><p style={{fontSize:9,color:"#475569"}}>Powered by iPrint ERP · {firm?.name||''} · {new Date().getFullYear()}</p></footer>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<RootApp/>);
</script>
</body>
</html>
