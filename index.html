<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#060810;color:#e2e8f0;overflow:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#1e293b;border-radius:3px}
input,select,textarea{font-family:inherit}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes sr{from{transform:translateX(120%)}to{transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.a{animation:fi .3s ease both}
.c{background:#0c1017;border:1px solid #1a2030;border-radius:10px;transition:border-color .2s}
.c:hover{border-color:#2a3548}
.b{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:6px;border:1px solid #1a2030;background:#0c1017;color:#c9d1d9;cursor:pointer;font-size:11px;font-weight:500;transition:all .15s;font-family:inherit;white-space:nowrap}
.b:hover{background:#151c28}
.bp{background:#e3a008;border-color:#e3a008;color:#060810;font-weight:700}.bp:hover{background:#ca8a04}
.bg{background:#238636;border-color:#238636;color:#fff}.bg:hover{background:#1a7f37}
.br{background:#da3633;border-color:#da3633;color:#fff}
.bs{padding:3px 7px;font-size:10px}
.bd{display:inline-flex;padding:2px 6px;border-radius:8px;font-size:9px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:5px 7px;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;border-bottom:1px solid #1a2030;font-weight:600;position:sticky;top:0;background:#0c1017;z-index:1}
td{padding:5px 7px;font-size:11px;border-bottom:1px solid #0c1017}
tr:hover td{background:#0a0f1a}
.in{width:100%;padding:5px 8px;border-radius:5px;border:1px solid #1a2030;background:#060810;color:#e2e8f0;font-size:11px;outline:none}
.in:focus{border-color:#e3a008}
.mn{font-family:'JetBrains Mono',monospace}
.done{text-decoration:line-through;opacity:.4}
.ck{width:14px;height:14px;border-radius:3px;border:2px solid #1a2030;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0}
.ck.on{background:#238636;border-color:#238636;color:#fff}
.ni{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:500;color:#64748b;transition:all .12s;border:1px solid transparent;margin-bottom:1px}
.ni:hover{color:#e2e8f0;background:#111827}
.ni.on{color:#e3a008;background:#18150a;border-color:#e3a00833}
.fg{display:grid;gap:5px}
.f2{grid-template-columns:1fr 1fr}
.f3{grid-template-columns:1fr 1fr 1fr}
.f4{grid-template-columns:1fr 1fr 1fr 1fr}
.loader{width:24px;height:24px;border:3px solid #1a2030;border-top-color:#e3a008;border-radius:50%;animation:spin .6s linear infinite}
@media(max-width:600px){.portal-item-grid{grid-template-columns:2fr 2fr 1fr!important}}

<script type="text/babel">
const {useState,useCallback,useMemo,useEffect,useRef} = React;

const SUPABASE_URL = 'https://idjeniwznjiaanaxcjvg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkamVuaXd6bmppYWFuYXhjanZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NTEzMzIsImV4cCI6MjA5MDUyNzMzMn0.ocVwlguP-u5STy73eF-FwJjUWp29QINdLiYZY0L1z9E';

// ─── FILE UPLOAD HELPER ─────────────────────────────────
const uploadFile = async (file, folder='general') => {
  if(!file) return null;
  const ext = file.name.split('.').pop();
  const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,6)}.${ext}`;
  const {data,error} = await sb.storage.from('Uploads').upload(path, file);
  if(error){console.error('Upload error:',error);return null;}
  const {data:urlData} = sb.storage.from('Uploads').getPublicUrl(path);
  return urlData?.publicUrl || null;
};
const uploadMultiple = async (files, folder='general') => {
  const urls=[];
  for(const file of files){const url=await uploadFile(file,folder);if(url)urls.push(url);}
  return urls;
};

// ─── SMART FILE OPEN (ERF #13 fix — 25 Apr 26) ─────────────
// PowerPoint/Word/Excel don't render inline in browsers → blank screen.
// Wrap those URLs with Office Online Viewer; leave PDFs and images alone.
const isOfficeFile = (url) => /\.(pptx?|docx?|xlsx?)(\?|#|$)/i.test(url || '');
const smartOpenUrl = (url) => isOfficeFile(url) ? ('https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(url)) : url;

// ─── CONSTANTS ──────────────────────────────────────────────
const DEPTS=["Estimate","Design","Production","Printing","Fabrication","Dispatch","Installation","Accounts"];
const DC=["#3b82f6","#8b5cf6","#f59e0b","#ef4444","#dc2626","#10b981","#059669","#06b6d4"];

// ─── STATUS LIFECYCLE (17 Apr 26 rework) ─────────────────────
// ALL_ST_NEW is the unified status list. Replaces 4 per-component ALL_ST arrays.
// New granular values for production: Printing·In-House / Outsource, Fabrication·In-House / Outsource.
// "Installed" replaces "Installation" (naming consistency with Banking CRM "Installed" card).
// "Dispatch" replaces "Delivered" for the same reason.
// Legacy values (Active, Printing, Fabrication, Installation, Delivered) are still present for
// backwards-compat — existing jobs keep them until naturally updated. Dropdowns show all values.
const ALL_ST_NEW = [
  // Pre-production (ESTIMATE bucket)
  'Draft','Quotation Sent','PO Pending','Recee',
  // Production — granular
  'Designing - In House','Designing - Outsource',
  'Printing · In-House','Printing · Outsource',
  'Fabrication · In-House','Fabrication · Outsource',
  // Post-production
  'Delivered',
  'Installation WIP',
  // Accounts
  'Billing Pending','Given for Billing','Cash Pending','IC Pending','DC Pending',
  'Billing Done','Cash Received',
  // Terminal
  'No Bill','Cancelled'
];
// Status → leading-edge dept bucket (for Banking CRM fallback + Dept Tracker rollup).
// Returns one of: 'design','printIn','printOut','fabIn','fabOut','delivered','installation', or null.
// Post-22Apr26 overhaul: 'dispatch' bucket renamed to 'delivered', 'installed' renamed to 'installation'.
// Legacy statuses removed from DB 22 Apr 26 (migrated to new statuses, see jobs_backup_before_status_overhaul_20260422).
const STATUS_TO_LEADING = (status) => {
  if (!status) return null;
  const s = String(status).trim();
  if (['Draft','Quotation Sent','PO Pending','Recee','Cancelled','No Bill'].includes(s)) return null;
  if (s === 'Designing - In House' || s === 'Designing - Outsource') return 'design';
  if (s === 'Printing · In-House') return 'printIn';
  if (s === 'Printing · Outsource') return 'printOut';
  if (s === 'Fabrication · In-House') return 'fabIn';
  if (s === 'Fabrication · Outsource') return 'fabOut';
  if (s === 'Delivered') return 'delivered';
  if (s === 'Installation WIP') return 'installation';
  // Accounts-stage statuses return null so they fall through to the non-leading
  // ACCOUNTS card in deptCounts (via card.statuses.includes(st.status)).
  // Previously these were mapped to 'installation', which caused all accounts jobs
  // to be misclassified as Installation in every site-level rollup.
  if (['Billing Pending','Given for Billing','Cash Pending','IC Pending','DC Pending','Billing Done','Cash Received'].includes(s)) return null;
  // Fallback for any legacy status that might resurface (defensive)
  if (s === 'Designing' || s === 'Active') return 'design';
  if (s === 'Printing') return 'printIn';
  if (s === 'Fabrication') return 'fabIn';
  if (s === 'Dispatch' || s === 'Installation') return 'delivered';
  if (s === 'Installed' || s === 'PO Received' || s === 'Recce Pending' || s === 'Proforma Invoice') return null;
  return null;
};

// ─── STATUS_CARDS: single source of truth for status cards across ERP ────────
// Updated 22 Apr 26 for non-banking job status overhaul per team sheet.
// 12 cards in lifecycle order. Same labels, same colors, same order everywhere.
// Each entry:
//   key       — internal id (also used as Dept Tracker tab id and leading-edge bucket)
//   label     — display label (UPPERCASE for cards; tabs may title-case if needed)
//   statuses  — array of jobs.status values that fall into this bucket
//   color     — hex color
//   isLeading — true if this card maps to a STATUS_TO_LEADING bucket (used by site-level rollup)
const STATUS_CARDS = [
  { key:'estimate',     label:'ESTIMATE',       statuses:['Quotation Sent','PO Pending','Recee'],                                                                              color:'#3b82f6', isLeading:false },
  { key:'draft',        label:'DRAFT',          statuses:['Draft'],                                                                                                            color:'#64748b', isLeading:false },
  { key:'design',       label:'DESIGN',         statuses:['Designing - In House','Designing - Outsource'],                                                                     color:'#8b5cf6', isLeading:true  },
  { key:'printIn',      label:'PRINT-IN-HOUSE', statuses:['Printing · In-House'],                                                                                              color:'#06b6d4', isLeading:true  },
  { key:'printOut',     label:'PRINT-OUT',      statuses:['Printing · Outsource'],                                                                                             color:'#f97316', isLeading:true  },
  { key:'fabIn',        label:'FAB-IN-HOUSE',   statuses:['Fabrication · In-House'],                                                                                           color:'#dc2626', isLeading:true  },
  { key:'fabOut',       label:'FAB-OUT',        statuses:['Fabrication · Outsource'],                                                                                          color:'#ea580c', isLeading:true  },
  { key:'delivered',    label:'DELIVERED',      statuses:['Delivered'],                                                                                                        color:'#3b82f6', isLeading:true  },
  { key:'installation', label:'INSTALLATION',   statuses:['Installation WIP'],                                                                                                 color:'#059669', isLeading:true  },
  { key:'accounts',     label:'ACCOUNTS',       statuses:['Billing Pending','Given for Billing','Cash Pending','IC Pending','DC Pending','Billing Done','Cash Received'],      color:'#06b6d4', isLeading:false },
  { key:'nobill',       label:'NO BILL',        statuses:['No Bill'],                                                                                                          color:'#64748b', isLeading:false },
  { key:'cancelled',    label:'CANCELLED',      statuses:['Cancelled'],                                                                                                        color:'#475569', isLeading:false },
];
// Quick lookup helpers
const STATUS_CARD_BY_KEY = Object.fromEntries(STATUS_CARDS.map(c => [c.key, c]));
// Count jobs in a card bucket. Semantics mirror Dept Tracker's tabs[].match (line ~2705):
// - isLeading cards: use STATUS_TO_LEADING rollup so all statuses land in the right bucket.
// - 'installation' card: additionally excludes any job whose status has moved on to
//   accounts/nobill/cancelled, so lifecycle buckets stay mutually exclusive.
// - Non-leading cards: strict status match.
const countJobsByCard = (jobs, cardKey) => {
  const card = STATUS_CARD_BY_KEY[cardKey];
  if (!card) return 0;
  if (card.isLeading) {
    if (cardKey === 'installation') {
      const accountsSt = STATUS_CARD_BY_KEY.accounts.statuses;
      return (jobs||[]).filter(j => STATUS_TO_LEADING(j.status) === 'installation'
        && !accountsSt.includes(j.status)
        && !['No Bill','Cancelled'].includes(j.status)).length;
    }
    return (jobs||[]).filter(j => STATUS_TO_LEADING(j.status) === cardKey).length;
  }
  return (jobs||[]).filter(j => card.statuses.includes(j.status)).length;
};

// renderStatusOptions: returns grouped <optgroup> options for any status dropdown.
// Statuses are organized under their STATUS_CARDS bucket label so users always see
// the bridge between cards and status names. The current status is shown but
// disabled (greyed out) so users can see it in context and understand which
// bucket their job is currently in — without being able to re-select it as a no-op.
// Added 22 Apr 26 as part of non-banking job status overhaul.
// Updated 23 Apr 26: show current status as disabled rather than hiding it.
const renderStatusOptions = (currentStatus) => {
  return STATUS_CARDS.map(card => {
    if (card.statuses.length === 0) return null;
    return React.createElement('optgroup', { key: card.key, label: card.label },
      card.statuses.map(st => {
        const isCurrent = st === currentStatus;
        return React.createElement('option', {
          key: st,
          value: st,
          disabled: isCurrent,
          style: isCurrent ? { color: '#64748b', fontStyle: 'italic' } : undefined
        }, isCurrent ? (st + ' (current)') : st);
      })
    );
  });
};

// UNIT_MODES: single source of truth for billing unit
// Each mode: {label, needsWH, dimUnit, areaFn, totalFn, displayFn}
// needsWH = true → show W & H inputs; false → hide them (just use qty)
// dimUnit = hint shown in W/H header
// areaFn(w,h,qty) → computed area/measure
// totalFn(area, qty, rate) → line total
// displayFn(area) → what to show in the Area column
const UNIT_MODES = [
  { value:'SqFt (INCH)',  label:'Inches → sqft',    needsWH:true,  dimUnit:'inch',
    areaFn:(w,h,q)=>{const W=+w||0,H=+h||0;if(W===0||H===0)return Math.round((+q||0)*100)/100;return Math.round(W*H*(+q||1)/144*100)/100;},
    totalFn:(a,q,r)=>Math.round(a*(+r||0)*100)/100,
    displayFn:(a)=>a>0?a+' ft²':'—' },
  { value:'SqFt (FOOT)',  label:'Feet → sqft',      needsWH:true,  dimUnit:'ft',
    areaFn:(w,h,q)=>{const W=+w||0,H=+h||0;if(W===0||H===0)return Math.round((+q||0)*100)/100;return Math.round(W*H*(+q||1)*100)/100;},
    totalFn:(a,q,r)=>Math.round(a*(+r||0)*100)/100,
    displayFn:(a)=>a>0?a+' ft²':'—' },
  { value:'SqFt (MM)',    label:'MM → sqft',        needsWH:true,  dimUnit:'mm',
    areaFn:(w,h,q)=>{const W=+w||0,H=+h||0;if(W===0||H===0)return Math.round((+q||0)*100)/100;return Math.round(W*H*(+q||1)/92903.04*100)/100;},
    totalFn:(a,q,r)=>Math.round(a*(+r||0)*100)/100,
    displayFn:(a)=>a>0?a+' ft²':'—' },
  { value:'SqMtr (INCH)', label:'Inches → sqmtr',   needsWH:true,  dimUnit:'inch',
    areaFn:(w,h,q)=>{const W=+w||0,H=+h||0;if(W===0||H===0)return Math.round((+q||0)*100)/100;return Math.round(W*H*(+q||1)/1550.0031*100)/100;},
    totalFn:(a,q,r)=>Math.round(a*(+r||0)*100)/100,
    displayFn:(a)=>a>0?a+' m²':'—' },
  { value:'SqMtr (FOOT)', label:'Feet → sqmtr',     needsWH:true,  dimUnit:'ft',
    areaFn:(w,h,q)=>{const W=+w||0,H=+h||0;if(W===0||H===0)return Math.round((+q||0)*100)/100;return Math.round(W*H*(+q||1)/10.7639*100)/100;},
    totalFn:(a,q,r)=>Math.round(a*(+r||0)*100)/100,
    displayFn:(a)=>a>0?a+' m²':'—' },
  { value:'SqMtr (MM)',   label:'MM → sqmtr',       needsWH:true,  dimUnit:'mm',
    areaFn:(w,h,q)=>{const W=+w||0,H=+h||0;if(W===0||H===0)return Math.round((+q||0)*100)/100;return Math.round(W*H*(+q||1)/1000000*100)/100;},
    totalFn:(a,q,r)=>Math.round(a*(+r||0)*100)/100,
    displayFn:(a)=>a>0?a+' m²':'—' },
  { value:'SqMtr (MTR)',  label:'Meters → sqmtr',   needsWH:true,  dimUnit:'m',
    areaFn:(w,h,q)=>{const W=+w||0,H=+h||0;if(W===0||H===0)return Math.round((+q||0)*100)/100;return Math.round(W*H*(+q||1)*100)/100;},
    totalFn:(a,q,r)=>Math.round(a*(+r||0)*100)/100,
    displayFn:(a)=>a>0?a+' m²':'—' },
  { value:'RFT (INCH)',   label:'Inches → rft',     needsWH:true,  dimUnit:'inch',
    areaFn:(w,h,q)=>{const W=+w||0;if(W===0)return Math.round((+q||0)*100)/100;return Math.round(W*(+q||1)*100)/100;},
    totalFn:(a,q,r)=>Math.round(a*(+r||0)*100)/100,
    displayFn:(a)=>a>0?a+' rft':'—' },
  { value:'RFT (FOOT)',   label:'Feet → rft',       needsWH:true,  dimUnit:'ft',
    areaFn:(w,h,q)=>{const W=+w||0;if(W===0)return Math.round((+q||0)*100)/100;return Math.round(W*(+q||1)*100)/100;},
    totalFn:(a,q,r)=>Math.round(a*(+r||0)*100)/100,
    displayFn:(a)=>a>0?a+' rft':'—' },
  { value:'NOS',   label:'NOS',   needsWH:false, dimUnit:'',
    areaFn:(w,h,q)=>0,
    totalFn:(a,q,r)=>Math.round((+q||1)*(+r||0)*100)/100,
    displayFn:(a)=>'—' },
  { value:'SET',   label:'Set',   needsWH:false, dimUnit:'',
    areaFn:(w,h,q)=>0,
    totalFn:(a,q,r)=>Math.round((+q||1)*(+r||0)*100)/100,
    displayFn:(a)=>'—' },
  { value:'LOT',   label:'Lot',   needsWH:false, dimUnit:'',
    areaFn:(w,h,q)=>0,
    totalFn:(a,q,r)=>Math.round((+r||0)*100)/100,
    displayFn:(a)=>'—' },
  { value:'KG',    label:'Kg',    needsWH:false, dimUnit:'',
    areaFn:(w,h,q)=>0,
    totalFn:(a,q,r)=>Math.round((+q||1)*(+r||0)*100)/100,
    displayFn:(a)=>'—' },
  // Roll modes for vendor-supplied roll material (laminate, vinyl, fabric).
  // W is roll width in METERS, H is roll length in METERS, Qty = number of rolls.
  // Per-sqft: vendor invoices by area consumed (rate × total sqft). 1 m² = 10.7639 ft².
  // Per-roll: vendor invoices by whole roll (rate × qty). Sqft is shown as reference only.
  { value:'Roll M×M (per sqft)', label:'Roll M×M (per sqft)', needsWH:true, dimUnit:'m',
    areaFn:(w,h,q)=>Math.round((+w||0)*(+h||0)*(+q||1)*10.7639*100)/100,
    totalFn:(a,q,r)=>Math.round(a*(+r||0)*100)/100,
    displayFn:(a)=>a>0?a+' ft² ('+'rolls)':'—' },
  { value:'Roll M×M (per roll)', label:'Roll M×M (per roll)', needsWH:true, dimUnit:'m',
    areaFn:(w,h,q)=>Math.round((+w||0)*(+h||0)*(+q||1)*10.7639*100)/100,
    totalFn:(a,q,r)=>Math.round((+q||1)*(+r||0)*100)/100,
    displayFn:(a)=>a>0?'rolls ('+a+' ft² ref.)':'—' },
];
const getUnitMode = (rm) => UNIT_MODES.find(u=>u.value===rm) || UNIT_MODES[0];
// UOM label/suffix for PDF + estimate display. Maps a rate_mode to the
// column header label and per-cell suffix that should appear on the
// Estimate PDF (and anywhere else a UOM column is rendered).
// header:  'SqFt' | 'SqMtr' | 'RFT' | 'Qty' | 'Lot' | 'Qty/UOM' (mixed)
// suffix:  ' ft²' | ' m²'  | ' rft'| ''    | ' lot'| ''        (per-row suffix used in mixed)
const getUomLabel = (rm) => {
  const v = String(rm||'');
  if (v.startsWith('SqFt') || v.startsWith('Roll')) return { header:'SqFt',  suffix:' ft²' };
  if (v.startsWith('SqMtr'))                         return { header:'SqMtr', suffix:' m²'  };
  if (v.startsWith('RFT'))                           return { header:'RFT',   suffix:' rft' };
  if (v === 'LOT')                                   return { header:'Lot',   suffix:' lot' };
  if (v === 'NOS' || v === 'SET' || v === 'KG')      return { header:'Qty',   suffix:''     };
  return { header:'Qty', suffix:'' };
};
// Resolve a single header for a list of items: shared header if all match,
// else 'Qty/UOM' with per-row suffixes used in cells.
const resolveUomHeader = (items) => {
  const headers = new Set((items||[]).map(it => getUomLabel(it.rate_mode || it.rm).header));
  if (headers.size <= 1) return [...headers][0] || 'Qty';
  return 'Qty/UOM';
};
// Keep legacy RATES for backward compat in other places
const SIZES=["MM","INCH","FOOT"];
const RATES=["SQFT","SQMTR","UNIT","RFT","NOS","SET","LOT"];
const MUNITS=["roll","nos","sheet","pcs","sqft","mtr","kg","box","set","lot"];
const FAB_P=["Laser Cutting","Router Cutting","CNC Cutting","Bending","Welding","PU Coating","Painting","Polishing","Assembly","Carpentry","3D Cutting"];

// ─── MATERIAL PICKER (searchable combobox) ─────────────────
// Replaces plain <select>+text input for material selection.
// - Click input → panel opens; type to filter (case-insensitive)
// - Pick existing → onPick({internal_name, client_name})
// - Type a brand-new name + click ➕ Add → onAddNew(typedName)
// - Free-text typing without click-Add still flows back via onPick
//   with isFreeText=true so caller can store on line item only.
// Props:
//   value         current selected internal_name (string)
//   products      array of {internal_name, client_name, ...}
//   onPick(obj)   called with {internal_name, client_name, isFreeText?}
//   onAddNew(s)   called with typed name to promote into products
//   placeholder   optional input placeholder
//   compact       boolean, smaller width for table cells
function MaterialPicker({value, products, onPick, onAddNew, placeholder, compact}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState(value||'');
  const [hi,setHi]=useState(0);
  const [panelPos,setPanelPos]=useState({top:0,left:0,width:220,placeAbove:false});
  const wrapRef=useRef(null);
  const inputRef=useRef(null);
  // Sync external value changes (e.g. when a new row is added)
  useEffect(()=>{ if(!open) setQ(value||''); },[value,open]);
  // Compute panel position from input's bounding rect.
  const computePos=useCallback(()=>{
    const el=inputRef.current; if(!el) return null;
    const r=el.getBoundingClientRect();
    const panelW=Math.max(r.width||0, 220);
    const panelMaxH=240;
    const margin=8;
    const spaceBelow=window.innerHeight - r.bottom;
    const spaceAbove=r.top;
    const placeAbove=spaceBelow < (panelMaxH+margin) && spaceAbove > spaceBelow;
    const top=placeAbove ? Math.max(margin, r.top - panelMaxH - 4) : (r.bottom + 4);
    const left=Math.min(Math.max(margin, r.left), Math.max(margin, window.innerWidth - panelW - margin));
    return {top, left, width:panelW, placeAbove};
  },[]);
  const openPanel=useCallback(()=>{
    const pos=computePos();
    if(pos) setPanelPos(pos);
    setOpen(true);
    setHi(0);
  },[computePos]);
  // Re-compute on scroll/resize while open so the fixed panel tracks the input.
  // Also poll via requestAnimationFrame for ~30 frames (~500ms) after open so the
  // panel position settles correctly during CSS entrance animations on ancestor
  // cards (the items table card has `animation:'fi .2s'` which causes the picker's
  // bounding rect to shift during the first 200ms after click).
  useEffect(()=>{
    if(!open) return;
    let frame=0;
    let rafId=null;
    const tick=()=>{
      const p=computePos();
      if(p) setPanelPos(prev=>(prev.top===p.top && prev.left===p.left && prev.width===p.width ? prev : p));
      frame++;
      if(frame<30) rafId=requestAnimationFrame(tick);
    };
    rafId=requestAnimationFrame(tick);
    const onScroll=()=>{ const p=computePos(); if(p) setPanelPos(p); };
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onScroll);
    return ()=>{
      if(rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('scroll', onScroll, true);
      window.removeEventListener('resize', onScroll);
    };
  },[open,computePos]);
  // Close on outside click — must check both wrapper and panel since panel
  // is portaled out via position:fixed and is not a descendant of wrapRef.
  useEffect(()=>{
    if(!open) return;
    const onDoc=(e)=>{
      if(wrapRef.current && wrapRef.current.contains(e.target)) return;
      if(e.target.closest && e.target.closest('[data-mp-panel="1"]')) return;
      setOpen(false);
    };
    document.addEventListener('mousedown',onDoc);
    return ()=>document.removeEventListener('mousedown',onDoc);
  },[open]);
  const ql=String(q||'').trim().toLowerCase();
  const matches=useMemo(()=>{
    if(!ql) return (products||[]).slice(0,200);
    return (products||[]).filter(p => String(p.internal_name||'').toLowerCase().includes(ql)).slice(0,200);
  },[ql,products]);
  const exactHit=useMemo(()=>{
    if(!ql) return null;
    return (products||[]).find(p => String(p.internal_name||'').trim().toLowerCase()===ql) || null;
  },[ql,products]);
  const showAddNew = ql && !exactHit && typeof onAddNew==='function';
  const totalRows = matches.length + (showAddNew?1:0);
  const onKey=(e)=>{
    if(e.key==='ArrowDown'){e.preventDefault();setHi(h=>Math.min(totalRows-1,h+1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setHi(h=>Math.max(0,h-1));}
    else if(e.key==='Enter'){
      e.preventDefault();
      if(showAddNew && hi===matches.length){onAddNew(q.trim());setOpen(false);return;}
      const pick=matches[hi];
      if(pick){onPick({internal_name:pick.internal_name, client_name:pick.client_name||pick.internal_name});setQ(pick.internal_name);setOpen(false);}
      else if(q.trim()){onPick({internal_name:q.trim(), client_name:q.trim(), isFreeText:true});setOpen(false);}
    }
    else if(e.key==='Escape'){setOpen(false);}
  };
  // Select all text on focus so user can immediately type a replacement
  // instead of appending to the prefilled value.
  const onFocus=(e)=>{ openPanel(); try{ e.target.select(); }catch(_){} };
  const w = compact ? 110 : 180;
  return (
    <div ref={wrapRef} style={{position:'relative',display:'inline-block',width:w}}>
      <input
        ref={inputRef}
        className="in"
        value={q}
        onChange={e=>{setQ(e.target.value);if(!open)openPanel();else setHi(0);}}
        onFocus={onFocus}
        onClick={openPanel}
        onKeyDown={onKey}
        placeholder={placeholder||'Search material...'}
        style={{fontSize:9,padding:'2px 4px',width:'100%',boxSizing:'border-box'}}
      />
      {open && ReactDOM.createPortal(
        <div data-mp-panel="1" style={{position:'fixed',top:panelPos.top,left:panelPos.left,zIndex:9999,background:'#0c1017',border:'1px solid #e3a008',borderRadius:6,width:panelPos.width,maxHeight:240,overflowY:'auto',boxShadow:'0 4px 12px rgba(0,0,0,.5)'}}>
          <div style={{padding:'4px 8px',fontSize:8,color:'#64748b',borderBottom:'1px solid #1a2030',background:'#0c1017'}}>
            {ql ? `${matches.length} of ${(products||[]).length} match` : `${(products||[]).length} materials`}
          </div>
          {matches.length===0 && !showAddNew && (
            <div style={{padding:'8px',fontSize:10,color:'#64748b',fontStyle:'italic'}}>No matches</div>
          )}
          {matches.map((p,i)=>(
            <div key={p.id||i}
              onMouseDown={(e)=>{e.preventDefault();onPick({internal_name:p.internal_name, client_name:p.client_name||p.internal_name});setQ(p.internal_name);setOpen(false);}}
              onMouseEnter={()=>setHi(i)}
              style={{padding:'5px 8px',fontSize:10,cursor:'pointer',background:i===hi?'#1f2937':'transparent',color:'#c9d1d9',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
              {p.internal_name}
            </div>
          ))}
          {showAddNew && (
            <div
              onMouseDown={(e)=>{e.preventDefault();onAddNew(q.trim());setQ(q.trim());setOpen(false);}}
              onMouseEnter={()=>setHi(matches.length)}
              style={{padding:'6px 8px',fontSize:10,cursor:'pointer',background:hi===matches.length?'#1f2937':'#0a0f1a',color:'#4ade80',borderTop:'1px solid #1a2030',fontWeight:700}}>
              ➕ Add as new material: "{q.trim()}"
            </div>
          )}
        </div>,
        document.body
      )}
    </div>
  );
}

function MainApp({user,onLogout,masterData}){
  const {firms,clients,suppliers,products,materials,machines,agencies,delBoys} = masterData;
  const [jobs,setJobs]=useState([]);
  const [batches,setBatches]=useState([]);
  const [items,setItems]=useState([]);
  const [grnData,setGrnData]=useState([]);
  const [pLogs,setPLogs]=useState([]);
  const [fLogs,setFLogs]=useState([]);
  const [osLogs,setOsLogs]=useState([]);
  const [dLogs,setDLogs]=useState([]);
  const [expenses,setExpenses]=useState([]);
  const [salesActs,setSalesActs]=useState([]);
  const [osItems,setOsItems]=useState([]);
  const [reqs,setReqs]=useState([]);
  const [prs,setPrs]=useState([]);
  const [pg,setPgRaw]=useState(()=>{
    try{return localStorage.getItem('erp_pg')||'dash';}catch(e){return 'dash';}
  });
  const setPg=(p)=>{setPgRaw(p);try{localStorage.setItem('erp_pg',p);}catch(e){}};
  const [toast,setToast]=useState(null);
  const [search,setSearch]=useState("");
  const [col,setCol]=useState(false);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(null);
  const [fyFilter,setFyFilter]=useState('2627'); // default to current FY
  const [portalAlert,setPortalAlert]=useState(null);

  const show=useCallback((m,ok=true)=>{setToast({m,ok});setTimeout(()=>setToast(null),2500);},[]);
  window._showToast=show;
  window._forceItemRefresh=(itemId,updates)=>{setItems(p=>p.map(i=>i.id===itemId?{...i,...updates}:i));};

  // Helper: fetch ALL rows from a table (paginate past 1000 limit)
  const fetchAll = async (table, order=null, filter=null) => {
    let all=[], from=0, size=1000;
    while(true){
      let q=sb.from(table).select('*').order(order||'id',{ascending:true}).range(from,from+size-1);
      if(filter) q=filter(q);
      const {data,error}=await q;
      if(error||!data||data.length===0) break;
      all=all.concat(data);
      if(data.length<size) break;
      from+=size;
    }
    return all;
  };

  // Load data from Supabase — jobs first (fast), then items in background
  useEffect(()=>{
    async function load(){
      setLoading(true);
      // Determine current FY suffix
      const now=new Date();const m=now.getMonth(),y=now.getFullYear();
      const curFYSuffix=m>=3?`${String(y).slice(2)}${String(y+1).slice(2)}`:`${String(y-1).slice(2)}${String(y).slice(2)}`;
      
      // Phase 1: Load current FY jobs + essential small tables (fast)
      const [j,g,ex] = await Promise.all([
        fetchAll('jobs','id',q=>q.like('id','%-'+curFYSuffix)),
        fetchAll('grn','id'),
        fetchAll('expenses','id'),
      ]);
      setJobs(j); setGrnData(g); setExpenses(ex);
      console.log('Phase 1: Loaded',j.length,'current FY jobs');
      setLoading(false);

      // Check for unacknowledged client-portal-submitted jobs
      try{
        const portalJobs=j.filter(x=>x.made_by&&(x.made_by.includes('CLIENT PORTAL')));
        const ackKey='portal_ack_'+user?.name;
        const lastAck=localStorage.getItem(ackKey)||'';
        const newPortalJobs=portalJobs.filter(x=>{
          const ts=x.created_at||'';
          return ts>lastAck;
        });
        if(newPortalJobs.length>0){
          setPortalAlert(newPortalJobs);
        }
      }catch(e){console.log('Portal notification check error:',e);}
      
      // Phase 2: Load batches + line items for current FY jobs
      const curJobIds=j.map(x=>x.id);
      const [b,li,osi,rq,pr] = await Promise.all([
        fetchAll('batches','id'),
        fetchAll('line_items','id'),
        fetchAll('outsource_items','id'),
        fetchAll('requisitions','id'),
        fetchAll('purchase_requests','created_at'),
      ]);
      setBatches(b); setItems(li); setOsItems(osi); setReqs(rq); setPrs(pr);
      console.log('Phase 2: Loaded',b.length,'batches',li.length,'items',osi.length,'outsource',rq.length,'requisitions');

      // Phase 3: Load older FY jobs + logs + sales in background
      const [oldJ,pl,fl,ol,dl,sa] = await Promise.all([
        fetchAll('jobs','id',q=>q.not('id','like','%-'+curFYSuffix)),
        fetchAll('print_logs','id'),
        fetchAll('fab_logs','id'),
        fetchAll('outsource_logs','id'),
        fetchAll('dispatch_logs','id'),
        fetchAll('sales_activities','id'),
      ]);
      setJobs(prev=>[...prev,...oldJ]); setPLogs(pl); setFLogs(fl);
      setOsLogs(ol); setDLogs(dl); setSalesActs(sa);
      console.log('Phase 3: Loaded',oldJ.length,'older jobs + logs');
    }
    load();
  },[]);

  // ─── CREATE JOB ───────────────────────────────────────────
  const createJob = useCallback(async (jobData, batchData, lineItemsData) => {
    // Retry with incremented ID if duplicate key
    let attempts=0;
    let finalJobData={...jobData};
    while(attempts<5){
      const {error:je} = await sb.from('jobs').insert(finalJobData);
      if(!je)break;
      if(je.message?.includes('duplicate key')||je.message?.includes('unique constraint')){
        attempts++;
        // Increment the number part
        const parts=finalJobData.id.split('-');
        const num=parseInt(parts[0])||0;
        const newId=String(num+attempts).padStart(4,'0')+'-'+parts.slice(1).join('-');
        finalJobData={...finalJobData,id:newId};
        // Also update batch and items with new job_id
        batchData={...batchData,job_id:newId};
        lineItemsData=lineItemsData.map(li=>({...li,job_id:newId}));
        continue;
      }
      show("Error: "+je.message,false);return;
    }
    if(attempts>=5){show("Error: Could not generate unique Job#. Please try again.",false);return;}
    const {error:be} = await sb.from('batches').insert(batchData);
    if(lineItemsData.length>0) await sb.from('line_items').insert(lineItemsData);
    setJobs(p=>[finalJobData,...p]);
    setBatches(p=>[batchData,...p]);
    setItems(p=>[...lineItemsData,...p]);
    show("Job "+finalJobData.id+" created successfully!");
    setPg("jobs");
  },[show]);

  // ─── ADD BATCH TO JOB ─────────────────────────────────────
  const addBatchToJob = useCallback(async (batchData) => {
    const {error} = await sb.from('batches').insert(batchData);
    if(!error) {setBatches(p=>[batchData,...p]); show("Batch added!");}
  },[show]);

  const deleteBatch = useCallback(async (batchId) => {
    const batchItems = items.filter(i=>i.batch_id===batchId);
    const totalAmt = batchItems.reduce((s,i)=>s+(+i.amount||0),0);
    const batch = batches.find(b=>b.id===batchId);
    const jobId = batch?.job_id||batchItems[0]?.job_id||'';
    const role = user?.role||'';
    const isAdmin = ['admin','sales'].includes(role);
    // Block non-admins from deleting batches with items
    if(batchItems.length > 0 && !isAdmin){show("⚠️ Only admins can delete batches with items. Ask JIGAR/RUCHITA.",false);return;}
    // Enhanced confirmation
    const msg = `⚠️ DELETE ENTIRE BATCH?\n\n"${batch?.note||'Batch'}" — ${batchItems.length} items\nTotal value: ₹${totalAmt.toFixed(2)}\nJob: ${jobId}\n\n⛔ ALL ${batchItems.length} items will be permanently deleted.\n\nType DELETE to confirm:`;
    const typed = prompt(msg);
    if(typed !== 'DELETE'){if(typed!==null)show("Cancelled — type DELETE exactly to confirm",false);return;}
    // Delete all items in batch first, then batch

      show('⚠️ "'+newStatus+'" is no longer a valid status. Please refresh the page (Ctrl+Shift+R) and try again.', false);
      console.warn('updateJobStatus rejected legacy status:', newStatus, 'for job', jobId);
      return;
    }
    
    // Instant UI update — don't wait for DB
    let skip=false;
    let newDates={};
    const now=new Date();
    const timeStr=now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' '+now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
    // 26 Apr 26: was window.__currentUser?.name which only got populated on Login

    // Read from the React prop (which is restored on boot, line 6957) with localStorage
    // fallback in case React state is ever stale.
    let userName=user?.name;
    if(!userName){try{const s=localStorage.getItem('erp_user');if(s)userName=JSON.parse(s)?.name;}catch(e){}}
    if(!userName)userName='Unknown';
    
    setJobs(prev=>{
      const job=prev.find(j=>j.id===jobId);
      if(!job||job.status===newStatus){skip=true;return prev;}
      const existingDates=job.status_dates||{};
      const statusKey=newStatus.replace(/\s+/g,'_').toLowerCase();
      newDates={...existingDates,[statusKey]:timeStr+' by '+userName};
      return prev.map(j=>j.id===jobId?{...j,status:newStatus,status_dates:newDates}:j);
    });
    if(skip)return;
    
    // Show toast IMMEDIATELY
    show("✅ Status → "+newStatus);
    
    // Dept flags — update React state instantly
    const statusDepts={'Draft':[0,0,0,0,0,0,0,0],'Quotation Sent':[1,0,0,0,0,0,0,0],'Recee':[1,0,0,0,0,0,0,0],'PO Pending':[1,0,0,0,0,0,0,0],

      'Printing · In-House':[1,1,1,1,0,0,0,0],'Printing · Outsource':[1,1,1,1,0,0,0,0],
      'Fabrication · In-House':[1,1,1,1,1,0,0,0],'Fabrication · Outsource':[1,1,1,1,1,0,0,0],
      'Delivered':[1,1,1,1,1,1,0,0],'Installation WIP':[1,1,1,1,1,1,1,0],
      'Billing Pending':[1,1,1,1,1,1,1,0],'Given for Billing':[1,1,1,1,1,1,1,0],

      'Billing Done':[1,1,1,1,1,1,1,1],'Cash Received':[1,1,1,1,1,1,1,1],'No Bill':[1,1,1,1,1,1,1,1],'Cancelled':[1,1,1,1,1,1,1,1]};
    const flags=statusDepts[newStatus];
    if(flags){
      const deptCols=['dept_estimate','dept_design','dept_production','dept_printing','dept_fabrication','dept_dispatch','dept_installation','dept_accounts'];
      const updates={};deptCols.forEach((c,i)=>{updates[c]=!!flags[i];});
      setItems(prev=>prev.map(i=>i.job_id===jobId?{...i,...updates}:i));
    }
    
    // ALL DB writes in parallel — non-blocking background
    const dbOps=[
      sb.from('jobs').update({status:newStatus,status_dates:newDates}).eq('id',jobId),
    ];
    if(flags){
      const deptCols=['dept_estimate','dept_design','dept_production','dept_printing','dept_fabrication','dept_dispatch','dept_installation','dept_accounts'];
      const updates={};deptCols.forEach((c,i)=>{updates[c]=!!flags[i];});
      dbOps.push(sb.from('line_items').update(updates).eq('job_id',jobId));

      const err=results.find(r=>r.error);
      if(err){show("⚠️ DB sync issue — refresh to verify",false);}

      </main>

      {modal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",zIndex:100,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"10px",overflowY:"auto"}} onClick={()=>{if(window._jfDirty&&!confirm('⚠️ You have unsaved changes in this job.\n\nClose anyway? Your changes will be lost.'))return;setModal(null);}}><div style={{background:"#0c1017",border:"1px solid #1a2030",borderRadius:12,width:"100%",maxWidth:1100,padding:16,margin:"10px 0",maxHeight:"calc(100vh - 20px)",overflowY:"auto",animation:"fi .2s"}} onClick={e=>e.stopPropagation()}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,position:"sticky",top:-16,background:"#0c1017",zIndex:2,padding:"8px 0",marginTop:-8}}><h3 style={{fontSize:13,fontWeight:700}}>{modal.t}</h3><button className="b bs" onClick={()=>{if(window._jfDirty&&!confirm('⚠️ You have unsaved changes in this job.\n\nClose anyway? Your changes will be lost.'))return;setModal(null);}}>✕</button></div>{modal.jobId?<JobDetail j={fullJobs.find(x=>x.id===modal.jobId)||modal.fallback} firms={firms} togDept={togDept} addBatchToJob={addBatchToJob} show={show} updateJobStatus={updateJobStatus} updateJobFields={updateJobFields} updateLineItem={updateLineItem} addLineItem={addLineItem} deleteLineItem={deleteLineItem} importBatches={importBatches} updateJobFile={updateJobFile} appendJobFiles={appendJobFiles} removeJobFile={removeJobFile} user={user} saveBill={saveBill} deleteBatch={deleteBatch} updateBatchNote={updateBatchNote} osItems={osItems} setOsItems={setOsItems} agencies={agencies} reqs={reqs} setReqs={setReqs} prs={prs} setPrs={setPrs} setBatches={setBatches} setItems={setItems} products={products} addNewProduct={addNewProduct}/>:modal.x}</div></div>}
      {portalAlert&&portalAlert.length>0&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:250,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>

          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
            <div style={{width:40,height:40,borderRadius:10,background:"#e3a00820",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🔔</div>

          </div>
          <div style={{maxHeight:300,overflowY:"auto",marginBottom:16}}>
            {portalAlert.map(j=><div key={j.id} style={{background:"#060810",border:"1px solid #e3a00833",borderRadius:8,padding:"10px 14px",marginBottom:6}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>

                  <p style={{fontSize:8,color:"#64748b",marginTop:3}}>{j.created_at?new Date(j.created_at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''}</p>

          <div style={{display:"flex",gap:8}}>

            <button onClick={()=>{try{localStorage.setItem('portal_ack_'+user?.name,new Date().toISOString());}catch(e){}setPortalAlert(null);}} style={{padding:"10px 16px",borderRadius:8,border:"1px solid #1a2030",background:"transparent",color:"#8b949e",fontSize:11,cursor:"pointer"}}>✓ Dismiss</button>
          </div>

      {toast&&<div style={{position:"fixed",bottom:12,right:12,background:toast.ok?"#238636":"#da3633",color:"#fff",padding:"6px 12px",borderRadius:6,fontWeight:600,fontSize:11,zIndex:200,animation:"sr .3s"}}>✓ {toast.m}</div>}
    </div>
  );
}

// ─── SMALL COMPONENTS ───────────────────────────────────────
function SC({l,v,s,c="#e3a008",d=0,delta}){return <div className="c a" style={{padding:"10px 12px",animationDelay:`${d}ms`}}><p style={{fontSize:8.5,color:"#64748b",textTransform:"uppercase",letterSpacing:".05em",fontWeight:600,marginBottom:2}}>{l}</p><div style={{display:"flex",alignItems:"baseline",gap:4}}><p className="mn" style={{fontSize:16,fontWeight:700,color:c}}>{v}</p>{delta!=null&&delta!==0&&<span style={{fontSize:9,fontWeight:700,color:delta>0?'#4ade80':'#f47067'}}>{delta>0?'▲ +'+delta:'▼ '+delta}</span>}</div>{s&&<p style={{fontSize:9,color:"#64748b"}}>{s}</p>}</div>;}
function FB({f,firms}){const fm=firms?.find(x=>x.code===f);return fm?<span className="bd" style={{background:fm.color+"20",color:fm.color}}>{fm.short_name}</span>:null;}
function Ck({on,onClick,tip}){return <div className={`ck ${on?"on":""}`} onClick={onClick} title={tip||undefined}>{on?"✓":""}</div>;}
function StatusTip({j,children}){
  const [show,setShow]=useState(false);
  const sd=j.status_dates||{};
  const entries=Object.entries(sd).filter(([k,v])=>v);
  const labels={draft:'Draft',quotation_sent:'Quotation Sent',po_pending:'PO Pending',recee:'Recee',designing_in_house:'Designing - In House',designing_outsource:'Designing - Outsource',printing_in_house:'Printing · In-House',printing_outsource:'Printing · Outsource',fabrication_in_house:'Fabrication · In-House',fabrication_outsource:'Fabrication · Outsource',delivered:'Delivered',installation_wip:'Installation WIP',billing_pending:'Billing Pending',given_for_billing:'Given for Billing',cash_pending:'Cash Pending',ic_pending:'IC Pending',dc_pending:'DC Pending',billing_done:'Billing Done',cash_received:'Cash Received',no_bill:'No Bill',cancelled:'Cancelled',
    // Legacy keys — kept so historical status_dates still render on old jobs
    active:'Active',po_received:'PO Received',recce_pending:'Recce Pending',designing:'Designing',printing:'Printing',fabrication:'Fabrication',installation:'Installation',proforma_invoice:'Proforma Invoice'};
  const curKey=j.status?.replace(/\s+/g,'_').toLowerCase();
  const lastEntry=entries.length>0?entries[entries.length-1]:null;
  return <div style={{position:"relative",display:"inline-block",cursor:"pointer"}} onMouseEnter={()=>setShow(true)} onMouseLeave={()=>setShow(false)}>
    {children}
    {show&&entries.length>0&&<div style={{position:"absolute",left:0,top:"100%",zIndex:50,background:"#161d2eee",border:"1px solid #2a3548",borderRadius:10,padding:"10px 14px",minWidth:260,maxWidth:350,boxShadow:"0 12px 32px rgba(0,0,0,.6)",backdropFilter:"blur(8px)",pointerEvents:"none"}}>
      <p style={{fontSize:9,fontWeight:700,color:"#e3a008",marginBottom:2}}>📅 Status History — {j.id}</p>
      {lastEntry&&<p style={{fontSize:8,color:"#8b949e",marginBottom:6}}>Last: {lastEntry[1]}</p>}
      <div style={{borderTop:"1px solid #2a3548",paddingTop:4}}>
        {entries.map(([k,v])=>{const isCurrent=k===curKey;return <div key={k} style={{display:"flex",justifyContent:"space-between",gap:8,padding:"3px 0",borderBottom:"1px solid #1a2030",background:isCurrent?"#e3a00810":"transparent",marginLeft:-4,marginRight:-4,paddingLeft:4,paddingRight:4,borderRadius:isCurrent?4:0}}>
          <span style={{fontSize:9,fontWeight:isCurrent?700:500,color:isCurrent?"#e3a008":"#c9d1d9"}}>{isCurrent?"▸ ":""}{labels[k]||k}</span>
          <span style={{fontSize:8,color:isCurrent?"#e3a008":"#8b949e",textAlign:"right",maxWidth:160}}>{v}</span>
        </div>;})}
      </div>
    </div>}
  </div>;
}

// ═══════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════
function DashPage({s,stock,sp,jobs,firms,sm,updateJobStatus,updateJobFields,togDept,addBatchToJob,show,updateLineItem,addLineItem,deleteLineItem,importBatches,updateJobFile,appendJobFiles,removeJobFile}){
  const [dq,setDq]=useState("");
  const low=Object.entries(stock).filter(([,v])=>v<=2&&v>=0).slice(0,5);
  
  // Banking client patterns
  const BANKING_CLIENTS=['DIEBOLD','CMS','OKI','NCR','NUVAMA','NUVAMA WEALTH','J M FINANCE','JM FINANCE','J.M. FINANCE','HITACHI','EDELWEISS','NIDO'];
  const isBanking=(cn)=>{if(!cn)return false;const u=cn.toUpperCase();return BANKING_CLIENTS.some(b=>u.includes(b));};
  const bankJobs=jobs.filter(j=>isBanking(j.client_name));
  const nonBankJobs=jobs.filter(j=>!isBanking(j.client_name));
  const activeStatuses=['Billing Done','Cancelled','No Bill','Cash Received'];
  const bStats=(jl)=>({
    total:jl.length,
    active:jl.filter(j=>!activeStatuses.includes(j.status)).length,
    estimate:jl.filter(j=>['Quotation Sent','PO Pending','Recee'].includes(j.status)).length,
    design:jl.filter(j=>['Designing - In House','Designing - Outsource'].includes(j.status)).length,
    // Post-22Apr26 status overhaul: only new statuses
    printIn:jl.filter(j=>j.status==='Printing · In-House').length,
    printOut:jl.filter(j=>j.status==='Printing · Outsource').length,
    fabIn:jl.filter(j=>j.status==='Fabrication · In-House').length,
    fabOut:jl.filter(j=>j.status==='Fabrication · Outsource').length,
    dispatch:jl.filter(j=>j.status==='Delivered').length,
    installed:jl.filter(j=>j.status==='Installation WIP').length,
    // Old aggregate keys kept for backward compat
    printing:jl.filter(j=>['Printing · In-House','Printing · Outsource'].includes(j.status)).length,
    fab:jl.filter(j=>['Fabrication · In-House','Fabrication · Outsource'].includes(j.status)).length,
    install:jl.filter(j=>j.status==='Installation WIP').length,
    delivered:jl.filter(j=>j.status==='Delivered').length,
    billPend:jl.filter(j=>['Billing Pending','Given for Billing','Cash Pending','IC Pending','DC Pending'].includes(j.status)).length,
    billed:jl.filter(j=>['Billing Done','Cash Received'].includes(j.status)).length,
  });
  const bk=bStats(bankJobs);const nb=bStats(nonBankJobs);
  const [indTab,setIndTab]=useState('all');
  const [cmpDays,setCmpDays]=useState(0); // 0=off, 7=week, 30=month

  // Item #6 — Site counts per status card (banking sites rolled up via parent-job status)
  const [sitesByJobNo,setSitesByJobNo]=useState(null); // Map<job_no, site_count_with_uid>
  useEffect(()=>{
    (async()=>{
      // Pull just job_no + site_unique_id — minimal columns for speed
      let all=[],from=0,sz=1000;
      while(true){
        const {data,error}=await sb.from('banking_sites').select('job_no,site_unique_id').range(from,from+sz-1);
        if(error||!data||!data.length)break;
        all=all.concat(data);
        if(data.length<sz)break;
        from+=sz;
      }
      // Only count sites that have a site_unique_id populated
      const map={};
      for(const s of all){
        if(!s.job_no||!s.site_unique_id||!String(s.site_unique_id).trim())continue;
        map[s.job_no]=(map[s.job_no]||0)+1;
      }
      setSitesByJobNo(map);
    })();
  },[]);
  const sitesPerCard=useMemo(()=>{
    if(!sitesByJobNo)return null;
    const out={};
    for(const card of STATUS_CARDS)out[card.key]=0;
    for(const j of jobs||[]){
      // Extract leading number (e.g. '9793-2627' → '9793') to match banking_sites.job_no convention
      const jobNum=String(j.id||'').split('-')[0];
      const cnt=sitesByJobNo[jobNum]||0;
      if(!cnt)continue;
      // Find which card this job falls into
      for(const card of STATUS_CARDS){
        if(card.statuses.includes(j.status)){out[card.key]+=cnt;break;}
      }
    }
    return out;
  },[sitesByJobNo,jobs]);

  // Calculate deltas: how many jobs were created in the comparison period
  const deltas=useMemo(()=>{
    if(!cmpDays) return {};
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-cmpDays);
    const cutStr=cutoff.toISOString();
    const recent=jobs.filter(j=>{const ca=j.created_at||'';return ca>=cutStr;});
    const recentCount=recent.length;
    // Count jobs that entered each status within the period (from status_dates)
    const statusDeltas={};
    const statusKeys={estimate:['quotation_sent','po_pending','po_received','recce_pending','active'],design:['designing'],printing:['printing'],fab:['fabrication'],install:['installation'],delivered:['delivered'],billPend:['billing_pending','given_for_billing','cash_pending','proforma_invoice','ic_pending'],billed:['billing_done','cash_received']};
    // Parse status_dates timestamps like "06 Apr 2026 04:26 pm by RUCHITA"
    const parseSD=(str)=>{if(!str)return null;const m=str.match(/(\d{1,2})\s+(\w+)\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(am|pm)/i);if(!m)return null;const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};let hr=+m[4];if(m[6].toLowerCase()==='pm'&&hr!==12)hr+=12;if(m[6].toLowerCase()==='am'&&hr===12)hr=0;return new Date(+m[3],months[m[2]]||0,+m[1],hr,+m[5]);};
    Object.entries(statusKeys).forEach(([key,sdKeys])=>{
      let count=0;
      jobs.forEach(j=>{
        const sd=j.status_dates||{};
        for(const sk of sdKeys){
          const ts=sd[sk];if(!ts)continue;
          const dt=parseSD(ts);
          if(dt&&dt>=cutoff)count++;
        }
      });
      statusDeltas[key]=count;
    });
    // For total jobs: new jobs created
    statusDeltas.jobs=recentCount;
    // For PO pending: count jobs that became PO pending (no PO) in the period
    statusDeltas.poPend=recent.filter(j=>!j.po_number&&!['Billing Done','Cancelled','No Bill','Cash Received','Draft'].includes(j.status)).length;
    return statusDeltas;
  },[cmpDays,jobs]);
  
  const results=useMemo(()=>{
    if(!dq||dq.length<2) return [];
    const q=dq.toLowerCase();
    return jobs.filter(j=>
      j.id?.toLowerCase().includes(q)||
      j.client_name?.toLowerCase().includes(q)||
      j.project?.toLowerCase().includes(q)||
      j.po_number?.toLowerCase().includes(q)||
      j.contact_person?.toLowerCase().includes(q)||
      (j.batches||[]).some(b=>b.bill_no?.toLowerCase().includes(q))
    ).slice(0,20);
  },[dq,jobs]);
  const sc={'Draft':'#64748b','Quotation Sent':'#3b82f6','PO Pending':'#f47067','Recee':'#f59e0b','Designing - In House':'#8b5cf6','Designing - Outsource':'#c084fc','Printing · In-House':'#06b6d4','Printing · Outsource':'#f97316','Fabrication · In-House':'#dc2626','Fabrication · Outsource':'#ea580c','Delivered':'#3b82f6','Installation WIP':'#059669','Billing Pending':'#06b6d4','Given for Billing':'#06b6d4','Cash Pending':'#e3a008','IC Pending':'#f59e0b','DC Pending':'#f59e0b','Billing Done':'#4ade80','Cash Received':'#4ade80','No Bill':'#64748b','Cancelled':'#64748b'};
  const openJob=(j)=>sm({t:`Job ${j.id} — ${j.project}`,jobId:j.id,fallback:j});
  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    <div className="c" style={{padding:10}}>
      <div style={{position:"relative"}}><input className="in" placeholder="🔍 Search by Job#, Invoice#, Client, Project, PO#..." value={dq} onChange={e=>setDq(e.target.value)} style={{fontSize:12,padding:"8px 12px",paddingLeft:12}}/></div>
      {results.length>0&&<div style={{marginTop:6,maxHeight:300,overflowY:"auto"}}><table><thead><tr><th>Job</th><th>Firm</th><th>Client</th><th>Project</th><th>Status</th><th>Invoice</th></tr></thead><tbody>
        {results.map(j=>{const bn=(j.batches||[]).map(b=>b.bill_no).filter(Boolean).join(', ');return <tr key={j.id} style={{cursor:"pointer"}} onClick={()=>openJob(j)}><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700}}><StatusTip j={j}>{j.id}</StatusTip></td><td><FB f={j.firm} firms={firms}/></td><td style={{fontSize:10}}>{j.client_name?.slice(0,22)}</td><td style={{fontSize:10,color:"#64748b"}}>{j.project?.slice(0,20)}</td><td><StatusTip j={j}><span className="bd" style={{background:(sc[j.status]||'#64748b')+'20',color:sc[j.status]||'#64748b'}}>{j.status}</span></StatusTip></td><td className="mn" style={{fontSize:10,color:"#06b6d4"}}>{bn||'—'}</td></tr>})}
      </tbody></table></div>}
      {dq.length>=2&&results.length===0&&<p style={{fontSize:10,color:"#64748b",marginTop:4}}>No results found for "{dq}"</p>}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
      <div style={{display:"flex",gap:3}}>
        {[{d:0,l:'No Compare'},{d:7,l:'7 Days'},{d:30,l:'30 Days'}].map(p=><button key={p.d} className={`b bs ${cmpDays===p.d?'bp':''}`} onClick={()=>setCmpDays(p.d)} style={{fontSize:9,padding:"3px 8px"}}>{p.d?'📊 '+p.l:'—'}</button>)}
      </div>
      {cmpDays>0&&<span style={{fontSize:9,color:"#64748b"}}>Showing changes in last {cmpDays} days</span>}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:7}}>
      <SC l="Total Jobs" v={s.jobs} s={`${s.active} active`} delta={deltas.jobs}/>
      {STATUS_CARDS.map((card,idx)=><SC key={card.key} l={card.label} v={countJobsByCard(jobs,card.key)} c={card.color} d={30+idx*15} s={sitesPerCard?`${sitesPerCard[card.key]||0} sites`:undefined}/>)}
    </div>
    {/* Banking / Non-Banking Split */}
    <div className="c" style={{padding:10}}>
      <div style={{display:"flex",gap:4,marginBottom:8}}>
        {[{id:'all',l:'All',e:'📊'},{id:'bank',l:'Banking',e:'🏦'},{id:'nonbank',l:'Non-Banking',e:'🏢'}].map(t=><button key={t.id} className={`b bs ${indTab===t.id?'bp':''}`} onClick={()=>setIndTab(t.id)} style={{fontSize:10}}>{t.e} {t.l}</button>)}
      </div>
      {indTab==='all'&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <div style={{background:"#060810",borderRadius:8,padding:10,border:"1px solid #1a2030"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><p style={{fontSize:10,fontWeight:700,color:"#3b82f6"}}>🏦 Banking</p><span className="mn" style={{fontSize:16,fontWeight:800,color:"#3b82f6"}}>{bk.total}</span></div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:3}}>
            <div style={{fontSize:8,color:"#64748b"}}>Active <span style={{color:"#e3a008",fontWeight:700}}>{bk.active}</span></div>
            <div style={{fontSize:8,color:"#64748b"}}>Print <span style={{color:"#ef4444",fontWeight:700}}>{bk.printing}</span></div>
            <div style={{fontSize:8,color:"#64748b"}}>Fab <span style={{color:"#dc2626",fontWeight:700}}>{bk.fab}</span></div>
            <div style={{fontSize:8,color:"#64748b"}}>Install <span style={{color:"#059669",fontWeight:700}}>{bk.install}</span></div>
            <div style={{fontSize:8,color:"#64748b"}}>Bill <span style={{color:"#06b6d4",fontWeight:700}}>{bk.billPend}</span></div>
            <div style={{fontSize:8,color:"#64748b"}}>Done <span style={{color:"#4ade80",fontWeight:700}}>{bk.billed}</span></div>
          </div>
        </div>
        <div style={{background:"#060810",borderRadius:8,padding:10,border:"1px solid #1a2030"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><p style={{fontSize:10,fontWeight:700,color:"#f59e0b"}}>🏢 Non-Banking</p><span className="mn" style={{fontSize:16,fontWeight:800,color:"#f59e0b"}}>{nb.total}</span></div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:3}}>
            <div style={{fontSize:8,color:"#64748b"}}>Active <span style={{color:"#e3a008",fontWeight:700}}>{nb.active}</span></div>
            <div style={{fontSize:8,color:"#64748b"}}>Print <span style={{color:"#ef4444",fontWeight:700}}>{nb.printing}</span></div>
            <div style={{fontSize:8,color:"#64748b"}}>Fab <span style={{color:"#dc2626",fontWeight:700}}>{nb.fab}</span></div>
            <div style={{fontSize:8,color:"#64748b"}}>Install <span style={{color:"#059669",fontWeight:700}}>{nb.install}</span></div>
            <div style={{fontSize:8,color:"#64748b"}}>Bill <span style={{color:"#06b6d4",fontWeight:700}}>{nb.billPend}</span></div>
            <div style={{fontSize:8,color:"#64748b"}}>Done <span style={{color:"#4ade80",fontWeight:700}}>{nb.billed}</span></div>
          </div>
        </div>
      </div>}
      {indTab==='bank'&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(100px,1fr))",gap:5}}>
        <SC l="Total" v={bk.total} c="#3b82f6"/><SC l="Active" v={bk.active} c="#e3a008"/><SC l="Estimate" v={bk.estimate} c="#3b82f6"/><SC l="Design" v={bk.design} c="#8b5cf6"/><SC l="Printing" v={bk.printing} c="#ef4444"/><SC l="Fabrication" v={bk.fab} c="#dc2626"/><SC l="Install" v={bk.install} c="#059669"/><SC l="Billing" v={bk.billPend} c="#06b6d4"/><SC l="Billed" v={bk.billed} c="#4ade80"/>
      </div>}
      {indTab==='nonbank'&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(100px,1fr))",gap:5}}>
        <SC l="Total" v={nb.total} c="#f59e0b"/><SC l="Active" v={nb.active} c="#e3a008"/><SC l="Estimate" v={nb.estimate} c="#3b82f6"/><SC l="Design" v={nb.design} c="#8b5cf6"/><SC l="Printing" v={nb.printing} c="#ef4444"/><SC l="Fabrication" v={nb.fab} c="#dc2626"/><SC l="Install" v={nb.install} c="#059669"/><SC l="Billing" v={nb.billPend} c="#06b6d4"/><SC l="Billed" v={nb.billed} c="#4ade80"/>
      </div>}
    </div>
    {low.length>0&&<div className="c" style={{padding:10,borderColor:"#f4706733"}}><p style={{fontSize:9,color:"#f47067",fontWeight:700,marginBottom:4}}>⚠️ Low Stock</p><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{low.map(([m,q])=><span key={m} style={{background:"#1a0505",border:"1px solid #f4706733",borderRadius:5,padding:"3px 6px",fontSize:9.5}}><strong style={{color:"#f47067"}}>{q}</strong> {m}</span>)}</div></div>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(110px,1fr))",gap:5}}>{[{l:"New Job",p:"new",e:"➕"},{l:"Material In",p:"grn",e:"📦"},{l:"Printing",p:"print",e:"🖨️"},{l:"Fabrication",p:"fab",e:"🔧"},{l:"Outsource",p:"os",e:"📤"},{l:"Dispatch",p:"disp",e:"🚚"},{l:"Stock",p:"stock",e:"📊"},{l:"Accounts",p:"acc",e:"🧾"}].map(a=><button key={a.l} className="b" style={{padding:8,justifyContent:"flex-start"}} onClick={()=>sp(a.p)}>{a.e} {a.l}</button>)}</div>
  </div>;
}

function JobsPage({jobs,s,firms,togDept,addBatchToJob,show,sp,sm,updateJobStatus,updateJobFields,updateLineItem,addLineItem,deleteLineItem,importBatches,updateJobFile,appendJobFiles,removeJobFile}){

function JobDetail({j,firms,togDept,addBatchToJob,show,updateJobStatus,updateJobFields,updateLineItem,addLineItem,deleteLineItem,importBatches,updateJobFile,appendJobFiles,removeJobFile,user,saveBill,deleteBatch,updateBatchNote,osItems,setOsItems,agencies,reqs,setReqs,prs,setPrs,setBatches,setItems,products,addNewProduct}){
  const ALL_ST = ALL_ST_NEW;
  const [vm,svm]=useState("internal");
  const [sa,ssa]=useState(false);const [nn,snn]=useState("");
  const [addingToBatch,setAddingToBatch]=useState(null); // batch id being added to
  const [copyBatch,setCopyBatch]=useState(null); // {batchId, bi, items:[{...item, selected:bool}]}
  const [pdfMode,setPdfMode]=useState(null); // 'estimate'|'production'|null
  const [pdfBatches,setPdfBatches]=useState({}); // {batchId: true/false}
  const [ni,setNi]=useState({internal_name:'',client_name:'',media:'',width:'',height:'',qty:1,rate:0,size_unit:'MM',rate_mode:'SqFt (INCH)',gstPct:18});
  const [osOpen,setOsOpen]=useState(null); // line_item_id whose OS panel is open
  const [osForm,setOsForm]=useState({task_type:'',vendor_name:'',rate:0,rate_mode:'UNIT',notes:''});
  const OS_TASKS=['Installation Charges','Coating Works','Router Cutting','Laser Cutting','Printing Charges','Frames','Signages (Internal)','Signages (External)'];
  const [jobPos,setJobPos]=useState([]);
  const [jobPosLoading,setJobPosLoading]=useState(true);
  const [showAddPo,setShowAddPo]=useState(false);
  const [newPo,setNewPo]=useState({po_number:'',po_date:'',po_amount:'',po_file_url:''});
  const [editingPoId,setEditingPoId]=useState(null);
  const [poUploading,setPoUploading]=useState(false);
  React.useEffect(()=>{
    let alive=true;
    (async()=>{
      setJobPosLoading(true);
      const {data,error}=await sb.from('job_pos').select('*').eq('job_id',j.id).order('created_at',{ascending:true});
      if(alive){
        if(!error&&data)setJobPos(data);
        setJobPosLoading(false);

    })();
    return ()=>{alive=false;};
