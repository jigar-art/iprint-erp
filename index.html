          items:acceptedItems.map(x=>({product:x.product,size:x.size||'',qty:x.qty||1,rate:x.rate,per:x.per||'Job',gst_pct:x.gst_pct||18,hsn:'',width:'',height:'',unit_mode:'NOS',area:0}))
        }));
        // If there are rejected items with notes — send WhatsApp to vendor + user + group
        if(rejectedItems.length>0 && prf.vendor_phone){
          const phone=(prf.vendor_phone||'').replace(/\D/g,'').replace(/^0/,'91').replace(/^(?!91)/,'91');
          const vendorMsg=`Dear *${prf.vendor_name}*,

Thank you for your quotation${quoteReview.invoiceNo?' ('+quoteReview.invoiceNo+')':''}. We have reviewed and have the following revision requests:

${rejectedItems.map((x,i)=>`*Item ${i+1}:* ${x.product}
_Note:_ ${x.note}`).join('\n\n')}

Please send a revised quotation at the earliest.

Regards,
iPrint India`;
          sendWhatsApp(phone, vendorMsg, 'vendor_quote_revision');
          // Copy to requestor
          const reqPhone=WA_NUMBERS[prf.requestor]||WA_NUMBERS['Jigar'];
          const userMsg=`📋 *Quote Revision Sent to ${prf.vendor_name}*

File: ${quoteReview.fileName}
Rejected items with notes:

${rejectedItems.map(x=>`• ${x.product}: ${x.note}`).join('\n')}

Accepted ${acceptedItems.length} of ${quoteReview.items.length} items — pre-filled in PR form.`;
          setTimeout(()=>sendWhatsApp(reqPhone, userMsg, 'vendor_quote_revision_user'),1500);
          // Group notification
          setTimeout(()=>sendWhatsApp(WA_GROUP, userMsg, 'vendor_quote_revision_group'),3000);
          show('✅ '+acceptedItems.length+' items added to PR. Revision notes sent to vendor + team on WhatsApp!');
        } else {
          show('✅ '+acceptedItems.length+' items loaded into PR from quote');
        }
        setQuoteReview(null);
        setShowQuoteUpload(false);
        setQuoteFile(null);
      };

      const savePR=async()=>{
        if(!prf.requestor){show('Select requestor',false);return;}
        if(!prf.vendor_id&&!prf.vendor_name){show('Select or enter a vendor',false);return;}
        if(!prf.items.some(x=>x.product)){show('Add at least one item',false);return;}
        // Every item with a product must have a unit_mode. blankItem defaults to 'NOS',
        // so this only fires if someone explicitly cleared the dropdown. Closes the
        // theoretical hole where a PR could be saved without a unit, causing PO display issues.
        const missingUnit = prf.items.findIndex(x => x.product && !x.unit_mode);
        if (missingUnit >= 0) {
          show(`Select a unit for item ${missingUnit + 1} (${prf.items[missingUnit].product.slice(0,30)})`, false);
          return;
        }
        setSaving(true);
        const pr_no=await genPRNo(prf.firm_code);
        const fy=getFY();
        const {subtotal,gst_total,transport_gst,total}=calcTotals(prf.items,prf.transport,prf.transport_gst_pct);
        const roundOff=+(+prf.round_off||0).toFixed(2);
        const finalTotal=+(total+roundOff).toFixed(2);
        const rec={
          id:'PR'+Date.now(),
          pr_no,fy,
          firm_code:prf.firm_code,
          job_id:j.id,
          request_type:prf.request_type,
          vendor_id:prf.vendor_id||null,
          vendor_name:prf.vendor_name,
          vendor_gstin:prf.vendor_gstin||null,
          vendor_address:prf.vendor_address||null,
          vendor_phone:prf.vendor_phone||null,
          vendor_state:prf.vendor_state||'Maharashtra',
          urgency:prf.urgency,
          expected_delivery:prf.expected_delivery||null,
          payment_terms:prf.payment_terms||null,
          transport:+prf.transport||0,
          transport_gst_pct:+prf.transport_gst_pct||0,
          round_off:roundOff,
          items:prf.items.filter(x=>x.product),
          subtotal,gst_total,total:finalTotal,
          notes:prf.notes||null,
          status:'Pending Approval',
          created_by:prf.requestor,
          created_at:new Date().toISOString(),
          requestor_dept: (typeof STAFF_DEPTS!=='undefined' && STAFF_DEPTS[prf.requestor]) || null,
          last_status_change_at: new Date().toISOString()
        };
        const {error}=await sb.from('purchase_requests').insert(rec);
        setSaving(false);
        if(error){show('⚠️ Save failed: '+error.message,false);return;}
        setPrs(p=>[...p,rec]);
        show('✅ '+pr_no+' submitted for Jigar\'s approval!');
        setPrf(blankForm);
        setShowPRForm(false);
      };

      const saveNewVendor=async()=>{
        if(!avf.name.trim()){show('Vendor name required',false);return;}
        const newV={id:'V-NEW-'+Date.now(),name:avf.name.trim(),category:avf.category,phone:avf.phone||null,gstin:avf.gstin||null,contact_person:avf.contact_person||null,state:avf.state||'Maharashtra',active:true,created_by:user?.name||'',created_at:new Date().toISOString()};
        const {error}=await sb.from('vendors').insert(newV);
        if(error){show('⚠️ Vendor save failed: '+error.message,false);return;}
        setVendors(p=>[...(p||[]),newV].sort((a,b)=>a.name.localeCompare(b.name)));
        selectVendor(newV.id);
        setAvf({name:'',category:'Material',phone:'',gstin:'',contact_person:'',state:'Maharashtra'});
        setShowAddVendor(false);
        show('✅ Vendor added!');
      };

      const deletePR=async(id,pr_no)=>{if(!confirm('Delete '+pr_no+'? This cannot be undone.'))return;const {error}=await sb.from('purchase_requests').delete().eq('id',id);if(!error)setPrs(p=>p.filter(r=>r.id!==id));};

      const stCol={
        'Pending Approval':{bg:'#e3a00820',c:'#e3a008'},
        'Approved':{bg:'#4ade8020',c:'#4ade80'},
        'Rejected':{bg:'#f4706720',c:'#f47067'},
        'PO Generated':{bg:'#06b6d420',c:'#06b6d4'},
        'PO Sent':{bg:'#3b82f620',c:'#3b82f6'},
        'Completed':{bg:'#8b5cf620',c:'#8b5cf6'},
        'Cancelled':{bg:'#64748b20',c:'#64748b'},
      };

      const totals=React.useMemo(()=>calcTotals(prf.items,prf.transport,prf.transport_gst_pct),[prf.items,prf.transport,prf.transport_gst_pct]);

      return <div style={{marginTop:6}}>
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <p style={{fontSize:10,fontWeight:700,color:"#f59e0b"}}>🛒 PURCHASE REQUESTS ({jobPRs.length})</p>
          <button className="b" onClick={()=>{setShowPRForm(!showPRForm);if(!showPRForm)loadVendors();}} style={{fontSize:9,padding:"2px 8px",borderColor:"#f59e0b",color:"#f59e0b"}}>{showPRForm?'✕ Close':'+ New PR'}</button>
        </div>

        {/* Existing PRs list */}
        {jobPRs.length>0&&<div style={{display:"flex",flexDirection:"column",gap:3,marginBottom:6}}>
          {jobPRs.map(r=>{
            const sc=stCol[r.status]||{bg:'#64748b20',c:'#64748b'};
            const rItems=Array.isArray(r.items)?r.items:[];
            return <div key={r.id} style={{background:"#060810",border:"1px solid #1a2030",borderRadius:6,padding:"6px 10px",fontSize:9}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3,flexWrap:"wrap",gap:3}}>
                <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                  <span style={{fontWeight:800,color:"#f59e0b",fontSize:10}}>{r.pr_no}</span>
                  <span style={{padding:"1px 6px",borderRadius:3,fontSize:7,fontWeight:700,background:sc.bg,color:sc.c}}>{r.status}</span>
                  {r.urgency==='Urgent'&&<span style={{padding:"1px 5px",borderRadius:3,fontSize:7,fontWeight:700,background:"#f4706720",color:"#f47067"}}>🔴 URGENT</span>}
                  <span style={{color:"#c9d1d9"}}>{r.vendor_name}</span>
                  <span style={{color:"#64748b",fontSize:8}}>{r.request_type}</span>
                  {r.payment_terms&&<span style={{color:"#64748b",fontSize:7}}>{r.payment_terms}</span>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <span style={{fontWeight:700,color:"#e3a008"}}>₹{(+r.total||0).toFixed(0)}</span>
                  <span style={{fontSize:7,color:"#64748b"}}>by {r.created_by}</span>
                  {r.status==='Pending Approval'&&<button style={{background:"none",border:"none",color:"#f47067",cursor:"pointer",fontSize:9}} onClick={()=>deletePR(r.id,r.pr_no)}>✕</button>}
                </div>
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {rItems.map((x,xi)=>{
                  const um=x.unit_mode?getUnitMode(x.unit_mode):null;
                  const dimStr=um&&um.needsWH&&(x.width||x.height)?` ${x.width||''}×${x.height||''}${um.dimUnit?' '+um.dimUnit:''}`:(x.size?' ('+x.size+')':'');
                  const modeStr=um&&um.value!=='NOS'?` [${um.value}]`:'';
                  return <span key={xi} style={{color:"#8b949e"}}>{x.product}{dimStr}{modeStr} × {x.qty} @ ₹{x.rate} <span style={{color:"#64748b"}}>GST {x.gst_pct}%</span></span>;
                })}
                {(+r.transport>0)&&<span style={{color:"#64748b"}}>+ Transport ₹{r.transport}</span>}
              </div>
              {r.rejection_reason&&<div style={{marginTop:3,padding:"3px 6px",background:"#f4706710",border:"1px solid #f4706733",borderRadius:4,fontSize:8,color:"#f47067"}}>❌ Rejected: {r.rejection_reason}</div>}
            </div>;
          })}
        </div>}

        {/* New PR Form */}
        {showPRForm&&<div style={{background:"#0a0f1a",border:"1px solid #f59e0b44",borderRadius:8,padding:10}}>
          <p style={{fontSize:9,fontWeight:700,color:"#f59e0b",marginBottom:8}}>NEW PURCHASE REQUEST</p>

          {/* ── VENDOR QUOTE UPLOAD SECTION ────────────────────────────── */}
          <div style={{marginBottom:8,padding:'6px 10px',background:'#060810',border:'1px solid #1a2030',borderRadius:6}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:6}}>
              <span style={{fontSize:9,color:'#64748b',fontWeight:600}}>📎 Have a vendor quote? Import it to pre-fill line items</span>
              <button className="b bs" onClick={()=>setShowQuoteUpload(v=>!v)} style={{fontSize:8,padding:'2px 8px',color:'#06b6d4',borderColor:'#06b6d4'}}>
                {showQuoteUpload?'✕ Cancel':'📂 Upload Quote (Excel/PDF)'}
              </button>
            </div>
            {showQuoteUpload&&<div style={{marginTop:8}}>
              <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                <label style={{display:'flex',alignItems:'center',gap:6,padding:'5px 10px',background:'#0c1017',border:'1px dashed #06b6d4',borderRadius:6,cursor:'pointer',fontSize:9,color:'#06b6d4'}}>
                  📂 {quoteFile?quoteFile.name:'Choose Excel or PDF file'}
                  <input type="file" accept=".xlsx,.xls,.pdf" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(f)setQuoteFile(f);}}/>
                </label>
                {quoteFile&&<button className="b bp" onClick={()=>{
                  if(quoteFile.name.match(/\.pdf$/i)){
                    setQuoteReview({vendorName:'',invoiceNo:'',invoiceDate:'',workDesc:'',items:[],fileName:quoteFile.name,fileType:'pdf',pdfOnly:true});
                  } else {
                    parseExcelQuote(quoteFile);
                  }
                }} disabled={quoteParsing} style={{fontSize:9,padding:'4px 12px',background:'#06b6d4',borderColor:'#06b6d4',color:'#000',fontWeight:700}}>
                  {quoteParsing?'⏳ Parsing...':'🔍 Parse & Review'}
                </button>}
                {quoteFile&&<span style={{fontSize:8,color:'#64748b'}}>{(quoteFile.size/1024).toFixed(0)} KB</span>}
              </div>
            </div>}
          </div>

          {/* ── QUOTE REVIEW MODAL ──────────────────────────────────────── */}
          {quoteReview&&<div style={{marginBottom:10,background:'#060810',border:'1px solid #06b6d4',borderRadius:8,padding:12}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <div>
                <span style={{fontWeight:800,color:'#06b6d4',fontSize:12}}>📋 Quote Review</span>
                <span style={{marginLeft:8,fontSize:10,color:'#64748b'}}>{quoteReview.fileName}</span>
                {quoteReview.invoiceNo&&<span style={{marginLeft:6,fontSize:9,color:'#8b949e'}}>Inv: {quoteReview.invoiceNo}</span>}
              </div>
              <button className="b bs" onClick={()=>{setQuoteReview(null);setQuoteFile(null);}} style={{fontSize:9}}>✕</button>
            </div>

            {quoteReview.pdfOnly?<div>
              <div style={{padding:'8px 10px',background:'rgba(6,182,212,0.08)',border:'1px solid rgba(6,182,212,0.2)',borderRadius:6,fontSize:10,color:'#7dd3fc',marginBottom:8}}>
                📎 PDF attached as reference. Items cannot be auto-parsed — please fill line items manually below.
              </div>
              <button className="b bp" onClick={()=>{setQuoteReview(null);setShowQuoteUpload(false);show('PDF attached — fill items manually');}}
                style={{fontSize:10,padding:'5px 14px',background:'#06b6d4',borderColor:'#06b6d4',color:'#000',fontWeight:700}}>
                ✅ OK, I'll fill manually
              </button>
            </div>:<div>
              {quoteReview.vendorName&&<div style={{fontSize:10,color:'#c9d1d9',marginBottom:6}}>
                <strong style={{color:'#4ade80'}}>Vendor:</strong> {quoteReview.vendorName}
                {quoteReview.workDesc&&<span style={{marginLeft:8,color:'#64748b',fontSize:9}}>{quoteReview.workDesc}</span>}
              </div>}
              <div style={{fontSize:8,color:'#f59e0b',fontWeight:700,marginBottom:4}}>
                REVIEW LINE ITEMS — ✅ Accept or ❌ Reject with note
                <span style={{marginLeft:8,color:'#64748b',fontWeight:400}}>
                  {quoteReview.items.filter(x=>x.accepted).length} of {quoteReview.items.length} accepted
                </span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:4,maxHeight:280,overflowY:'auto',marginBottom:8}}>
                {quoteReview.items.map((item,xi)=><div key={xi}
                  style={{background:item.accepted?'rgba(74,222,128,0.05)':'rgba(244,112,103,0.05)',
                    border:'1px solid '+(item.accepted?'rgba(74,222,128,0.25)':'rgba(244,112,103,0.25)'),
                    borderRadius:6,padding:'6px 10px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    {/* Accept/Reject toggle */}
                    <button onClick={()=>setQuoteReview(p=>({...p,items:p.items.map((it,i)=>i===xi?{...it,accepted:!it.accepted,note:it.accepted?it.note:''}:it)}))}
                      style={{padding:'2px 8px',borderRadius:4,border:'none',cursor:'pointer',fontSize:9,fontWeight:700,
                        background:item.accepted?'#4ade80':'#f47067',color:item.accepted?'#000':'#fff',flexShrink:0}}>
                      {item.accepted?'✅ Accept':'❌ Reject'}
                    </button>
                    {/* Item name */}
                    <span style={{flex:1,fontSize:10,color:item.accepted?'#c9d1d9':'#64748b',textDecoration:item.accepted?'none':'line-through',minWidth:120}}>
                      <strong>{item.sr}.</strong> {item.product}
                    </span>
                    {/* Rate - editable */}
                    <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
                      <span style={{fontSize:8,color:'#64748b'}}>₹</span>
                      <input className="in mn" type="number" value={item.rate}
                        onChange={e=>setQuoteReview(p=>({...p,items:p.items.map((it,i)=>i===xi?{...it,rate:+e.target.value}:it)}))}
                        style={{fontSize:9,padding:'1px 4px',width:64,color:'#e3a008',background:'#0c1017'}}/>
                      <span style={{fontSize:8,color:'#64748b'}}>/{item.per||'Job'}</span>
                    </div>
                    {/* GST */}
                    <select className="in" value={item.gst_pct}
                      onChange={e=>setQuoteReview(p=>({...p,items:p.items.map((it,i)=>i===xi?{...it,gst_pct:+e.target.value}:it)}))}
                      style={{fontSize:8,padding:'1px 3px',width:48}}>
                      {[0,5,12,18,28].map(g=><option key={g} value={g}>{g}%</option>)}
                    </select>
                    <span style={{fontSize:9,fontWeight:700,color:'#e3a008',minWidth:60,textAlign:'right'}}>
                      ₹{((item.qty||1)*(item.rate||0)).toLocaleString('en-IN')}
                    </span>
                  </div>
                  {/* Rejection note input */}
                  {!item.accepted&&<div style={{marginTop:5}}>
                    <input className="in" value={item.note||''}
                      onChange={e=>setQuoteReview(p=>({...p,items:p.items.map((it,i)=>i===xi?{...it,note:e.target.value}:it)}))}
                      placeholder="Reason for rejection / revision request (e.g. Rate too high — target ₹1200)"
                      autoFocus
                      style={{fontSize:9,padding:'3px 6px',width:'100%',borderColor:'#f47067',color:'#fca5a5'}}/>
                    <span style={{fontSize:8,color:'#f47067',marginTop:2,display:'block'}}>📱 This note will be sent to vendor via WhatsApp</span>
                  </div>}
                </div>)}
              </div>
              {/* Total + Apply button */}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:6}}>
                <div style={{fontSize:10,color:'#64748b'}}>
                  Accepted total: <strong style={{color:'#e3a008'}}>
                    ₹{quoteReview.items.filter(x=>x.accepted).reduce((s,x)=>(s+(x.qty||1)*(x.rate||0)),0).toLocaleString('en-IN')}
                  </strong>
                  {quoteReview.items.some(x=>!x.accepted)&&<span style={{marginLeft:8,color:'#f47067'}}>
                    · {quoteReview.items.filter(x=>!x.accepted).length} rejected
                    {quoteReview.items.filter(x=>!x.accepted&&x.note).length>0&&
                      <span style={{color:'#25d366'}}> · 📱 {quoteReview.items.filter(x=>!x.accepted&&x.note).length} notes to send</span>}
                  </span>}
                </div>
                <div style={{display:'flex',gap:6}}>
                  <button className="b bs" onClick={()=>{setQuoteReview(null);setQuoteFile(null);}} style={{fontSize:9}}>Cancel</button>
                  <button className="b bp" onClick={applyQuoteToForm}
                    disabled={quoteReview.items.filter(x=>x.accepted).length===0}
                    style={{fontSize:10,padding:'5px 14px',background:'#4ade80',borderColor:'#4ade80',color:'#000',fontWeight:700}}>
                    ✅ Apply to PR{prf.vendor_phone&&quoteReview.items.some(x=>!x.accepted&&x.note)?' + Send WhatsApp':''}
                  </button>
                </div>
              </div>
            </div>}
          </div>}

          {/* Row 1: Firm / Requestor / Type / Urgency */}
          <div className="fg" style={{gap:6,marginBottom:6,gridTemplateColumns:"repeat(4,1fr)"}}>
            <div>
              <span style={{fontSize:7,color:"#64748b",display:"block",marginBottom:2}}>Firm *</span>
              <select className="in" value={prf.firm_code} onChange={e=>setPrf(p=>({...p,firm_code:e.target.value}))} style={{fontSize:9,padding:"3px 4px",width:"100%"}}>
                {FIRMS.map(f=><option key={f.code} value={f.code}>{f.code} — {f.name}</option>)}
              </select>
            </div>
            <div>
              <span style={{fontSize:7,color:"#64748b",display:"block",marginBottom:2}}>Requested By *</span>
              <select className="in" value={prf.requestor} onChange={e=>setPrf(p=>({...p,requestor:e.target.value}))} style={{fontSize:9,padding:"3px 4px",width:"100%"}}>
                <option value="">Select...</option>
                {PR_REQUESTORS.map(r=><option key={r} value={r}>{r}</option>)}
              </select>
            </div>
            <div>
              <span style={{fontSize:7,color:"#64748b",display:"block",marginBottom:2}}>Type</span>
              <select className="in" value={prf.request_type} onChange={e=>setPrf(p=>({...p,request_type:e.target.value,vendor_id:'',vendor_name:''}))} style={{fontSize:9,padding:"3px 4px",width:"100%"}}>
                <option>Material</option><option>Outsource</option><option>Mixed</option>
              </select>
            </div>
            <div>
              <span style={{fontSize:7,color:"#64748b",display:"block",marginBottom:2}}>Urgency</span>
              <select className="in" value={prf.urgency} onChange={e=>setPrf(p=>({...p,urgency:e.target.value}))} style={{fontSize:9,padding:"3px 4px",width:"100%",color:prf.urgency==='Urgent'?'#f47067':prf.urgency==='Scheduled'?'#06b6d4':'inherit'}}>
                {PR_URGENCY.map(u=><option key={u} value={u}>{u}</option>)}
              </select>
            </div>
          </div>

          {/* Row 2: Vendor selector + Add Vendor */}
          <div style={{marginBottom:6}}>
            <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:2}}>
              <span style={{fontSize:7,color:"#64748b"}}>Vendor *</span>
              <button style={{background:"none",border:"none",color:"#f59e0b",cursor:"pointer",fontSize:8,padding:0}} onClick={()=>{setShowAddVendor(!showAddVendor);}}>+ Add New Vendor</button>
            </div>
            <div style={{display:"flex",gap:4,alignItems:"center"}}>
              <select className="in" value={prf.vendor_id} onChange={e=>selectVendor(e.target.value)} style={{fontSize:9,padding:"3px 4px",flex:1}}>
                <option value="">Select vendor...</option>
                {filteredVendors.map(v=><option key={v.id} value={v.id}>{v.name}{v.category==='Both'?' (M+OS)':''}</option>)}
              </select>
              {prf.vendor_name&&<span style={{fontSize:8,color:"#4ade80",whiteSpace:"nowrap"}}>✓ {prf.vendor_name}</span>}
            </div>
            {prf.vendor_gstin&&<span style={{fontSize:7,color:"#64748b"}}>GSTIN: {prf.vendor_gstin}</span>}
          </div>

          {/* Inline Add Vendor Modal */}
          {showAddVendor&&<div style={{background:"#060810",border:"1px solid #f59e0b33",borderRadius:6,padding:8,marginBottom:8}}>
            <p style={{fontSize:8,fontWeight:700,color:"#f59e0b",marginBottom:6}}>+ NEW VENDOR</p>
            <div className="fg" style={{gap:4,marginBottom:4,gridTemplateColumns:"repeat(3,1fr)"}}>
              <div><span style={{fontSize:7,color:"#64748b",display:"block",marginBottom:1}}>Name *</span><input className="in" value={avf.name} onChange={e=>setAvf(p=>({...p,name:e.target.value}))} placeholder="Vendor / Supplier name" style={{fontSize:9,padding:"3px 4px",width:"100%"}}/></div>
              <div><span style={{fontSize:7,color:"#64748b",display:"block",marginBottom:1}}>Category</span><select className="in" value={avf.category} onChange={e=>setAvf(p=>({...p,category:e.target.value}))} style={{fontSize:9,padding:"3px 4px",width:"100%"}}><option>Material</option><option>Outsource</option><option>Both</option></select></div>

                    return {...it,unit_mode:v,area:newArea,size:sizeStr};
                  })}));
                };
                // When W/H/Qty change, also refresh area + size

                    const sizeStr=um2.needsWH&&(merged.width||merged.height)?`${merged.width||''}×${merged.height||''} ${um2.dimUnit||''}`.trim():'';

                  <td><input className="in mn" type="number" min="0" value={x.rate} onChange={e=>updItem(xi,'rate',e.target.value)} style={{fontSize:9,padding:"2px 4px",width:"100%"}}/></td>
                  <td><select className="in" value={x.gst_pct} onChange={e=>updItem(xi,'gst_pct',+e.target.value)} style={{fontSize:8,padding:"2px 3px",width:"100%",color:x.gst_pct===0?'#64748b':'inherit'}}>{PR_GST.map(g=><option key={g} value={g}>{g}%</option>)}</select></td>
                  <td style={{fontSize:9,color:"#e3a008",fontWeight:700,textAlign:"right",paddingRight:4}}>
                    <span style={{display:"block"}}>₹{lineAmt.toFixed(0)}</span>
                    {area>0&&<span style={{fontSize:7,color:"#64748b",display:"block"}}>{um.displayFn(area)}</span>}
                    {x.gst_pct>0&&<span style={{fontSize:7,color:"#64748b"}}>+₹{lineGst.toFixed(0)} GST</span>}
                  </td>
                  <td>{prf.items.length>1&&<button style={{background:"none",border:"none",color:"#f47067",cursor:"pointer",fontSize:10,padding:0}} onClick={()=>delItem(xi)}>✕</button>}</td>
                </tr>;
              })}</tbody>
            </table>
          </div>

          {/* Footer: Add Line + Transport + Totals + Submit */}
          <div style={{display:"flex",gap:8,alignItems:"flex-start",flexWrap:"wrap"}}>
            <button className="b bs" onClick={addItem} style={{fontSize:8,color:"#f59e0b",borderColor:"#f59e0b",padding:"3px 8px"}}>+ Add Line</button>
            <div style={{display:"flex",alignItems:"center",gap:4}}>
              <span style={{fontSize:8,color:"#64748b"}}>Transport ₹</span>
              <input className="in mn" type="number" min="0" value={prf.transport} onChange={e=>setPrf(p=>({...p,transport:e.target.value}))} style={{fontSize:9,padding:"2px 4px",width:70}}/>
              <span style={{fontSize:8,color:"#64748b"}}>GST</span>
              <select className="in" value={prf.transport_gst_pct||0} onChange={e=>setPrf(p=>({...p,transport_gst_pct:+e.target.value}))} style={{fontSize:9,padding:"2px 3px",width:52}}>
                {[0,5,12,18].map(g=><option key={g} value={g}>{g}%</option>)}
              </select>
            </div>
            <span style={{flex:1}}/>
            <div style={{textAlign:"right",fontSize:9}}>
              <div style={{color:"#64748b"}}>Subtotal: <strong style={{color:"#c9d1d9"}}>₹{totals.subtotal.toFixed(0)}</strong></div>
              <div style={{color:"#64748b"}}>GST: <strong style={{color:"#c9d1d9"}}>₹{totals.gst_total.toFixed(0)}</strong></div>
              {(+prf.transport>0)&&<div style={{color:"#64748b"}}>Transport: <strong style={{color:"#c9d1d9"}}>₹{(+prf.transport).toFixed(0)}</strong></div>}
              {(+totals.transport_gst>0)&&<div style={{color:"#64748b"}}>Transport GST: <strong style={{color:"#c9d1d9"}}>₹{totals.transport_gst.toFixed(0)}</strong></div>}
              <div style={{display:"flex",alignItems:"center",gap:4,justifyContent:"flex-end",marginTop:2}}>
                <span style={{fontSize:8,color:"#64748b"}}>Round Off ₹</span>
                <input className="in mn" type="number" step="0.01" value={prf.round_off||0} onChange={e=>setPrf(p=>({...p,round_off:e.target.value}))} style={{fontSize:9,padding:"2px 4px",width:60,textAlign:"right"}}/>
                <button className="b bs" type="button" title="Auto round total to nearest ₹1" onClick={()=>{const t=totals.total;const rounded=Math.round(t);setPrf(p=>({...p,round_off:+(rounded-t).toFixed(2)}));}} style={{fontSize:8,padding:"2px 5px"}}>↪ Round</button>
              </div>
              <div style={{fontSize:11,fontWeight:800,color:"#e3a008"}}>Total: ₹{(totals.total + (+prf.round_off||0)).toFixed(2)}</div>
            </div>
            <button className="b bp" onClick={savePR} disabled={saving} style={{fontSize:10,padding:"5px 16px",background:"#f59e0b",borderColor:"#f59e0b",color:"#000",fontWeight:700,alignSelf:"flex-end"}}>{saving?'Saving...':'📋 Submit PR'}</button>
          </div>
        </div>}
      </div>;
    })()}
    {(j.batches||[]).map((b,bi)=><div key={b.id} className="c" style={{padding:0,overflow:"hidden"}}>
      <div style={{padding:"5px 8px",borderBottom:"1px solid #1a2030",background:"#0a0f1a"}}>

          <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
            <span style={{fontSize:10}}><strong style={{color:"#e3a008"}}>Batch {bi+1}</strong> · {b.date} · {b.note}</span>
            {b.client_po_number&&<span className="mn" style={{fontSize:8,color:"#3b82f6"}}>C-PO:{b.client_po_number}</span>}

            <button style={{background:"#10b98122",border:"1px solid #10b981",borderRadius:4,color:"#10b981",cursor:"pointer",fontSize:8,padding:"1px 6px",fontWeight:700}} title="Generate Delivery Challan" onClick={()=>openDCForm(b)}>🚚 DC</button>

            const wb=XLSX.read(buf,{type:'array'});
            const batchesWithItems=[];
            const skipReasons=[];
            // Helper: is this cell "empty" for our purposes? Treats #REF!/#N/A/#VALUE! as empty
            const isErrCell=(v)=>{const s=String(v||'').trim();return /^#(REF|N\/A|VALUE|NAME|DIV|NULL|NUM)/i.test(s);};
            const cleanCell=(v)=>isErrCell(v)?'':v;
            for(const sName of wb.SheetNames){
              const ws=wb.Sheets[sName];
              const rawData=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
              if(!rawData||rawData.length<2){skipReasons.push(sName+': sheet too short');continue;}
              // Strip #REF!/#N/A/etc. errors throughout — they'll otherwise pollute Sr-column scans
              const data=rawData.map(row=>row.map(cleanCell));
              // Find header row — accept many synonyms
              const SR_RE=/(^|\s)(sr\.?\s*no|sl\.?\s*no|s\.?\s*no|s\.?\s*r)\b/;
              const DESC_RE=/(description|particular|job\s*desc|item\s*\/?\s*internal|item\s*name|^item$|^internal$|^name$|client\s*name|^client$)/;
              const SIZE_RE=/(^w$|^h$|width|height|size|sqft|sq\.?\s*ft|qty|quantit|rate)/;
              let hRow=-1;
              for(let i=0;i<Math.min(25,data.length);i++){
                const cells=data[i].map(c=>String(c||'').toLowerCase().trim());
                const txt=' '+cells.join(' | ')+' ';
                const hasSr=SR_RE.test(txt)||cells.some(c=>/^(sr\.?\s*no|sl\.?\s*no|s\.?\s*no)$/.test(c));
                const hasDesc=DESC_RE.test(txt);
                const hasSize=SIZE_RE.test(txt);
                if(hasSr&&hasDesc){hRow=i;break;}
                if(hasDesc&&hasSize){hRow=i;break;}
              }
              if(hRow<0){skipReasons.push(sName+': no header row found (need Sr No + Description, or Description + Qty/Size)');continue;}
              const headers=data[hRow].map(c=>String(c||'').toLowerCase().trim());
              // Sub-header row may have W / H labels
              const subRow=hRow+1<data.length?data[hRow+1].map(c=>String(c||'').toLowerCase().trim()):[];
              const hasSubHeader=subRow.some(c=>/^[wh]$/.test(c))&&!subRow.some(c=>/^\d+$/.test(c));
              const dataStart=hasSubHeader?hRow+2:hRow+1;
              
              const findCol=(patterns)=>{for(const p of patterns){const idx=headers.findIndex(c=>p.test(c));if(idx>=0)return idx;}return -1;};
              // Description: try strong matches first, then fall back to item/internal/name aliases
              let cDesc=findCol([/job\s*desc|description|particular/]);
              if(cDesc<0)cDesc=findCol([/item\s*\/?\s*internal|item\s*name|^item$|^internal$|client\s*name|^client$|^name$/]);
              const cQty=findCol([/^qty$|^qty\s|quantit/]);
              const cRate=findCol([/rate\s*sqft|supply.*rate|^rate$|rate\s*\(/]);
              const cTotal=findCol([/^total$|total\s*amount|^total amount$|^amount$/]);
              const cGst=findCol([/gst\s*amt|gst\s*amount|^gst$/]);
              const cMedia=findCol([/media|material|spec/]);
              const cSqft=findCol([/^sqft$|sq\.?\s*ft/]);
              // W/H detection: sub-header → header → "size in foot/inch" combo column
              let cW=subRow.indexOf('w');if(cW<0)cW=findCol([/^w$/,/width/]);
              let cH=subRow.indexOf('h');if(cH<0)cH=findCol([/^h$/,/height/]);
              if(cW<0){const sizeCol=findCol([/size.*foot|size.*inch|size.*mm|size.*in/]);if(sizeCol>=0){cW=sizeCol;cH=sizeCol+1;}}
              // Detect dim unit from header text: default INCH (most BOQs use inches), override on FT/MM hints
              let dimUnit='INCH';
              const hdrTxt=headers.join(' ')+' '+subRow.join(' ');
              if(/\bft\b|foot|feet/.test(hdrTxt))dimUnit='FOOT';
              else if(/\bmm\b|millim/.test(hdrTxt))dimUnit='MM';
              
              // Extract metadata from rows above header
              let poNum='',delivAddr='';
              for(let i=0;i<hRow;i++){
                const k=String(data[i][0]||'').toLowerCase().trim();
                const v=String(data[i][1]||'').trim();
                if(/po\s*number|po\s*no/.test(k))poNum=v;
                if(/delivery\s*address/.test(k))delivAddr=v;
              }
              
              const lineItems=[];
              const batchId="B"+uid();
              for(let r=dataStart;r<data.length;r++){
                const row=data[r];
                const srVal=String(row[0]||'').trim();
                // Skip total/summary/terms rows
                if(/^(total|sub\s*total|gst|terms|note|nan|basic|eastimate|estimate|general|grand)/i.test(srVal))continue;
                
                const desc=cDesc>=0?String(row[cDesc]||'').trim():'';
                // Need either a numeric sr# OR a non-empty description; skip otherwise
                const isNumSr=/^\d+$/.test(srVal);
                if(!desc&&!isNumSr)continue;
                if(!desc&&!srVal)continue;
                
                const qty=cQty>=0?(+row[cQty]||0):1;
                // Allow qty=0 rows? No — BOQ items always have qty. But default to 1 if column missing.
                const effectiveQty=cQty>=0?qty:1;
                if(cQty>=0&&qty<=0)continue;
                const rate=cRate>=0?(+row[cRate]||0):0;
                const total=cTotal>=0?(+row[cTotal]||0):0;
                const gst=cGst>=0?(+row[cGst]||0):0;
                const sqftVal=cSqft>=0?(+row[cSqft]||0):0;
                const w=cW>=0?String(row[cW]||'').trim():'';
                const h=cH>=0?String(row[cH]||'').trim():'';
                const media=cMedia>=0?String(row[cMedia]||'').slice(0,150):'';
                // SqFt calc respects dim unit: if INCH, divide by 144; if MM, divide by 92903.04; if FOOT, multiply directly
                const wn=+w||0,hn=+h||0;
                let calcSqft=sqftVal;
                if(!calcSqft&&wn&&hn){
                  if(dimUnit==='INCH')calcSqft=(wn*hn*effectiveQty)/144;
                  else if(dimUnit==='MM')calcSqft=(wn*hn*effectiveQty)/92903.04;
                  else calcSqft=wn*hn*effectiveQty; // FOOT
                }
                
                lineItems.push({id:"LI"+uid(),batch_id:batchId,job_id:j.id,sr:lineItems.length+1,product_id:"",
                  internal_name:(desc||srVal).slice(0,150),client_name:(desc||srVal).slice(0,150),media,
                  width:w,height:h,size_unit:dimUnit,qty:effectiveQty,rate_mode:calcSqft?'SqFt (INCH)':'UNIT',rate,
                  sqft:Math.round(calcSqft*100)/100,
                  total:total||Math.round(calcSqft*rate*100)/100,gst,gstPct:18,
                  amount:total&&gst?Math.round((total+gst)*100)/100:Math.round((total||calcSqft*rate)*1.18*100)/100||0,
                  area:'In-house',dept_estimate:false,dept_design:false,dept_production:false,dept_printing:false,
                  dept_fabrication:false,dept_dispatch:false,dept_installation:false,dept_accounts:false});
              }
              if(lineItems.length===0){skipReasons.push(sName+': header found but no valid item rows below it');continue;}
              batchesWithItems.push({
                batch:{id:batchId,job_id:j.id,date:td(),note:sName+(poNum?' | PO:'+poNum:'')+(delivAddr?' | '+delivAddr.slice(0,50):''),bill_no:"",status:"New"},
                items:lineItems
              });
            }
            if(batchesWithItems.length>0){
              const imported=await importBatches(batchesWithItems);
              const totItems=batchesWithItems.reduce((s,b)=>s+b.items.length,0);
              const skipMsg=skipReasons.length>0?' ('+skipReasons.length+' sheet(s) skipped)':'';
              show("✅ "+imported+" batch(es), "+totItems+" items imported"+skipMsg+". Close & reopen to see.",true);
              if(skipReasons.length>0)console.log('[BOQ Import] Skipped sheets:',skipReasons);
            } else {
              const detail=skipReasons.length>0?' Reasons: '+skipReasons.join(' • '):' Check that sheets have Sr No + Description columns.';
              show("⚠️ No valid sheets found."+detail,false);
            }
          }catch(ex){show("Import error: "+ex.message,false);}
        }}/>
      </label>
    </div>}

            const psHtml=`<html><head><title>Production Sheet ${j.id}</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;padding:20px;color:#222;font-size:11px}h1{font-size:16px;margin-bottom:2px}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid #999;padding:4px 6px;font-size:10px;text-align:left}th{background:#e8e8e8;font-weight:600}td.r{text-align:right;font-family:monospace}td img{max-width:70px;max-height:70px;border-radius:3px;border:1px solid #ccc}.hdr{display:flex;justify-content:space-between;margin-bottom:12px;border-bottom:2px solid #333;padding-bottom:8px}.meta{display:grid;grid-template-columns:120px 1fr;gap:2px 8px;font-size:11px;margin-bottom:12px}.meta b{color:#333}.total{background:#f0f0f0;font-weight:700}.batch-hdr{background:#333;color:#fff;padding:4px 8px;font-size:10px;font-weight:700;margin-top:12px}.refs{margin-top:16px}.refs img{max-width:250px;max-height:250px;border:1px solid #ccc;border-radius:4px;margin:6px}@media print{body{padding:10px}}</style></head><body>`+

              selBatches.map((b,bi)=>{const bItems=(b.items||[]);if(!bItems.length)return '';const hasImg=bItems.some(it=>it.img_url);
                return `<div class="batch-hdr">Batch ${bi+1} · ${b.date||''} · ${b.note||''}</div>`+
                  `<table><thead><tr><th>#</th><th>Description</th>${hasImg?'<th>Image</th>':''}<th>Material / Media Make</th><th>Size (W×H)</th><th>Unit</th><th>Qty</th><th>SqFt</th><th>Machine</th></tr></thead><tbody>`+

                  `</tbody></table>`;}).join('')+
              `<table style="margin-top:8px"><tr class="total"><td colspan="5" style="text-align:right"><b>GRAND TOTAL</b></td><td class="r"><b>${totQty}</b></td><td class="r"><b>${totSqft}</b></td><td></td></tr></table>`+
              (()=>{const allImgs=selItems.filter(it=>it.img_url);const designRefs=Array.isArray(j.design_ref_urls)?j.design_ref_urls:[];return allImgs.length>0||designRefs.length>0?'<div class="refs"><h3 style="font-size:12px;margin-bottom:8px;border-bottom:1px solid #999;padding-bottom:4px">Artwork / Design References</h3><div style="display:flex;flex-wrap:wrap;gap:10px">'+allImgs.map((it,i)=>'<div style="text-align:center"><img src="'+it.img_url+'"/><p style="font-size:9px;font-weight:600;margin-top:2px">'+(it.internal_name||'Item '+(i+1))+'</p></div>').join('')+designRefs.map((u,i)=>'<div style="text-align:center"><img src="'+u+'" style="max-width:250px"/><p style="font-size:9px">Ref '+(i+1)+'</p></div>').join('')+'</div></div>':'';})() +
              `<div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;font-size:10px;color:#666"><div style="border-top:1px solid #999;padding-top:4px">Prepared By</div><div style="border-top:1px solid #999;padding-top:4px">Production Head</div><div style="border-top:1px solid #999;padding-top:4px">Approved By</div></div></body></html>`;
            const w=window.open('','_blank');w.document.write(psHtml);w.document.close();w.print();
          }
          setPdfMode(null);
        }} style={{fontSize:11}}>🖨️ Export {pdfMode==='estimate'?'Estimate':'Production Sheet'}</button>
      </div>
    </div>}

    {/* DELIVERY CHALLAN FORM MODAL */}
    {dcMode&&(()=>{const batch=(j.batches||[]).find(b=>b.id===dcMode);if(!batch)return null;const firm=firms.find(f=>f.code===(j.firm||'JXT'))||{};
      return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:20,overflowY:"auto"}} onClick={()=>setDcMode(null)}>
        <div style={{background:"#0c1017",border:"1px solid #10b981",borderRadius:10,width:"100%",maxWidth:700,padding:16,maxHeight:"calc(100vh - 40px)",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <h3 style={{fontSize:13,fontWeight:700,color:"#10b981"}}>🚚 Generate Delivery Challan — Batch: {batch.note||batch.id}</h3>
            <button className="b bs" onClick={()=>setDcMode(null)}>✕</button>

            <p style={{color:"#8b949e",fontSize:9}}>{firm.address}</p>

          <div className="fg f2" style={{gap:6}}>
            <div style={{gridColumn:"span 2"}}><label style={{fontSize:8,color:"#64748b"}}>To (Customer Name / Billing Name) *</label><input className="in" value={dcForm.to_name} onChange={e=>setDcForm(p=>({...p,to_name:e.target.value}))} style={{fontSize:10}}/></div>
            <div style={{gridColumn:"span 2"}}><label style={{fontSize:8,color:"#64748b"}}>Delivery Address</label><textarea className="in" value={dcForm.to_address} onChange={e=>setDcForm(p=>({...p,to_address:e.target.value}))} style={{fontSize:10,minHeight:55,resize:"vertical",fontFamily:"inherit",lineHeight:1.4,width:"100%"}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>Job #</label><input className="in mn" value={j.id} readOnly style={{fontSize:10,color:"#e3a008"}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>Delivery Note</label><input className="in" value={dcForm.delivery_note} onChange={e=>setDcForm(p=>({...p,delivery_note:e.target.value}))} style={{fontSize:10}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>Date</label><input className="in" type="date" value={dcForm.dc_date} onChange={e=>setDcForm(p=>({...p,dc_date:e.target.value}))} style={{fontSize:10}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>PO. No</label><input className="in mn" value={dcForm.po_no} onChange={e=>setDcForm(p=>({...p,po_no:e.target.value}))} style={{fontSize:10}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>PO Date</label><input className="in" type="date" value={dcForm.po_date} onChange={e=>setDcForm(p=>({...p,po_date:e.target.value}))} style={{fontSize:10}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>Prepared By</label><input className="in" value={dcForm.prepared_by} onChange={e=>setDcForm(p=>({...p,prepared_by:e.target.value}))} style={{fontSize:10}}/></div>
            <div><label style={{fontSize:8,color:"#64748b"}}>Delivered By</label><input className="in" value={dcForm.delivered_by} onChange={e=>setDcForm(p=>({...p,delivered_by:e.target.value}))} placeholder="Delivery person name" style={{fontSize:10}}/></div>
          </div>
          <div style={{marginTop:10,padding:8,background:"#060810",border:"1px solid #1a2030",borderRadius:6}}>
            {(()=>{
              const allItems=batch.items||[];
              const selSet=dcSelectedItems===null?new Set(allItems.map(x=>x.id)):dcSelectedItems;
              const selCount=dcSelectedItems===null?allItems.length:dcSelectedItems.size;
              const toggleItem=(id)=>{
                const current=dcSelectedItems===null?new Set(allItems.map(x=>x.id)):new Set(dcSelectedItems);
                if(current.has(id)) current.delete(id); else current.add(id);
                setDcSelectedItems(current.size===allItems.length?null:new Set(current));
              };
              const toggleAll=()=>setDcSelectedItems(dcSelectedItems===null?new Set():null);
              return <>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                  <p style={{fontSize:9,color:'#10b981',fontWeight:700}}>
                    ITEMS TO BE INCLUDED
                    <span style={{marginLeft:6,color:selCount<allItems.length?'#f59e0b':'#10b981'}}>
                      ({selCount} of {allItems.length} selected{selCount<allItems.length?' — PARTIAL DC':''})
                    </span>
                  </p>
                  <button onClick={toggleAll} style={{fontSize:8,padding:'2px 8px',background:'transparent',border:'1px solid #1a2030',borderRadius:4,color:'#64748b',cursor:'pointer'}}>
                    {dcSelectedItems===null?'Deselect All':'Select All'}
                  </button>
                </div>
                <div style={{fontSize:9,color:'#8b949e',maxHeight:160,overflowY:'auto'}}>
                  {allItems.map((it,i)=>{
                    const checked=selSet.has(it.id);
                    return <div key={it.id}
                      onClick={()=>toggleItem(it.id)}
                      style={{display:'flex',alignItems:'center',gap:8,padding:'5px 6px',borderBottom:'1px solid #1a2030',cursor:'pointer',background:checked?'rgba(16,185,129,0.05)':'transparent',borderRadius:3,transition:'background 0.1s'}}>
                      <div style={{width:14,height:14,borderRadius:3,border:'1.5px solid '+(checked?'#10b981':'#475569'),background:checked?'#10b981':'transparent',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                        {checked&&<span style={{color:'#000',fontSize:9,fontWeight:900,lineHeight:1}}>✓</span>}
                      </div>
                      <span style={{flex:1,color:checked?'#e2e8f0':'#64748b',textDecoration:checked?'none':'line-through'}}>
                        {i+1}. {it.internal_name||it.client_name}
                        {it.width&&it.height?' — '+it.width+'×'+it.height+(it.size_unit?''+it.size_unit:''):''}
                        <span style={{color:'#64748b',marginLeft:4}}>× {it.qty}</span>
                      </span>
                    </div>;
                  })}
                </div>
                {selCount===0&&<div style={{fontSize:9,color:'#f47067',marginTop:6,padding:'4px 6px',background:'rgba(244,112,103,0.08)',borderRadius:4}}>⚠️ No items selected — select at least 1 item to generate DC</div>}
              </>;
            })()}
          </div>
          <div style={{display:"flex",gap:6,marginTop:12,justifyContent:"flex-end"}}>
            <button className="b" onClick={()=>setDcMode(null)}>Cancel</button>
            {(()=>{const cnt=dcSelectedItems===null?(batch.items||[]).length:(dcSelectedItems?.size||0);return <button className="b bp" onClick={()=>{if(cnt===0){show('Select at least 1 item',false);return;}saveAndPrintDC(batch);}} style={{background:cnt===0?'#374151':'#10b981',borderColor:cnt===0?'#374151':'#10b981',fontSize:11,padding:'6px 16px',opacity:cnt===0?0.6:1}}>🖨️ Save & Print DC ({cnt} item{cnt!==1?'s':''}, 3 Copies)</button>;})()}
          </div>
        </div>
      </div>;
    })()}

  </div>;
}

function NewJobPage({firms,clients,products,team,machines,createJob,addNewClient,addNewProduct,sp,jobs,user}){
  const [fm,sfm]=useState("JXT");
  const [f,sF]=useState({cl:"",cn:"",cp:"",cph:"",cemail:"",po:"",da:"",ba:"",pr:"",rd:td(),mb:team[0]?.name||"",pt:"50% Advance. Rest within 30 days.",remark:"",cgst:"",bname:""});
  const [su,sSu]=useState("INCH");
  const [showNewCli,setShowNewCli]=useState(false);
  const [nc,setNc]=useState({name:"",contact:"",phone:"",email:"",gst:"",billing_name:""});
  const [poFile,setPoFile]=useState(null);
  const [designFiles,setDesignFiles]=useState([]);
  const [submitting,setSubmitting]=useState(false);
  const [syncBankingNJ,setSyncBankingNJ]=useState(false);
  const [bankProjectNJ,setBankProjectNJ]=useState('');
  const NJ_BANK_PROJECTS=['NCR SBI BRANDING','NCR SBI GSB','NCR PNB GSB','NCR BOB GSB','CMS SBI GSB+LOLLIPOP','CMS SBI BRANDING','CMS BOB GSB+BRANDING','Diebold HDFC GSB'];
  const NJ_BANK_MAP={'NCR SBI BRANDING':['NCR','SBI'],'NCR SBI GSB':['NCR','SBI'],'NCR PNB GSB':['NCR','PNB'],'NCR BOB GSB':['NCR','BOB'],'CMS SBI GSB+LOLLIPOP':['CMS','SBI'],'CMS SBI BRANDING':['CMS','SBI'],'CMS BOB GSB+BRANDING':['CMS','BOB'],'Diebold HDFC GSB':['Diebold','HDFC']};
  const MACH_OPT=["In-house",...(machines||[]).map(m=>m.name),"Outsource"];
  const [its,sIts]=useState([{id:uid(),sr:1,pi:0,int:products[0]?.internal_name||"",cli:products[0]?.client_name||"",m:"",w:"",h:"",qty:1,rm:"SqFt (INCH)",rate:"",sqft:0,tot:0,gst:0,amt:0,gstPct:18,mach:"In-house",imgUrl:""}]);

  const selC=cid=>{const c=clients.find(x=>x.id===cid);if(c)sF(p=>({...p,cl:cid,cn:c.name,cp:c.contact,cph:c.phone,cemail:c.email||p.cemail,cgst:c.gst||'',bname:c.billing_name||c.name}));};
  const doAddCli=async()=>{if(!nc.name.trim())return;const cid="CL"+uid();const cd={id:cid,name:nc.name.trim(),contact:nc.contact,phone:nc.phone,email:nc.email,gst:nc.gst,billing_name:nc.billing_name||nc.name.trim()};const ok=await addNewClient(cd);if(ok){clients.push(cd);sF(p=>({...p,cl:cid,cn:nc.name.trim(),cp:nc.contact,cph:nc.phone,cemail:nc.email,cgst:nc.gst||'',bname:nc.billing_name||nc.name.trim()}));setNc({name:"",contact:"",phone:"",email:"",gst:"",billing_name:""});setShowNewCli(false);}};
  const selP=(i,pi)=>{const pm=products[pi];if(pm)sIts(p=>{const n=[...p];n[i]={...n[i],pi,int:pm.internal_name,cli:pm.client_name};return n;});};
  const GST_OPTS=[0,5,12,18,28];
  const uI=(i,k,v)=>{sIts(p=>{const n=[...p];const it={...n[i],[k]:v};const w=+it.w||0,h=+it.h||0,q=+it.qty||1,r=+it.rate||0;const gp=(it.gstPct===''||it.gstPct==null)?18:+it.gstPct;const um=getUnitMode(it.rm);it.sqft=um.areaFn(w,h,q);it.tot=um.totalFn(it.sqft,q,r);it.gst=Math.round(it.tot*(gp/100)*100)/100;it.amt=Math.round((it.tot+it.gst)*100)/100;n[i]=it;return n;});};
  const aI=()=>sIts(p=>{const lastRm=p[p.length-1]?.rm||"SqFt (INCH)";return [...p,{id:uid(),sr:p.length+1,pi:0,int:products[0]?.internal_name||"",cli:products[0]?.client_name||"",m:"",w:"",h:"",qty:1,rm:lastRm,rate:"",sqft:0,tot:0,gst:0,amt:0,gstPct:18,mach:"In-house",imgUrl:""}];});
  const rI=i=>sIts(p=>p.filter((_,x)=>x!==i).map((it,x)=>({...it,sr:x+1})));
  const tot=useMemo(()=>{const s=Math.round(its.reduce((a,x)=>a+x.tot,0)*100)/100,g=Math.round(its.reduce((a,x)=>a+x.gst,0)*100)/100,tq=its.reduce((a,x)=>a+(+x.qty||0),0),tsq=Math.round(its.reduce((a,x)=>a+(+x.sqft||0),0)*100)/100;return {s,g,t:Math.round((s+g)*100)/100,tq,tsq};},[its]);
  
  // Sequential job numbering — FY auto-detect based on current date
  const curFY=useMemo(()=>{const n=new Date();const m=n.getMonth(),y=n.getFullYear();return m>=3?`${String(y).slice(2)}${String(y+1).slice(2)}`:`${String(y-1).slice(2)}${String(y).slice(2)}`;},[]); 
  const [dbMaxNum,setDbMaxNum]=useState(0);
  useEffect(()=>{sb.from('jobs').select('id').like('id','%-'+curFY).then(({data})=>{if(data){const nums=data.map(j=>{const p=j.id?.split('-')[0];return parseInt(p)||0;});setDbMaxNum(Math.max(0,...nums));}});},[curFY]);
  const nextNum=useMemo(()=>{
    const fyJobs=jobs.filter(j=>j.id?.includes('-'+curFY));
    const memNums=fyJobs.map(j=>{const p=j.id?.split('-')[0];return parseInt(p)||0;});
    const memMax=Math.max(0,...memNums);
    return String(Math.max(memMax,dbMaxNum)+1).padStart(4,'0');
  },[jobs,curFY,dbMaxNum]);
  const jid=`${nextNum}-${curFY}`;

  const sub=async(isDraft=false)=>{
    if(!f.cn){alert("Select client");return;}
    if(!isDraft){
      const missing=[];
      if(!f.pr.trim())missing.push("Project / Site Name");
      if(!f.cp.trim())missing.push("Contact Person");
      if(!f.cph.trim())missing.push("Contact Number");
      if(!f.da.trim())missing.push("Delivery Address");
      if(!f.cgst.trim())missing.push("Client GST Number");
      if(!f.bname.trim())missing.push("Billing Entity");
      if(missing.length>0){alert("⚠️ Please fill all mandatory fields:\n\n• "+missing.join("\n• "));return;}
      if(its.length===0){alert("Add at least one item before creating a job.");return;}
      if(!confirm(`Create Job ${jid}?\n\nClient: ${f.cn}\nProject: ${f.pr}\nBilling: ${f.bname}\nGST: ${f.cgst}\nItems: ${its.length}\n\nClick OK to proceed.`))return;
    }
    setSubmitting(true);
    const poUrl=await uploadFile(poFile,'po');
    const designUrls=designFiles.length>0?await uploadMultiple(designFiles,'design-refs'):[];
    const jobData={id:jid,firm:fm,client_id:f.cl,client_name:f.cn,project:f.pr,delivery_address:f.da,billing_address:f.ba,contact_person:f.cp,contact_no:f.cph,made_by:f.mb,po_number:f.po,billing_name:f.bname||f.cn,client_gst:f.cgst,payment_terms:f.pt,status:isDraft?"Draft":"Active",po_file_url:poUrl?[poUrl]:[],design_ref_urls:designUrls};
    const batchId="B"+uid();
    const batchData={id:batchId,job_id:jid,date:f.rd,note:"Initial",bill_no:"",status:"New"};
    const lineItems=its.map(it=>({id:"LI"+uid(),batch_id:batchId,job_id:jid,sr:it.sr,product_id:"",internal_name:it.int,client_name:it.cli,media:it.m,width:it.w,height:it.h,size_unit:getUnitMode(it.rm).dimUnit||'INCH',qty:+it.qty||1,rate_mode:it.rm,rate:+it.rate||0,sqft:it.sqft,total:it.tot,gst:it.gst,gstPct:(it.gstPct===''||it.gstPct==null)?18:+it.gstPct,amount:it.amt,area:it.mach||"In-house",dept_estimate:false,dept_design:false,dept_production:false,dept_printing:false,dept_fabrication:false,dept_dispatch:false,dept_installation:false,dept_accounts:false,img_url:it.imgUrl||""}));
    // Auto-add fallback: any typed-in material name that's not in products
    // (case-insensitive) gets promoted to the products master list, so future
    // jobs see it in the dropdown. Canonicalizes line item internal_name to
    // existing casing if a case-mismatch hit is found.
    if(typeof addNewProduct==='function' && Array.isArray(products)){
      for(const li of lineItems){
        const nm=String(li.internal_name||'').trim();
        if(!nm) continue;
        try{
          const r3=await addNewProduct(nm, li.client_name||nm, products);
          if(r3&&r3.row){
            if(r3.isNew)products.push(r3.row);
            // Canonicalize casing on the line item
            li.internal_name=r3.row.internal_name;
          }
        }catch(e){/* non-fatal */}
      }
    }
    await createJob(jobData,batchData,lineItems);
    // Sync to Banking CRM if enabled
    if(syncBankingNJ&&bankProjectNJ){
      const bm=NJ_BANK_MAP[bankProjectNJ]||['',''];
      const siteId='BS-'+Date.now()+Math.random().toString(36).slice(2,5);
      await sb.from('banking_sites').insert({id:siteId,project:bankProjectNJ,client:bm[0],bank:bm[1],job_no:jid.split('-')[0],po_number:f.po||'',atm_id:'',site_unique_id:'',site_address:f.da||'',city:'',district:'',state:'',pincode:'',vendor_name:'',vendor_contact:'',installation_status:'Pending',photo_status:'',billing_category:'',work_category:'Pending',created_at:new Date().toISOString()});
    }
    setSubmitting(false);
  };

  return <div style={{display:"flex",flexDirection:"column",gap:8,maxWidth:1100}}>
    <div style={{display:"flex",gap:4}}>{firms.map(f=><button key={f.code} className="b" onClick={()=>sfm(f.code)} style={{flex:1,padding:8,flexDirection:"column",border:`2px solid ${fm===f.code?f.color:"#1a2030"}`,background:fm===f.code?f.color+"15":"transparent"}}><span style={{fontWeight:800,color:f.color,fontSize:12}}>{f.short_name}</span><span style={{fontSize:7,color:"#64748b"}}>{f.gst}</span></button>)}</div>

      ws['!cols']=[{wch:4},{wch:30},{wch:35},{wch:8},{wch:8},{wch:6},{wch:6},{wch:10},{wch:8},{wch:10},{wch:12},{wch:6},{wch:10},{wch:12}];
      XLSX.utils.book_append_sheet(wb,ws,'Estimate '+jid);
      XLSX.writeFile(wb,'Estimate_'+jid+'_'+(f.cn||'Client').replace(/[^a-zA-Z0-9]/g,'_').slice(0,20)+'.xlsx');
    }} style={{gap:6}}>📊 Export Excel</button><button className="b" onClick={()=>sub(true)} style={{padding:"7px 14px",borderColor:"#64748b"}} disabled={submitting}>{submitting?"⏳...":"💾 Save Draft"}</button><button className="b bp" onClick={()=>sub(false)} style={{padding:"7px 18px"}} disabled={submitting}>{submitting?"⏳ Creating...":"Create "+jid}</button></div>
    <div style={{background:"#0a0f1a",border:"1px solid #1a2030",borderRadius:8,padding:8,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer"}} onClick={()=>setSyncBankingNJ(p=>!p)}>
        <div className={`ck ${syncBankingNJ?"on":""}`} style={{flexShrink:0}}>{syncBankingNJ?"✓":""}</div>
        <span style={{fontSize:10,fontWeight:700,color:syncBankingNJ?"#06b6d4":"#64748b"}}>🏦 Sync to Banking CRM</span>
      </div>
      {syncBankingNJ&&<select className="in" value={bankProjectNJ} onChange={e=>setBankProjectNJ(e.target.value)} style={{fontSize:9,padding:"3px 6px",width:200}}>
        <option value="">Select Banking Project...</option>
        {NJ_BANK_PROJECTS.map(p=><option key={p} value={p}>{p}</option>)}
      </select>}
    </div>
  </div>;
}

// DEPT TRACKER
function DeptPage({jobs,s,togDept,updateJobStatus,sm,items,osItems}){
  const ALL_ST = ALL_ST_NEW;

  // ── Designing Bulk-Reassign modal state (22 Apr 26) ────────────────────
  // Modal lets admin bulk-move "Designing - In House" jobs → "Designing - Outsource"
  // Triggered from the DESIGN card's 🔀 icon (visible only when ad === 'design').
  const [showReassignModal, setShowReassignModal] = React.useState(false);
  const [reassignSelected, setReassignSelected] = React.useState({});  // {job_id: true}
  const [reassignDirection, setReassignDirection] = React.useState('to-outsource'); // 'to-outsource' | 'to-inhouse'
  const [reassignSaving, setReassignSaving] = React.useState(false);

  // Compute dept-status for every job using the SAME hybrid logic as Banking CRM.
  // This is a reduced version of BankCRMPage.jobDeptStatus — keyed by j.id directly
  // (no jobNoPrefix split needed for Dept Tracker since it works on jobs, not sites).
  const jobLeading = React.useMemo(() => {
    const map = {};
    const itemsByJob = {};
    (items||[]).forEach(it => { if (it.job_id) (itemsByJob[it.job_id]=itemsByJob[it.job_id]||[]).push(it); });
    const osByJob = {};
    (osItems||[]).forEach(o => { if (o.job_id) (osByJob[o.job_id]=osByJob[o.job_id]||[]).push(o); });
    (jobs||[]).forEach(j => {
      const li = itemsByJob[j.id] || [];
      const os = osByJob[j.id] || [];
      // STATUS WINS: `leading` always comes from jobs.status. Card counts are predictable.
      const leading = STATUS_TO_LEADING(j.status);
      if (leading === null) return; // Draft/Quotation Sent/Cancelled/etc. don't count in production buckets
      // `all` = secondary signal: shows dept_* tick pattern and outsource_items in the Stage pill column.
      // This gives a multi-stage visual without letting ticks override the status.
      const all = [leading];
      const hasGranular = os.length > 0 || li.some(it => it.dept_design||it.dept_printing||it.dept_fabrication||it.dept_dispatch||it.dept_installation||it.dept_accounts);
      if (hasGranular && li.length > 0) {
        const anyIncomplete = (k) => li.some(it => !it[k]);
        const designA = anyIncomplete('dept_design');
        const printingA = anyIncomplete('dept_printing');
        const fabA = anyIncomplete('dept_fabrication');
        const dispA = anyIncomplete('dept_dispatch');
        const installA = anyIncomplete('dept_installation');
        const printOut = os.some(o => /print/i.test(o.task_type||'')) || li.some(it => it.area==='Outsource' && !it.dept_printing);
        const fabOut = os.some(o => /router|laser|coating|frame|signage|fabric/i.test(o.task_type||'')) || li.some(it => it.area==='Outsource' && !it.dept_fabrication);
        const printIn = printingA && li.some(it => it.area!=='Outsource' && !it.dept_printing);
        const fabIn = fabA && li.some(it => it.area!=='Outsource' && !it.dept_fabrication);
        // Extra pills beyond the leading one
        if (designA && leading !== 'design') all.push('design');
        if (printIn && leading !== 'printIn') all.push('printIn');
        if (printOut && leading !== 'printOut') all.push('printOut');
        if (fabIn && leading !== 'fabIn') all.push('fabIn');
        if (fabOut && leading !== 'fabOut') all.push('fabOut');
        if (dispA && leading !== 'delivered') all.push('delivered');
        if (!installA && leading !== 'installation') all.push('installation');
      }
      map[j.id] = {leading, source: hasGranular && li.length > 0 ? 'granular' : 'status', all};
    });
    return map;
  }, [jobs, items, osItems]);

  // Tabs — 12 buckets, 1-for-1 with STATUS_CARDS. Same colors, same labels, same order.
  // Middle 7 (isLeading) match by jobLeading rollup. Rest match by j.status directly.
  // Note: 'installation' tab additionally excludes terminal accounts/cancelled states so
  // jobs that have moved on don't double-show in both Installation and Accounts.
  const tabs = STATUS_CARDS.map(card => ({
    id: card.key,
    l: card.label,
    c: card.color,
    match: card.isLeading
      ? (card.key === 'installation'
          // 'installation' tab = only jobs still literally at 'Installation WIP' stage; any job
          // that has moved on to any accounts status, no-bill, or cancelled belongs in
          // that later bucket instead. Keeps lifecycle stages mutually exclusive so a
          // job is counted in exactly one card/tab (matches Dashboard's count too).
          ? (j) => jobLeading[j.id]?.leading === 'installation' && !STATUS_CARD_BY_KEY.accounts.statuses.includes(j.status) && !['No Bill','Cancelled'].includes(j.status)
          : (j) => jobLeading[j.id]?.leading === card.key)
      : (j) => card.statuses.includes(j.status)
  }));
  const [ad,sad]=useState(tabs[0].id);
  const cur=tabs.find(t=>t.id===ad) || tabs[0];
  const pen=useMemo(()=>jobs.filter(j=>{
    if(s && !j.id?.toLowerCase().includes(s.toLowerCase()) && !j.client_name?.toLowerCase().includes(s.toLowerCase())) return false;
    if(ad===null) return true; // No card selected → show all jobs
    return cur.match(j);
  }),[jobs,cur,s,ad,jobLeading]);

  // Card counts — derive from the SAME match functions the tabs use, so cards and
  // tabs cannot drift (fixed 18 Apr 26 — audit caught ACCOUNTS card=0 vs tab=10 and
  // INSTALLED card=11 vs tab=7 because the old walk was leading-first and put every
  // accounts-status job into the earlier-indexed INSTALLED bucket before reaching ACCOUNTS).
  const cardDefs = STATUS_CARDS.map(c => ({k:c.key, l:c.label, c:c.color}));
  const cardCounts = useMemo(() => {
    const c = Object.fromEntries(STATUS_CARDS.map(card => [card.key, 0]));
    (jobs||[]).forEach(j => {
      for (const t of tabs) {
        if (t.match(j)) { c[t.id]++; /* note: a job may satisfy multiple tab matches,
                                         but we break after the first so cards sum to
                                         jobs.length just like sequential bucketing */ break; }
      }
    });
    return c;
  }, [jobs, jobLeading, tabs]);

  // Status pill colors — covers all 22 new statuses post 22 Apr overhaul
  const sc = {
    'Draft':'#64748b','Quotation Sent':'#3b82f6','PO Pending':'#f47067','Recee':'#f59e0b',
    'Designing - In House':'#8b5cf6','Designing - Outsource':'#c084fc',
    'Printing · In-House':'#06b6d4','Printing · Outsource':'#f97316',
    'Fabrication · In-House':'#dc2626','Fabrication · Outsource':'#ea580c',
    'Delivered':'#3b82f6',
    'Installation WIP':'#059669',
    'Billing Pending':'#06b6d4','Given for Billing':'#06b6d4','Cash Pending':'#e3a008','IC Pending':'#f59e0b','DC Pending':'#f59e0b','Billing Done':'#4ade80','Cash Received':'#4ade80',
    'No Bill':'#64748b','Cancelled':'#64748b'
  };

  // Pill color for stage keys (used in multi-pill Stage column)
  const stageColor = (k) => ({design:'#8b5cf6',printIn:'#06b6d4',printOut:'#f97316',fabIn:'#06b6d4',fabOut:'#f97316',delivered:'#3b82f6',installation:'#4ade80'}[k] || '#64748b');
  const stageLabel = (k) => ({design:'Design',printIn:'P·In',printOut:'P·Out',fabIn:'F·In',fabOut:'F·Out',delivered:'Delivered',installation:'Inst WIP'}[k] || k);

  const openJob=(j)=>sm({t:`Job ${j.id} — ${j.project}`,jobId:j.id,fallback:j});

  return (
    <div style={{display:"flex",flexDirection:"column",gap:6}}>

      {/* Production Status cards row (NEW) — same 7 cards as Banking CRM */}
      <div style={{background:'#060810',border:'1px solid #1a2030',borderRadius:6,padding:'7px 10px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',margin:'0 0 5px'}}>
          <p style={{fontSize:8,color:'#64748b',textTransform:'uppercase',letterSpacing:'.05em',fontWeight:600,margin:0}}>
            🏭 Production Status — click to filter
          </p>
          {ad === 'design' && (
            <button onClick={()=>setShowReassignModal(true)} style={{background:'#8b5cf620',border:'1px solid #8b5cf655',color:'#c084fc',borderRadius:4,padding:'3px 8px',fontSize:9,fontWeight:600,cursor:'pointer'}}>
              🔀 Reassign In-House ↔ Outsource
            </button>
          )}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(90px,1fr))',gap:5}}>
          {cardDefs.map(d => {
            const active = ad === d.k;
            return (
              <div key={d.k}
                onClick={() => sad(active ? null : d.k)}
                style={{
                  background: active ? d.c+'30' : d.c+'15',
                  border: `1px solid ${active ? d.c : d.c+'55'}`,
                  borderRadius: 4,
                  padding: '6px 8px',
                  cursor: 'pointer',
                  transition: 'all 0.15s',
                }}>
                <div style={{fontSize:7,color:d.c,fontWeight:700,letterSpacing:'.03em',textTransform:'uppercase'}}>{d.l}</div>
                <div className="mn" style={{fontSize:14,color:d.c,fontWeight:700,marginTop:1}}>{(cardCounts[d.k]||0).toLocaleString('en-IN')}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Tabs — 12 buckets, fully derived from STATUS_CARDS for consistency with cards above */}
      <div style={{display:"flex",gap:2,flexWrap:"wrap"}}>
        {tabs.map(t => {
          const count = jobs.filter(t.match).length;
          return (
            <button key={t.id} className={`b bs ${ad===t.id?"bp":""}`} onClick={()=>sad(t.id)}
              style={ad!==t.id?{borderColor:t.c+"55",color:t.c}:{}}>
              {t.l} ({count})
            </button>
          );
        })}
      </div>

      {/* Job list */}
      <div className="c" style={{padding:0}}>
        <div style={{padding:"6px 8px",borderBottom:`2px solid ${ad===null?'#64748b':cur.c}`,background:"#0a0f1a",display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{fontSize:10,fontWeight:700,color:ad===null?'#94a3b8':cur.c}}>{ad===null?'All jobs':cur.l} — {pen.length} jobs</span>
          <span style={{fontSize:8,color:'#64748b'}}>{ad===null?'Click a card above to filter':'Granular rollup first · falls back to jobs.status'}</span>
        </div>
        <div style={{overflowX:"auto",maxHeight:"calc(100vh-200px)"}}>
          <table>
            <thead><tr>
              <th>Job</th><th>Date</th><th>Client</th><th>Product</th>
              <th>Source</th><th>Stage</th>
              <th>Status</th><th>Project</th><th>Contact</th><th>Change Status</th>
            </tr></thead>
            <tbody>
              {pen.map((j,i) => {
                const it = (j.batches||[])[0]?.items?.[0];
                const dt = j.created_at ? new Date(j.created_at) : null;
                const ds = dt ? dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) : '';
                const jl = jobLeading[j.id];
                return (
                  <tr key={i}>
                    <td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700,cursor:"pointer",textDecoration:"underline",textDecorationColor:"#e3a00844"}} onClick={()=>openJob(j)}>
                      <StatusTip j={j}>{j.id}</StatusTip>
                    </td>
                    <td style={{fontSize:8,color:"#64748b",whiteSpace:"nowrap"}}>{ds}</td>
                    <td style={{fontSize:10}}>{j.client_name?.slice(0,22)}</td>
                    <td style={{fontSize:10,fontWeight:600}}>{it?.internal_name||''}</td>
                    <td>{jl ? (
                      <span className="bd" style={{background:(jl.source==='granular'?'#4ade80':'#e3a008')+'20',color:jl.source==='granular'?'#4ade80':'#e3a008',fontSize:7}}>
                        {jl.source}
                      </span>
                    ) : <span style={{fontSize:8,color:'#475569'}}>—</span>}</td>
                    <td style={{whiteSpace:'nowrap'}}>{jl && jl.all && jl.all.length > 0 ? (
                      <span style={{display:'inline-flex',gap:2,flexWrap:'wrap'}}>
                        {jl.all.map((k,i) => (
                          <span key={i} className="bd" style={{background:stageColor(k)+'20',color:stageColor(k),fontSize:7,fontWeight:700,padding:'1px 4px'}}>
                            {stageLabel(k)}
                          </span>
                        ))}
                      </span>
                    ) : <span style={{fontSize:8,color:'#475569'}}>—</span>}</td>
                    <td>
                      <StatusTip j={j}>
                        <span className="bd" style={{background:(sc[j.status]||'#64748b')+'20',color:sc[j.status]||'#64748b'}}>{j.status}</span>
                      </StatusTip>
                    </td>
                    <td style={{fontSize:10,color:"#64748b"}}>{j.project?.slice(0,22)}</td>
                    <td style={{fontSize:10}}>{j.contact_person}</td>
                    <td>
                      <select className="in" defaultValue="" onChange={e=>{
                        const ns = e.target.value;
                        if (!ns) return;
                        if (confirm('Change "'+j.id+'" from "'+j.status+'" to "'+ns+'"?')) { updateJobStatus(j.id, ns); }
                        e.target.value = '';
                      }} style={{fontSize:9,padding:"2px 4px",width:130}}>
                        <option value="">Change →</option>
                        {renderStatusOptions(j.status)}
                      </select>
                    </td>
                  </tr>
                );
              })}
              {pen.length === 0 && (
                <tr><td colSpan={10} style={{textAlign:"center",color:"#4ade80",padding:20}}>🎉 All done!</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      {/* ── Designing Bulk-Reassign Modal (22 Apr 26) ───────────────────── */}
      {showReassignModal && (()=>{
        const srcStatus = reassignDirection === 'to-outsource' ? 'Designing - In House' : 'Designing - Outsource';
        const tgtStatus = reassignDirection === 'to-outsource' ? 'Designing - Outsource' : 'Designing - In House';
        const eligible = (jobs||[]).filter(j => j.status === srcStatus);
        const selectedIds = Object.keys(reassignSelected).filter(id => reassignSelected[id]);
        const toggleAll = () => {
          if (selectedIds.length === eligible.length) {
            setReassignSelected({});
          } else {
            const all = {};
            eligible.forEach(j => { all[j.id] = true; });
            setReassignSelected(all);
          }
        };
        const toggle = (id) => setReassignSelected(p => ({...p, [id]: !p[id]}));
        const doBulkMove = async () => {
          if (selectedIds.length === 0) return;
          if (!confirm(`Move ${selectedIds.length} job(s) from "${srcStatus}" to "${tgtStatus}"?\n\nThis updates the jobs directly in the database.`)) return;
          setReassignSaving(true);
          let ok = 0, fail = 0;
          for (const id of selectedIds) {
            const {error} = await sb.from('jobs').update({status: tgtStatus}).eq('id', id);
            if (error) fail++; else { ok++; updateJobStatus(id, tgtStatus); }
          }
          setReassignSaving(false);
          alert(`Done: ${ok} moved, ${fail} failed.`);
          setReassignSelected({});
          if (fail === 0) setShowReassignModal(false);
        };
        return (
          <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:10}} onClick={()=>setShowReassignModal(false)}>
            <div style={{background:'#0c1017',border:'1px solid #1a2030',borderRadius:10,width:'100%',maxWidth:720,maxHeight:'90vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
              <div style={{padding:'12px 14px',borderBottom:'1px solid #1a2030',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <h3 style={{fontSize:13,fontWeight:700,color:'#e3a008',margin:0}}>🔀 Designing — Bulk Reassign</h3>
                  <p style={{fontSize:9,color:'#64748b',margin:'2px 0 0'}}>Move Designing jobs between In-House and Outsource</p>
                </div>
                <button className="b bs" onClick={()=>setShowReassignModal(false)}>✕</button>
              </div>
              <div style={{padding:'10px 14px',borderBottom:'1px solid #1a2030',display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                <div style={{display:'flex',gap:4,background:'#060810',border:'1px solid #1a2030',borderRadius:6,padding:2}}>
                  <button onClick={()=>{setReassignDirection('to-outsource');setReassignSelected({});}} style={{padding:'4px 10px',borderRadius:4,border:'none',cursor:'pointer',background:reassignDirection==='to-outsource'?'#8b5cf6':'transparent',color:reassignDirection==='to-outsource'?'white':'#94a3b8',fontSize:10,fontWeight:600}}>In-House → Outsource</button>
                  <button onClick={()=>{setReassignDirection('to-inhouse');setReassignSelected({});}} style={{padding:'4px 10px',borderRadius:4,border:'none',cursor:'pointer',background:reassignDirection==='to-inhouse'?'#c084fc':'transparent',color:reassignDirection==='to-inhouse'?'white':'#94a3b8',fontSize:10,fontWeight:600}}>Outsource → In-House</button>
                </div>
                <span style={{fontSize:10,color:'#64748b'}}>{eligible.length} eligible · {selectedIds.length} selected</span>
                <div style={{marginLeft:'auto',display:'flex',gap:6}}>
                  <button className="b bs" onClick={toggleAll} disabled={eligible.length===0}>{selectedIds.length===eligible.length&&eligible.length>0?'Clear all':'Select all'}</button>
                  <button className="b bp" onClick={doBulkMove} disabled={selectedIds.length===0||reassignSaving}>{reassignSaving?'Saving...':`Move ${selectedIds.length||''} →`}</button>
                </div>
              </div>
              <div style={{overflow:'auto',flex:1,padding:'0 14px 10px'}}>
                {eligible.length===0 ? (
                  <div style={{padding:30,textAlign:'center',color:'#64748b',fontSize:11}}>No jobs at "{srcStatus}" status.</div>
                ) : (
                  <table style={{width:'100%'}}>
                    <thead style={{position:'sticky',top:0,background:'#0c1017'}}>
                      <tr><th style={{width:30}}><input type="checkbox" checked={selectedIds.length===eligible.length&&eligible.length>0} onChange={toggleAll}/></th><th>Job#</th><th>Client</th><th>Project</th><th>Date</th></tr>
                    </thead>
                    <tbody>
                      {eligible.map(j=>(
                        <tr key={j.id} style={{cursor:'pointer',background:reassignSelected[j.id]?'#8b5cf615':''}} onClick={()=>toggle(j.id)}>
                          <td><input type="checkbox" checked={!!reassignSelected[j.id]} onChange={()=>toggle(j.id)} onClick={e=>e.stopPropagation()}/></td>
                          <td className="mn" style={{fontSize:10,color:'#e3a008',fontWeight:700}}>{j.id}</td>
                          <td style={{fontSize:10}}>{j.client_name?.slice(0,28)}</td>
                          <td style={{fontSize:10,color:'#64748b'}}>{j.project?.slice(0,35)}</td>
                          <td style={{fontSize:9,color:'#64748b',whiteSpace:'nowrap'}}>{j.created_at?.slice(0,10)||'—'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            </div>
          </div>
        );
      })()}

    </div>
  );
}

// GRN
function GRNPage({grn,suppliers,materials,team,addGRN,updateGRN,deleteGRN,addNewMaterial,addNewSupplier}){const [sf,ssf]=useState(false);const [selGrn,setSelGrn]=useState(null);const [editGrn,setEditGrn]=useState(null);const [photoFile,setPhotoFile]=useState(null);const [poFile,setPoFile]=useState(null);const [saving,setSaving]=useState(false);const [f,sF]=useState({date:td(),supplier:suppliers[0]?.name||"",material:materials[0]?.name||"",code:"",size:"",length:"",qty:1,unit:"roll",sqft:"",rate:"",invoice_no:"",job_id:"",inward_type:"Stock",received_by:team[0]?.name||"",qc:"OK"});
  const [newMat,setNewMat]=useState("");const [newSup,setNewSup]=useState("");const [showNewMat,setShowNewMat]=useState(false);const [showNewSup,setShowNewSup]=useState(false);
  const add=async()=>{setSaving(true);const photoUrl=await uploadFile(photoFile,'grn-photos');const poUrl=await uploadFile(poFile,'grn-po');await addGRN({id:"G"+uid(),...f,qty:+f.qty,rate:+f.rate,sqft:+f.sqft,photo_url:photoUrl,po_file_url:poUrl});sF(p=>({...p,qty:1,code:"",size:"",length:"",sqft:"",rate:"",invoice_no:"",job_id:""}));setPhotoFile(null);setPoFile(null);setSaving(false);};
  const doAddMat=async()=>{if(!newMat.trim())return;const r=await addNewMaterial(newMat.trim());if(r){sF(p=>({...p,material:r.name}));materials.push(r);setNewMat("");setShowNewMat(false);}};
  const doAddMat2=async(name)=>{const r=await addNewMaterial(name);if(r){sF(p=>({...p,material:r.name}));materials.push(r);}};
  const doAddSup=async()=>{if(!newSup.trim())return;const r=await addNewSupplier(newSup.trim());if(r){sF(p=>({...p,supplier:r.name}));suppliers.push(r);setNewSup("");setShowNewSup(false);}};
  return <div style={{display:"flex",flexDirection:"column",gap:6}}>
    <button className="b bp" onClick={()=>ssf(p=>!p)}>{sf?"▾ Close":"📦 New Inward"}</button>
    {sf&&<div className="c a" style={{padding:10}}><div className="fg f4">

    </tbody></table></div></div>

          <F l="Code#"><input className="in mn" value={editGrn.code||''} onChange={e=>setEditGrn(p=>({...p,code:e.target.value}))}/></F>

          <F l="Length"><input className="in mn" value={editGrn.length||''} onChange={e=>setEditGrn(p=>({...p,length:e.target.value}))}/></F>

          <F l="SqFt"><input className="in mn" value={editGrn.sqft||''} onChange={e=>setEditGrn(p=>({...p,sqft:+e.target.value}))}/></F>
          <F l="Rate"><input className="in mn" value={editGrn.rate||''} onChange={e=>setEditGrn(p=>({...p,rate:+e.target.value}))}/></F>
          <F l="Invoice#"><input className="in mn" value={editGrn.invoice_no||''} onChange={e=>setEditGrn(p=>({...p,invoice_no:e.target.value}))}/></F>
          <F l="Job#"><input className="in mn" value={editGrn.job_id||''} onChange={e=>setEditGrn(p=>({...p,job_id:e.target.value}))}/></F>
          <F l="Type"><select className="in" value={editGrn.inward_type||'Stock'} onChange={e=>setEditGrn(p=>({...p,inward_type:e.target.value}))}><option>Stock</option><option>Job</option></select></F>

          <F l="QC"><select className="in" value={editGrn.qc||'OK'} onChange={e=>setEditGrn(p=>({...p,qc:e.target.value}))}><option>OK</option><option>Rejected</option></select></F>
        </div>
        <div style={{display:"flex",gap:4,marginTop:10,justifyContent:"flex-end"}}>
          <button className="b" onClick={()=>setEditGrn(null)}>Cancel</button>
