        </div>
      </div>
      :<div className="fg f2" style={{gap:10,fontSize:11}}>
        <div><span style={{color:"#64748b",fontSize:9}}>DATE</span><p style={{fontWeight:600}}>{selGrn.date}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>SUPPLIER</span><p style={{fontWeight:600}}>{selGrn.supplier}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>MATERIAL</span><p style={{fontWeight:700,color:"#e3a008"}}>{selGrn.material}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>CODE</span><p className="mn">{selGrn.code||'—'}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>SIZE × LENGTH</span><p className="mn">{selGrn.size||'—'} × {selGrn.length||'—'}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>QTY</span><p className="mn" style={{fontWeight:700}}>{selGrn.qty} {selGrn.unit}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>TOTAL SQFT</span><p className="mn">{selGrn.sqft||'—'}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>RATE</span><p className="mn">₹{selGrn.rate}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>INVOICE / CHALLAN #</span><p className="mn">{selGrn.invoice_no||'—'}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>JOB #</span><p className="mn" style={{color:"#e3a008"}}>{selGrn.job_id||'—'}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>TYPE</span><p>{selGrn.inward_type}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>RECEIVED BY</span><p>{selGrn.received_by}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>QC STATUS</span><p style={{color:selGrn.qc==="OK"?"#4ade80":"#f47067",fontWeight:700}}>{selGrn.qc}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>PHOTO</span><p>{selGrn.photo_url?<a href={selGrn.photo_url} target="_blank" style={{color:"#3b82f6"}}>📸 View Photo</a>:'No photo uploaded'}</p></div>
        <div><span style={{color:"#64748b",fontSize:9}}>PO COPY</span><p>{selGrn.po_file_url?<a href={smartOpenUrl(selGrn.po_file_url)} target="_blank" style={{color:"#3b82f6"}}>📎 View PO</a>:'No PO uploaded'}</p></div>
      </div>}
    </div></div>}
    </div>;
}

// PRINTING — Analytics Dashboard (auto-logged via dept checkboxes)
function PrintPage({logs,machines,materials,team,stock,addLog,jobs,sm,updateJobStatus}){
  const [showQ,setShowQ]=useState(true);
  const [showDetail,setShowDetail]=useState(null); // log id being detailed
  const [df,setDf]=useState({machine:'',ink_cyan:0,ink_magenta:0,ink_yellow:0,ink_black:0,ink_white:0,waste:0,notes:''});
  const ALL_ST = ALL_ST_NEW;
  const queue=(jobs||[]).filter(j=>j.status==='Printing'||j.status==='Printing · In-House'||j.status==='Printing · Outsource');
  const openJob=(j)=>sm&&sm({t:`Job ${j.id} — ${j.project}`,jobId:j.id,fallback:j});
  // Analytics
  const today=td();
  const weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-7);const weekAgoStr=weekAgo.toISOString().slice(0,10);
  const logsToday=logs.filter(l=>l.date===today);
  const logsThisWeek=logs.filter(l=>l.date>=weekAgoStr);
  const totalSqftToday=logsToday.reduce((s,l)=>s+(+l.print_sqft||0),0);
  const totalSqftWeek=logsThisWeek.reduce((s,l)=>s+(+l.print_sqft||0),0);
  // Machine usage
  const byMachine={};logsThisWeek.forEach(l=>{const m=l.machine||'(unset)';byMachine[m]=(byMachine[m]||0)+1;});
  const machineRows=Object.entries(byMachine).sort((a,b)=>b[1]-a[1]);
  // Operator productivity
  const byOp={};logsThisWeek.forEach(l=>{const o=l.operator||'(unknown)';if(!byOp[o])byOp[o]={count:0,sqft:0};byOp[o].count++;byOp[o].sqft+=(+l.print_sqft||0);});
  const opRows=Object.entries(byOp).sort((a,b)=>b[1].count-a[1].count);
  // Save detail (machine+ink) for an auto-logged entry
  const saveDetail=async(logId)=>{
    const {error}=await sb.from('print_logs').update({machine:df.machine,ink_cyan:+df.ink_cyan||0,ink_magenta:+df.ink_magenta||0,ink_yellow:+df.ink_yellow||0,ink_black:+df.ink_black||0,ink_white:+df.ink_white||0,waste:+df.waste||0,notes:df.notes}).eq('id',logId);
    if(error){alert('Error: '+error.message);return;}
    setShowDetail(null);setDf({machine:'',ink_cyan:0,ink_magenta:0,ink_yellow:0,ink_black:0,ink_white:0,waste:0,notes:''});
    location.reload();
  };
  return <div style={{display:"flex",flexDirection:"column",gap:6}}>
    <div className="c a" style={{padding:10,background:"linear-gradient(90deg,#ef444422,#0a0f1a)",borderColor:"#ef444433"}}>
      <p style={{fontSize:11,fontWeight:700,color:"#ef4444",marginBottom:4}}>🖨️ PRINTING — AUTO-TRACKED</p>
      <p style={{fontSize:10,color:"#8b949e"}}>Logs are created <strong>automatically</strong> when you tick the <span style={{background:"#10b98122",color:"#10b981",padding:"1px 4px",borderRadius:3,fontWeight:700}}>PRI</span> checkbox on any line item. Click any log below to add machine name, ink consumed, and waste — all optional.</p>
    </div>
    {/* Stat cards */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
      <div className="c" style={{padding:10,textAlign:"center"}}><p style={{fontSize:8,color:"#64748b"}}>JOBS IN PRINTING</p><p style={{fontSize:18,fontWeight:800,color:"#ef4444"}}>{queue.length}</p></div>
      <div className="c" style={{padding:10,textAlign:"center"}}><p style={{fontSize:8,color:"#64748b"}}>ITEMS PRINTED TODAY</p><p style={{fontSize:18,fontWeight:800,color:"#e3a008"}}>{logsToday.length}</p></div>
      <div className="c" style={{padding:10,textAlign:"center"}}><p style={{fontSize:8,color:"#64748b"}}>SQFT PRINTED TODAY</p><p style={{fontSize:18,fontWeight:800,color:"#8b5cf6"}}>{totalSqftToday.toFixed(0)}</p></div>
      <div className="c" style={{padding:10,textAlign:"center"}}><p style={{fontSize:8,color:"#64748b"}}>SQFT THIS WEEK</p><p style={{fontSize:18,fontWeight:800,color:"#10b981"}}>{totalSqftWeek.toFixed(0)}</p></div>
    </div>
    {/* Queue */}
    <div className="c" style={{padding:0}}>
      <div style={{padding:"6px 10px",borderBottom:"2px solid #ef4444",background:"#0a0f1a",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>setShowQ(p=>!p)}>
        <span style={{fontSize:11,fontWeight:700,color:"#ef4444"}}>🖨️ Jobs in Printing Queue — {queue.length}</span><span style={{fontSize:9,color:"#64748b"}}>{showQ?'▾ Hide':'▸ Show'}</span>
      </div>
      {showQ&&<div style={{overflowX:"auto",maxHeight:250}}><table><thead><tr><th>Job</th><th>Client</th><th>Project</th><th>Items</th><th>Contact</th><th>Change Status</th></tr></thead><tbody>
        {queue.map(j=>{const itemCount=(j.batches||[]).reduce((s,b)=>(s+(b.items||[]).length),0);return <tr key={j.id}><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700,cursor:"pointer",textDecoration:"underline",textDecorationColor:"#e3a00844"}} onClick={()=>openJob(j)}>{j.id}</td><td style={{fontSize:10}}>{j.client_name?.slice(0,20)}</td><td style={{fontSize:10,color:"#64748b"}}>{j.project?.slice(0,20)}</td><td className="mn" style={{fontSize:10}}>{itemCount}</td><td style={{fontSize:10}}>{j.contact_person?.slice(0,15)}</td><td><select className="in" defaultValue="" onChange={e=>{const ns=e.target.value;if(!ns)return;if(confirm('Change "'+j.id+'" from "'+j.status+'" to "'+ns+'"?')){updateJobStatus(j.id,ns);}e.target.value='';}} style={{fontSize:9,padding:"2px 4px",width:110}}><option value="">Change →</option>{renderStatusOptions(j.status)}</select></td></tr>})}
        {queue.length===0&&<tr><td colSpan={6} style={{textAlign:"center",color:"#64748b",padding:12}}>No jobs in Printing</td></tr>}
      </tbody></table></div>}
    </div>
    {/* Analytics: Machine + Operator */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
      <div className="c" style={{padding:0}}><div style={{padding:"6px 10px",borderBottom:"1px solid #1a2030",background:"#0a0f1a"}}><span style={{fontSize:10,fontWeight:700,color:"#ef4444"}}>📊 Machine Usage (7 days)</span></div>
        <table style={{width:"100%"}}><thead><tr><th style={{textAlign:"left"}}>Machine</th><th className="mn">Jobs</th></tr></thead><tbody>
        {machineRows.map(([m,c])=><tr key={m}><td style={{fontSize:10}}>{m}</td><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700}}>{c}</td></tr>)}
        {machineRows.length===0&&<tr><td colSpan={2} style={{textAlign:"center",color:"#64748b",padding:12,fontSize:10}}>No data yet</td></tr>}
      </tbody></table></div>
      <div className="c" style={{padding:0}}><div style={{padding:"6px 10px",borderBottom:"1px solid #1a2030",background:"#0a0f1a"}}><span style={{fontSize:10,fontWeight:700,color:"#10b981"}}>👷 Operator Productivity (7 days)</span></div>
        <table style={{width:"100%"}}><thead><tr><th style={{textAlign:"left"}}>Operator</th><th className="mn">Items</th><th className="mn">SqFt</th></tr></thead><tbody>
        {opRows.map(([o,d])=><tr key={o}><td style={{fontSize:10}}>{o}</td><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700}}>{d.count}</td><td className="mn" style={{fontSize:10,color:"#8b5cf6"}}>{d.sqft.toFixed(0)}</td></tr>)}
        {opRows.length===0&&<tr><td colSpan={3} style={{textAlign:"center",color:"#64748b",padding:12,fontSize:10}}>No data yet</td></tr>}
      </tbody></table></div>
    </div>
    {/* Auto-logged entries */}
    <div className="c" style={{padding:0}}>
      <div style={{padding:"6px 10px",borderBottom:"1px solid #1a2030",background:"#0a0f1a"}}><span style={{fontSize:10,fontWeight:700,color:"#ef4444"}}>📋 Recent Print Activity ({logs.length} total)</span><span style={{fontSize:8,color:"#64748b",marginLeft:8}}>Click any row to add machine + ink consumption details</span></div>
      <div style={{overflowX:"auto",maxHeight:400}}><table><thead><tr><th>Date</th><th>Job</th><th>Operator</th><th>Material</th><th>Qty</th><th>SqFt</th><th>Machine</th><th>Ink(ml)</th><th>Waste</th><th></th></tr></thead><tbody>
        {logs.slice(0,100).map(l=>{const ti=(+l.ink_cyan||0)+(+l.ink_magenta||0)+(+l.ink_yellow||0)+(+l.ink_black||0)+(+l.ink_white||0);return <tr key={l.id} style={{cursor:"pointer",background:showDetail===l.id?"#0d1520":"transparent"}} onClick={()=>{setShowDetail(l.id);setDf({machine:l.machine||'',ink_cyan:l.ink_cyan||0,ink_magenta:l.ink_magenta||0,ink_yellow:l.ink_yellow||0,ink_black:l.ink_black||0,ink_white:l.ink_white||0,waste:l.waste||0,notes:l.notes||''});}}>
          <td style={{fontSize:9}}>{l.date}</td><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700}}>{l.job_id}</td><td style={{fontSize:9}}>{l.operator}</td><td style={{fontSize:9,color:"#8b949e"}}>{(l.material||l.notes||'').slice(0,25)}</td><td className="mn" style={{fontSize:9}}>{l.qty_used}</td><td className="mn" style={{fontSize:9,color:"#8b5cf6"}}>{l.print_sqft||'—'}</td><td style={{fontSize:9}}>{l.machine||<span style={{color:"#64748b"}}>click to add</span>}</td><td className="mn" style={{fontSize:9,color:ti>0?"#8b5cf6":"#64748b"}}>{ti||'—'}</td><td className="mn" style={{fontSize:9,color:"#f47067"}}>{l.waste||'—'}</td><td style={{fontSize:8,color:"#e3a008"}}>✎</td>
        </tr>;})}
        {logs.length===0&&<tr><td colSpan={10} style={{textAlign:"center",color:"#64748b",padding:16}}>No prints logged yet. Tick a <strong style={{color:"#10b981"}}>PRI</strong> checkbox on any line item to auto-create one.</td></tr>}
      </tbody></table></div>
    </div>
    {/* Detail modal for adding machine + ink details */}

      <F l="Del Boy"><select className="in" value={f.delivery_boy} onChange={e=>sF(p=>({...p,delivery_boy:e.target.value}))}>{delBoys.map(d=><option key={d.id} value={d.name}>{d.name}</option>)}<option>Other</option></select></F>

// ── WhatsApp sending via Interakt (through serverless proxy) ──
// Credentials live server-side in Vercel env var INTERAKT_KEY.
// Proxy endpoint: /api/wa-send  (see api/wa-send.js)
// ──────────────────────────────────────────────────────────────

// Send via Interakt API (through proxy) OR fallback to wa.me pre-fill.
// Signature intentionally unchanged so existing call sites work as-is.
async function sendWhatsApp(toNumber, message, campaign='iprint_notification') {
  // Group-invite URLs cannot be sent via any WhatsApp API — open in a new tab instead.
  if (typeof toNumber === 'string' && toNumber.indexOf('http') === 0) {
    window.open(toNumber, '_blank');
    return false;
  }
  try {
    const res = await fetch('/api/wa-send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to: toNumber, message: message, campaign: campaign })
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) {
      console.log('WA sent OK:', data.id || '(no id)');
      return true;
    }
    console.warn('WA proxy issue:', res.status, JSON.stringify(data).slice(0, 200));
    window.open('https://wa.me/' + toNumber + '?text=' + encodeURIComponent(message), '_blank');
    return false;
  } catch (e) {
    console.error('WA proxy error:', e);
    window.open('https://wa.me/' + toNumber + '?text=' + encodeURIComponent(message), '_blank');
    return false;
  }
}

// Convert number to words (Indian format)
function numToWords(n) {
  if (!n || isNaN(n)) return 'Zero';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function convert(num) {
    if (num === 0) return '';
    if (num < 20) return ones[num] + ' ';
    if (num < 100) return tens[Math.floor(num/10)] + (num%10 ? ' ' + ones[num%10] : '') + ' ';
    if (num < 1000) return ones[Math.floor(num/100)] + ' Hundred ' + convert(num%100);
    if (num < 100000) return convert(Math.floor(num/1000)) + 'Thousand ' + convert(num%1000);
    if (num < 10000000) return convert(Math.floor(num/100000)) + 'Lakh ' + convert(num%100000);
    return convert(Math.floor(num/10000000)) + 'Crore ' + convert(num%10000000);
  }
  const [intPart, decPart] = (+n).toFixed(2).split('.');
  let words = convert(parseInt(intPart)).trim();
  if (decPart && parseInt(decPart) > 0) words += ' and ' + convert(parseInt(decPart)).trim() + ' Paise';
  return words + ' Only';
}

// buildPOHtml — top-level, pure. Used by POPage AND MyPRsPage.
// Accepts (pr, poNo, firm, jobsArr) and returns the full PO HTML doc string.
// jobsArr is required to surface project name on the PO header.
// ══════════════════════════════════════════════════════════
function buildPOHtml(pr, poNo, firm, jobsArr) {
  const items = Array.isArray(pr.items) ? pr.items : [];
  const job = (jobsArr||[]).find(j => j.id === pr.job_id);
  const jobLabel = pr.job_id ? `${pr.job_id}${job && job.project ? ' (' + job.project + ')' : ''}` : '';
  const isIntraState = (pr.vendor_state||'Maharashtra').toLowerCase() === 'maharashtra';
  const _lineBase = (x) => {
    if (x && x.unit_mode) {
      const um = getUnitMode(x.unit_mode);
      const a = um.areaFn(+x.width||0, +x.height||0, +x.qty||1);
      return um.totalFn(a, +x.qty||1, +x.rate||0);
    }
    return (+x.qty||0)*(+x.rate||0);
  };
  const subtotal = +pr.subtotal || items.reduce((s,x) => s + _lineBase(x), 0);
  const gstTotal = (pr.gst_total !== null && pr.gst_total !== undefined && pr.gst_total !== '')
    ? +pr.gst_total
    : items.reduce((s,x) => s + _lineBase(x)*(+x.gst_pct||0)/100, 0);
  const transport = +pr.transport || 0;
  const transportGstPct = +pr.transport_gst_pct || 0;
  const transportGst = transport * transportGstPct / 100;
  const tdsPct = +pr.tds_pct || 0;
  const tdsAmount = +pr.tds_amount || (subtotal * tdsPct / 100);
  const roundOff = +pr.round_off || 0;
  const grandTotal = subtotal + gstTotal + transport + transportGst + roundOff;
  const netPayable = grandTotal - tdsAmount;
  const totalQty = items.reduce((s,x) => s + (+x.qty||0), 0);
  const gstGroups = {};
  items.forEach(x => {
    const base = _lineBase(x);
    const gp = +x.gst_pct || 0;
    const key = gp;
    if (!gstGroups[key]) gstGroups[key] = {base:0, tax:0};
    gstGroups[key].base += base;
    gstGroups[key].tax += base * gp / 100;
  });
  const today = new Date();
  const dateStr = today.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'2-digit'});
  const itemRows = items.map((x, i) => {
    const um = x.unit_mode ? getUnitMode(x.unit_mode) : null;
    const area = um ? um.areaFn(+x.width||0, +x.height||0, +x.qty||1) : 0;
    const dimLine = um && um.needsWH && (x.width || x.height)
      ? `<br><span style="font-weight:400;font-size:9px;color:#555">${x.width||''}×${x.height||''} ${um.dimUnit||''}${area>0 ? ' = '+um.displayFn(area) : ''}</span>`
      : (x.size ? `<br><span style="font-weight:400;font-size:9px;color:#555">${x.size}</span>` : '');
    const hsnLine = x.hsn ? `<br><span style="font-size:8px;color:#888">HSN: ${x.hsn}</span>` : '';
    // Use um.value on the PO (compact like "SqFt (INCH)", "RFT (FOOT)", "NOS"). The um.label
    // was rewritten 20 Apr to read as a sentence ("Feet → sqft") for dropdown clarity, which
    // is too verbose for PO documents. Roll modes still render as "roll" (short form).
    const qtyUnit = um ? (um.value.indexOf('Roll')===0 ? 'roll' : um.value) : (x.per||'nos');
    const lineAmt = _lineBase(x);
    return `
    <tr>
      <td style="text-align:center;padding:4px 6px;border:1px solid #ccc;font-size:10px;">${i+1}</td>
      <td style="padding:4px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${x.product||''}${dimLine}${hsnLine}</td>
      <td style="text-align:center;padding:4px 6px;border:1px solid #ccc;font-size:10px;">${pr.expected_delivery||dateStr}</td>
      <td style="text-align:right;padding:4px 6px;border:1px solid #ccc;font-size:10px;">${(+x.qty||0).toFixed(2)} ${qtyUnit}</td>
      <td style="text-align:right;padding:4px 6px;border:1px solid #ccc;font-size:10px;">${(+x.rate||0).toLocaleString('en-IN',{minimumFractionDigits:2})}</td>
      <td style="text-align:center;padding:4px 6px;border:1px solid #ccc;font-size:10px;">${qtyUnit}</td>
      <td style="text-align:center;padding:4px 6px;border:1px solid #ccc;font-size:10px;"></td>
      <td style="text-align:right;padding:4px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${lineAmt.toLocaleString('en-IN',{minimumFractionDigits:2})}</td>
    </tr>`;
  }).join('');
  const gstRows = Object.entries(gstGroups).map(([pct, {base, tax}]) => {
    if (+pct === 0 || tax === 0) return '';
    if (isIntraState) {
      return `
        <tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Input CGST @ ${pct/2}%</td>
        <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${(tax/2).toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>
        <tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Input SGST @ ${pct/2}%</td>
        <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${(tax/2).toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>`;
    } else {
      return `<tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Input IGST @ ${pct}%</td>
        <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${tax.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>`;
    }
  }).join('');
  const transportRow = transport > 0 ? `<tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Transport / Freight</td>
    <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${transport.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>` : '';
  const transportGstRow = transportGst > 0 ? `<tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Transport GST @ ${transportGstPct}%</td>
    <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${transportGst.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>` : '';
  const roundOffRow = roundOff !== 0 ? `<tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Round Off</td>
    <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${roundOff.toLocaleString('en-IN',{minimumFractionDigits:2,signDisplay:'auto'})}</td></tr>` : '';
  const tdsRow = tdsAmount > 0 ? `<tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;color:#b91c1c;">Less: TDS @ ${tdsPct}% (on subtotal)</td>
    <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;color:#b91c1c;">(${tdsAmount.toLocaleString('en-IN',{minimumFractionDigits:2})})</td></tr>
    <tr><td colspan="7" style="text-align:right;padding:5px 6px;border:1px solid #ccc;font-size:11px;font-weight:700;background:#f0fdf4;">Net Payable to Vendor</td>
    <td style="text-align:right;padding:5px 6px;border:1px solid #ccc;font-size:12px;font-weight:800;background:#f0fdf4;">₹ ${netPayable.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>` : '';

  return `<!DOCTYPE html>

</style></head><body>

${pr.job_id ? `<div class="meta-row" style="margin-top:-4px">

</div>` : ''}

  ${firm.email ? '<p>E-Mail : ' + firm.email + '</p>' : ''}
</div>

<div class="po-title">PURCHASE ORDER</div>

<div class="party-box">
  <div style="margin-bottom:4px"><span style="color:#555">Party : </span><strong>${pr.vendor_name}</strong></div>

  ${pr.vendor_gstin ? '<div style="margin-top:4px">GSTIN/UIN &nbsp;&nbsp;&nbsp;&nbsp;: &nbsp;<strong>' + pr.vendor_gstin + '</strong></div>' : ''}
  ${pr.vendor_gstin && pr.vendor_gstin.length >= 12 ? '<div>PAN &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: &nbsp;<strong>' + pr.vendor_gstin.substring(2, 12) + '</strong></div>' : ''}
  ${pr.vendor_phone ? '<div>Phone &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: &nbsp;' + pr.vendor_phone + '</div>' : ''}
  <div>State Name &nbsp;: &nbsp;${(pr.vendor_state||'Maharashtra')}, Code : ${(pr.vendor_state||'Maharashtra').toLowerCase()==='maharashtra'?'27':'—'}</div>
</div>

<div class="pt-box"><strong>Payment Terms</strong><br>${pr.payment_terms||'To be confirmed'}</div>

<table>

    </tr>
    ${gstRows}
    ${transportRow}
    ${transportGstRow}
    ${roundOffRow}
    <tr style="background:#f9f9f9">
      <td colspan="3" style="padding:5px 6px;border:1px solid #ccc;font-size:10px;font-weight:700;">Total</td>
      <td style="text-align:right;padding:5px 6px;border:1px solid #ccc;font-size:10px;font-weight:700;">${totalQty.toFixed(4)} nos</td>

// ══════════════════════════════════════════════════════════
// PHASE D — GRN / RECEIVE MATERIAL PAGE
// ══════════════════════════════════════════════════════════
function GRNReceivePage({prs, setPrs, jobs, user, show}) {
  const GRN_RECEIVERS = ['Murli Shetty', 'Shreya'];
  const STATUS_FILTERS = ['PO Generated','PO Sent','Approved','All'];

  const [filter, setFilter] = React.useState('PO Generated');
  const [receiving, setReceiving] = React.useState(null);
  const [gf, setGf] = React.useState({
    received_by: user?.name || 'Murli Shetty',
    received_at: new Date().toISOString().slice(0,10),
    invoice_no: '',
    received_notes: '',
    partial_delivery: false,
    items_received: []
  });
  const [saving, setSaving] = React.useState(false);

  const filtered = React.useMemo(() => {
    const list = filter === 'All'
      ? prs.filter(p => ['Approved','PO Generated','PO Sent'].includes(p.status))
      : prs.filter(p => p.status === filter);
    return [...list].sort((a,b) => b.created_at > a.created_at ? 1 : -1);
  },[prs, filter]);

  const openReceive = (pr) => {
    const items = Array.isArray(pr.items) ? pr.items : [];
    setGf({
      received_by: user?.name?.includes('MURLI') || user?.name?.includes('Murli') ? 'Murli Shetty'
        : user?.name?.includes('SHREYA') || user?.name?.includes('Shreya') ? 'Shreya'
        : 'Murli Shetty',
      received_at: new Date().toISOString().slice(0,10),
      invoice_no: '',
      received_notes: '',
      partial_delivery: false,
      items_received: items.map((x,i) => {
        const um = x.unit_mode ? getUnitMode(x.unit_mode) : null;
        const area = um ? um.areaFn(+x.width||0, +x.height||0, +x.qty||1) : 0;
        // For area-mode lines we display the computed area as the "ordered amount"
        // (e.g. 850 ft²), but we still keep raw qty for legacy/per-roll/per-piece lines.
        const isAreaMode = um && um.needsWH && area > 0 && um.value !== 'Roll M×M (per roll)';
        return {
          index: i,
          product: x.product,
          unit_mode: x.unit_mode || null,
          width: x.width || '',
          height: x.height || '',
          area: area,
          ordered_qty: +x.qty || 0,
          ordered_display: isAreaMode ? area : (+x.qty || 0),
          per: isAreaMode ? (um.displayFn(area).split(' ')[1] || um.dimUnit || 'nos') : (x.per || (um ? um.value : 'nos')),
          received_qty: isAreaMode ? area : (+x.qty || 0),
          ok: true
        };
      })
    });
    setReceiving(pr);
  };

  const saveGRN = async () => {
    if (!gf.received_by) { show('Select receiver', false); return; }
    setSaving(true);
    const grn_id = 'GRN' + Date.now();
    const nowIso = new Date().toISOString();
    const updates = {
      status: gf.partial_delivery ? 'PO Sent' : 'Completed',
      received_by: gf.received_by,
      received_at: new Date(gf.received_at).toISOString(),
      grn_id,
      received_notes: [
        gf.invoice_no ? 'Invoice: ' + gf.invoice_no : '',
        gf.received_notes || '',
        gf.partial_delivery ? 'PARTIAL DELIVERY' : '',
        gf.items_received.some(x => +x.received_qty !== +(x.ordered_display ?? x.ordered_qty))
          ? 'Qty variances: ' + gf.items_received.filter(x => +x.received_qty !== +(x.ordered_display ?? x.ordered_qty))
              .map(x => x.product + ' (ordered ' + (x.ordered_display ?? x.ordered_qty) + ', received ' + x.received_qty + ')').join('; ')
          : ''
      ].filter(Boolean).join(' | ') || null,
      invoice_no: gf.invoice_no || null,
      partial_delivery: gf.partial_delivery,
      last_status_change_at: nowIso
    };
    const {error} = await sb.from('purchase_requests').update(updates).eq('id', receiving.id);
    if (error) { show('Save failed: ' + error.message, false); setSaving(false); return; }

    const updated = {...receiving, ...updates};
    setPrs(p => p.map(x => x.id === receiving.id ? updated : x));

    // WhatsApp notify Jigar + group
    const itemsSummary = gf.items_received.map(x => x.product + ' x' + x.received_qty + ' ' + x.per).join(', ');
    const waMsg = (gf.partial_delivery
      ? 'PARTIAL DELIVERY recorded'
      : 'Material RECEIVED and GRN recorded') +
      ' — ' + receiving.pr_no +
      '\nVendor: ' + receiving.vendor_name +
      '\nItems: ' + itemsSummary +
      '\nGRN: ' + grn_id +
      (gf.invoice_no ? '\nInvoice: ' + gf.invoice_no : '') +
      (gf.received_notes ? '\nNotes: ' + gf.received_notes : '') +
      '\nReceived by: ' + gf.received_by +
      '\nStatus: ' + (gf.partial_delivery ? 'Partial — balance pending' : 'COMPLETED');
    sendWhatsApp(WA_NUMBERS['Jigar'], waMsg, 'iprint_grn_received');

    // Auto-notify the original requestor
    const reqPhone = WA_NUMBERS[receiving.created_by];
    if (reqPhone && receiving.created_by !== 'Jigar') {
      const reqMsg = (gf.partial_delivery
        ? `📦 *PARTIAL DELIVERY* received for your PR *${receiving.pr_no}*.\n\nVendor: ${receiving.vendor_name}\nGRN: ${grn_id}\nReceived by: ${gf.received_by}\n\nBalance still pending. Track status in *My PRs* tab.`
        : `✅ *Material RECEIVED* for your PR *${receiving.pr_no}* — status now COMPLETED.\n\nVendor: ${receiving.vendor_name}\nGRN: ${grn_id}\nReceived by: ${gf.received_by}\n\nView details in *My PRs* tab.`);
      sendWhatsApp(reqPhone, reqMsg, 'iprint_grn_requestor');
    }

    setSaving(false);
    setReceiving(null);
    show('✅ GRN ' + grn_id + ' recorded! Status → ' + (gf.partial_delivery ? 'PO Sent (partial)' : 'Completed'));
  };

  const stCol = {
    'Approved':     {bg:'#4ade8020',c:'#4ade80'},
    'PO Generated': {bg:'#06b6d420',c:'#06b6d4'},
    'PO Sent':      {bg:'#3b82f620',c:'#3b82f6'},
    'Completed':    {bg:'#8b5cf620',c:'#8b5cf6'},
  };
  const firmColor = code => ({JPP:'#e3a008',JXT:'#3b82f6',VHD:'#8b5cf6'})[code]||'#64748b';

  const pendingCount = prs.filter(p => ['PO Sent','PO Generated'].includes(p.status)).length;

  return (
    <div style={{padding:12, overflowY:'auto', height:'100%'}}>
      {/* Header */}
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12, flexWrap:'wrap', gap:8}}>
        <div>
          <h2 style={{fontSize:14, fontWeight:800, color:'#8b5cf6', margin:0}}>📦 Receive Material — GRN</h2>
          <p style={{fontSize:10, color:'#64748b', margin:'2px 0 0'}}>
            {pendingCount > 0
              ? <span style={{color:'#3b82f6', fontWeight:700}}>{pendingCount} PO(s) pending material receipt</span>
              : <span style={{color:'#4ade80'}}>✓ All POs received</span>}
          </p>
        </div>
        <div style={{display:'flex', gap:4, flexWrap:'wrap'}}>
          {STATUS_FILTERS.map(f => (
            <button key={f} className={`b bs ${filter===f?'bp':''}`} onClick={() => setFilter(f)}
              style={{fontSize:9, padding:'3px 8px',
                ...(filter===f && f==='PO Sent' ? {background:'#3b82f620',borderColor:'#3b82f6',color:'#3b82f6'} : {})}}>
              {f}{f==='PO Sent' ? ` (${prs.filter(p=>p.status==='PO Sent').length})` : ''}
            </button>
          ))}
        </div>
      </div>

      {/* GRN Entry Panel */}
      {receiving && (
        <div style={{background:'#0a0f1a', border:'1px solid #8b5cf644', borderRadius:8, padding:12, marginBottom:12}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10, flexWrap:'wrap', gap:6}}>
            <div>
              <span style={{fontWeight:800, color:'#8b5cf6', fontSize:12}}>Recording GRN — {receiving.pr_no}</span>
              {receiving.po_no && <span style={{marginLeft:8, fontSize:10, color:'#06b6d4'}}>{receiving.po_no}</span>}
              <span style={{marginLeft:8, fontSize:9, color:'#64748b'}}>{receiving.vendor_name}</span>
            </div>
            <button className="b bs" onClick={() => setReceiving(null)} style={{fontSize:9}}>✕ Cancel</button>
          </div>

          {/* Receiver + Date + Invoice */}
          <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8, marginBottom:10}}>
            <div>
              <span style={{fontSize:7, color:'#64748b', display:'block', marginBottom:2}}>Received By *</span>
              <select className="in" value={gf.received_by} onChange={e=>setGf(p=>({...p,received_by:e.target.value}))}
                style={{fontSize:9, padding:'3px 4px', width:'100%'}}>
                {GRN_RECEIVERS.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
            </div>
            <div>
              <span style={{fontSize:7, color:'#64748b', display:'block', marginBottom:2}}>Date of Receipt *</span>
              <input className="in" type="date" value={gf.received_at}
                onChange={e=>setGf(p=>({...p,received_at:e.target.value}))}
                style={{fontSize:9, padding:'3px 4px', width:'100%'}}/>
            </div>
            <div>
              <span style={{fontSize:7, color:'#64748b', display:'block', marginBottom:2}}>Vendor Invoice No.</span>
              <input className="in" value={gf.invoice_no}
                onChange={e=>setGf(p=>({...p,invoice_no:e.target.value}))}
                placeholder="e.g. INV-2024-456"
                style={{fontSize:9, padding:'3px 4px', width:'100%'}}/>
            </div>
          </div>

          {/* Items received — qty check */}
          <p style={{fontSize:8, color:'#8b5cf6', fontWeight:700, marginBottom:6}}>ITEMS RECEIVED</p>
          <div style={{background:'#060810', borderRadius:6, padding:'6px 8px', marginBottom:8}}>
            <table style={{width:'100%'}}>
              <thead><tr>
                <th style={{fontSize:7, color:'#64748b', textAlign:'left', paddingBottom:4}}>Item</th>
                <th style={{fontSize:7, color:'#64748b', textAlign:'right', width:70}}>Ordered</th>
                <th style={{fontSize:7, color:'#64748b', textAlign:'right', width:90}}>Received Qty</th>
                <th style={{fontSize:7, color:'#64748b', textAlign:'center', width:50}}>OK?</th>
              </tr></thead>
              <tbody>
                {gf.items_received.map((x, i) => {
                  const orderedRef = (x.ordered_display !== undefined && x.ordered_display !== null) ? +x.ordered_display : +x.ordered_qty;
                  const variance = +x.received_qty !== orderedRef;
                  const dimHint = x.unit_mode && x.width && x.height ? ` (${x.width}×${x.height} ${x.unit_mode.includes('M×M')?'m':''})` : '';
                  return (
                    <tr key={i}>
                      <td style={{fontSize:9, color:'#c9d1d9', paddingRight:8, paddingTop:4}}>{x.product}<span style={{fontSize:7,color:'#64748b'}}>{dimHint}</span></td>
                      <td style={{fontSize:9, color:'#64748b', textAlign:'right', paddingTop:4}}>{orderedRef} {x.per}</td>
                      <td style={{textAlign:'right', paddingTop:2}}>
                        <input className="in mn" type="number" min="0" value={x.received_qty}
                          onChange={e => setGf(p => ({...p, items_received: p.items_received.map((it,xi) => xi===i ? {...it, received_qty: e.target.value} : it)}))}
                          style={{fontSize:9, padding:'2px 4px', width:70, textAlign:'right',
                            borderColor: variance ? '#f59e0b' : '#1a2030',
                            color: variance ? '#f59e0b' : 'inherit'}}/>
                        <span style={{fontSize:8, color:'#64748b', marginLeft:3}}>{x.per}</span>
                      </td>
                      <td style={{textAlign:'center', paddingTop:4}}>

                          : <span style={{fontSize:9, color:'#4ade80'}}>✓</span>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {gf.items_received.some(x => +x.received_qty !== +(x.ordered_display ?? x.ordered_qty)) && (
              <div style={{marginTop:6, fontSize:8, color:'#f59e0b'}}>
                ⚠️ Quantity variance detected — will be noted in GRN
              </div>
            )}
          </div>

          {/* Notes + Partial */}
          <div style={{display:'grid', gridTemplateColumns:'1fr auto', gap:8, marginBottom:10, alignItems:'center'}}>
            <div>
              <span style={{fontSize:7, color:'#64748b', display:'block', marginBottom:2}}>Notes / Remarks</span>
              <input className="in" value={gf.received_notes}
                onChange={e=>setGf(p=>({...p,received_notes:e.target.value}))}
                placeholder="Any observations, quality issues, damage notes..."
                style={{fontSize:9, padding:'3px 4px', width:'100%'}}/>
            </div>
            <div style={{textAlign:'center', padding:'0 8px'}}>
              <span style={{fontSize:7, color:'#64748b', display:'block', marginBottom:4}}>Partial Delivery?</span>
              <input type="checkbox" checked={gf.partial_delivery}
                onChange={e=>setGf(p=>({...p,partial_delivery:e.target.checked}))}
                style={{width:16, height:16, cursor:'pointer'}}/>
              {gf.partial_delivery && <div style={{fontSize:7, color:'#f59e0b', marginTop:2}}>Balance pending</div>}
            </div>
          </div>

          {/* Status indicator */}
          <div style={{background: gf.partial_delivery ? '#f59e0b15' : '#4ade8015',
            border: '1px solid ' + (gf.partial_delivery ? '#f59e0b44' : '#4ade8044'),
            borderRadius:6, padding:'6px 10px', marginBottom:10, fontSize:9}}>
            {gf.partial_delivery
              ? <span style={{color:'#f59e0b'}}>⚠️ <strong>Partial delivery</strong> — status will stay at "PO Sent". Record again when balance arrives.</span>
              : <span style={{color:'#4ade80'}}>✅ <strong>Full delivery</strong> — PR status will be marked <strong>Completed</strong>.</span>}
          </div>

          {/* Save button */}
          <div style={{display:'flex', justifyContent:'flex-end', gap:6}}>
            <button className="b bs" onClick={() => setReceiving(null)} style={{fontSize:9, padding:'4px 12px'}}>Cancel</button>
            <button className="b bp" onClick={saveGRN} disabled={saving}
              style={{fontSize:11, padding:'6px 20px', background:'#8b5cf6', borderColor:'#8b5cf6', fontWeight:700}}>
              {saving ? '⏳ Saving...' : '📦 Confirm Receipt & Save GRN'}
            </button>
          </div>
        </div>
      )}

      {/* PR List */}
      {filtered.length === 0 && (
        <div style={{textAlign:'center', padding:40, color:'#64748b', fontSize:11}}>
          {filter === 'PO Sent' ? '✅ No POs pending receipt' : `No ${filter} PRs`}
        </div>
      )}

      <div style={{display:'flex', flexDirection:'column', gap:6}}>
        {filtered.map(pr => {
          const sc = stCol[pr.status] || {bg:'#64748b20',c:'#64748b'};
          const rItems = Array.isArray(pr.items) ? pr.items : [];
          const isCompleted = pr.status === 'Completed';
          return (
            <div key={pr.id} style={{background:'#0a0f1a',
              border:`1px solid ${pr.status==='PO Sent'?'#3b82f633':'#1a2030'}`,
              borderRadius:8, padding:'10px 12px',
              opacity: isCompleted ? 0.7 : 1}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:6}}>
                <div style={{display:'flex', alignItems:'center', gap:6, flexWrap:'wrap'}}>
                  <span style={{fontWeight:800, color:'#f59e0b', fontSize:11}}>{pr.pr_no}</span>
                  {pr.po_no && <span style={{fontWeight:700, color:'#06b6d4', fontSize:10}}>{pr.po_no}</span>}
                  <span style={{padding:'1px 6px', borderRadius:3, fontSize:7, fontWeight:700, background:sc.bg, color:sc.c}}>{pr.status}</span>
                  <span style={{padding:'1px 6px', borderRadius:3, fontSize:8, fontWeight:700,
                    background:firmColor(pr.firm_code)+'20', color:firmColor(pr.firm_code)}}>{pr.firm_code}</span>
                  <span style={{fontSize:9, color:'#c9d1d9'}}>{pr.vendor_name}</span>
                  {pr.urgency==='Urgent' && <span style={{padding:'1px 5px', borderRadius:3, fontSize:7, fontWeight:700, background:'#f4706720', color:'#f47067'}}>🔴 URGENT</span>}
                </div>
                <div style={{display:'flex', alignItems:'center', gap:8}}>
                  <span style={{fontWeight:800, color:'#e3a008', fontSize:12}}>₹{(+pr.total||0).toLocaleString('en-IN',{maximumFractionDigits:0})}</span>
                  {!isCompleted && (
                    <button className="b bp" onClick={() => openReceive(pr)}
                      style={{fontSize:10, padding:'5px 14px', background:'#8b5cf6', borderColor:'#8b5cf6', fontWeight:700}}>
                      📦 Receive
                    </button>
                  )}
                  {isCompleted && pr.grn_id && (
                    <span style={{fontSize:8, color:'#4ade80', fontWeight:700}}>✅ {pr.grn_id}</span>
                  )}
                </div>
              </div>

              {/* Items summary */}
              <div style={{marginTop:6, display:'flex', gap:8, flexWrap:'wrap', fontSize:9, color:'#8b949e'}}>
                {rItems.map((x,xi) => <span key={xi}>{x.product}{x.size?' ('+x.size+')':''} × {x.qty} {x.per}</span>)}
                {pr.expected_delivery && <span style={{color:'#06b6d4'}}>· Expected {pr.expected_delivery}</span>}
                {pr.payment_terms && <span style={{color:'#64748b'}}>· {pr.payment_terms}</span>}
              </div>

              {/* GRN details if completed */}
              {isCompleted && (
                <div style={{marginTop:6, padding:'4px 8px', background:'#4ade8010', border:'1px solid #4ade8033', borderRadius:4, fontSize:8}}>
                  <span style={{color:'#4ade80'}}>📦 Received by {pr.received_by}</span>
                  {pr.received_at && <span style={{color:'#64748b', marginLeft:8}}>{new Date(pr.received_at).toLocaleDateString('en-IN')}</span>}
                  {pr.received_notes && <span style={{color:'#8b949e', marginLeft:8}}>· {pr.received_notes}</span>}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function POPage({prs, setPrs, jobs, user, show, firms}) {
  const [filter, setFilter] = React.useState('Approved');
  const [generating, setGenerating] = React.useState(null);
  const [poPreview, setPoPreview] = React.useState(null); // {pr, poNo, html}
  const [tdsByPr, setTdsByPr] = React.useState({}); // Shreya's TDS% selection per-PR, keyed by pr.id

  const STATUS_FILTERS = ['Approved','PO Generated','Completed','All'];
  const stCol = {
    'Approved':     {bg:'#4ade8020',c:'#4ade80'},
    'PO Generated': {bg:'#06b6d420',c:'#06b6d4'},
    'PO Sent':      {bg:'#3b82f620',c:'#3b82f6'},
    'Completed':    {bg:'#8b5cf620',c:'#8b5cf6'},
  };

  const filtered = React.useMemo(() => {
    const list = filter === 'All' ? prs.filter(p=>['Approved','PO Generated','Completed'].includes(p.status))
      : prs.filter(p => p.status === filter);
    return [...list].sort((a,b) => b.created_at > a.created_at ? 1 : -1);
  }, [prs, filter]);

  const getFY = () => {
    const n = new Date(); const m = n.getMonth(), y = n.getFullYear();
    return m >= 3 ? `${String(y).slice(2)}-${String(y+1).slice(2)}` : `${String(y-1).slice(2)}-${String(y).slice(2)}`;
  };

  const genPONo = async (firmCode) => {
    const fy = getFY();
    const {data} = await sb.from('purchase_requests').select('po_no').eq('firm_code', firmCode).eq('fy', fy).not('po_no','is',null);
    const nums = (data||[]).map(r => { const m = r.po_no?.match(/\/(\d+)$/); return m ? +m[1] : 0; });
    const next = String(Math.max(0, ...nums) + 1).padStart(3, '0');
    return `${firmCode}/PO/${fy}/${next}`;
  };

  const buildPOHtml = (pr, poNo, firm, jobsArr) => {
    const items = Array.isArray(pr.items) ? pr.items : [];
    // Look up job to surface project name on the PO header. jobsArr passed in (was closure dep).
    const job = (jobsArr||[]).find(j => j.id === pr.job_id);
    const jobLabel = pr.job_id ? `${pr.job_id}${job && job.project ? ' (' + job.project + ')' : ''}` : '';
    const isIntraState = (pr.vendor_state||'Maharashtra').toLowerCase() === 'maharashtra';
    // Per-line amount honours unit_mode if present, falls back to qty*rate for legacy items.
    const _lineBase = (x) => {
      if (x && x.unit_mode) {
        const um = getUnitMode(x.unit_mode);
        const a = um.areaFn(+x.width||0, +x.height||0, +x.qty||1);
        return um.totalFn(a, +x.qty||1, +x.rate||0);
      }
      return (+x.qty||0)*(+x.rate||0);
    };
    const subtotal = +pr.subtotal || items.reduce((s,x) => s + _lineBase(x), 0);
    // Bug-fix (PR2.0): respect stored gst_total even when it's 0; per-item gst_pct defaults to 0 (not 18) so "no GST" PRs don't silently acquire tax.
    const gstTotal = (pr.gst_total !== null && pr.gst_total !== undefined && pr.gst_total !== '')
      ? +pr.gst_total
      : items.reduce((s,x) => s + _lineBase(x)*(+x.gst_pct||0)/100, 0);
    const transport = +pr.transport || 0;
    const transportGstPct = +pr.transport_gst_pct || 0;
    const transportGst = transport * transportGstPct / 100;
    const tdsPct = +pr.tds_pct || 0;
    const tdsAmount = +pr.tds_amount || (subtotal * tdsPct / 100);
    const roundOff = +pr.round_off || 0;
    const grandTotal = subtotal + gstTotal + transport + transportGst + roundOff;
    const netPayable = grandTotal - tdsAmount;
    const totalQty = items.reduce((s,x) => s + (+x.qty||0), 0);

    // GST breakdown per rate
    const gstGroups = {};
    items.forEach(x => {
      const base = _lineBase(x);
      // Bug-fix (PR2.0): default per-item GST to 0 (not 18) so explicit 0% on PR doesn't silently become 18% here.
      const gp = +x.gst_pct || 0;
      const key = gp;
      if (!gstGroups[key]) gstGroups[key] = {base:0, tax:0};
      gstGroups[key].base += base;
      gstGroups[key].tax += base * gp / 100;
    });

    const today = new Date();
    const dateStr = today.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'2-digit'});

    const itemRows = items.map((x, i) => {
      const um = x.unit_mode ? getUnitMode(x.unit_mode) : null;
      const area = um ? um.areaFn(+x.width||0, +x.height||0, +x.qty||1) : 0;
      // Build the description line — show W×H + dim unit + computed area when available, else fall back to free-text size.
      const dimLine = um && um.needsWH && (x.width || x.height)
        ? `<br><span style="font-weight:400;font-size:9px;color:#555">${x.width||''}×${x.height||''} ${um.dimUnit||''}${area>0 ? ' = '+um.displayFn(area) : ''}</span>`
        : (x.size ? `<br><span style="font-weight:400;font-size:9px;color:#555">${x.size}</span>` : '');
      const hsnLine = x.hsn ? `<br><span style="font-size:8px;color:#888">HSN: ${x.hsn}</span>` : '';
      // Qty column shows qty + the real unit. Use um.value (compact like "SqFt (INCH)")
      // instead of um.label (rewritten 20 Apr to be a verbose dropdown-clarity sentence).
      const qtyUnit = um ? (um.value.indexOf('Roll')===0 ? 'roll' : um.value) : (x.per||'nos');
      const lineAmt = _lineBase(x);
      return `
      <tr>
        <td style="text-align:center;padding:4px 6px;border:1px solid #ccc;font-size:10px;">${i+1}</td>
        <td style="padding:4px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${x.product||''}${dimLine}${hsnLine}</td>
        <td style="text-align:center;padding:4px 6px;border:1px solid #ccc;font-size:10px;">${pr.expected_delivery||dateStr}</td>
        <td style="text-align:right;padding:4px 6px;border:1px solid #ccc;font-size:10px;">${(+x.qty||0).toFixed(2)} ${qtyUnit}</td>
        <td style="text-align:right;padding:4px 6px;border:1px solid #ccc;font-size:10px;">${(+x.rate||0).toLocaleString('en-IN',{minimumFractionDigits:2})}</td>
        <td style="text-align:center;padding:4px 6px;border:1px solid #ccc;font-size:10px;">${qtyUnit}</td>
        <td style="text-align:center;padding:4px 6px;border:1px solid #ccc;font-size:10px;"></td>
        <td style="text-align:right;padding:4px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${lineAmt.toLocaleString('en-IN',{minimumFractionDigits:2})}</td>
      </tr>`;
    }).join('');

    const gstRows = Object.entries(gstGroups).map(([pct, {base, tax}]) => {
      // Bug-fix (PR2.0): hide tax rows entirely for 0% GST groups — cleaner PO per team feedback.
      if (+pct === 0 || tax === 0) return '';
      if (isIntraState) {
        return `
          <tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Input CGST @ ${pct/2}%</td>
          <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${(tax/2).toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>
          <tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Input SGST @ ${pct/2}%</td>
          <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${(tax/2).toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>`;
      } else {
        return `<tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Input IGST @ ${pct}%</td>
          <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${tax.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>`;
      }
    }).join('');

    const transportRow = transport > 0 ? `<tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Transport / Freight</td>
      <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${transport.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>` : '';
    const transportGstRow = transportGst > 0 ? `<tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Transport GST @ ${transportGstPct}%</td>
      <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${transportGst.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>` : '';
    const roundOffRow = roundOff !== 0 ? `<tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;">Round Off</td>
      <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;">${roundOff.toLocaleString('en-IN',{minimumFractionDigits:2,signDisplay:'auto'})}</td></tr>` : '';
    const tdsRow = tdsAmount > 0 ? `<tr><td colspan="7" style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-style:italic;color:#b91c1c;">Less: TDS @ ${tdsPct}% (on subtotal)</td>
      <td style="text-align:right;padding:3px 6px;border:1px solid #ccc;font-size:10px;font-weight:600;color:#b91c1c;">(${tdsAmount.toLocaleString('en-IN',{minimumFractionDigits:2})})</td></tr>
      <tr><td colspan="7" style="text-align:right;padding:5px 6px;border:1px solid #ccc;font-size:11px;font-weight:700;background:#f0fdf4;">Net Payable to Vendor</td>
      <td style="text-align:right;padding:5px 6px;border:1px solid #ccc;font-size:12px;font-weight:800;background:#f0fdf4;">₹ ${netPayable.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>` : '';

    return `<!DOCTYPE html>
