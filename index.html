function ApprovalsPage({prs, setPrs, jobs, user, show, firms}) {
  const [filter, setFilter] = React.useState('Pending Approval');
  const [rejecting, setRejecting] = React.useState(null); // pr id being rejected
  const [rejReason, setRejReason] = React.useState('');
  const [processing, setProcessing] = React.useState(null); // pr id being processed
  const [waButtons, setWaButtons] = React.useState({}); // {prId: true} = show WA buttons

  const STATUS_FILTERS = ['Pending Approval','Approved','Rejected','All'];
  const stCol = {
    'Pending Approval': {bg:'#e3a00820',c:'#e3a008'},
    'Approved':         {bg:'#4ade8020',c:'#4ade80'},
    'Rejected':         {bg:'#f4706720',c:'#f47067'},
    'PO Generated':     {bg:'#06b6d420',c:'#06b6d4'},
    'PO Sent':          {bg:'#3b82f620',c:'#3b82f6'},
    'Completed':        {bg:'#8b5cf620',c:'#8b5cf6'},
    'Cancelled':        {bg:'#64748b20',c:'#64748b'},
  };

  const filtered = React.useMemo(() => {
    const list = filter === 'All' ? prs : prs.filter(p => p.status === filter);
    return [...list].sort((a,b) => b.created_at > a.created_at ? 1 : -1);
  }, [prs, filter]);

  const pendingCount = (prs||[]).filter(p => p.status === 'Pending Approval').length;

  const buildApproveMsg = (pr) => {
    const items = (pr.items||[]).map(x => `${x.product}${x.size?' ('+x.size+')':''} x${x.qty}`).join(', ');
    return `✅ *PR Approved — ${pr.pr_no}*\n\nYour Purchase Request has been approved by Jigar.\n\n*Vendor:* ${pr.vendor_name}\n*Items:* ${items}\n*Total:* ₹${(+pr.total||0).toFixed(0)}\n*Urgency:* ${pr.urgency}\n\nShreya will generate the PO shortly. 📄`;
  };

  const buildVendorMsg = (pr) => {
    const items = (pr.items||[]).map(x => `• ${x.product}${x.size?' ('+x.size+')':''} — Qty: ${x.qty} ${x.per} @ ₹${x.rate}`).join('\n');
    return `Dear *${pr.vendor_name}*,\n\nThis is iPrint India. We are raising a Purchase Order for the following:\n\n${items}\n\n*PR Ref:* ${pr.pr_no}\n*Payment Terms:* ${pr.payment_terms||'To be confirmed'}\n${pr.expected_delivery?'*Expected Delivery:* '+pr.expected_delivery+'\n':''}\nOur team will send you the formal PO document shortly. Please confirm availability.\n\nThank you 🙏\n*iPrint India*`;
  };

  const buildGroupMsg = (pr, action) => {
    if (action === 'approved') {
      const items = (pr.items||[]).map(x => `${x.product} x${x.qty}`).join(', ');
      return `🛒 *PR Approved*\n\n*${pr.pr_no}* | ${pr.firm_code}\n*Vendor:* ${pr.vendor_name}\n*Items:* ${items}\n*Amount:* ₹${(+pr.total||0).toFixed(0)}\n*Requested by:* ${pr.created_by}\n*Urgency:* ${pr.urgency}\n\nApproved by Jigar ✅`;
    } else {
      return `❌ *PR Rejected*\n\n*${pr.pr_no}* | ${pr.firm_code}\n*Vendor:* ${pr.vendor_name}\n*Requested by:* ${pr.created_by}\n*Reason:* ${pr.rejection_reason||'See ERP for details'}`;
    }
  };

  const buildRejectMsg = (pr) => {
    return `❌ *PR Rejected — ${pr.pr_no}*\n\nYour Purchase Request has been rejected by Jigar.\n\n*Vendor:* ${pr.vendor_name}\n*Reason:* ${pr.rejection_reason||'Please check with Jigar for details'}\n\nPlease revise and resubmit from the ERP. You can edit the PR and resubmit for approval.`;
  };

  const approvePR = async (pr) => {
    setProcessing(pr.id);
    const updates = {status:'Approved', approved_by:'Jigar', approved_at: new Date().toISOString()};
    const {error} = await sb.from('purchase_requests').update(updates).eq('id', pr.id);
    if (error) { show('⚠️ Update failed: ' + error.message, false); setProcessing(null); return; }
    const updated = {...pr, ...updates};
    setPrs(p => p.map(x => x.id === pr.id ? updated : x));
    setProcessing(null);
    setWaButtons(p => ({...p, [pr.id]: true}));
    show('✅ ' + pr.pr_no + ' approved! Send WhatsApp notifications below.');
  };

  const rejectPR = async (pr) => {
    if (!rejReason.trim()) { show('Enter rejection reason', false); return; }
    setProcessing(pr.id);
    const updates = {status:'Rejected', rejected_by:'Jigar', rejected_at: new Date().toISOString(), rejection_reason: rejReason.trim()};
    const {error} = await sb.from('purchase_requests').update(updates).eq('id', pr.id);
    if (error) { show('⚠️ Update failed: ' + error.message, false); setProcessing(null); return; }
    const updated = {...pr, ...updates};
    setPrs(p => p.map(x => x.id === pr.id ? updated : x));
    setProcessing(null);
    setRejecting(null);
    setRejReason('');
    setWaButtons(p => ({...p, [pr.id]: true}));
    show('PR rejected. Send WhatsApp notification to requestor.');
  };

  const job = (jobId) => (jobs||[]).find(j => j.id === jobId);
  const firmColor = (code) => ({JPP:'#e3a008',JXT:'#3b82f6',VHD:'#8b5cf6'}[code]||'#64748b');

  return (
    <div style={{padding:12, overflowY:'auto', height:'100%'}}>
      {/* Header */}
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12, flexWrap:'wrap', gap:8}}>
        <div>
          <h2 style={{fontSize:14, fontWeight:800, color:'#f59e0b', margin:0}}>🔔 Purchase Approvals</h2>
          <p style={{fontSize:10, color:'#64748b', margin:'2px 0 0'}}>
            {pendingCount > 0
              ? <span style={{color:'#e3a008', fontWeight:700}}>{pendingCount} pending your approval</span>
              : <span style={{color:'#4ade80'}}>✓ All clear — no pending approvals</span>}
          </p>
        </div>
        <div style={{display:'flex', gap:4}}>
          {STATUS_FILTERS.map(f => (
            <button key={f} className={`b bs ${filter===f?'bp':''}`}
              onClick={() => setFilter(f)}
              style={{fontSize:9, padding:'3px 8px',
                ...(filter===f && f==='Pending Approval' ? {background:'#e3a00820',borderColor:'#e3a008',color:'#e3a008'} : {})}}>
              {f}{f==='Pending Approval' && pendingCount > 0 ? ` (${pendingCount})` : ''}
            </button>
          ))}
        </div>
      </div>

      {/* AiSensy API Key notice */}
      {META_WA_TOKEN && (
        <div style={{background:'#e3a00810', border:'1px solid #e3a00833', borderRadius:6, padding:'6px 10px', marginBottom:10, fontSize:9, color:'#e3a008'}}>
          ✅ <strong>WhatsApp API active</strong> — Meta Cloud API connected. Messages send automatically on approve/reject. Test token valid ~24hrs — add permanent token before it expires.
        </div>
      )}

      {/* PR Cards */}
      {filtered.length === 0 && (
        <div style={{textAlign:'center', padding:40, color:'#64748b', fontSize:11}}>
          {filter === 'Pending Approval' ? '🎉 No pending approvals!' : `No ${filter.toLowerCase()} PRs`}
        </div>
      )}

      <div style={{display:'flex', flexDirection:'column', gap:8}}>
        {filtered.map(pr => {
          const sc = stCol[pr.status] || {bg:'#64748b20', c:'#64748b'};
          const rItems = Array.isArray(pr.items) ? pr.items : [];
          const jb = job(pr.job_id);
          const isPending = pr.status === 'Pending Approval';
          const isApproved = pr.status === 'Approved';
          const isRejected = pr.status === 'Rejected';
          const showWA = waButtons[pr.id] || isApproved || isRejected;
          const requestorPhone = WA_NUMBERS[pr.created_by];

          return (
            <div key={pr.id} style={{background:'#0a0f1a', border:`1px solid ${isPending?'#e3a00844':'#1a2030'}`, borderRadius:8, padding:12,
              boxShadow: isPending ? '0 0 12px #e3a00811' : 'none'}}>

              {/* PR Header row */}
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:8, flexWrap:'wrap', gap:6}}>
                <div style={{display:'flex', alignItems:'center', gap:6, flexWrap:'wrap'}}>
                  <span style={{fontWeight:800, color:'#f59e0b', fontSize:12}}>{pr.pr_no}</span>
                  <span style={{padding:'1px 6px', borderRadius:3, fontSize:7, fontWeight:700, background:sc.bg, color:sc.c}}>{pr.status}</span>
                  {pr.urgency==='Urgent' && <span style={{padding:'1px 5px', borderRadius:3, fontSize:7, fontWeight:700, background:'#f4706720', color:'#f47067'}}>🔴 URGENT</span>}
                  <span style={{padding:'1px 6px', borderRadius:3, fontSize:8, fontWeight:700, background:firmColor(pr.firm_code)+'20', color:firmColor(pr.firm_code)}}>{pr.firm_code}</span>
                  <span style={{fontSize:9, color:'#64748b'}}>{pr.request_type}</span>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontWeight:800, color:'#e3a008', fontSize:13}}>₹{(+pr.total||0).toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
                  <div style={{fontSize:8, color:'#64748b'}}>GST incl: ₹{(+pr.gst_total||0).toFixed(0)}</div>
                </div>
              </div>

              {/* Meta row */}
              <div style={{display:'flex', gap:12, flexWrap:'wrap', marginBottom:8, fontSize:9}}>
                <span>🏢 <strong style={{color:'#c9d1d9'}}>{pr.vendor_name}</strong>{pr.vendor_gstin&&<span style={{color:'#64748b'}}> · {pr.vendor_gstin}</span>}</span>
                <span>👤 <span style={{color:'#94a3b8'}}>by {pr.created_by}</span></span>
                {jb && <span>📋 <span style={{color:'#64748b'}}>Job {pr.job_id} · {jb.client_name}</span></span>}
                {pr.expected_delivery && <span>📅 <span style={{color:'#06b6d4'}}>By {pr.expected_delivery}</span></span>}
                {pr.payment_terms && <span>💳 <span style={{color:'#64748b'}}>{pr.payment_terms}</span></span>}
                <span style={{color:'#64748b', fontSize:8}}>{new Date(pr.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
              </div>

              {/* Items */}
              <div style={{background:'#060810', borderRadius:5, padding:'6px 8px', marginBottom:8}}>
                <table style={{width:'100%'}}>
                  <thead><tr>
                    <th style={{fontSize:7, color:'#64748b', textAlign:'left', paddingBottom:3}}>Item</th>
                    <th style={{fontSize:7, color:'#64748b', textAlign:'right'}}>Qty</th>
                    <th style={{fontSize:7, color:'#64748b', textAlign:'right'}}>Rate</th>
                    <th style={{fontSize:7, color:'#64748b', textAlign:'right'}}>GST</th>
                    <th style={{fontSize:7, color:'#64748b', textAlign:'right'}}>Amount</th>
                  </tr></thead>
                  <tbody>{rItems.map((x,xi) => (
                    <tr key={xi}>
                      <td style={{fontSize:9, color:'#c9d1d9', paddingRight:8}}>{x.product}{x.size ? <span style={{color:'#64748b'}}> ({x.size})</span> : ''}</td>
                      <td style={{fontSize:9, color:'#94a3b8', textAlign:'right'}}>{x.qty} {x.per}</td>
                      <td style={{fontSize:9, color:'#94a3b8', textAlign:'right'}}>₹{x.rate}</td>
                      <td style={{fontSize:9, color:'#64748b', textAlign:'right'}}>{x.gst_pct}%</td>
                      <td style={{fontSize:9, color:'#e3a008', fontWeight:700, textAlign:'right'}}>₹{((+x.qty||0)*(+x.rate||0)).toFixed(0)}</td>
                    </tr>
                  ))}</tbody>
                </table>
                {(+pr.transport>0) && <div style={{textAlign:'right', fontSize:8, color:'#64748b', marginTop:3}}>+ Transport ₹{pr.transport}</div>}
              </div>

              {pr.notes && <div style={{fontSize:9, color:'#64748b', marginBottom:8, fontStyle:'italic'}}>📝 {pr.notes}</div>}
              {pr.rejection_reason && <div style={{background:'#f4706710', border:'1px solid #f4706733', borderRadius:4, padding:'4px 8px', fontSize:9, color:'#f47067', marginBottom:8}}>❌ Rejected: {pr.rejection_reason}</div>}

              {/* Action buttons — Pending Approval */}
              {isPending && rejecting !== pr.id && (
                <div style={{display:'flex', gap:6, alignItems:'center', flexWrap:'wrap'}}>
                  <button className="b bp" onClick={() => approvePR(pr)} disabled={processing===pr.id}
                    style={{fontSize:10, padding:'5px 16px', background:'#4ade80', borderColor:'#4ade80', color:'#000', fontWeight:700}}>
                    {processing===pr.id ? '...' : '✅ Approve'}
                  </button>
                  <button className="b" onClick={() => {setRejecting(pr.id); setRejReason('');}}
                    style={{fontSize:10, padding:'5px 14px', borderColor:'#f47067', color:'#f47067'}}>
                    ❌ Reject
                  </button>
                  <span style={{flex:1}}/>
                  <span style={{fontSize:8, color:'#64748b'}}>Requested by {pr.created_by} · ₹{(+pr.total||0).toFixed(0)}</span>
                </div>
              )}

              {/* Rejection reason input */}
              {isPending && rejecting === pr.id && (
                <div style={{background:'#f4706710', border:'1px solid #f4706733', borderRadius:6, padding:8}}>
                  <p style={{fontSize:9, color:'#f47067', fontWeight:700, marginBottom:6}}>❌ Rejection Reason</p>
                  <input className="in" value={rejReason} onChange={e=>setRejReason(e.target.value)}
                    placeholder="e.g. Rate too high — get 2 more quotes, Wrong vendor for this type of work..."
                    style={{fontSize:9, padding:'4px 8px', width:'100%', marginBottom:6, borderColor:'#f4706766'}}
                    onKeyDown={e => e.key==='Enter' && rejectPR(pr)}
                    autoFocus/>
                  <div style={{display:'flex', gap:4}}>
                    <button className="b bp" onClick={() => rejectPR(pr)} disabled={processing===pr.id}
                      style={{fontSize:10, padding:'4px 14px', background:'#f47067', borderColor:'#f47067', color:'#fff', fontWeight:700}}>
                      {processing===pr.id ? '...' : '❌ Confirm Reject'}
                    </button>
                    <button className="b bs" onClick={() => {setRejecting(null); setRejReason('');}}
                      style={{fontSize:9, padding:'4px 10px'}}>Cancel</button>
                  </div>
                </div>
              )}

              {/* WhatsApp buttons — shown after action OR for already approved/rejected */}
              {showWA && (
                <div style={{marginTop:8, padding:'8px 10px', background:'#0d2818', border:'1px solid #25d36633', borderRadius:6}}>
                  <p style={{fontSize:8, color:'#25d366', fontWeight:700, marginBottom:6}}>📱 WhatsApp Notifications {META_WA_TOKEN ? '(Auto-send via Meta API ✅)' : '(Click to open pre-filled)'}</p>
                  <div style={{display:'flex', gap:4, flexWrap:'wrap'}}>
                    {/* Notify Requestor */}
                    {requestorPhone && (
                      <button className="b" onClick={() => sendWhatsApp(requestorPhone,
                        isApproved ? buildApproveMsg(pr) : buildRejectMsg({...pr}),
                        isApproved ? 'iprint_pr_approved' : 'iprint_pr_rejected')}
                        style={{fontSize:9, padding:'4px 10px', background:'#25d36620', borderColor:'#25d36644', color:'#25d366'}}>
                        📱 Notify {pr.created_by}
                      </button>
                    )}
                    {/* Notify Vendor — only on approval */}
                    {isApproved && pr.vendor_phone && (
                      <button className="b" onClick={() => sendWhatsApp(pr.vendor_phone.replace(/\D/g,'').replace(/^0/,'91').replace(/^(?!91)/,'91'),
                        buildVendorMsg(pr), 'iprint_vendor_notify')}
                        style={{fontSize:9, padding:'4px 10px', background:'#25d36620', borderColor:'#25d36644', color:'#25d366'}}>
                        📱 Message Vendor
                      </button>
                    )}
                    {/* iPrint Group */}
                    <button className="b" onClick={() => {
                        const msg = buildGroupMsg(pr, isApproved ? 'approved' : 'rejected');
                        navigator.clipboard?.writeText(msg).catch(()=>{});
                        window.open(WA_GROUP, '_blank');
                        show('Message copied! Paste it in the group 📋');
                      }}
                      style={{fontSize:9, padding:'4px 10px', background:'#25d36620', borderColor:'#25d36644', color:'#25d366'}}>
                      👥 Post to iPrint Group
                    </button>
                    {/* Notify Shreya for PO — only on approval */}
                    {isApproved && (
                      <button className="b" onClick={() => sendWhatsApp(WA_NUMBERS['Shreya'],
                        `📄 *PO Required — ${pr.pr_no}*\n\nPlease generate a PO for:\n*Vendor:* ${pr.vendor_name}\n*Amount:* ₹${(+pr.total||0).toFixed(0)}\n*Firm:* ${pr.firm_code}\n*Payment Terms:* ${pr.payment_terms||'TBD'}\n\nApproved by Jigar ✅`, 'iprint_po_request')}
                        style={{fontSize:9, padding:'4px 10px', background:'#3b82f620', borderColor:'#3b82f644', color:'#3b82f6'}}>
                        📄 Request PO from Shreya
                      </button>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function RemPage({jobs,osItems,setOsItems,items,reqs,setReqs}){const rem=jobs.filter(j=>!j.po_number).map(j=>({...j,d:Math.max(0,Math.floor((new Date()-new Date(j.created_at))/864e5))})).sort((a,b)=>b.d-a.d);
  const pendingOs=(osItems||[]).filter(o=>o.po_status==='Pending');
  const pendingReqs=(reqs||[]).filter(r=>r.po_status==='Pending');
  const updateOsPO=async(osId,poNum)=>{
    const {error}=await sb.from('outsource_items').update({po_status:poNum?'PO Generated':'Pending',po_number:poNum}).eq('id',osId);
    if(!error&&setOsItems)setOsItems(p=>p.map(o=>o.id===osId?{...o,po_status:poNum?'PO Generated':'Pending',po_number:poNum}:o));
  };
  const updateReqPO=async(rId,poNum)=>{
    const {error}=await sb.from('requisitions').update({po_status:poNum?'PO Generated':'Pending',po_number:poNum}).eq('id',rId);
    if(!error&&setReqs)setReqs(p=>p.map(r=>r.id===rId?{...r,po_status:poNum?'PO Generated':'Pending',po_number:poNum}:r));
  };
  return <div>
  {pendingReqs.length>0&&<div className="c" style={{marginBottom:12,borderColor:"#8b5cf644"}}>
    <h3 style={{fontSize:12,fontWeight:700,color:"#8b5cf6",marginBottom:8}}>📋 Requisition PO Pending ({pendingReqs.length})</h3>
    <table><thead><tr><th>Req#</th><th>Job</th><th>Vendor</th><th>Items</th><th>Total</th><th>By</th><th>Date</th><th>PO#</th><th></th></tr></thead>
    <tbody>{pendingReqs.map(r=>{const rItems=Array.isArray(r.items)?r.items:[];
      return <tr key={r.id}>
        <td style={{fontWeight:800,color:"#8b5cf6",fontSize:11}}>#{r.req_no}</td>
        <td className="mn" style={{color:"#e3a008",fontWeight:700,fontSize:10}}>{r.job_id}</td>
        <td style={{fontSize:9}}>{r.vendor_name}</td>
        <td style={{fontSize:8,color:"#8b949e"}}>{rItems.map(x=>x.product).join(', ').slice(0,40)}</td>
        <td className="mn" style={{fontWeight:700,fontSize:10,color:"#e3a008"}}>₹{(+r.total||0).toFixed(0)}</td>
        <td style={{fontSize:8,color:"#64748b"}}>{r.created_by}</td>
        <td style={{fontSize:8,color:"#64748b"}}>{r.date}</td>
        <td><input className="in mn" placeholder="Enter PO#" style={{width:80,fontSize:9,padding:"2px 4px"}} onKeyDown={e=>{if(e.key==='Enter'&&e.target.value){updateReqPO(r.id,e.target.value);e.target.value='';}}}/></td>
        <td><button className="b bp" style={{fontSize:8,padding:"2px 6px",background:"#8b5cf6",borderColor:"#8b5cf6"}} onClick={e=>{const inp=e.target.parentElement.previousElementSibling?.querySelector('input');if(inp?.value){updateReqPO(r.id,inp.value);inp.value='';}}}>✓ PO</button></td>
      </tr>})}</tbody></table>
  </div>}
  {pendingOs.length>0&&<div className="c" style={{marginBottom:12,borderColor:"#f9731644"}}>
    <h3 style={{fontSize:12,fontWeight:700,color:"#f97316",marginBottom:8}}>🔧 Outsource PO Pending ({pendingOs.length})</h3>
    <table><thead><tr><th>Job</th><th>Item</th><th>Task</th><th>Vendor</th><th>Rate</th><th>Total</th><th>Added By</th><th>PO#</th><th></th></tr></thead>
    <tbody>{pendingOs.map(o=>{const li=(items||[]).find(i=>i.id===o.line_item_id);const jb=jobs.find(j=>j.id===o.job_id);
      return <tr key={o.id}>
        <td className="mn" style={{color:"#e3a008",fontWeight:700,fontSize:10}}>{o.job_id}</td>
        <td style={{fontSize:9}}>{li?.internal_name||'—'}</td>
        <td style={{fontWeight:600,color:"#f97316",fontSize:9}}>{o.task_type}</td>
        <td style={{fontSize:9}}>{o.vendor_name}</td>
        <td className="mn" style={{fontSize:9}}>₹{(+o.rate||0).toFixed(2)}/{o.rate_mode}</td>
        <td className="mn" style={{fontWeight:700,fontSize:10,color:"#e3a008"}}>₹{(+o.total||0).toFixed(2)}</td>
        <td style={{fontSize:8,color:"#64748b"}}>{o.created_by}</td>
        <td><input className="in mn" placeholder="Enter PO#" style={{width:80,fontSize:9,padding:"2px 4px"}} onKeyDown={e=>{if(e.key==='Enter'&&e.target.value){updateOsPO(o.id,e.target.value);e.target.value='';}}}/></td>
        <td><button className="b bp" style={{fontSize:8,padding:"2px 6px"}} onClick={e=>{const inp=e.target.parentElement.previousElementSibling?.querySelector('input');if(inp?.value){updateOsPO(o.id,inp.value);inp.value='';}}}>✓ PO</button></td>
      </tr>})}</tbody></table>
  </div>}
  <div className="c" style={{padding:0}}><table><thead><tr><th>Job</th><th>Client</th><th>Project</th><th>Days</th><th></th></tr></thead><tbody>
    {rem.map(j=><tr key={j.id}><td className="mn" style={{color:"#e3a008",fontWeight:700}}>{j.id}</td><td>{j.client_name?.slice(0,22)}</td><td style={{color:"#64748b"}}>{j.project}</td><td><span style={{color:j.d>30?"#ef4444":"#f59e0b",fontWeight:700}}>{j.d}d</span></td><td><button className="b br bs" onClick={()=>window.open(`mailto:?subject=PO Reminder-${j.id}&body=Dear ${j.contact_person},%0AReminder for PO:%0AJob:${j.id}%0AProject:${j.project}%0APending:${j.d} days%0ARegards,iPrint`)}>📧</button></td></tr>)}
    {rem.length===0&&<tr><td colSpan={5} style={{textAlign:"center",color:"#4ade80",padding:16}}>All POs received!</td></tr>}
  </tbody></table></div></div>;
}

// CLIENTS
function CliPage({clients,jobs,s}){const fl=clients.filter(c=>!s||c.name?.toLowerCase().includes(s.toLowerCase()));
  return <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:7}}>{fl.map(c=>{const cj=jobs.filter(j=>j.client_id===c.id);return <div key={c.id} className="c a" style={{padding:10}}><h4 style={{fontSize:11.5,fontWeight:700}}>{c.name?.slice(0,26)}</h4><p style={{fontSize:10,color:"#64748b"}}>{c.contact} · {c.phone}</p><p style={{fontSize:10,marginTop:3}}><strong>{cj.length}</strong> jobs</p></div>;})}</div>;
}

// ACCOUNTS
function AccPage({jobs,batches,items,saveBill,firms,updateJobStatus,updateJobFile,appendJobFiles,removeJobFile,show,addBatchToJob}){
  const [tab,setTab]=useState('pending');
  const [invoices,setInvoices]=useState({});
  const [sq,setSq]=useState('');
  const [statusFilter,setStatusFilter]=useState('All');
  const tabs=[
    {id:'pending',l:'All Pending',c:'#f59e0b',statuses:['Billing Pending','Given for Billing','Delivered','Cash Pending','Proforma Invoice','IC Pending']},
    {id:'given',l:'Given for Billing',c:'#06b6d4',statuses:['Given for Billing','Delivered']},
    {id:'done',l:'Billing Completed',c:'#4ade80',statuses:['Billing Done','Cash Received','No Bill']},
  ];
  const cur=tabs.find(t=>t.id===tab);
  const filtered=jobs.filter(j=>{
    if(!cur.statuses.includes(j.status))return false;
    if(statusFilter!=='All'&&j.status!==statusFilter)return false;
    if(sq){const q=sq.toLowerCase();return j.id?.toLowerCase().includes(q)||j.client_name?.toLowerCase().includes(q)||j.project?.toLowerCase().includes(q)||j.po_number?.toLowerCase().includes(q)||(j.batches||[]).some(b=>b.bill_no?.toLowerCase().includes(q));}
    return true;
  });
  const sc={'Billing Pending':'#f59e0b','Cash Pending':'#e3a008','Proforma Invoice':'#8b5cf6','IC Pending':'#f47067','Given for Billing':'#06b6d4','Delivered':'#10b981','Billing Done':'#4ade80','Cash Received':'#4ade80','No Bill':'#64748b'};
  const addInvoice=async(j)=>{
    const inv=(invoices[j.id]||'').trim();
    if(!inv){alert("Enter invoice# first");return;}
    // Find a batch without bill_no, or create a new one
    const jBatches=(j.batches||[]);
    const emptyBatch=jBatches.find(b=>!b.bill_no);
    if(emptyBatch){
      saveBill(emptyBatch.id,inv);
    } else {
      // Create a new batch for this invoice
      const bid="B"+uid();
      const bd={id:bid,job_id:j.id,date:td(),note:"Invoice: "+inv,bill_no:inv,status:"Done"};
      if(addBatchToJob) await addBatchToJob(bd);
    }
    setInvoices(p=>({...p,[j.id]:''}));
    show("✅ Invoice "+inv+" added to "+j.id);
  };
  const markBilled=async(j)=>{
    const existingInv=(j.batches||[]).map(b=>b.bill_no).filter(Boolean);
    if(existingInv.length===0){alert("Add at least one invoice# first");return;}
    updateJobStatus(j.id,'Billing Done');
    show("✅ "+j.id+" → Billing Done ("+existingInv.length+" invoice(s))");
  };
  const InvChips=({j,editable})=>{
    const bills=(j.batches||[]).map(b=>b.bill_no).filter(Boolean);
    return <div style={{display:'flex',flexWrap:'wrap',gap:2,alignItems:'center'}}>
      {bills.map((b,i)=><span key={i} className="bd" style={{background:'#06b6d420',color:'#06b6d4',fontSize:9,padding:'1px 6px'}}>{b}</span>)}
      {editable&&<div style={{display:'flex',gap:2,alignItems:'center',marginTop:bills.length?2:0}}>
        <input className="in mn" style={{width:90,fontSize:9,padding:'2px 4px'}} placeholder="New Inv#" value={invoices[j.id]||''} onChange={e=>setInvoices(p=>({...p,[j.id]:e.target.value}))} onKeyDown={e=>{if(e.key==='Enter')addInvoice(j);}}/>
        <button className="b bg bs" style={{fontSize:8,padding:'2px 6px',whiteSpace:'nowrap'}} onClick={()=>addInvoice(j)}>➕ Add</button>
      </div>}
    </div>;
  };
  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    <div style={{display:"flex",justifyContent:"space-between",gap:4,flexWrap:"wrap"}}>
      <div style={{display:"flex",gap:3}}>{tabs.map(t=><button key={t.id} className={`b ${tab===t.id?"bp":""}`} onClick={()=>{setTab(t.id);setStatusFilter('All');}} style={tab!==t.id?{borderColor:t.c+"55",color:t.c}:{}}>{t.l} ({jobs.filter(j=>t.statuses.includes(j.status)).length})</button>)}</div>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <select className="in" value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{fontSize:10,padding:"4px 6px",width:140}}>
          <option value="All">All Statuses ({cur.statuses.reduce((c,st)=>c+jobs.filter(j=>j.status===st).length,0)})</option>
          {cur.statuses.map(st=>{const cnt=jobs.filter(j=>j.status===st).length;return <option key={st} value={st}>{st} ({cnt})</option>;})}
        </select>
        <div style={{position:"relative"}}><input className="in" placeholder="🔍 Search Job#, Client, PO, Inv#..." value={sq} onChange={e=>setSq(e.target.value)} style={{width:200,fontSize:10,paddingLeft:8}}/>{sq&&<button style={{position:"absolute",right:4,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:10}} onClick={()=>setSq('')}>✕</button>}</div>
      </div>
    </div>
    <div className="c" style={{padding:0}}><div style={{padding:"6px 8px",borderBottom:`2px solid ${cur.c}`,background:"#0a0f1a"}}><span style={{fontSize:10,fontWeight:700,color:cur.c}}>{statusFilter!=='All'?statusFilter:cur.l} — {filtered.length} jobs{sq?` matching "${sq}"`:''}</span></div>
    <div style={{overflowX:"auto",maxHeight:"calc(100vh-180px)"}}><table><thead><tr><th>Job</th><th>Firm</th><th>Client</th><th>Project</th><th>Status</th><th>PO</th><th>Invoices</th>{tab!=='done'&&<><th>📎 DC</th><th>📎 IC</th><th>Action</th></>}</tr></thead><tbody>
      {filtered.map(j=>{ return <tr key={j.id}><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700}}><StatusTip j={j}>{j.id}</StatusTip></td><td><FB f={j.firm} firms={firms}/></td><td style={{fontSize:10}}>{j.client_name?.slice(0,22)}</td><td style={{fontSize:10,color:"#64748b"}}>{j.project?.slice(0,18)}</td><td><StatusTip j={j}><span className="bd" style={{background:(sc[j.status]||'#64748b')+'20',color:sc[j.status]||'#64748b'}}>{j.status}</span></StatusTip></td><td style={{fontSize:10}}>{j.po_number?<span style={{color:"#4ade80"}}>✓</span>:<span style={{color:"#f47067"}}>⚠️</span>}</td>
        <td style={{minWidth:140}}><InvChips j={j} editable={tab!=='done'}/></td>
        {tab!=='done'&&<><td style={{minWidth:90}}>{(()=>{const urls=Array.isArray(j.dc_file_url)?j.dc_file_url:j.dc_file_url?[j.dc_file_url]:[];return <div>{urls.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:2,marginBottom:3}}>{urls.map((u,i)=><span key={i} style={{display:"inline-flex",alignItems:"center",gap:3,background:"#3b82f615",border:"1px solid #3b82f633",padding:"2px 6px",borderRadius:4}}><a href={u} target="_blank" style={{color:"#3b82f6",fontSize:9}}>📄{i+1}</a><button style={{background:"#f4706720",border:"1px solid #f4706744",borderRadius:3,color:"#f47067",cursor:"pointer",fontSize:9,padding:"0 4px",lineHeight:"14px",fontWeight:700}} onClick={()=>{if(confirm('Remove this DC file?'))removeJobFile(j.id,'dc_file_url',u)}}>✕</button></span>)}</div>}<input type="file" accept=".pdf,.jpg,.png" multiple className="in" style={{padding:1,fontSize:8,width:70}} onChange={async e=>{const files=[...e.target.files];if(files.length){const newUrls=await uploadMultiple(files,'accounts-dc');if(newUrls.length&&appendJobFiles)appendJobFiles(j.id,'dc_file_url',newUrls);}}}/></div>;})()}</td><td style={{minWidth:90}}>{(()=>{const urls=Array.isArray(j.ic_file_url)?j.ic_file_url:j.ic_file_url?[j.ic_file_url]:[];return <div>{urls.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:2,marginBottom:3}}>{urls.map((u,i)=><span key={i} style={{display:"inline-flex",alignItems:"center",gap:3,background:"#3b82f615",border:"1px solid #3b82f633",padding:"2px 6px",borderRadius:4}}><a href={u} target="_blank" style={{color:"#3b82f6",fontSize:9}}>📄{i+1}</a><button style={{background:"#f4706720",border:"1px solid #f4706744",borderRadius:3,color:"#f47067",cursor:"pointer",fontSize:9,padding:"0 4px",lineHeight:"14px",fontWeight:700}} onClick={()=>{if(confirm('Remove this IC file?'))removeJobFile(j.id,'ic_file_url',u)}}>✕</button></span>)}</div>}<input type="file" accept=".pdf,.jpg,.png" multiple className="in" style={{padding:1,fontSize:8,width:70}} onChange={async e=>{const files=[...e.target.files];if(files.length){const newUrls=await uploadMultiple(files,'accounts-ic');if(newUrls.length&&appendJobFiles)appendJobFiles(j.id,'ic_file_url',newUrls);}}}/></div>;})()}</td><td><button className="b bg bs" onClick={()=>markBilled(j)}>✓ Bill Done</button></td></>}
      </tr>})}
      {filtered.length===0&&<tr><td colSpan={tab!=='done'?10:7} style={{textAlign:"center",color:"#4ade80",padding:20}}>No jobs in this category</td></tr>}
    </tbody></table></div></div>
  </div>;
}

// ═══════════════════════════════════════════════════════════
// BOQ IMPORT — Smart Excel/CSV parser for client BOQs
// ═══════════════════════════════════════════════════════════
function BOQImportPage({firms,clients,products,team,machines,createJob,sp,jobs,user}){
  const [step,setStep]=useState(1);
  const [sheets,setSheets]=useState([]);
  const [selSheets,setSelSheets]=useState([]);
  const [parsedItems,setParsedItems]=useState([]);
  const [its,setIts]=useState([]);
  const [fm,sfm]=useState("JXT");
  const [f,sF]=useState({cl:"",cn:"",cp:"",cph:"",cemail:"",po:"",da:"",pr:"",rd:td(),mb:team[0]?.name||"",pt:"50% Advance. Rest within 30 days.",remark:""});
  const [su,sSu]=useState("INCH");
  const [submitting,setSubmitting]=useState(false);
  const [err,setErr]=useState("");
  const [fileName,setFileName]=useState("");
  const [colHeaders,setColHeaders]=useState([]);
  const [colMap,setColMap]=useState({});
  const [headerRow,setHeaderRow]=useState(0);
  const [importMode,setImportMode]=useState('one_job'); // 'one_job' or 'multi_job'
  const [syncBanking,setSyncBanking]=useState(false);
  const [bankProject,setBankProject]=useState('');
  const BANK_PROJECTS=['NCR SBI BRANDING','NCR SBI GSB','NCR PNB GSB','NCR BOB GSB','CMS SBI GSB+LOLLIPOP','CMS SBI BRANDING','CMS BOB GSB+BRANDING','Diebold HDFC GSB'];
  const BANK_MAP={'NCR SBI BRANDING':['NCR','SBI'],'NCR SBI GSB':['NCR','SBI'],'NCR PNB GSB':['NCR','PNB'],'NCR BOB GSB':['NCR','BOB'],'CMS SBI GSB+LOLLIPOP':['CMS','SBI'],'CMS SBI BRANDING':['CMS','SBI'],'CMS BOB GSB+BRANDING':['CMS','BOB'],'Diebold HDFC GSB':['Diebold','HDFC']};

  // Smart size parser — handles all formats: "Width- 16in Height- 24in", "8\"x12\"", "3ftx4ft", "1177.5MM x350.3MM", "18″ × 24″"
  const parseSize=(sizeStr)=>{
    if(!sizeStr||typeof sizeStr!=='string') return {w:'',h:''};
    const s=sizeStr.replace(/\\n/g,' ').replace(/\n/g,' ').replace(/[″″]/g,'"').replace(/['']/g,"'").trim();
    // Pattern: Width- 16in Height- 24in / Width:15 Inch Height:4 Inch
    const wm=s.match(/width[:\-\s]*(\d+\.?\d*)\s*(in|inch|mm|ft)?/i);
    const hm=s.match(/height[:\-\s]*(\d+\.?\d*)\s*(in|inch|mm|ft)?/i);
    if(wm&&hm) return {w:wm[1],h:hm[1]};
    // Pattern: 3ftx4ft / 8"x12" / 18″ × 24″ / 1177.5MM x 350.3MM
    const xm=s.match(/(\d+\.?\d*)\s*(?:"|"|″|ft|in|inch|mm|cm|')?\s*[x×]\s*(\d+\.?\d*)\s*(?:"|"|″|ft|in|inch|mm|cm|')?/i);
    if(xm) return {w:xm[1],h:xm[2]};
    // Pattern: just "54 Inch Height" (single dimension)
    const single=s.match(/(\d+\.?\d*)\s*(in|inch|mm|ft|"|″)/i);
    if(single) return {w:single[1],h:''};
    return {w:'',h:''};
  };

  // Auto-detect header row (may not be row 0 — JPMC has 8 rows of company info)
  const findHeaderRow=(data)=>{
    for(let i=0;i<Math.min(15,data.length);i++){
      const row=data[i];if(!row)continue;
      const txt=row.map(c=>String(c||'').toLowerCase()).join(' ');
      if(/(sl\.?\s*no|sr\.?\s*no)/.test(txt)&&/(description|particular|specification|item|job desc|signage|product)/.test(txt)) return i;
      if(/(description|particular|item|job desc|signage\s*name|product\s*name)/.test(txt)&&/(qty|quantity|unit|uom|nos|sqft|sft|size)/.test(txt)) return i;
      if(/(sl\.?\s*no|sr\.?\s*no)/.test(txt)&&/(qty|quantity|unit|uom|rate|amount)/.test(txt)) return i;
      // CMS/Banking BOQ: has site code + address + job description
      if(/(sr\.?\s*no|sl\.?\s*no)/.test(txt)&&/(site\s*code|atm\s*id)/.test(txt)&&/(address|location)/.test(txt)) return i;
    }
    return 0;
  };

  // Smart column detector — finds columns by fuzzy matching headers
  // Also checks the row BELOW for split headers (e.g. "SIZES IN INCHES" → "WIDTH" | "HEIGHT")
  const detectColumns=(headers,nextRow)=>{
    const h=headers.map(x=>String(x||'').toLowerCase().replace(/[\s\n]/g,' ').trim());
    const h2=nextRow?nextRow.map(x=>String(x||'').toLowerCase().replace(/[\s\n]/g,' ').trim()):[];
    const find=(patterns)=>{for(const p of patterns){const idx=h.findIndex(c=>p.test(c));if(idx>=0)return idx;}return -1;};
    const find2=(patterns)=>{for(const p of patterns){const idx=h2.findIndex(c=>p.test(c));if(idx>=0)return idx;}return -1;};
    let width=find([/^width$/,/width/]);
    let height=find([/^height$/,/height/]);
    // Check next row for split headers like "SIZES IN INCHES" → next row has WIDTH|HEIGHT
    if(width<0&&h2.length>0){width=find2([/^width$/,/width/]);}
    if(height<0&&h2.length>0){height=find2([/^height$/,/height/]);}
    return {
      sr:find([/^sl|^sr|^s\.?\s*no|^#/]),
      desc:find([/description|particular|^item$|job desc|signage\s*name|product\s*name|^name$/]),
      spec:find([/^specification|^material|media\s*make/]),
      wallNo:find([/wall.*no|location|zone/]),
      floor:find([/^floor$/]),
      size:find([/^size$|size.*in|size.*\(|^uom$|^umo$|flex\s*size/]),
      width,height,
      uom:find([/uom|umo|^unit$|^units$/]),
      qty:find([/^qty|quantit|^nos$/]),
      supplyRate:find([/supply.*rate|^rate$|unit rate/]),
      installRate:find([/install.*rate/]),
      totalAmt:find([/total.*amount|total.*amt|^amount$/]),
      remarks:find([/remark/]),
      refImage:find([/ref.*image|^image|reference/]),
      length:find([/^length$/]),
      breadth:find([/^breadth$/]),
      // CMS/Banking specific columns
      siteCode:find([/site\s*code|atm\s*id|branch\s*code/]),
      address:find([/^address$|new\s*address|site\s*address/]),
      pincode:find([/pin\s*code|pincode|^pin$/]),
      city:find([/^city$/]),
      district:find([/^district$/]),
      state:find([/^state$/]),
      fieldOfficer:find([/field\s*officer|f\.?\s*o|contact/]),
    };
  };

  // Parse an Excel sheet into standardized items
  const parseSheet=(data,sheetName)=>{
    if(!data||data.length<2) return [];
    const hRow=findHeaderRow(data);
    const headers=data[hRow];
    const nextRow=data[hRow+1]||[];
    const cols=detectColumns(headers,nextRow);
    // Check if next row is a sub-header (e.g. WIDTH|HEIGHT under "SIZES IN INCHES")
    const nextRowTxt=(nextRow||[]).map(c=>String(c||'').toLowerCase().trim()).join(' ');
    const hasSplitHeader=/width|height|breadth/.test(nextRowTxt)&&cols.desc>-1;
    const startRow=hasSplitHeader?hRow+2:hRow+1;
    const items=[];
    let lastFloor='';
    for(let r=startRow;r<data.length;r++){
      const row=data[r];
      if(!row||row.every(c=>c===null||c===undefined||c===''))continue;
      // Skip summary/total rows
      const allCellsTxt=row.map(c=>String(c||'').toLowerCase().trim()).join(' ');
      if(/^(sub\s*total|basic|gst|total|general\s*point|note|grand total)/i.test(String(row[0]||'').trim()))continue;
      if(/^(sub\s*total|total|grand total)/i.test(allCellsTxt.slice(0,20)))continue;
      // Skip section headers (no qty, just category names)
      
      const desc=cols.desc>-1?String(row[cols.desc]||''):'';
      const spec=cols.spec>-1?String(row[cols.spec]||''):'';
      const wallNo=cols.wallNo>-1?String(row[cols.wallNo]||''):'';
      const floor=cols.floor>-1?String(row[cols.floor]||''):'';
      const siteCode=cols.siteCode>-1?String(row[cols.siteCode]||''):'';
      if(floor&&floor!=='nan')lastFloor=floor.replace(/\\n/g,' ');
      if(!desc&&!wallNo&&!spec&&!siteCode)continue;
      if(/^nan$/i.test(desc)&&!wallNo&&!spec&&!siteCode)continue;

      let w='',h='';
      if(cols.width>-1&&cols.height>-1){
        w=String(row[cols.width]||'');h=String(row[cols.height]||'');
      } else if(cols.length>-1&&(cols.height>-1||cols.breadth>-1)){
        w=String(row[cols.length]||'');h=String(row[cols.breadth>-1?cols.breadth:cols.height]||'');
      } else if(cols.size>-1){
        const sizeVal=row[cols.size];
        // If size column has a number, treat it as width and next column as height (CMS Flex Size format)
        if(sizeVal&&!isNaN(+sizeVal)&&row[cols.size+1]&&!isNaN(+row[cols.size+1])){
          w=String(sizeVal);h=String(row[cols.size+1]);
        } else {
          const parsed=parseSize(String(sizeVal||''));
          w=parsed.w;h=parsed.h;
        }
      }
      // Also try parsing size from description or spec (e.g. "18″ × 24″")
      if(!w&&!h&&desc){const descSize=parseSize(desc);w=descSize.w;h=descSize.h;}
      if(!w&&!h&&spec){const specSize=parseSize(spec);w=specSize.w;h=specSize.h;}
      // Try UOM column for size (some BOQs put size in UOM like '18″ × 24″')
      if(!w&&!h&&cols.uom>-1){const uomSize=parseSize(String(row[cols.uom]||''));w=uomSize.w;h=uomSize.h;}
      
      const qty=cols.qty>-1?(+row[cols.qty]||0):0;
      // For CMS BOQs with site codes, default qty to 1 if no explicit qty column
      if(qty<=0&&!siteCode)continue;
      const finalQty=qty>0?qty:1;
      const uom=cols.uom>-1?String(row[cols.uom]||'Nos'):'Nos';
      const remarks=cols.remarks>-1?String(row[cols.remarks]||''):'';
      const sRate=cols.supplyRate>-1?(+row[cols.supplyRate]||0):0;
      const iRate=cols.installRate>-1?(+row[cols.installRate]||0):0;

      // Build label: [SiteCode] [Floor] [WallNo]: Description
      let label=desc.slice(0,100);
      if(siteCode&&!/^nan$/i.test(siteCode)) label=siteCode.replace(/\\n/g,' ').trim()+(desc?' — '+label:'');
      else{
        if(wallNo&&!/^nan$/i.test(wallNo)) label=wallNo.replace(/\\n/g,' ').trim()+': '+label;
        if(lastFloor) label=lastFloor+' — '+label;
      }
      
      // Material: combine spec + remarks + CMS address
      let mat=(spec&&!/^nan$/i.test(spec)?spec.replace(/\\n/g,' ').slice(0,80):'');
      if(remarks&&!/^nan$/i.test(remarks)){
        mat=mat?(mat+' | '+remarks.replace(/\\n/g,' ').slice(0,60)):remarks.replace(/\\n/g,' ').slice(0,80);
      }
      // For CMS BOQs, build full site address as material/remarks
      let siteAddr='';
      if(cols.address>-1){
        const parts=[row[cols.address],row[cols.city],row[cols.district],row[cols.state],row[cols.pincode]].filter(v=>v&&String(v).trim()&&!/^nan$/i.test(String(v)));
        siteAddr=parts.map(v=>String(v).trim()).join(', ');
        if(siteAddr&&!mat) mat=siteAddr;
        else if(siteAddr) mat=mat+' | '+siteAddr;
      }
      // Field officer
      const fo=cols.fieldOfficer>-1?String(row[cols.fieldOfficer]||'').trim():'';
      if(fo&&!/^nan$/i.test(fo)) mat=mat?(mat+' | FO: '+fo):('FO: '+fo);

      items.push({
        sr:items.length+1,sheet:sheetName,desc:label.replace(/\\n/g,' '),fullDesc:desc+(spec?'\n\nSpec: '+spec:''),wallNo,floor:lastFloor,
        w:String(w).replace(/[^0-9.]/g,''),h:String(h).replace(/[^0-9.]/g,''),
        qty:finalQty,uom:uom.trim().replace(/^nan$/i,'Nos'),
        remarks:mat,supplyRate:sRate?String(sRate):'',installRate:iRate?String(iRate):'',
      });
    }
    return items;
  };

  const handleFile=async(e)=>{
    const file=e.target.files[0];if(!file)return;setErr("");setFileName(file.name);
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const allSheets=wb.SheetNames.map(name=>{
        const ws=wb.Sheets[name];
        const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        return {name,data,rowCount:data.length-1};
      }).filter(s=>s.rowCount>0);
      setSheets(allSheets);
      setSelSheets(allSheets.map(s=>s.name));
      setStep(2);
    }catch(ex){
      setErr("Could not read file: "+ex.message);
    }
  };

  const buildFromSheets=()=>{
    let all=[];
    for(const s of sheets){
      if(!selSheets.includes(s.name))continue;
      const items=parseSheet(s.data,s.name);
      all=all.concat(items);
    }
    // Re-number
    all.forEach((it,i)=>{it.sr=i+1;});
    setParsedItems(all);
    // Convert to job line items
    setIts(all.map(it=>{
      const sr=+it.supplyRate||0;const ir=+it.installRate||0;const combinedRate=sr+ir;
      const uomMap={'sq ft':'SQFT','sqft':'SQFT','sft':'SQFT','sqm':'SQFT','sq.ft':'SQFT','set':'SET','nos':'NOS','num':'NOS','no':'NOS','pcs':'NOS','lot':'LOT','ls':'LOT','rft':'RFT','rm':'RFT','lm':'RFT'};
      const rm=uomMap[it.uom.toLowerCase()]||'UNIT';
      const sqft=cSq(it.w,it.h,it.qty,su);
      const tot=rm==='SQFT'&&sqft?Math.round(sqft*combinedRate*100)/100:Math.round(it.qty*combinedRate*100)/100;
      const gst=Math.round(tot*0.18*100)/100;
      return {
        id:uid(),sr:it.sr,int:it.desc,cli:it.desc,m:it.remarks||'',w:it.w,h:it.h,
        qty:it.qty,rm,rate:combinedRate||'',sqft,
        tot:combinedRate?tot:0,gst:combinedRate?gst:0,amt:combinedRate?Math.round((tot+gst)*100)/100:0,
        gstPct:18,mach:'In-house',imgUrl:'',
        supplyRate:it.supplyRate,installRate:it.installRate,fullDesc:it.fullDesc,
      };
    }));
    setStep(3);
  };

  const uI=(i,k,v)=>{setIts(p=>{const n=[...p];const it={...n[i],[k]:v};
    const w=+it.w||0,h=+it.h||0,q=+it.qty||1;const gp=+(it.gstPct||18);
    const sr=+it.supplyRate||0;const ir=+it.installRate||0;const combinedRate=sr+ir;
    it.rate=combinedRate||+it.rate||0;
    it.sqft=cSq(w,h,q,su);
    it.tot=it.rm==="SQFT"?Math.round(it.sqft*it.rate*100)/100:Math.round(q*it.rate*100)/100;
    it.gst=Math.round(it.tot*(gp/100)*100)/100;it.amt=Math.round((it.tot+it.gst)*100)/100;n[i]=it;return n;});};
  const rI=i=>setIts(p=>p.filter((_,x)=>x!==i).map((it,x)=>({...it,sr:x+1})));
  const aI=()=>setIts(p=>[...p,{id:uid(),sr:p.length+1,int:"",cli:"",m:"",w:"",h:"",qty:1,rm:"SQFT",rate:"",sqft:0,tot:0,gst:0,amt:0,gstPct:18,mach:"In-house",imgUrl:"",supplyRate:"",installRate:"",fullDesc:""}]);

  const tot=useMemo(()=>{const s=Math.round(its.reduce((a,x)=>a+x.tot,0)*100)/100,g=Math.round(its.reduce((a,x)=>a+x.gst,0)*100)/100,tq=its.reduce((a,x)=>a+(+x.qty||0),0),tsq=Math.round(its.reduce((a,x)=>a+(+x.sqft||0),0)*100)/100;return{s,g,t:Math.round((s+g)*100)/100,tq,tsq};},[its]);

  const curFY=useMemo(()=>{const n=new Date();const m=n.getMonth(),y=n.getFullYear();return m>=3?`${String(y).slice(2)}${String(y+1).slice(2)}`:`${String(y-1).slice(2)}${String(y).slice(2)}`;},[]); 
  const nextNum=useMemo(()=>{const fyJobs=jobs.filter(j=>j.id?.includes('-'+curFY));const nums=fyJobs.map(j=>{const p=j.id?.split('-')[0];return parseInt(p)||0;});return String(Math.max(0,...nums)+1).padStart(4,'0');},[jobs,curFY]);
  const jid=`${nextNum}-${curFY}`;
  const selC=cid=>{const c=clients.find(x=>x.id===cid);if(c)sF(p=>({...p,cl:cid,cn:c.name,cp:c.contact,cph:c.phone,cemail:c.email||''}));};

  const submitJob=async()=>{
    if(!f.cn){alert("Select client");return;}
    if(its.length===0){alert("No items");return;}
    if(importMode==='multi_job'){
      // Each item = separate job
      if(!confirm(`Create ${its.length} SEPARATE JOBS?\n\nClient: ${f.cn}\nProject: ${f.pr||'—'}\nJobs to create: ${its.length}\n\nEach row becomes its own job sheet.\nClick OK to proceed.`))return;
      setSubmitting(true);
      const curFYVal=curFY;
      const fyJobs=jobs.filter(j=>j.id?.includes('-'+curFYVal));
      let lastNum=Math.max(0,...fyJobs.map(j=>{const p=j.id?.split('-')[0];return parseInt(p)||0;}));
      for(const it of its){
        lastNum++;
        const newJid=String(lastNum).padStart(4,'0')+'-'+curFYVal;
        const jobData={id:newJid,firm:fm,client_id:f.cl,client_name:f.cn,project:it.int||f.pr,delivery_address:it.siteAddr||f.da,contact_person:f.cp,contact_no:f.cph,made_by:f.mb,po_number:f.po,billing_name:f.cn,client_gst:"",payment_terms:f.pt,status:"Active"};
        const batchId="B"+uid();
        const batchData={id:batchId,job_id:newJid,date:f.rd,note:"BOQ Import: "+fileName,bill_no:"",status:"New"};
        const lineItems=[{id:"LI"+uid(),batch_id:batchId,job_id:newJid,sr:1,product_id:"",internal_name:it.int,client_name:it.cli,media:it.m,width:it.w,height:it.h,size_unit:getUnitMode(it.rm).dimUnit||'INCH',qty:+it.qty||1,rate_mode:it.rm,rate:+it.rate||0,sqft:it.sqft,total:it.tot,gst:it.gst,gstPct:+(it.gstPct||18),amount:it.amt,area:it.mach||"In-house",dept_estimate:false,dept_design:false,dept_production:false,dept_printing:false,dept_fabrication:false,dept_dispatch:false,dept_installation:false,dept_accounts:false,img_url:it.imgUrl||""}];
        await createJob(jobData,batchData,lineItems);
        // Sync to Banking CRM if enabled
        if(syncBanking&&bankProject){
          const bm=BANK_MAP[bankProject]||['',''];
          const siteId='BS-'+Date.now()+Math.random().toString(36).slice(2,5)+i;
          const siteCode=it.int?.split(' — ')[0]||it.int?.split('—')[0]||'';

            // Parse using manual mapping

              const hRow=headerRow;
              const items=[];
              for(let r=hRow+1;r<s.data.length;r++){

                const get=(role)=>{const idx=Object.keys(colMap).find(k=>colMap[k]===role);return idx!=null?String(row[+idx]||'').trim():'';};
                const itemName=get('item_name');const siteCode=get('site_code');
                if(!itemName&&!siteCode)continue;
                const allTxt=row.map(c=>String(c||'').toLowerCase()).join(' ');
                if(/^(total|sub.?total|grand|gst|basic|note)/i.test(allTxt.slice(0,20)))continue;
                let w='',h='';
                const wRaw=get('width'),hRaw=get('height'),sizeRaw=get('size');
                if(wRaw)w=wRaw.replace(/[^0-9.]/g,'');
                if(hRaw)h=hRaw.replace(/[^0-9.]/g,'');

                if(!w&&!h&&itemName){const ps=parseSize(itemName);w=ps.w;h=ps.h;}
                const qtyRaw=get('qty');let qty=+qtyRaw||0;

                siteAddr:it.siteAddr||'',jobType:it.jobType||''};
            }));

        <div className="fg f3">
          <F l="Client *"><select className="in" value={f.cl} onChange={e=>selC(e.target.value)}><option value="">Select...</option>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></F>

            <td className="mn" style={{fontSize:10,fontWeight:600}}>{it.tot?fmt(it.tot):"—"}</td>
            <td><select className="in mn" value={it.gstPct||18} onChange={e=>uI(i,"gstPct",e.target.value)} style={{fontSize:8,padding:"1px",width:36}} onClick={e=>e.stopPropagation()}>{GST_OPTS.map(g=><option key={g} value={g}>{g}%</option>)}</select></td>
            <td className="mn" style={{fontSize:10,fontWeight:700,color:"#e3a008"}}>{it.amt?fmt(it.amt):"—"}</td>

          </React.Fragment>)}
          <tr style={{background:"#0a0f1a"}}><td colSpan={5} style={{textAlign:"right",fontWeight:700,fontSize:10}}>TOTAL</td><td className="mn" style={{fontWeight:700}}>{tot.tq}</td><td></td><td className="mn" style={{fontWeight:600,color:"#06b6d4"}}>{tot.tsq||"—"}</td><td colSpan={2}></td><td className="mn" style={{fontWeight:700}}>{fmt(tot.s)}</td><td></td><td className="mn" style={{fontWeight:800,color:"#e3a008"}}>{fmt(tot.t)}</td><td colSpan={2}></td></tr>
        </tbody></table></div>
      </div>
      <div style={{display:"flex",gap:4,justifyContent:"flex-end",flexWrap:"wrap"}}>
        <button className="b" onClick={()=>{setStep(1);setIts([]);setSheets([]);setFileName("");}}>← Start Over</button>

      </div>
    </>}
  </div>;
}

// EXPENSES TRACKER
// ═══════════════════════════════════════════════════════════
function ExpensesPage({expenses,addExpense,deleteExpense,team,firms}){
  const DEFAULT_CATS=["Material Purchase","Transport","Labour","Rent","Electricity","Fuel","Office Supplies","Food & Tea","Maintenance","Salary Advance","Petty Cash","Tools","Ink Purchase","Outsource Payment","Other"];
  // Build dynamic categories from existing expenses + defaults
  const allCats=useMemo(()=>{
    const s=new Set(DEFAULT_CATS);
    expenses.forEach(e=>{if(e.category)s.add(e.category);});
    return [...s].sort();
  },[expenses]);
  const PAY_MODES=["Cash","UPI","Bank Transfer","Cheque","Card","Credit"];
  const [sf,ssf]=useState(false);
  const [receiptFile,setReceiptFile]=useState(null);
  const [saving,setSaving]=useState(false);
  const [filter,setFilter]=useState('all');
  const [fMonth,setFMonth]=useState('all');
  const [addingCat,setAddingCat]=useState(false);
  const [newCat,setNewCat]=useState('');
  const [f,sF]=useState({date:td(),category:DEFAULT_CATS[0],description:"",amount:"",paid_to:"",payment_mode:"Cash",firm:firms[0]?.code||"",job_id:"",approved_by:team[0]?.name||"",notes:""});

  // Get unique "Paid To" names from existing expenses for suggestions
  const paidToNames=useMemo(()=>{
    const s=new Set();
    expenses.forEach(e=>{if(e.paid_to&&e.paid_to.trim())s.add(e.paid_to.trim());});
    return [...s].sort();
  },[expenses]);

  const add=async()=>{if(!f.amount||!f.description){alert("Fill amount & description");return;}setSaving(true);const rUrl=await uploadFile(receiptFile,'expense-receipts');await addExpense({id:"EX"+uid(),...f,amount:+f.amount,receipt_url:rUrl});sF(p=>({...p,description:"",amount:"",paid_to:"",job_id:"",notes:""}));setReceiptFile(null);setSaving(false);};

  const filtered=expenses.filter(e=>{if(filter!=='all'&&e.category!==filter)return false;if(fMonth!=='all'){const d=new Date(e.date);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(key!==fMonth)return false;}return true;}).sort((a,b)=>b.date?.localeCompare(a.date));

  const totalFiltered=filtered.reduce((s,e)=>s+(+e.amount||0),0);
  const monthSet=new Set();expenses.forEach(e=>{if(e.date){const d=new Date(e.date);monthSet.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}});
  const monthOpts=[...monthSet].sort().reverse();

  const catTotals={};filtered.forEach(e=>{catTotals[e.category||'Other']=(catTotals[e.category||'Other']||0)+(+e.amount||0);});

  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
      <button className="b bp" onClick={()=>ssf(p=>!p)}>{sf?"▾ Close":"💸 New Expense"}</button>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <span className="mn" style={{fontSize:12,fontWeight:700,color:"#e3a008"}}>{fmt(totalFiltered)}</span>
        <span style={{fontSize:9,color:"#64748b"}}>{filtered.length} entries</span>
      </div>
    </div>

    {sf&&<div className="c a" style={{padding:10}}>
      <p style={{fontSize:9,color:"#dc2626",fontWeight:700,marginBottom:6}}>💸 LOG EXPENSE</p>
      <div className="fg f4">
        <F l="Date"><input type="date" className="in" value={f.date} onChange={e=>sF(p=>({...p,date:e.target.value}))}/></F>
        <F l="Category">{addingCat?<div style={{display:"flex",gap:3}}><input className="in" value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="New category name" autoFocus style={{flex:1}}/><button className="b bp" style={{fontSize:8,padding:"2px 6px"}} onClick={()=>{if(newCat.trim()){sF(p=>({...p,category:newCat.trim()}));setAddingCat(false);setNewCat('');}}} >✓</button><button className="b bs" style={{fontSize:8,padding:"2px 4px"}} onClick={()=>{setAddingCat(false);setNewCat('');}}>✕</button></div>:<div style={{display:"flex",gap:3}}><select className="in" value={f.category} onChange={e=>{if(e.target.value==='__ADD__'){setAddingCat(true);}else sF(p=>({...p,category:e.target.value}));}} style={{flex:1}}>{allCats.map(c=><option key={c}>{c}</option>)}<option value="__ADD__">➕ Add New Category...</option></select></div>}</F>
        <F l="Amount ₹ *"><input className="in mn" type="number" value={f.amount} onChange={e=>sF(p=>({...p,amount:e.target.value}))} placeholder="0"/></F>
        <F l="Paid To"><div style={{position:"relative"}}><input className="in" list="paidToList" value={f.paid_to} onChange={e=>sF(p=>({...p,paid_to:e.target.value}))} placeholder="Name/Vendor — type or select"/><datalist id="paidToList">{paidToNames.map(n=><option key={n} value={n}/>)}</datalist></div></F>
        <div style={{gridColumn:"span 2"}}><F l="Description *"><input className="in" value={f.description} onChange={e=>sF(p=>({...p,description:e.target.value}))} placeholder="What was this expense for?"/></F></div>
        <F l="Payment Mode"><select className="in" value={f.payment_mode} onChange={e=>sF(p=>({...p,payment_mode:e.target.value}))}>{PAY_MODES.map(m=><option key={m}>{m}</option>)}</select></F>
        <F l="Firm"><select className="in" value={f.firm} onChange={e=>sF(p=>({...p,firm:e.target.value}))}><option value="">General</option>{firms.map(fm=><option key={fm.code} value={fm.code}>{fm.short_name}</option>)}</select></F>
        <F l="Job# (optional)"><input className="in mn" value={f.job_id} onChange={e=>sF(p=>({...p,job_id:e.target.value}))} placeholder="Link to job"/></F>
        <F l="Approved By"><select className="in" value={f.approved_by} onChange={e=>sF(p=>({...p,approved_by:e.target.value}))}>{team.map(t=><option key={t.name} value={t.name}>{t.name}</option>)}</select></F>
        <F l="📸 Receipt"><input type="file" accept="image/*,.pdf" capture="environment" className="in" style={{padding:2}} onChange={e=>setReceiptFile(e.target.files[0]||null)}/></F>
        <F l="Notes"><input className="in" value={f.notes} onChange={e=>sF(p=>({...p,notes:e.target.value}))} placeholder="Extra details..."/></F>
      </div>
      <button className="b bp" onClick={add} style={{marginTop:8}} disabled={saving}>{saving?"⏳ Saving...":"Save Expense"}</button>
    </div>}

    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
      <select className="in" value={filter} onChange={e=>setFilter(e.target.value)} style={{width:160,fontSize:10}}>
        <option value="all">All Categories</option>
        {allCats.map(c=><option key={c} value={c}>{c}</option>)}
      </select>
      <select className="in" value={fMonth} onChange={e=>setFMonth(e.target.value)} style={{width:120,fontSize:10}}>
        <option value="all">All Months</option>
        {monthOpts.map(m=><option key={m} value={m}>{m}</option>)}
      </select>
    </div>

    {Object.keys(catTotals).length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
      {Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=><span key={cat} style={{background:"#1a0505",border:"1px solid #dc262633",borderRadius:5,padding:"3px 7px",fontSize:9.5}}><strong style={{color:"#dc2626"}}>{fmtK(amt)}</strong> <span style={{color:"#94a3b8"}}>{cat}</span></span>)}
    </div>}

    <div className="c" style={{padding:0}}><div style={{overflowX:"auto",maxHeight:"calc(100vh - 220px)"}}><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Paid To</th><th>Mode</th><th>Firm</th><th>Job</th><th>By</th><th>📎</th><th></th></tr></thead><tbody>
      {filtered.map(e=><tr key={e.id}>
        <td>{e.date}</td>
        <td><span className="bd" style={{background:"#dc262620",color:"#f87171"}}>{e.category}</span></td>
        <td style={{fontSize:10,maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.description}</td>
        <td className="mn" style={{fontWeight:700,color:"#dc2626"}}>{fmt(e.amount)}</td>
        <td style={{fontSize:10}}>{e.paid_to}</td>
        <td><span className="bd" style={{background:e.payment_mode==='Cash'?"#f59e0b20":"#3b82f620",color:e.payment_mode==='Cash'?"#f59e0b":"#3b82f6"}}>{e.payment_mode}</span></td>
        <td>{e.firm&&<FB f={e.firm} firms={firms}/>}</td>
        <td className="mn" style={{fontSize:10,color:"#e3a008"}}>{e.job_id||'—'}</td>
        <td style={{fontSize:10}}>{e.approved_by}</td>
        <td>{e.receipt_url?<a href={e.receipt_url} target="_blank" style={{color:"#3b82f6",fontSize:9}}>📸</a>:'—'}</td>
        <td><button className="b br bs" onClick={()=>{if(confirm('Delete this expense?'))deleteExpense(e.id)}} style={{fontSize:8,padding:"1px 4px"}}>✕</button></td>
      </tr>)}
      {filtered.length===0&&<tr><td colSpan={11} style={{textAlign:"center",color:"#64748b",padding:20}}>No expenses found</td></tr>}
    </tbody></table></div></div>
  </div>;
}

// ROOT APP — Loads master data, then shows Login or MainApp
// ═══════════════════════════════════════════════════════════
function RootApp(){
  const [user,setUser]=useState(()=>{
    try{const s=localStorage.getItem('erp_user');return s?JSON.parse(s):null;}catch(e){return null;}
  });
  const [masterData,setMasterData]=useState(null);
  const [loading,setLoading]=useState(true);

  const handleLogin=(member)=>{
    setUser(member);
    try{localStorage.setItem('erp_user',JSON.stringify(member));localStorage.setItem('erp_login_time',Date.now().toString());}catch(e){}
  };
  const handleLogout=()=>{
    setUser(null);
    try{localStorage.removeItem('erp_user');localStorage.removeItem('erp_pg');localStorage.removeItem('erp_login_time');}catch(e){}
  };

  useEffect(()=>{
    async function loadMaster(){
      const [f,c,s,p,m,mac,ag,db,tm] = await Promise.all([
        sb.from('firms').select('*'),
        sb.from('clients').select('*').order('name'),
        sb.from('suppliers').select('*').order('name'),
        sb.from('products').select('*').order('internal_name'),
        sb.from('materials').select('*').order('name'),
        sb.from('machines').select('*'),
        sb.from('outsource_agencies').select('*'),
        sb.from('delivery_boys').select('*'),
        sb.from('team_members').select('*').eq('active',true),
      ]);
      setMasterData({
        firms:f.data||[], clients:c.data||[], suppliers:s.data||[],
        products:p.data||[], materials:m.data||[], machines:mac.data||[],
        agencies:ag.data||[], delBoys:db.data||[], team:tm.data||[],
      });
      // Validate stored session — if user no longer in team, auto-logout
      try{
        const stored=localStorage.getItem('erp_user');
        if(stored){
          const u=JSON.parse(stored);
          const teamList=tm.data||[];
          const valid=teamList.find(t=>t.name===u.name&&t.pin===u.pin);
          if(!valid){localStorage.removeItem('erp_user');localStorage.removeItem('erp_pg');setUser(null);}
        }
      }catch(e){}
      setLoading(false);
    }
    loadMaster();
  },[]);

  if(loading) return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,background:"#060810"}}><div className="loader"/><p style={{color:"#64748b",fontSize:12}}>Loading iPrint ERP...</p></div>;

  // CLIENT PORTAL — if URL has ?client=CODE
  const urlP=new URLSearchParams(window.location.search);
  const cCode=urlP.get('client');
  if(cCode) return <ClientPortal code={cCode}/>;

  if(!user) return <Login onLogin={handleLogin} team={masterData.team}/>;
  return <MainApp user={user} onLogout={handleLogout} masterData={masterData}/>;
}

// BANKING CRM PAGE
// ═══════════════════════════════════════════════════════════
function BankCRMPage({show,jobs,sm,sp,firms,clients,user}){
  const [sites,setSites]=useState([]);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('ALL');
  const [search,setSearch]=useState('');
  const [stFilter,setStFilter]=useState('All');
  const [stateFilter,setStateFilter]=useState('All');
  const [page,setPage]=useState(0);
  const [showAddSite,setShowAddSite]=useState(false);
  const [customProject,setCustomProject]=useState(false);
  const [newSite,setNewSite]=useState({project:'',client:'',bank:'',job_no:'',po_number:'',atm_id:'',site_unique_id:'',site_address:'',city:'',district:'',state:'',pincode:'',vendor_name:'',vendor_contact:'',installation_status:'Pending',photo_status:'',billing_category:'',work_category:'Pending'});
  const [siteAction,setSiteAction]=useState(null); // {type:'delete'|'move'|null, site}
  const [moveJobNo,setMoveJobNo]=useState('');
  const pageSize=50;

  // Load banking sites from Supabase
  useEffect(()=>{
    (async()=>{
      setLoading(true);
      let all=[],from=0,sz=1000;
      while(true){
        const {data,error}=await sb.from('banking_sites').select('*').order('id').range(from,from+sz-1);
        if(error||!data||!data.length)break;
        all=all.concat(data);
        if(data.length<sz)break;
        from+=sz;
      }
      setSites(all);setLoading(false);
      console.log('Banking CRM: loaded',all.length,'sites');
    })();
  },[]);

  // Projects
  const projects=useMemo(()=>{
    const p={};sites.forEach(s=>{if(!p[s.project])p[s.project]=0;p[s.project]++;});
    return Object.entries(p).sort((a,b)=>b[1]-a[1]);
  },[sites]);

  // Filtered sites
  const filtered=useMemo(()=>{
    let f=sites;
    if(tab!=='ALL')f=f.filter(s=>s.project===tab);
    if(stFilter!=='All')f=f.filter(s=>s.billing_category===stFilter);
    if(stateFilter!=='All')f=f.filter(s=>s.state===stateFilter);
    if(search){const q=search.toLowerCase();f=f.filter(s=>
      s.site_address?.toLowerCase().includes(q)||s.atm_id?.toLowerCase().includes(q)||s.site_unique_id?.toLowerCase().includes(q)||
      s.city?.toLowerCase().includes(q)||s.state?.toLowerCase().includes(q)||
      s.vendor_name?.toLowerCase().includes(q)||s.job_no?.toLowerCase().includes(q)||
      s.billing_status?.toLowerCase().includes(q)||s.district?.toLowerCase().includes(q)
    );}
    return f;
  },[sites,tab,stFilter,stateFilter,search]);

  // Stats
  const stats=useMemo(()=>{
    const f=tab==='ALL'?sites:sites.filter(s=>s.project===tab);
    return {
      total:f.length,
      invoiced:f.filter(s=>s.billing_category==='Invoiced').length,
      givenForBilling:f.filter(s=>s.billing_category==='Given for Billing').length,
      pending:f.filter(s=>!s.billing_category||['Photo Pending','Work/PO Pending','Billing Pending','Other'].includes(s.billing_category)).length,
      completed:f.filter(s=>s.work_category==='Completed').length,
      photoReceived:f.filter(s=>s.photo_status?.includes('Received')).length,
      photoPending:f.filter(s=>!s.photo_status||s.photo_status.includes('Pending')||s.photo_status==='').length,
    };
  },[sites,tab]);

  // Unique states for filter
  const states=useMemo(()=>{
    const s=new Set();sites.forEach(r=>{if(r.state)s.add(r.state);});
    return [...s].sort();
  },[sites]);

  // Billing categories for filter
  // ── SITE ACTIONS: Delete & Move ─────────────────────────────────────────
  const deleteSite=async(site)=>{
    const {error}=await sb.from('banking_sites').delete().eq('id',site.id);
    if(error){show('Delete failed: '+error.message,false);return;}
    setSites(p=>p.filter(s=>s.id!==site.id));
    setSiteAction(null);
    show('🗑️ Site deleted — '+( site.atm_id||site.site_unique_id||site.id));
  };
  const moveSite=async(site,newJobNo)=>{
    const cleaned=newJobNo.trim().replace(/^0+/,'');
    if(!cleaned){show('Enter a valid Job number',false);return;}
    const {error}=await sb.from('banking_sites').update({job_no:cleaned}).eq('id',site.id);
    if(error){show('Move failed: '+error.message,false);return;}
    setSites(p=>p.map(s=>s.id===site.id?{...s,job_no:cleaned}:s));
    setSiteAction(null);
    setMoveJobNo('');
    show('✅ Site moved to Job '+cleaned);
  };
  // ── DUPLICATE DETECTION ───────────────────────────────────────────────────
  const dupIds=useMemo(()=>{
    const seen={};const dups=new Set();
    sites.forEach(s=>{
      const key=(s.atm_id||'')+'||'+(s.site_unique_id||'');
      if(key!=='||'){
        if(seen[key]) dups.add(s.id),dups.add(seen[key]);
        else seen[key]=s.id;
      }
    });
    return dups;
  },[sites]);

  const billingCats=useMemo(()=>{
    const s=new Set();sites.forEach(r=>{if(r.billing_category)s.add(r.billing_category);});
    return [...s].sort();
  },[sites]);

  // Update a site field
  const updateSite=async(id,field,value)=>{
    const {error}=await sb.from('banking_sites').update({[field]:value}).eq('id',id);
    if(!error){setSites(p=>p.map(s=>s.id===id?{...s,[field]:value}:s));show('Updated!');}
    else show('Error: '+error.message,false);
  };
  // Update site AND sync to linked job (for PO#)
  const updateSiteWithJobSync=async(siteId,jobNo,field,value)=>{
    const {error}=await sb.from('banking_sites').update({[field]:value}).eq('id',siteId);
    if(error){show('Error: '+error.message,false);return;}
    setSites(p=>p.map(s=>s.id===siteId?{...s,[field]:value}:s));
    // Sync PO# to the linked job in jobs table
    if(field==='po_number'&&jobNo){
      const fy=['2526','2627'];
      for(const f of fy){
        const jid=jobNo.padStart(4,'0')+'-'+f;
        await sb.from('jobs').update({po_number:value}).eq('id',jid);
      }
    }
    show('Updated & synced!');
  };

  // Export to Excel
  const exportExcel=()=>{
    const data=filtered.map((s,i)=>({
      'Sr':i+1,'Job#':s.job_no||'','Vendor PO#':s.po_number||'','ATM ID':s.atm_id||'','Site UID':s.site_unique_id||'',
      'Address':s.site_address||'','City':s.city||'','District':s.district||'',
      'State':s.state||'','Pincode':s.pincode||'','Vendor':s.vendor_name||'','Vendor Contact':s.vendor_contact||'',
      'Installation':s.installation_status||'','Photos':s.photo_status||'',
      'Billing Status':s.billing_status||'','Billing Category':s.billing_category||'',
      'Work Category':s.work_category||''
    }));
    const ws=XLSX.utils.json_to_sheet(data);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,tab==='ALL'?'All Sites':tab.slice(0,31));
    XLSX.writeFile(wb,`Banking_CRM_${tab.replace(/[^a-zA-Z0-9]/g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`);
    show('Excel exported!');
  };

  // Add new site to CRM
  const addSite=async()=>{
    if(!newSite.project||!newSite.client||!newSite.bank){show('Fill Project, Client & Bank',false);return;}
    const id='BS-'+Date.now()+Math.random().toString(36).slice(2,5);
    const rec={...newSite,id};
    const {error}=await sb.from('banking_sites').insert(rec);
    if(!error){setSites(p=>[rec,...p]);setShowAddSite(false);setCustomProject(false);setNewSite({project:'',client:'',bank:'',job_no:'',po_number:'',atm_id:'',site_unique_id:'',site_address:'',city:'',district:'',state:'',pincode:'',vendor_name:'',vendor_contact:'',installation_status:'Pending',photo_status:'',billing_category:'',work_category:'Pending'});show('Site added!');}
    else show('Error: '+error.message,false);
  };

  // Project options for dropdown
  const projectOpts=['NCR SBI BRANDING','NCR SBI GSB','NCR PNB GSB','NCR BOB GSB','CMS SBI GSB+LOLLIPOP','CMS SBI BRANDING','CMS BOB GSB+BRANDING','Diebold HDFC GSB'];
  const clientBankMap={'NCR SBI BRANDING':['NCR','SBI'],'NCR SBI GSB':['NCR','SBI'],'NCR PNB GSB':['NCR','PNB'],'NCR BOB GSB':['NCR','BOB'],'CMS SBI GSB+LOLLIPOP':['CMS','SBI'],'CMS SBI BRANDING':['CMS','SBI'],'CMS BOB GSB+BRANDING':['CMS','BOB'],'Diebold HDFC GSB':['Diebold','HDFC']};

  // Paginated
  const paged=filtered.slice(page*pageSize,(page+1)*pageSize);
  const totalPages=Math.ceil(filtered.length/pageSize);

  if(loading)return <div style={{display:'flex',alignItems:'center',justifyContent:'center',padding:40}}><div className="loader"></div><span style={{marginLeft:8,color:'#64748b'}}>Loading Banking CRM...</span></div>;

  return <div style={{display:'flex',flexDirection:'column',gap:8}}>
    {/* Project Tabs */}
    <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
      <button className={`b bs ${tab==='ALL'?'bp':''}`} onClick={()=>{setTab('ALL');setPage(0);}}>All ({sites.length})</button>
      {projects.map(([p,c])=><button key={p} className={`b bs ${tab===p?'bp':''}`} onClick={()=>{setTab(p);setPage(0);}} style={{fontSize:9}}>{p} ({c})</button>)}
    </div>

    {/* Stats Cards */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(100px,1fr))',gap:5}}>
      <SC l="Total Sites" v={stats.total} c="#3b82f6"/><SC l="Invoiced" v={stats.invoiced} c="#4ade80"/><SC l="Given for Billing" v={stats.givenForBilling} c="#06b6d4"/><SC l="Billing Pending" v={stats.pending} c="#f59e0b"/><SC l="Work Done" v={stats.completed} c="#10b981"/><SC l="Photo ✓" v={stats.photoReceived} c="#8b5cf6"/><SC l="Photo Pending" v={stats.photoPending} c="#f47067"/>
    </div>

    {/* Linked ERP Jobs Summary */}
    {(()=>{
      const BANKING_CLIENTS=['DIEBOLD','CMS','OKI','NCR','NUVAMA','NUVAMA WEALTH','J M FINANCE','JM FINANCE','J.M. FINANCE','HITACHI','EDELWEISS','NIDO'];
      const isBk=(cn)=>{if(!cn)return false;const u=cn.toUpperCase();return BANKING_CLIENTS.some(b=>u.includes(b));};
      const bJobs=jobs.filter(j=>isBk(j.client_name));
      const erpActive=bJobs.filter(j=>!['Billing Done','Cash Received','No Bill','Cancelled'].includes(j.status));
      const erpBilled=bJobs.filter(j=>['Billing Done','Cash Received'].includes(j.status));
      const erpBillPend=bJobs.filter(j=>['Billing Pending','Given for Billing','Cash Pending','Proforma Invoice','IC Pending'].includes(j.status));
      return <div className="c" style={{padding:8}}>
        <p style={{fontSize:9,color:'#64748b',marginBottom:4}}>📋 ERP JOBS (Banking Clients)</p>
        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          <span style={{fontSize:11}}><strong style={{color:'#3b82f6'}}>{bJobs.length}</strong> <span style={{fontSize:9,color:'#64748b'}}>Total Jobs</span></span>
          <span style={{fontSize:11}}><strong style={{color:'#e3a008'}}>{erpActive.length}</strong> <span style={{fontSize:9,color:'#64748b'}}>Active</span></span>
          <span style={{fontSize:11}}><strong style={{color:'#06b6d4'}}>{erpBillPend.length}</strong> <span style={{fontSize:9,color:'#64748b'}}>Billing Pending</span></span>
          <span style={{fontSize:11}}><strong style={{color:'#4ade80'}}>{erpBilled.length}</strong> <span style={{fontSize:9,color:'#64748b'}}>Billed</span></span>
          <span style={{fontSize:9,color:'#475569',alignSelf:'center'}}>| CRM tracks {stats.total} individual ATM sites across these jobs</span>
        </div>
      </div>;
    })()}

    {/* Filters + Search + Export + Add */}
    <div className="c" style={{padding:8,display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
      <select className="in" value={stFilter} onChange={e=>{setStFilter(e.target.value);setPage(0);}} style={{fontSize:10,padding:'4px 6px',width:130}}>
        <option value="All">All Billing ({filtered.length})</option>
        {billingCats.map(c=><option key={c} value={c}>{c}</option>)}
      </select>
      <select className="in" value={stateFilter} onChange={e=>{setStateFilter(e.target.value);setPage(0);}} style={{fontSize:10,padding:'4px 6px',width:130}}>
        <option value="All">All States</option>
        {states.map(s=><option key={s} value={s}>{s}</option>)}
      </select>
      <input className="in" placeholder="🔍 Search ATM, City, Vendor, Job#..." value={search} onChange={e=>{setSearch(e.target.value);setPage(0);}} style={{flex:1,fontSize:10,padding:'4px 8px',minWidth:150}}/>
      <button className="b bg bs" onClick={exportExcel} style={{fontSize:9}}>📥 Export</button>
      <button className="b bp bs" onClick={()=>setShowAddSite(true)} style={{fontSize:9}}>➕ Add Site</button>
      <button className="b bs" onClick={()=>sp('new')} style={{fontSize:9,borderColor:'#3b82f6',color:'#3b82f6'}}>➕ New Job</button>
      <span style={{fontSize:9,color:'#64748b'}}>{filtered.length} sites</span>
    </div>

    {/* Add Site Form */}
    {showAddSite&&<div className="c a" style={{padding:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <h4 style={{fontSize:12,fontWeight:700,color:'#e3a008'}}>➕ Add New Banking Site</h4>
        <button className="b bs" onClick={()=>{setShowAddSite(false);setCustomProject(false);}}>✕</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6}}>
        <div><label style={{fontSize:8,color:'#64748b'}}>Project *</label>{customProject?<div style={{display:'flex',gap:2}}><input className="in" value={newSite.project} onChange={e=>setNewSite(s=>({...s,project:e.target.value}))} placeholder="Enter new project name" style={{fontSize:10,flex:1}} autoFocus/><button className="b bs" onClick={()=>{setCustomProject(false);setNewSite(s=>({...s,project:'',client:'',bank:''}));}} style={{fontSize:8,padding:'2px 5px'}} title="Back to list">✕</button></div>:<select className="in" value={newSite.project} onChange={e=>{const p=e.target.value;if(p==='__CUSTOM__'){setCustomProject(true);setNewSite(s=>({...s,project:'',client:'',bank:''}));return;}const cb=clientBankMap[p]||['',''];setNewSite(s=>({...s,project:p,client:cb[0],bank:cb[1]}));}} style={{fontSize:10}}>

        <div><label style={{fontSize:8,color:'#64748b'}}>Job #</label><input className="in" value={newSite.job_no} onChange={e=>setNewSite(s=>({...s,job_no:e.target.value}))} placeholder="e.g. 0921" style={{fontSize:10}}/></div>
        <div><label style={{fontSize:8,color:'#64748b'}}>PO #</label><input className="in" value={newSite.po_number} onChange={e=>setNewSite(s=>({...s,po_number:e.target.value}))} style={{fontSize:10}}/></div>
        <div><label style={{fontSize:8,color:'#64748b'}}>ATM ID</label><input className="in" value={newSite.atm_id} onChange={e=>setNewSite(s=>({...s,atm_id:e.target.value}))} style={{fontSize:10}}/></div>
        <div><label style={{fontSize:8,color:'#64748b'}}>Site Unique ID</label><input className="in" value={newSite.site_unique_id} onChange={e=>setNewSite(s=>({...s,site_unique_id:e.target.value}))} style={{fontSize:10}}/></div>
        <div style={{gridColumn:'span 2'}}><label style={{fontSize:8,color:'#64748b'}}>Site Address</label><input className="in" value={newSite.site_address} onChange={e=>setNewSite(s=>({...s,site_address:e.target.value}))} style={{fontSize:10}}/></div>
        <div><label style={{fontSize:8,color:'#64748b'}}>City</label><input className="in" value={newSite.city} onChange={e=>setNewSite(s=>({...s,city:e.target.value}))} style={{fontSize:10}}/></div>
        <div><label style={{fontSize:8,color:'#64748b'}}>District</label><input className="in" value={newSite.district} onChange={e=>setNewSite(s=>({...s,district:e.target.value}))} style={{fontSize:10}}/></div>

        <div><label style={{fontSize:8,color:'#64748b'}}>Pincode</label><input className="in" value={newSite.pincode} onChange={e=>setNewSite(s=>({...s,pincode:e.target.value}))} style={{fontSize:10}}/></div>
        <div><label style={{fontSize:8,color:'#64748b'}}>Vendor Name</label><input className="in" value={newSite.vendor_name} onChange={e=>setNewSite(s=>({...s,vendor_name:e.target.value}))} style={{fontSize:10}}/></div>
        <div><label style={{fontSize:8,color:'#64748b'}}>Vendor Contact</label><input className="in" value={newSite.vendor_contact} onChange={e=>setNewSite(s=>({...s,vendor_contact:e.target.value}))} style={{fontSize:10}}/></div>
        <div><label style={{fontSize:8,color:'#64748b'}}>Installation</label><select className="in" value={newSite.installation_status} onChange={e=>setNewSite(s=>({...s,installation_status:e.target.value}))} style={{fontSize:10}}>
          <option value="Pending">Pending</option><option value="Completed">Completed</option><option value="In Progress">In Progress</option>
        </select></div>
      </div>
      <div style={{display:'flex',gap:6,marginTop:8}}>
        <button className="b bp" onClick={addSite} style={{fontSize:11}}>💾 Save Site</button>
