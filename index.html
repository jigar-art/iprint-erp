// ACCOUNTS
function AccPage({jobs,batches,items,saveBill,firms,updateJobStatus,updateJobFile,appendJobFiles,removeJobFile,show,addBatchToJob,sm,user,setBatches,updateBatchField}){
  const [tab,setTab]=useState('pending');
  const [invoices,setInvoices]=useState({});
  const [invoiceDates,setInvoiceDates]=useState({}); // {jobId: 'YYYY-MM-DD'}
  const [editBatchInv,setEditBatchInv]=useState(null); // {batch, newNo, newDate}
  const [sq,setSq]=useState('');
  const [statusFilter,setStatusFilter]=useState('All');
  // Item #16 (Accounts) — same gate as Banking CRM canAddInvoice
  const canEditInvoice=(()=>{const uN=(user?.name||'').toUpperCase();return ['JIGAR','AMOL','CHANDNI','RUCHITA','APARNA','VIDYA'].some(u=>uN.includes(u));})();
  const tabs=[
    {id:'pending',l:'All Pending',c:'#f59e0b',statuses:['Billing Pending','Given for Billing','Cash Pending','IC Pending','DC Pending']},
    {id:'given',l:'Given for Billing',c:'#06b6d4',statuses:['Given for Billing']},
    {id:'done',l:'Billing Completed',c:'#4ade80',statuses:['Billing Done','Cash Received','No Bill']},
  ];
  const cur=tabs.find(t=>t.id===tab);
  // openJob: same pattern as every other page (DashPage, JobsPage, DeptPage, etc.) — opens
  // the Job Detail modal via the setModal helper passed in as sm. Audit 18 Apr noted
  // Accounts Job# cells were inconsistent with other pages; this fixes that.
  const openJob=(j)=>sm&&sm({t:`Job ${j.id} — ${j.project}`,jobId:j.id,fallback:j});
  const filtered=jobs.filter(j=>{
    if(!cur.statuses.includes(j.status))return false;
    if(statusFilter!=='All'&&j.status!==statusFilter)return false;
    if(sq){const q=sq.toLowerCase();return j.id?.toLowerCase().includes(q)||j.client_name?.toLowerCase().includes(q)||j.project?.toLowerCase().includes(q)||j.po_number?.toLowerCase().includes(q)||(j.batches||[]).some(b=>b.bill_no?.toLowerCase().includes(q));}
    return true;
  });
  const sc={'Billing Pending':'#f59e0b','Given for Billing':'#06b6d4','Cash Pending':'#e3a008','IC Pending':'#f47067','DC Pending':'#f59e0b','Billing Done':'#4ade80','Cash Received':'#4ade80','No Bill':'#64748b'};
  const addInvoice=async(j)=>{
    const inv=(invoices[j.id]||'').trim();
    const invDate=(invoiceDates[j.id]||'').trim();
    if(!inv){alert("Enter invoice# first");return;}
    if(!invDate){alert("Enter invoice date");return;}
    // Find a batch without bill_no, or create a new one
    const jBatches=(j.batches||[]);
    const emptyBatch=jBatches.find(b=>!b.bill_no);
    if(emptyBatch){
      // Save bill_no via existing helper, then write invoice_date via updateBatchField
      saveBill(emptyBatch.id,inv);
      if(updateBatchField)updateBatchField(emptyBatch.id,'invoice_date',invDate);
    } else {
      // Create a new batch for this invoice (with invoice_date baked in)
      const bid="B"+uid();
      const bd={id:bid,job_id:j.id,date:td(),note:"Invoice: "+inv,bill_no:inv,status:"Done",invoice_date:invDate};
      if(addBatchToJob) await addBatchToJob(bd);
    }
    setInvoices(p=>({...p,[j.id]:''}));
    setInvoiceDates(p=>({...p,[j.id]:''}));
    show("✅ Invoice "+inv+" ("+invDate+") added to "+j.id);
  };
  const markBilled=async(j)=>{
    const existingInv=(j.batches||[]).map(b=>b.bill_no).filter(Boolean);
    if(existingInv.length===0){alert("Add at least one invoice# first");return;}
    updateJobStatus(j.id,'Billing Done');
    show("✅ "+j.id+" → Billing Done ("+existingInv.length+" invoice(s))");
  };
  const InvChips=({j,editable})=>{
    // Invoice rows now derived from batches (each batch carries bill_no + invoice_date)
    const invBatches=(j.batches||[]).filter(b=>b.bill_no);
    return <div style={{display:'flex',flexWrap:'wrap',gap:2,alignItems:'center'}}>
      {invBatches.map(b=>{
        const dt=b.invoice_date?new Date(b.invoice_date+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):null;
        return <span key={b.id} title={(editable?'Click to edit · ':'')+'Invoice '+b.bill_no+(b.invoice_date?' · '+b.invoice_date:' · no date')} onClick={editable?()=>setEditBatchInv({batch:b,newNo:b.bill_no,newDate:b.invoice_date||''}):undefined} className="bd" style={{background:'#06b6d420',color:'#06b6d4',fontSize:9,padding:'1px 6px',cursor:editable?'pointer':'default'}}>{b.bill_no}{dt?' · '+dt:''}</span>;
      })}
      {editable&&<div style={{display:'flex',gap:2,alignItems:'center',marginTop:invBatches.length?2:0,flexWrap:'wrap'}}>
        <input className="in mn" style={{width:80,fontSize:9,padding:'2px 4px'}} placeholder="Inv#" value={invoices[j.id]||''} onChange={e=>setInvoices(p=>({...p,[j.id]:e.target.value}))} onKeyDown={e=>{if(e.key==='Enter')addInvoice(j);}}/>
        <input type="date" className="in mn" style={{width:108,fontSize:9,padding:'2px 4px'}} value={invoiceDates[j.id]||''} onChange={e=>setInvoiceDates(p=>({...p,[j.id]:e.target.value}))} title="Invoice date (required)"/>
        <button className="b bg bs" style={{fontSize:8,padding:'2px 6px',whiteSpace:'nowrap'}} onClick={()=>addInvoice(j)}>➕ Add</button>
      </div>}
    </div>;
  };
  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    <div style={{display:"flex",justifyContent:"space-between",gap:4,flexWrap:"wrap"}}>
      <div style={{display:"flex",gap:3}}>{tabs.map(t=><button key={t.id} className={`b ${tab===t.id?"bp":""}`} onClick={()=>{setTab(t.id);setStatusFilter('All');}} style={tab!==t.id?{borderColor:t.c+"55",color:t.c}:{}}>{t.l} ({jobs.filter(j=>t.statuses.includes(j.status)).length})</button>)}</div>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <select className="in" value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{fontSize:10,padding:"4px 6px",width:140}}>
          <option value="All">All Statuses ({cur.statuses.reduce((c,st)=>c+jobs.filter(j=>j.status===st).length,0)})</option>
          {cur.statuses.map(st=>{const cnt=jobs.filter(j=>j.status===st).length;return <option key={st} value={st}>{st} ({cnt})</option>;})}
        </select>
        <div style={{position:"relative"}}><input className="in" placeholder="🔍 Search Job#, Client, PO, Inv#..." value={sq} onChange={e=>setSq(e.target.value)} style={{width:200,fontSize:10,paddingLeft:8}}/>{sq&&<button style={{position:"absolute",right:4,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:10}} onClick={()=>setSq('')}>✕</button>}</div>
      </div>
    </div>
    <div className="c" style={{padding:0}}><div style={{padding:"6px 8px",borderBottom:`2px solid ${cur.c}`,background:"#0a0f1a"}}><span style={{fontSize:10,fontWeight:700,color:cur.c}}>{statusFilter!=='All'?statusFilter:cur.l} — {filtered.length} jobs{sq?` matching "${sq}"`:''}</span></div>
    <div style={{overflowX:"auto",maxHeight:"calc(100vh-180px)"}}><table><thead><tr><th>Job</th><th>Firm</th><th>Client</th><th>Project</th><th>Status</th><th>PO</th><th>Invoices</th>{tab!=='done'&&<><th>📎 DC</th><th>📎 IC</th><th>Action</th></>}</tr></thead><tbody>
      {filtered.map(j=>{ return <tr key={j.id}><td className="mn" style={{fontSize:10,color:"#e3a008",fontWeight:700,cursor:"pointer",textDecoration:"underline",textDecorationColor:"#e3a00844"}} onClick={()=>openJob(j)}><StatusTip j={j}>{j.id}</StatusTip></td><td><FB f={j.firm} firms={firms}/></td><td style={{fontSize:10}}>{j.client_name?.slice(0,22)}</td><td style={{fontSize:10,color:"#64748b"}}>{j.project?.slice(0,18)}</td><td><StatusTip j={j}><span className="bd" style={{background:(sc[j.status]||'#64748b')+'20',color:sc[j.status]||'#64748b'}}>{j.status}</span></StatusTip></td><td style={{fontSize:10}}>{j.po_number?<span style={{color:"#4ade80"}}>✓</span>:<span style={{color:"#f47067"}}>⚠️</span>}</td>
        <td style={{minWidth:170}}><InvChips j={j} editable={canEditInvoice}/></td>
        {tab!=='done'&&<><td style={{minWidth:90}}>{(()=>{const jobUrls=Array.isArray(j.dc_file_url)?j.dc_file_url:j.dc_file_url?[j.dc_file_url]:[];const batchEntries=(j.batches||[]).flatMap((b,bi)=>(Array.isArray(b.dc_urls)?b.dc_urls:[]).map(u=>({url:u,batchIdx:bi+1})));return <div>{(jobUrls.length>0||batchEntries.length>0)&&<div style={{display:"flex",flexWrap:"wrap",gap:2,marginBottom:3}}>{jobUrls.map((u,i)=><span key={'j'+i} style={{display:"inline-flex",alignItems:"center",gap:3,background:"#3b82f615",border:"1px solid #3b82f633",padding:"2px 6px",borderRadius:4}}><a href={smartOpenUrl(u)} target="_blank" style={{color:"#3b82f6",fontSize:9}}>📄{i+1}</a><button style={{background:"#f4706720",border:"1px solid #f4706744",borderRadius:3,color:"#f47067",cursor:"pointer",fontSize:9,padding:"0 4px",lineHeight:"14px",fontWeight:700}} onClick={()=>{if(confirm('Remove this DC file?'))removeJobFile(j.id,'dc_file_url',u)}}>✕</button></span>)}{batchEntries.map((e,i)=><span key={'b'+i} style={{display:"inline-flex",alignItems:"center",gap:3,background:"#06b6d415",border:"1px solid #06b6d433",padding:"2px 6px",borderRadius:4}} title={`DC attached to Batch ${e.batchIdx}`}><a href={smartOpenUrl(e.url)} target="_blank" style={{color:"#06b6d4",fontSize:9}}>📄{jobUrls.length+i+1}</a><span style={{fontSize:7,color:"#64748b",fontWeight:600}}>B{e.batchIdx}</span></span>)}</div>}<input type="file" accept=".pdf,.jpg,.png" multiple className="in" style={{padding:1,fontSize:8,width:70}} onChange={async e=>{const files=[...e.target.files];if(files.length){const newUrls=await uploadMultiple(files,'accounts-dc');if(newUrls.length&&appendJobFiles)appendJobFiles(j.id,'dc_file_url',newUrls);}}}/></div>;})()}</td><td style={{minWidth:90}}>{(()=>{const urls=Array.isArray(j.ic_file_url)?j.ic_file_url:j.ic_file_url?[j.ic_file_url]:[];return <div>{urls.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:2,marginBottom:3}}>{urls.map((u,i)=><span key={i} style={{display:"inline-flex",alignItems:"center",gap:3,background:"#3b82f615",border:"1px solid #3b82f633",padding:"2px 6px",borderRadius:4}}><a href={smartOpenUrl(u)} target="_blank" style={{color:"#3b82f6",fontSize:9}}>📄{i+1}</a><button style={{background:"#f4706720",border:"1px solid #f4706744",borderRadius:3,color:"#f47067",cursor:"pointer",fontSize:9,padding:"0 4px",lineHeight:"14px",fontWeight:700}} onClick={()=>{if(confirm('Remove this IC file?'))removeJobFile(j.id,'ic_file_url',u)}}>✕</button></span>)}</div>}<input type="file" accept=".pdf,.jpg,.png" multiple className="in" style={{padding:1,fontSize:8,width:70}} onChange={async e=>{const files=[...e.target.files];if(files.length){const newUrls=await uploadMultiple(files,'accounts-ic');if(newUrls.length&&appendJobFiles)appendJobFiles(j.id,'ic_file_url',newUrls);}}}/></div>;})()}</td><td><button className="b bg bs" onClick={()=>markBilled(j)}>✓ Bill Done</button></td></>}
      </tr>})}
      {filtered.length===0&&<tr><td colSpan={tab!=='done'?10:7} style={{textAlign:"center",color:"#4ade80",padding:20}}>No jobs in this category</td></tr>}
    </tbody></table></div></div>
    {/* Edit Batch Invoice Modal — Item #16 (Accounts) ──────── */}
    {editBatchInv&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={()=>setEditBatchInv(null)}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#0c1017',border:'1px solid #1a2030',borderRadius:10,padding:20,width:'100%',maxWidth:440}}>
        <div style={{marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:14,color:'#e6edf3'}}>✏️ Edit Invoice</div>
          <div style={{fontSize:10,color:'#64748b',marginTop:3}}>Job <strong style={{color:'#e3a008'}}>{editBatchInv.batch.job_id}</strong> · Currently: <span style={{color:'#06b6d4',fontWeight:700}}>{editBatchInv.batch.bill_no}</span>{editBatchInv.batch.invoice_date?<> · <span style={{color:'#06b6d4'}}>{editBatchInv.batch.invoice_date}</span></>:<> · <span style={{color:'#f47067'}}>no date</span></>}</div>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:9,color:'#64748b',display:'block',marginBottom:4}}>INVOICE NUMBER</label>
          <input className="in" value={editBatchInv.newNo} onChange={e=>setEditBatchInv(p=>({...p,newNo:e.target.value}))} placeholder="V-9999/26-27 or J-NNN/YY-YY" autoFocus style={{fontSize:13,padding:'6px 10px',width:'100%',letterSpacing:1}}/>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:9,color:'#64748b',display:'block',marginBottom:4}}>INVOICE DATE</label>
          <input type="date" className="in" value={editBatchInv.newDate} onChange={e=>setEditBatchInv(p=>({...p,newDate:e.target.value}))} style={{fontSize:12,padding:'6px 10px',width:'100%'}}/>
        </div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="b bs" onClick={()=>setEditBatchInv(null)} style={{fontSize:11}}>Cancel</button>
          <button className="b bp" onClick={async()=>{
            const v=(editBatchInv.newNo||'').trim();
            const d=(editBatchInv.newDate||'').trim();
            if(!v){show('Enter invoice number',false);return;}
            if(!d){show('Enter invoice date',false);return;}
            const oldNo=editBatchInv.batch.bill_no;
            const oldDate=editBatchInv.batch.invoice_date||'';
            const noChanged=v!==oldNo;
            const dateChanged=d!==oldDate;
            if(!noChanged&&!dateChanged){setEditBatchInv(null);return;}
            const updates={};
            if(noChanged)updates.bill_no=v;
            if(dateChanged)updates.invoice_date=d;
            const {error}=await sb.from('batches').update(updates).eq('id',editBatchInv.batch.id);
            if(error){show('Error: '+error.message,false);return;}
            if(setBatches)setBatches(p=>p.map(b=>b.id===editBatchInv.batch.id?{...b,...updates}:b));
            show('Invoice updated!');
            setEditBatchInv(null);
          }} style={{fontSize:11,background:'#4ade80',borderColor:'#4ade80',color:'#000',fontWeight:700}}>💾 Save</button>
        </div>
      </div>
    </div>}
  </div>;
}

// ═══════════════════════════════════════════════════════════
// BOQ IMPORT — Smart Excel/CSV parser for client BOQs
// ═══════════════════════════════════════════════════════════
function BOQImportPage({firms,clients,products,team,machines,createJob,sp,jobs,user}){
  const [step,setStep]=useState(1);
  const [sheets,setSheets]=useState([]);
  const [selSheets,setSelSheets]=useState([]);
  const [parsedItems,setParsedItems]=useState([]);
  const [its,setIts]=useState([]);
  const [fm,sfm]=useState("JXT");
  const [f,sF]=useState({cl:"",cn:"",cp:"",cph:"",cemail:"",po:"",da:"",pr:"",rd:td(),mb:team[0]?.name||"",pt:"50% Advance. Rest within 30 days.",remark:""});
  const [su,sSu]=useState("INCH");
  const [submitting,setSubmitting]=useState(false);
  const [err,setErr]=useState("");
  const [fileName,setFileName]=useState("");
  const [colHeaders,setColHeaders]=useState([]);
  const [colMap,setColMap]=useState({});
  const [headerRow,setHeaderRow]=useState(0);
  const [importMode,setImportMode]=useState('one_job'); // 'one_job' or 'multi_job'
  const [syncBanking,setSyncBanking]=useState(false);
  const [bankProject,setBankProject]=useState('');
  // 20 Apr: Template system — save/load column mappings per client
  const [boqTemplates,setBoqTemplates]=useState([]); // loaded on mount
  const [templateMatched,setTemplateMatched]=useState(null); // {id, template_name} if auto-match found
  const [manualMode,setManualMode]=useState(false); // user toggled manual column mapping wizard
  const [saveAsTemplate,setSaveAsTemplate]=useState(false);
  const [templateNameInput,setTemplateNameInput]=useState('');
  // Fetch BOQ templates for current client on mount
  React.useEffect(()=>{
    (async()=>{
      const {data,error}=await sb.from('boq_templates').select('*').eq('active',true).order('use_count',{ascending:false});
      if(!error) setBoqTemplates(data||[]);
    })();
  },[]);
  const BANK_PROJECTS=['NCR SBI BRANDING','NCR SBI GSB','NCR PNB GSB','NCR BOB GSB','CMS SBI GSB+LOLLIPOP','CMS SBI BRANDING','CMS BOB GSB+BRANDING','Diebold HDFC GSB'];
  const BANK_MAP={'NCR SBI BRANDING':['NCR','SBI'],'NCR SBI GSB':['NCR','SBI'],'NCR PNB GSB':['NCR','PNB'],'NCR BOB GSB':['NCR','BOB'],'CMS SBI GSB+LOLLIPOP':['CMS','SBI'],'CMS SBI BRANDING':['CMS','SBI'],'CMS BOB GSB+BRANDING':['CMS','BOB'],'Diebold HDFC GSB':['Diebold','HDFC']};

  // Smart size parser — handles all formats: "Width- 16in Height- 24in", "8\"x12\"", "3ftx4ft", "1177.5MM x350.3MM", "18″ × 24″"
  const parseSize=(sizeStr)=>{
    if(!sizeStr||typeof sizeStr!=='string') return {w:'',h:''};
    const s=sizeStr.replace(/\\n/g,' ').replace(/\n/g,' ').replace(/[″″]/g,'"').replace(/['']/g,"'").trim();
    // Pattern: Width- 16in Height- 24in / Width:15 Inch Height:4 Inch
    const wm=s.match(/width[:\-\s]*(\d+\.?\d*)\s*(in|inch|mm|ft)?/i);
    const hm=s.match(/height[:\-\s]*(\d+\.?\d*)\s*(in|inch|mm|ft)?/i);
    if(wm&&hm) return {w:wm[1],h:hm[1]};
    // Pattern: 3ftx4ft / 8"x12" / 18″ × 24″ / 1177.5MM x 350.3MM
    const xm=s.match(/(\d+\.?\d*)\s*(?:"|"|″|ft|in|inch|mm|cm|')?\s*[x×]\s*(\d+\.?\d*)\s*(?:"|"|″|ft|in|inch|mm|cm|')?/i);
    if(xm) return {w:xm[1],h:xm[2]};
    // Pattern: just "54 Inch Height" (single dimension)
    const single=s.match(/(\d+\.?\d*)\s*(in|inch|mm|ft|"|″)/i);
    if(single) return {w:single[1],h:''};
    return {w:'',h:''};
  };

  // Auto-detect header row (may not be row 0 — JPMC has 8 rows of company info)
  const findHeaderRow=(data)=>{
    for(let i=0;i<Math.min(15,data.length);i++){
      const row=data[i];if(!row)continue;
      const txt=row.map(c=>String(c||'').toLowerCase()).join(' ');
      if(/(sl\.?\s*no|sr\.?\s*no)/.test(txt)&&/(description|particular|specification|item|job desc|signage|product)/.test(txt)) return i;
      if(/(description|particular|item|job desc|signage\s*name|product\s*name)/.test(txt)&&/(qty|quantity|unit|uom|nos|sqft|sft|size)/.test(txt)) return i;
      if(/(sl\.?\s*no|sr\.?\s*no)/.test(txt)&&/(qty|quantity|unit|uom|rate|amount)/.test(txt)) return i;
      // CMS/Banking BOQ: has site code + address + job description
      if(/(sr\.?\s*no|sl\.?\s*no)/.test(txt)&&/(site\s*code|atm\s*id)/.test(txt)&&/(address|location)/.test(txt)) return i;
    }
    return 0;
  };

  // Smart column detector — finds columns by fuzzy matching headers
  // Also checks the row BELOW for split headers (e.g. "SIZES IN INCHES" → "WIDTH" | "HEIGHT")
  const detectColumns=(headers,nextRow)=>{
    const h=headers.map(x=>String(x||'').toLowerCase().replace(/[\s\n]/g,' ').trim());
    const h2=nextRow?nextRow.map(x=>String(x||'').toLowerCase().replace(/[\s\n]/g,' ').trim()):[];
    const find=(patterns)=>{for(const p of patterns){const idx=h.findIndex(c=>p.test(c));if(idx>=0)return idx;}return -1;};
    const find2=(patterns)=>{for(const p of patterns){const idx=h2.findIndex(c=>p.test(c));if(idx>=0)return idx;}return -1;};
    let width=find([/^width$/,/width/]);
    let height=find([/^height$/,/height/]);
    // Check next row for split headers like "SIZES IN INCHES" → next row has WIDTH|HEIGHT
    if(width<0&&h2.length>0){width=find2([/^width$/,/width/]);}
    if(height<0&&h2.length>0){height=find2([/^height$/,/height/]);}
    return {
      sr:find([/^sl|^sr|^s\.?\s*no|^#/]),
      desc:find([/description|particular|^item$|job desc|signage\s*name|product\s*name|^name$/]),
      spec:find([/^specification|^material|media\s*make/]),
      wallNo:find([/wall.*no|location|zone/]),
      floor:find([/^floor$/]),
      size:find([/^size$|size.*in|size.*\(|^uom$|^umo$|flex\s*size/]),
      width,height,
      uom:find([/uom|umo|^unit$|^units$/]),
      qty:find([/^qty|quantit|^nos$/]),
      supplyRate:find([/supply.*rate|^rate$|unit rate/]),
      installRate:find([/install.*rate/]),
      totalAmt:find([/total.*amount|total.*amt|^amount$/]),
      remarks:find([/remark/]),
      refImage:find([/ref.*image|^image|reference/]),
      length:find([/^length$/]),
      breadth:find([/^breadth$/]),
      // CMS/Banking specific columns
      siteCode:find([/site\s*code|atm\s*id|branch\s*code/]),
      address:find([/^address$|new\s*address|site\s*address/]),
      pincode:find([/pin\s*code|pincode|^pin$/]),
      city:find([/^city$/]),
      district:find([/^district$/]),
      state:find([/^state$/]),
      fieldOfficer:find([/field\s*officer|f\.?\s*o|contact/]),
    };
  };

  // Parse an Excel sheet into standardized items.
  // overrideCols/overrideHeaderRow: optional — when provided, skip auto-detect (used by manual mapping + templates).
  const parseSheet=(data,sheetName,overrideCols,overrideHeaderRow)=>{
    if(!data||data.length<2) return [];
    const hRow=(overrideHeaderRow!==undefined&&overrideHeaderRow!==null)?overrideHeaderRow:findHeaderRow(data);
    const headers=data[hRow];
    const nextRow=data[hRow+1]||[];
    const cols=overrideCols||detectColumns(headers,nextRow);
    // Check if next row is a sub-header (e.g. WIDTH|HEIGHT under "SIZES IN INCHES")
    const nextRowTxt=(nextRow||[]).map(c=>String(c||'').toLowerCase().trim()).join(' ');
    const hasSplitHeader=/width|height|breadth/.test(nextRowTxt)&&cols.desc>-1;
    const startRow=hasSplitHeader?hRow+2:hRow+1;
    const items=[];
    let lastFloor='';
    for(let r=startRow;r<data.length;r++){
      const row=data[r];
      if(!row||row.every(c=>c===null||c===undefined||c===''))continue;
      // Skip summary/total rows
      const allCellsTxt=row.map(c=>String(c||'').toLowerCase().trim()).join(' ');
      if(/^(sub\s*total|basic|gst|total|general\s*point|note|grand total)/i.test(String(row[0]||'').trim()))continue;
      if(/^(sub\s*total|total|grand total)/i.test(allCellsTxt.slice(0,20)))continue;
      // Skip section headers (no qty, just category names)
      
      const desc=cols.desc>-1?String(row[cols.desc]||''):'';
      const spec=cols.spec>-1?String(row[cols.spec]||''):'';
      const wallNo=cols.wallNo>-1?String(row[cols.wallNo]||''):'';
      const floor=cols.floor>-1?String(row[cols.floor]||''):'';
      const siteCode=cols.siteCode>-1?String(row[cols.siteCode]||''):'';
      if(floor&&floor!=='nan')lastFloor=floor.replace(/\\n/g,' ');
      if(!desc&&!wallNo&&!spec&&!siteCode)continue;
      if(/^nan$/i.test(desc)&&!wallNo&&!spec&&!siteCode)continue;

      let w='',h='';
      if(cols.width>-1&&cols.height>-1){
        w=String(row[cols.width]||'');h=String(row[cols.height]||'');
      } else if(cols.length>-1&&(cols.height>-1||cols.breadth>-1)){
        w=String(row[cols.length]||'');h=String(row[cols.breadth>-1?cols.breadth:cols.height]||'');
      } else if(cols.size>-1){
        const sizeVal=row[cols.size];
        // If size column has a number, treat it as width and next column as height (CMS Flex Size format)
        if(sizeVal&&!isNaN(+sizeVal)&&row[cols.size+1]&&!isNaN(+row[cols.size+1])){
          w=String(sizeVal);h=String(row[cols.size+1]);
        } else {
          const parsed=parseSize(String(sizeVal||''));
          w=parsed.w;h=parsed.h;
        }
      }
      // Also try parsing size from description or spec (e.g. "18″ × 24″")
      if(!w&&!h&&desc){const descSize=parseSize(desc);w=descSize.w;h=descSize.h;}
      if(!w&&!h&&spec){const specSize=parseSize(spec);w=specSize.w;h=specSize.h;}
      // Try UOM column for size (some BOQs put size in UOM like '18″ × 24″')
      if(!w&&!h&&cols.uom>-1){const uomSize=parseSize(String(row[cols.uom]||''));w=uomSize.w;h=uomSize.h;}
      
      const qty=cols.qty>-1?(+row[cols.qty]||0):0;
      // For CMS BOQs with site codes, default qty to 1 if no explicit qty column
      if(qty<=0&&!siteCode)continue;
      const finalQty=qty>0?qty:1;
      const uom=cols.uom>-1?String(row[cols.uom]||'Nos'):'Nos';
      const remarks=cols.remarks>-1?String(row[cols.remarks]||''):'';
      const sRate=cols.supplyRate>-1?(+row[cols.supplyRate]||0):0;
      const iRate=cols.installRate>-1?(+row[cols.installRate]||0):0;

      // Build label: [SiteCode] [Floor] [WallNo]: Description
      let label=desc.slice(0,100);
      if(siteCode&&!/^nan$/i.test(siteCode)) label=siteCode.replace(/\\n/g,' ').trim()+(desc?' — '+label:'');
      else{
        if(wallNo&&!/^nan$/i.test(wallNo)) label=wallNo.replace(/\\n/g,' ').trim()+': '+label;
        if(lastFloor) label=lastFloor+' — '+label;
      }
      
      // Material: combine spec + remarks + CMS address
      let mat=(spec&&!/^nan$/i.test(spec)?spec.replace(/\\n/g,' ').slice(0,80):'');
      if(remarks&&!/^nan$/i.test(remarks)){
        mat=mat?(mat+' | '+remarks.replace(/\\n/g,' ').slice(0,60)):remarks.replace(/\\n/g,' ').slice(0,80);
      }
      // For CMS BOQs, build full site address as material/remarks
      let siteAddr='';
      if(cols.address>-1){
        const parts=[row[cols.address],row[cols.city],row[cols.district],row[cols.state],row[cols.pincode]].filter(v=>v&&String(v).trim()&&!/^nan$/i.test(String(v)));
        siteAddr=parts.map(v=>String(v).trim()).join(', ');
        if(siteAddr&&!mat) mat=siteAddr;
        else if(siteAddr) mat=mat+' | '+siteAddr;
      }
      // Field officer
      const fo=cols.fieldOfficer>-1?String(row[cols.fieldOfficer]||'').trim():'';
      if(fo&&!/^nan$/i.test(fo)) mat=mat?(mat+' | FO: '+fo):('FO: '+fo);

      items.push({
        sr:items.length+1,sheet:sheetName,desc:label.replace(/\\n/g,' '),fullDesc:desc+(spec?'\n\nSpec: '+spec:''),wallNo,floor:lastFloor,
        w:String(w).replace(/[^0-9.]/g,''),h:String(h).replace(/[^0-9.]/g,''),
        qty:finalQty,uom:uom.trim().replace(/^nan$/i,'Nos'),
        remarks:mat,supplyRate:sRate?String(sRate):'',installRate:iRate?String(iRate):'',
      });
    }
    return items;
  };

  const handleFile=async(e)=>{
    const file=e.target.files[0];if(!file)return;setErr("");setFileName(file.name);
    // Reset template state for new file
    setTemplateMatched(null);setManualMode(false);setColMap({});setHeaderRow(0);
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const allSheets=wb.SheetNames.map(name=>{
        const ws=wb.Sheets[name];
        const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        return {name,data,rowCount:data.length-1};
      }).filter(s=>s.rowCount>0);
      setSheets(allSheets);
      setSelSheets(allSheets.map(s=>s.name));
      // 20 Apr: Template auto-match — check if any saved template matches this file's filename OR first sheet name
      if(boqTemplates.length>0&&allSheets.length>0){
        const fname=(file.name||'').toLowerCase();
        const firstSheet=(allSheets[0].name||'').toLowerCase();
        const match=boqTemplates.find(t=>{
          if(t.filename_pattern){const p=t.filename_pattern.toLowerCase();if(fname.includes(p))return true;}
          if(t.sheet_name_pattern){const p=t.sheet_name_pattern.toLowerCase();if(firstSheet.includes(p))return true;}
          return false;
        });
        if(match){
          setTemplateMatched({id:match.id,template_name:match.template_name,client_name:match.client_name});
          setColMap(match.column_map||{});
          setHeaderRow(match.header_row||0);
        }
      }
      setStep(2);
    }catch(ex){
      setErr("Could not read file: "+ex.message);
    }
  };

  const buildFromSheets=()=>{
    let all=[];
    // Use manual mapping if user edited it OR template is applied (non-empty colMap signals override)
    const useOverride=(manualMode||templateMatched)&&Object.keys(colMap||{}).length>0;
    const overrideCols=useOverride?colMap:undefined;
    const overrideHRow=useOverride?headerRow:undefined;
    for(const s of sheets){
      if(!selSheets.includes(s.name))continue;
      const items=parseSheet(s.data,s.name,overrideCols,overrideHRow);
      all=all.concat(items);
    }
    // Re-number
    all.forEach((it,i)=>{it.sr=i+1;});
    setParsedItems(all);
    // Convert to job line items
    setIts(all.map(it=>{
      const sr=+it.supplyRate||0;const ir=+it.installRate||0;const combinedRate=sr+ir;
      const uomMap={'sq ft':'SQFT','sqft':'SQFT','sft':'SQFT','sqm':'SQFT','sq.ft':'SQFT','set':'SET','nos':'NOS','num':'NOS','no':'NOS','pcs':'NOS','lot':'LOT','ls':'LOT','rft':'RFT','rm':'RFT','lm':'RFT'};
      const rm=uomMap[it.uom.toLowerCase()]||'UNIT';
      const sqft=cSq(it.w,it.h,it.qty,su);
      const tot=rm==='SQFT'&&sqft?Math.round(sqft*combinedRate*100)/100:Math.round(it.qty*combinedRate*100)/100;
      const gst=Math.round(tot*0.18*100)/100;
      return {
        id:uid(),sr:it.sr,int:it.desc,cli:it.desc,m:it.remarks||'',w:it.w,h:it.h,
        qty:it.qty,rm,rate:combinedRate||'',sqft,
        tot:combinedRate?tot:0,gst:combinedRate?gst:0,amt:combinedRate?Math.round((tot+gst)*100)/100:0,
        gstPct:18,mach:'In-house',imgUrl:'',
        supplyRate:it.supplyRate,installRate:it.installRate,fullDesc:it.fullDesc,
      };
    }));
    setStep(3);
  };

  const uI=(i,k,v)=>{setIts(p=>{const n=[...p];const it={...n[i],[k]:v};
    const w=+it.w||0,h=+it.h||0,q=+it.qty||1;const gp=(it.gstPct===''||it.gstPct==null)?18:+it.gstPct;
    const sr=+it.supplyRate||0;const ir=+it.installRate||0;const combinedRate=sr+ir;
    it.rate=combinedRate||+it.rate||0;
    it.sqft=cSq(w,h,q,su);
    it.tot=it.rm==="SQFT"?Math.round(it.sqft*it.rate*100)/100:Math.round(q*it.rate*100)/100;
    it.gst=Math.round(it.tot*(gp/100)*100)/100;it.amt=Math.round((it.tot+it.gst)*100)/100;n[i]=it;return n;});};
  const rI=i=>setIts(p=>p.filter((_,x)=>x!==i).map((it,x)=>({...it,sr:x+1})));
  const aI=()=>setIts(p=>[...p,{id:uid(),sr:p.length+1,int:"",cli:"",m:"",w:"",h:"",qty:1,rm:"SQFT",rate:"",sqft:0,tot:0,gst:0,amt:0,gstPct:18,mach:"In-house",imgUrl:"",supplyRate:"",installRate:"",fullDesc:""}]);

  const tot=useMemo(()=>{const s=Math.round(its.reduce((a,x)=>a+x.tot,0)*100)/100,g=Math.round(its.reduce((a,x)=>a+x.gst,0)*100)/100,tq=its.reduce((a,x)=>a+(+x.qty||0),0),tsq=Math.round(its.reduce((a,x)=>a+(+x.sqft||0),0)*100)/100;return{s,g,t:Math.round((s+g)*100)/100,tq,tsq};},[its]);

  const curFY=useMemo(()=>{const n=new Date();const m=n.getMonth(),y=n.getFullYear();return m>=3?`${String(y).slice(2)}${String(y+1).slice(2)}`:`${String(y-1).slice(2)}${String(y).slice(2)}`;},[]); 
  const nextNum=useMemo(()=>{const fyJobs=jobs.filter(j=>j.id?.includes('-'+curFY));const nums=fyJobs.map(j=>{const p=j.id?.split('-')[0];return parseInt(p)||0;});return String(Math.max(0,...nums)+1).padStart(4,'0');},[jobs,curFY]);
  const jid=`${nextNum}-${curFY}`;
  const selC=cid=>{const c=clients.find(x=>x.id===cid);if(c)sF(p=>({...p,cl:cid,cn:c.name,cp:c.contact,cph:c.phone,cemail:c.email||''}));};

  // 20 Apr: Persist BOQ template on successful import (save new / bump use_count)
  // Wrapped in try/catch — template errors never block job creation (main flow already succeeded).
  const persistTemplate=async()=>{
    try{
      if(saveAsTemplate&&templateNameInput&&templateNameInput.trim()&&Object.keys(colMap||{}).length>0){
        // New template — derive patterns from filename + first selected sheet name
        const firstSheet=(selSheets[0]||sheets[0]?.name||'').trim();
        const baseFname=(fileName||'').replace(/\.(xlsx|xls|csv)$/i,'').trim();
        // filename_pattern: first word of the base filename (e.g. "AP_Reliance Sheet (1).xlsx" → "AP_Reliance")
        const fnameTokens=baseFname.split(/[\s_\-(]+/).filter(t=>t.length>=3);
        const fnamePat=fnameTokens[0]||'';
        const sheetPat=firstSheet&&firstSheet.toLowerCase()!=='sheet1'?firstSheet:'';
        await sb.from('boq_templates').insert({
          client_id:f.cl||null,
          client_name:f.cn||'Unknown',
          template_name:templateNameInput.trim(),
          sheet_name_pattern:sheetPat||null,
          filename_pattern:fnamePat||null,
          column_map:colMap,
          header_row:headerRow||0,
          data_start_row:(headerRow||0)+1,
          created_by:user?.name||null,
          use_count:1,
          last_used_at:new Date().toISOString(),
        });
      } else if(templateMatched&&templateMatched.id){
        // Existing template — bump use_count + last_used_at
        const cur=boqTemplates.find(t=>t.id===templateMatched.id);
        await sb.from('boq_templates').update({
          use_count:(cur?.use_count||0)+1,
          last_used_at:new Date().toISOString(),
        }).eq('id',templateMatched.id);
      }
    }catch(ex){
      console.warn('BOQ template persist failed (non-fatal):',ex);
    }
  };

  const submitJob=async()=>{
    if(!f.cn){alert("Select client");return;}
    if(its.length===0){alert("No items");return;}
    if(importMode==='multi_job'){
      // Each item = separate job
      if(!confirm(`Create ${its.length} SEPARATE JOBS?\n\nClient: ${f.cn}\nProject: ${f.pr||'—'}\nJobs to create: ${its.length}\n\nEach row becomes its own job sheet.\nClick OK to proceed.`))return;
      setSubmitting(true);
      const curFYVal=curFY;
      const fyJobs=jobs.filter(j=>j.id?.includes('-'+curFYVal));
      let lastNum=Math.max(0,...fyJobs.map(j=>{const p=j.id?.split('-')[0];return parseInt(p)||0;}));
      for(const it of its){
        lastNum++;
        const newJid=String(lastNum).padStart(4,'0')+'-'+curFYVal;
        const jobData={id:newJid,firm:fm,client_id:f.cl,client_name:f.cn,project:it.int||f.pr,delivery_address:it.siteAddr||f.da,contact_person:f.cp,contact_no:f.cph,made_by:f.mb,po_number:f.po,billing_name:f.cn,client_gst:"",payment_terms:f.pt,status:"Active"};
        const batchId="B"+uid();
        const batchData={id:batchId,job_id:newJid,date:f.rd,note:"BOQ Import: "+fileName,bill_no:"",status:"New"};
        const lineItems=[{id:"LI"+uid(),batch_id:batchId,job_id:newJid,sr:1,product_id:"",internal_name:it.int,client_name:it.cli,media:it.m,width:it.w,height:it.h,size_unit:getUnitMode(it.rm).dimUnit||'INCH',qty:+it.qty||1,rate_mode:it.rm,rate:+it.rate||0,sqft:it.sqft,total:it.tot,gst:it.gst,gstPct:(it.gstPct===''||it.gstPct==null)?18:+it.gstPct,amount:it.amt,area:it.mach||"In-house",dept_estimate:false,dept_design:false,dept_production:false,dept_printing:false,dept_fabrication:false,dept_dispatch:false,dept_installation:false,dept_accounts:false,img_url:it.imgUrl||""}];
        await createJob(jobData,batchData,lineItems);
        // Sync to Banking CRM if enabled
        if(syncBanking&&bankProject){
          const bm=BANK_MAP[bankProject]||['',''];

      await persistTemplate();

  const GST_OPTS=[0,5,12,18,28];

  return <div style={{display:"flex",flexDirection:"column",gap:8,maxWidth:1200}}>

    </div>

    {step===1&&<div className="c a" style={{padding:24,textAlign:"center"}}>

      <label style={{display:"inline-flex",alignItems:"center",gap:6,padding:"10px 24px",background:"#e3a008",color:"#060810",borderRadius:8,fontWeight:700,fontSize:12,cursor:"pointer",transition:"all .15s"}}>

    {step===2&&<>
      <div className="c a" style={{padding:12}}>

          <summary style={{fontSize:10,fontWeight:700,color:"#94a3b8",cursor:"pointer"}}>📚 {boqTemplates.length} saved template{boqTemplates.length>1?'s':''} — click to apply one manually</summary>
          <div style={{marginTop:6,display:"flex",flexDirection:"column",gap:3}}>

        <p style={{fontSize:10,fontWeight:700,color:"#e3a008",marginBottom:8}}>📊 {sheets.length} SHEET(S) DETECTED — Select which to import</p>
        {sheets.map(s=>{const hRow=findHeaderRow(s.data);

            </div>
          </div>;
        })}
        <div style={{display:"flex",gap:4,marginTop:8}}>
          <button className="b" onClick={()=>{setStep(1);setSheets([]);setFileName("");}}>← Back</button>

            // Auto-detect columns, then show mapping UI
            const s=sheets.find(x=>selSheets.includes(x.name));

            // If template matched, use template's headerRow; otherwise auto-detect
            const hRow=templateMatched?headerRow:findHeaderRow(s.data);
            const headers=(s.data[hRow]||[]).map((h,i)=>({idx:i,label:String(h||'Column '+(i+1)).trim()}));
            setColHeaders(headers);
            if(!templateMatched){
              setHeaderRow(hRow);

              const auto=detectColumns(s.data[hRow]||[],s.data[hRow+1]||[]);
              const m={};
              if(auto.desc>=0)m[auto.desc]='item_name';
              if(auto.spec>=0)m[auto.spec]='material';
              if(auto.width>=0)m[auto.width]='width';

              if(auto.remarks>=0)m[auto.remarks]='remarks';

              if(auto.refImage>=0)m[auto.refImage]='ref_image';
              if(auto.pincode>=0)m[auto.pincode]='pincode';
              if(auto.city>=0)m[auto.city]='city';
              if(auto.district>=0)m[auto.district]='district';
              if(auto.state>=0)m[auto.state]='state';

          }} disabled={selSheets.length===0}>Map Columns →</button>
        </div>
      </div>
    </>}

    {step===2.5&&<>
      <div className="c a" style={{padding:12}}>

        <div style={{overflowX:"auto"}}><table><thead><tr>
          {colHeaders.map(h=><th key={h.idx} style={{fontSize:8,whiteSpace:"nowrap",minWidth:80}}>{h.label.slice(0,20)}</th>)}
        </tr></thead><tbody>
          <tr>{colHeaders.map(h=><td key={h.idx} style={{padding:2}}>
            <select className="in" value={colMap[h.idx]||''} onChange={e=>{const v=e.target.value;setColMap(p=>{const n={...p};if(!v)delete n[h.idx];else{Object.keys(n).forEach(k=>{if(n[k]===v&&+k!==h.idx)delete n[k];});n[h.idx]=v;}return n;});}} style={{fontSize:8,padding:"2px",width:"100%",color:colMap[h.idx]?"#4ade80":"#64748b"}}>
              <option value="">— skip —</option>
              <option value="item_name">📌 Item Name</option>
              <option value="material">📦 Material/Spec</option>
              <option value="width">↔ Width</option>
              <option value="height">↕ Height</option>
              <option value="size">📐 Size (WxH)</option>
              <option value="qty">🔢 Qty</option>
              <option value="rate">💰 Rate</option>
              <option value="remarks">📝 Remarks</option>
              <option value="site_code">🏢 Site Code</option>
              <option value="address">📍 Address</option>
              <option value="pincode">📮 Pin Code</option>
              <option value="city">🏙 City</option>
              <option value="district">🗺 District</option>
              <option value="state">🏛 State</option>
              <option value="field_officer">👷 Field Officer</option>
              <option value="job_type">🏷 Job Type/Description</option>
              <option value="ref_image">🖼 Ref Image</option>
            </select>
          </td>)}</tr>
          {(()=>{const s=sheets.find(x=>selSheets.includes(x.name));if(!s)return null;return (s.data||[]).slice(headerRow+1,headerRow+4).map((r,i)=><tr key={i}>{colHeaders.map(h=><td key={h.idx} style={{fontSize:8,maxWidth:100,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"#8b949e"}}>{String(r[h.idx]||'').slice(0,30)}</td>)}</tr>);})()}
        </tbody></table></div>
        <div style={{display:"flex",gap:3,flexWrap:"wrap",marginTop:6}}>
          {Object.entries(colMap).map(([idx,role])=><span key={idx} className="bd" style={{background:"#23863620",color:"#4ade80",fontSize:8}}>{colHeaders.find(h=>h.idx===+idx)?.label?.slice(0,15)} → {role}</span>)}
          {Object.keys(colMap).length===0&&<span style={{fontSize:9,color:"#f47067"}}>⚠️ No columns mapped — assign at least Item Name</span>}
        </div>
        {templateMatched?<div style={{background:"#05966915",border:"1px solid #05966940",borderRadius:8,padding:"8px 10px",marginTop:8,display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:12}}>⚡</span>
          <span style={{fontSize:10,color:"#6ee7b7",fontWeight:600}}>Using template: {templateMatched.template_name}</span>
          <span style={{fontSize:9,color:"#94a3b8",marginLeft:"auto"}}>(will increment use_count on import)</span>
        </div>:<div style={{background:"#0a0f1a",border:"1px solid #1a2030",borderRadius:8,padding:10,marginTop:8}}>
          <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}} onClick={()=>{if(!saveAsTemplate&&!templateNameInput){const guess=(fileName||'').replace(/\.(xlsx|xls|csv)$/i,'').slice(0,40);setTemplateNameInput(guess);}setSaveAsTemplate(p=>!p);}}>
            <div className={`ck ${saveAsTemplate?"on":""}`} style={{flexShrink:0}}>{saveAsTemplate?"✓":""}</div>
            <span style={{fontSize:10,fontWeight:700,color:saveAsTemplate?"#e3a008":"#64748b"}}>📌 Save this mapping as a template</span>
            <span style={{fontSize:8,color:"#64748b"}}>— so next BOQ with similar layout auto-applies it</span>
          </div>
          {saveAsTemplate&&<div style={{marginTop:6}}>
            <input className="in" value={templateNameInput} onChange={e=>setTemplateNameInput(e.target.value)} placeholder="Template name, e.g. Reliance Site List" style={{fontSize:10,padding:"4px 8px",width:"100%"}}/>
            <p style={{fontSize:8,color:"#64748b",marginTop:3}}>Client name will be taken from Step 3. Template matches future files by filename/sheet name containing this text.</p>
          </div>}
        </div>}
        <div style={{background:"#0a0f1a",border:"1px solid #1a2030",borderRadius:8,padding:10,marginTop:8}}>
          <p style={{fontSize:9,fontWeight:700,color:"#8b5cf6",marginBottom:6}}>📋 IMPORT MODE — How should rows be treated?</p>
          <div style={{display:"flex",gap:6}}>
            <label style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer",fontSize:10,color:importMode==='one_job'?"#4ade80":"#64748b",padding:"6px 10px",border:"1px solid "+(importMode==='one_job'?"#4ade80":"#1a2030"),borderRadius:6,background:importMode==='one_job'?"#23863610":"transparent"}} onClick={()=>setImportMode('one_job')}>
              <span style={{width:14,height:14,borderRadius:7,border:"2px solid "+(importMode==='one_job'?"#4ade80":"#64748b"),display:"flex",alignItems:"center",justifyContent:"center"}}>{importMode==='one_job'&&<span style={{width:8,height:8,borderRadius:4,background:"#4ade80"}}/>}</span>
              📦 All rows → ONE job (combined sheet)
            </label>
            <label style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer",fontSize:10,color:importMode==='multi_job'?"#e3a008":"#64748b",padding:"6px 10px",border:"1px solid "+(importMode==='multi_job'?"#e3a008":"#1a2030"),borderRadius:6,background:importMode==='multi_job'?"#e3a00810":"transparent"}} onClick={()=>setImportMode('multi_job')}>
              <span style={{width:14,height:14,borderRadius:7,border:"2px solid "+(importMode==='multi_job'?"#e3a008":"#64748b"),display:"flex",alignItems:"center",justifyContent:"center"}}>{importMode==='multi_job'&&<span style={{width:8,height:8,borderRadius:4,background:"#e3a008"}}/>}</span>
              📑 Each row → SEPARATE job (individual sheets)
            </label>
          </div>
        </div>
        <div style={{background:"#0a0f1a",border:"1px solid #1a2030",borderRadius:8,padding:10,marginTop:8}}>
          <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}} onClick={()=>setSyncBanking(p=>!p)}>
            <div className={`ck ${syncBanking?"on":""}`} style={{flexShrink:0}}>{syncBanking?"✓":""}</div>
            <span style={{fontSize:10,fontWeight:700,color:syncBanking?"#06b6d4":"#64748b"}}>🏦 Sync to Banking CRM</span>
            <span style={{fontSize:8,color:"#64748b"}}>— Creates entries in Banking CRM dashboard for each job</span>
          </div>
          {syncBanking&&<div style={{marginTop:6}}>
            <select className="in" value={bankProject} onChange={e=>setBankProject(e.target.value)} style={{fontSize:10,padding:"4px 8px",width:"100%"}}>
              <option value="">Select Banking Project...</option>
              {BANK_PROJECTS.map(p=><option key={p} value={p}>{p}</option>)}
            </select>
            {!bankProject&&<span style={{fontSize:8,color:"#f47067",marginTop:2,display:"block"}}>⚠️ Select a banking project to enable sync</span>}
          </div>}
        </div>
        <div style={{display:"flex",gap:4,marginTop:8}}>
          <button className="b" onClick={()=>setStep(2)}>← Back</button>
          <button className="b bp" onClick={()=>{
            // Parse using manual mapping
            let all=[];
            for(const s of sheets){
              if(!selSheets.includes(s.name))continue;
              const hRow=headerRow;
              const items=[];
              for(let r=hRow+1;r<s.data.length;r++){
                const row=s.data[r];if(!row||row.every(c=>!c&&c!==0))continue;
                const get=(role)=>{const idx=Object.keys(colMap).find(k=>colMap[k]===role);return idx!=null?String(row[+idx]||'').trim():'';};
                const itemName=get('item_name');const siteCode=get('site_code');
                if(!itemName&&!siteCode)continue;
                const allTxt=row.map(c=>String(c||'').toLowerCase()).join(' ');
                if(/^(total|sub.?total|grand|gst|basic|note)/i.test(allTxt.slice(0,20)))continue;
                let w='',h='';
                const wRaw=get('width'),hRaw=get('height'),sizeRaw=get('size');
                if(wRaw)w=wRaw.replace(/[^0-9.]/g,'');
                if(hRaw)h=hRaw.replace(/[^0-9.]/g,'');
                if(!w&&!h&&sizeRaw){const ps=parseSize(sizeRaw);w=ps.w;h=ps.h;}
                if(!w&&!h&&itemName){const ps=parseSize(itemName);w=ps.w;h=ps.h;}
                const qtyRaw=get('qty');let qty=+qtyRaw||0;
                if(qty<=0&&!siteCode)continue;
                if(qty<=0)qty=1;
                const rate=+(get('rate'))||0;
                const mat=get('material');const remarks=get('remarks');
                // Build full address from address + city + district + state + pincode
                const addrParts=[get('address'),get('city'),get('district'),get('state'),get('pincode')].filter(v=>v&&!/^nan$/i.test(v));
                const fullAddr=addrParts.join(', ');
                const fo=get('field_officer');
                const jobType=get('job_type');
                let label=siteCode?(siteCode+(itemName?' — '+itemName:(jobType?' — '+jobType:''))):itemName;
                let material=[mat,jobType&&!siteCode?'':jobType,remarks,fo?'FO: '+fo:''].filter(v=>v&&!/^nan$/i.test(v)).join(' | ');
                items.push({sr:items.length+1,sheet:s.name,desc:label.slice(0,120),fullDesc:label+(material?'\n'+material:'')+(fullAddr?'\n📍 '+fullAddr:''),
                  w,h,qty,uom:'Nos',remarks:material,supplyRate:rate?String(rate):'',installRate:'',wallNo:'',floor:'',
                  siteAddr:fullAddr,jobType:jobType||''});
              }
              all=all.concat(items);
            }
            all.forEach((it,i)=>{it.sr=i+1;});
            setParsedItems(all);
            setIts(all.map(it=>{
              const sr=+it.supplyRate||0;const ir=+it.installRate||0;const combinedRate=sr+ir;
              const uomMap={'sq ft':'SQFT','sqft':'SQFT','sft':'SQFT','set':'SET','nos':'NOS','pcs':'NOS','lot':'LOT','rft':'RFT'};
              const rm=uomMap[it.uom.toLowerCase()]||'UNIT';
              const sqft=cSq(it.w,it.h,it.qty,su);
              const tot=rm==='SQFT'&&sqft?Math.round(sqft*combinedRate*100)/100:Math.round(it.qty*combinedRate*100)/100;
              const gst=Math.round(tot*0.18*100)/100;
              return {id:uid(),sr:it.sr,int:it.desc,cli:it.desc,m:it.remarks||'',w:it.w,h:it.h,
                qty:it.qty,rm,rate:combinedRate||'',sqft,
                tot:combinedRate?tot:0,gst:combinedRate?gst:0,amt:combinedRate?Math.round((tot+gst)*100)/100:0,
                gstPct:18,mach:'In-house',imgUrl:'',supplyRate:it.supplyRate,installRate:it.installRate,fullDesc:it.fullDesc,
                siteAddr:it.siteAddr||'',jobType:it.jobType||''};
            }));
            setStep(3);
          }} disabled={!colMap||!Object.values(colMap).includes('item_name')&&!Object.values(colMap).includes('site_code')}>Parse {selSheets.length} sheet(s) →</button>
        </div>
      </div>
    </>}

    {step===3&&<>
      <div style={{display:"flex",gap:3}}>{firms.map(fi=><button key={fi.code} className="b" onClick={()=>sfm(fi.code)} style={{flex:1,padding:6,flexDirection:"column",border:`2px solid ${fm===fi.code?fi.color:"#1a2030"}`,background:fm===fi.code?fi.color+"15":"transparent"}}><span style={{fontWeight:800,color:fi.color,fontSize:11}}>{fi.short_name}</span></button>)}</div>

        <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><div><p style={{fontSize:8,color:"#64748b"}}>BOQ IMPORT → NEW JOB</p><p className="mn" style={{fontSize:16,fontWeight:800,color:"#e3a008"}}>{jid}</p></div><span className="bd" style={{background:"#8b5cf620",color:"#8b5cf6"}}>📥 {its.length} items from {selSheets.length} sheet(s)</span></div>

// EXPENSES TRACKER
// ═══════════════════════════════════════════════════════════
function ExpensesPage({expenses,addExpense,deleteExpense,team,firms}){
  const DEFAULT_CATS=["Material Purchase","Transport","Labour","Rent","Electricity","Fuel","Office Supplies","Food & Tea","Maintenance","Salary Advance","Petty Cash","Tools","Ink Purchase","Outsource Payment","Other"];
  // Build dynamic categories from existing expenses + defaults
  const allCats=useMemo(()=>{
    const s=new Set(DEFAULT_CATS);
    expenses.forEach(e=>{if(e.category)s.add(e.category);});
    return [...s].sort();
  },[expenses]);
  const PAY_MODES=["Cash","UPI","Bank Transfer","Cheque","Card","Credit"];
  const [sf,ssf]=useState(false);
  const [receiptFile,setReceiptFile]=useState(null);
  const [saving,setSaving]=useState(false);
  const [filter,setFilter]=useState('all');
  const [fMonth,setFMonth]=useState('all');
  const [addingCat,setAddingCat]=useState(false);
  const [newCat,setNewCat]=useState('');
  const [f,sF]=useState({date:td(),category:DEFAULT_CATS[0],description:"",amount:"",paid_to:"",payment_mode:"Cash",firm:firms[0]?.code||"",job_id:"",approved_by:team[0]?.name||"",notes:""});

  // Get unique "Paid To" names from existing expenses for suggestions
  const paidToNames=useMemo(()=>{
    const s=new Set();
    expenses.forEach(e=>{if(e.paid_to&&e.paid_to.trim())s.add(e.paid_to.trim());});
    return [...s].sort();
  },[expenses]);

  const add=async()=>{if(!f.amount||!f.description){alert("Fill amount & description");return;}setSaving(true);const rUrl=await uploadFile(receiptFile,'expense-receipts');await addExpense({id:"EX"+uid(),...f,amount:+f.amount,receipt_url:rUrl});sF(p=>({...p,description:"",amount:"",paid_to:"",job_id:"",notes:""}));setReceiptFile(null);setSaving(false);};

  const filtered=expenses.filter(e=>{if(filter!=='all'&&e.category!==filter)return false;if(fMonth!=='all'){const d=new Date(e.date);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(key!==fMonth)return false;}return true;}).sort((a,b)=>b.date?.localeCompare(a.date));

  const totalFiltered=filtered.reduce((s,e)=>s+(+e.amount||0),0);
  const monthSet=new Set();expenses.forEach(e=>{if(e.date){const d=new Date(e.date);monthSet.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}});
  const monthOpts=[...monthSet].sort().reverse();

  const catTotals={};filtered.forEach(e=>{catTotals[e.category||'Other']=(catTotals[e.category||'Other']||0)+(+e.amount||0);});

  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
      <button className="b bp" onClick={()=>ssf(p=>!p)}>{sf?"▾ Close":"💸 New Expense"}</button>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <span className="mn" style={{fontSize:12,fontWeight:700,color:"#e3a008"}}>{fmt(totalFiltered)}</span>
        <span style={{fontSize:9,color:"#64748b"}}>{filtered.length} entries</span>
      </div>
    </div>

    {sf&&<div className="c a" style={{padding:10}}>
      <p style={{fontSize:9,color:"#dc2626",fontWeight:700,marginBottom:6}}>💸 LOG EXPENSE</p>
      <div className="fg f4">
        <F l="Date"><input type="date" className="in" value={f.date} onChange={e=>sF(p=>({...p,date:e.target.value}))}/></F>
        <F l="Category">{addingCat?<div style={{display:"flex",gap:3}}><input className="in" value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="New category name" autoFocus style={{flex:1}}/><button className="b bp" style={{fontSize:8,padding:"2px 6px"}} onClick={()=>{if(newCat.trim()){sF(p=>({...p,category:newCat.trim()}));setAddingCat(false);setNewCat('');}}} >✓</button><button className="b bs" style={{fontSize:8,padding:"2px 4px"}} onClick={()=>{setAddingCat(false);setNewCat('');}}>✕</button></div>:<div style={{display:"flex",gap:3}}><select className="in" value={f.category} onChange={e=>{if(e.target.value==='__ADD__'){setAddingCat(true);}else sF(p=>({...p,category:e.target.value}));}} style={{flex:1}}>{allCats.map(c=><option key={c}>{c}</option>)}<option value="__ADD__">➕ Add New Category...</option></select></div>}</F>
        <F l="Amount ₹ *"><input className="in mn" type="number" value={f.amount} onChange={e=>sF(p=>({...p,amount:e.target.value}))} placeholder="0"/></F>
        <F l="Paid To"><div style={{position:"relative"}}><input className="in" list="paidToList" value={f.paid_to} onChange={e=>sF(p=>({...p,paid_to:e.target.value}))} placeholder="Name/Vendor — type or select"/><datalist id="paidToList">{paidToNames.map(n=><option key={n} value={n}/>)}</datalist></div></F>
        <div style={{gridColumn:"span 2"}}><F l="Description *"><input className="in" value={f.description} onChange={e=>sF(p=>({...p,description:e.target.value}))} placeholder="What was this expense for?"/></F></div>
        <F l="Payment Mode"><select className="in" value={f.payment_mode} onChange={e=>sF(p=>({...p,payment_mode:e.target.value}))}>{PAY_MODES.map(m=><option key={m}>{m}</option>)}</select></F>
        <F l="Firm"><select className="in" value={f.firm} onChange={e=>sF(p=>({...p,firm:e.target.value}))}><option value="">General</option>{firms.map(fm=><option key={fm.code} value={fm.code}>{fm.short_name}</option>)}</select></F>
        <F l="Job# (optional)"><input className="in mn" value={f.job_id} onChange={e=>sF(p=>({...p,job_id:e.target.value}))} placeholder="Link to job"/></F>
        <F l="Approved By"><select className="in" value={f.approved_by} onChange={e=>sF(p=>({...p,approved_by:e.target.value}))}>{team.map(t=><option key={t.name} value={t.name}>{t.name}</option>)}</select></F>
        <F l="📸 Receipt"><input type="file" accept="image/*,.pdf" capture="environment" className="in" style={{padding:2}} onChange={e=>setReceiptFile(e.target.files[0]||null)}/></F>
        <F l="Notes"><input className="in" value={f.notes} onChange={e=>sF(p=>({...p,notes:e.target.value}))} placeholder="Extra details..."/></F>
      </div>
      <button className="b bp" onClick={add} style={{marginTop:8}} disabled={saving}>{saving?"⏳ Saving...":"Save Expense"}</button>
    </div>}

    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
      <select className="in" value={filter} onChange={e=>setFilter(e.target.value)} style={{width:160,fontSize:10}}>
        <option value="all">All Categories</option>
        {allCats.map(c=><option key={c} value={c}>{c}</option>)}
      </select>
      <select className="in" value={fMonth} onChange={e=>setFMonth(e.target.value)} style={{width:120,fontSize:10}}>
        <option value="all">All Months</option>
        {monthOpts.map(m=><option key={m} value={m}>{m}</option>)}
      </select>
    </div>

    {Object.keys(catTotals).length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
      {Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=><span key={cat} style={{background:"#1a0505",border:"1px solid #dc262633",borderRadius:5,padding:"3px 7px",fontSize:9.5}}><strong style={{color:"#dc2626"}}>{fmtK(amt)}</strong> <span style={{color:"#94a3b8"}}>{cat}</span></span>)}
    </div>}

    <div className="c" style={{padding:0}}><div style={{overflowX:"auto",maxHeight:"calc(100vh - 220px)"}}><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Paid To</th><th>Mode</th><th>Firm</th><th>Job</th><th>By</th><th>📎</th><th></th></tr></thead><tbody>
      {filtered.map(e=><tr key={e.id}>
        <td>{e.date}</td>
        <td><span className="bd" style={{background:"#dc262620",color:"#f87171"}}>{e.category}</span></td>
        <td style={{fontSize:10,maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.description}</td>
        <td className="mn" style={{fontWeight:700,color:"#dc2626"}}>{fmt(e.amount)}</td>
        <td style={{fontSize:10}}>{e.paid_to}</td>
        <td><span className="bd" style={{background:e.payment_mode==='Cash'?"#f59e0b20":"#3b82f620",color:e.payment_mode==='Cash'?"#f59e0b":"#3b82f6"}}>{e.payment_mode}</span></td>
        <td>{e.firm&&<FB f={e.firm} firms={firms}/>}</td>
        <td className="mn" style={{fontSize:10,color:"#e3a008"}}>{e.job_id||'—'}</td>
        <td style={{fontSize:10}}>{e.approved_by}</td>
        <td>{e.receipt_url?<a href={e.receipt_url} target="_blank" style={{color:"#3b82f6",fontSize:9}}>📸</a>:'—'}</td>
        <td><button className="b br bs" onClick={()=>{if(confirm('Delete this expense?'))deleteExpense(e.id)}} style={{fontSize:8,padding:"1px 4px"}}>✕</button></td>
      </tr>)}
      {filtered.length===0&&<tr><td colSpan={11} style={{textAlign:"center",color:"#64748b",padding:20}}>No expenses found</td></tr>}
    </tbody></table></div></div>
  </div>;
}

// ROOT APP — Loads master data, then shows Login or MainApp
// ═══════════════════════════════════════════════════════════
function RootApp(){
  const [user,setUser]=useState(()=>{
    try{const s=localStorage.getItem('erp_user');return s?JSON.parse(s):null;}catch(e){return null;}
  });
  const [masterData,setMasterData]=useState(null);
  const [loading,setLoading]=useState(true);

  const handleLogin=(member)=>{
    setUser(member);
    try{localStorage.setItem('erp_user',JSON.stringify(member));localStorage.setItem('erp_login_time',Date.now().toString());}catch(e){}
  };
  const handleLogout=()=>{
    setUser(null);
    try{localStorage.removeItem('erp_user');localStorage.removeItem('erp_pg');localStorage.removeItem('erp_login_time');}catch(e){}
  };

  useEffect(()=>{
    async function loadMaster(){
      const [f,c,s,p,m,mac,ag,db,tm] = await Promise.all([
        sb.from('firms').select('*'),
        sb.from('clients').select('*').order('name'),
        sb.from('suppliers').select('*').order('name'),
        sb.from('products').select('*').order('internal_name'),
        sb.from('materials').select('*').order('name'),
        sb.from('machines').select('*'),
        sb.from('outsource_agencies').select('*'),
        sb.from('delivery_boys').select('*'),
        sb.from('team_members').select('*').eq('active',true),
      ]);
      setMasterData({
        firms:f.data||[], clients:c.data||[], suppliers:s.data||[],
        products:p.data||[], materials:m.data||[], machines:mac.data||[],
        agencies:ag.data||[], delBoys:db.data||[], team:tm.data||[],
      });
      // Validate stored session — if user no longer in team, auto-logout
      try{
        const stored=localStorage.getItem('erp_user');
        if(stored){
          const u=JSON.parse(stored);
          const teamList=tm.data||[];
          const valid=teamList.find(t=>t.name===u.name&&t.pin===u.pin);
          if(!valid){localStorage.removeItem('erp_user');localStorage.removeItem('erp_pg');setUser(null);}
        }
      }catch(e){}
      setLoading(false);
    }
    loadMaster();
  },[]);

  if(loading) return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,background:"#060810"}}><div className="loader"/><p style={{color:"#64748b",fontSize:12}}>Loading iPrint ERP...</p></div>;

  // CLIENT PORTAL — if URL has ?client=CODE
  const urlP=new URLSearchParams(window.location.search);
  const cCode=urlP.get('client');
  if(cCode) return <ClientPortal code={cCode}/>;

  if(!user) return <Login onLogin={handleLogin} team={masterData.team}/>;
  return <MainApp user={user} onLogout={handleLogout} masterData={masterData}/>;
}

  const togglePmtStatus=async(site,newStatus,note='')=>{

  const canUploadFiles=(()=>{const uN=(user?.name||'').toUpperCase();return ['JIGAR','AMOL','CHANDNI','RUCHITA','PRIYANKA','APARNA'].some(u=>uN.includes(u));})();

  const addInvoice=async(site,invNo,invDate)=>{

  // ── DEPT STATUS ROLLUP (Hybrid: granular per-job, falling back to jobs.status for old jobs) ──
  // For each job, compute which dept stages are CURRENTLY active. Two routes per job:
  //   1) GRANULAR — any dept_* tick on any line_item OR any outsource_items row → use new logic
  //   2) STATUS — no granular signal at all → fall back to jobs.status mapping (for old jobs)
  // Uses top-level STATUS_TO_LEADING constant for the status→stage mapping.
  // Each map entry records `source: 'granular'|'status'` for debugging.
  const jobDeptStatus = React.useMemo(() => {
    const map = {};
    if (!jobs || !jobs.length) return map;
    // Index line_items + outsource_items by job_id for O(1) lookup
    const itemsByJob = {};
    (items||[]).forEach(it => {
      if (!it.job_id) return;
      (itemsByJob[it.job_id] = itemsByJob[it.job_id] || []).push(it);
    });
    const osByJob = {};
    (osItems||[]).forEach(o => {
      if (!o.job_id) return;
      (osByJob[o.job_id] = osByJob[o.job_id] || []).push(o);
    });
    jobs.forEach(j => {
      const jobNoPrefix = (j.id||'').split('-')[0];
      if (!jobNoPrefix) return;
      // FY collision guard (23 Apr 26): when a site's job number exists in multiple
      // FYs (e.g. 1073-2526 AND 1073-2627), both share the same jobNoPrefix '1073'.
      // Without this guard, the forEach iteration order silently decides which status
      // the site gets classified by. Rule: the newer FY (lexicographically-greater
      // job id) represents the more current state of work on that site and wins.
      const existing = map[jobNoPrefix];
      if (existing && existing._jobId && existing._jobId >= j.id) return;
      const lineItems = itemsByJob[j.id] || [];
      const osList = osByJob[j.id] || [];
      // OPTION B (17 Apr 26): STATUS WINS. `leading` always comes from jobs.status.
      // dept_* ticks are recorded separately for debug but no longer drive card counts.
      // This gives predictable, status-consistent counts that match the Dashboard.
      // 18 Apr 26 update: also keep raw status so non-leading STATUS_CARDS buckets
      // (estimate/draft/accounts/nobill/cancelled) can roll up at site level too.
      const leading = STATUS_TO_LEADING(j.status);
      const hasGranularSignal = osList.length > 0 || lineItems.some(it =>
        it.dept_design || it.dept_printing || it.dept_fabrication ||
        it.dept_dispatch || it.dept_installation || it.dept_accounts
      );
      // Booleans: each site belongs to exactly ONE bucket = its leading bucket.
      // This makes card-click filtering and count totals line up cleanly.
      map[jobNoPrefix] = {
        design:    leading === 'design',
        printIn:   leading === 'printIn',
        printOut:  leading === 'printOut',
        fabIn:     leading === 'fabIn',
        fabOut:    leading === 'fabOut',
        dispatch:  leading === 'delivered',     // Banking CRM still uses 'dispatch' key, but reads from new 'delivered' leading bucket
        installed: leading === 'installation',  // Banking CRM still uses 'installed' key, but reads from new 'installation' leading bucket
        leading,
        status:    j.status,  // raw status — used for non-leading STATUS_CARDS buckets
        source: (hasGranularSignal && lineItems.length > 0) ? 'granular' : 'status',
        _jobId:    j.id  // used by FY collision guard — keep the newer FY's classification
      };
    });
    return map;
  }, [jobs, items, osItems, refreshTick]);

  // Helper to get a site's dept status (defensive: always returns an object)
  const siteDeptStatus = React.useCallback((s) => {
    return (s && s.job_no && jobDeptStatus[s.job_no]) || {design:false,printIn:false,printOut:false,fabIn:false,fabOut:false,dispatch:false,installed:false,leading:null,status:null};
  }, [jobDeptStatus]);

  const projects=useMemo(()=>{

  // Filtered sites
  const filtered=useMemo(()=>{

        f=f.filter(s=>{
          const st = siteDeptStatus(s);
          if(card.isLeading) return st.leading === card.key;
          return st.status && card.statuses.includes(st.status);
        });
      }
    }
    if(search){const q=search.toLowerCase();f=f.filter(s=>
      s.site_address?.toLowerCase().includes(q)||s.atm_id?.toLowerCase().includes(q)||s.site_unique_id?.toLowerCase().includes(q)||
      s.city?.toLowerCase().includes(q)||s.state?.toLowerCase().includes(q)||
      s.vendor_name?.toLowerCase().includes(q)||s.job_no?.toLowerCase().includes(q)||
      s.billing_status?.toLowerCase().includes(q)||s.district?.toLowerCase().includes(q)
    );}
    return f;
  },[sites,tab,stFilter,stateFilter,search,deptFilter,siteDeptStatus]);

  // Stats
  const stats=useMemo(()=>{
    const f=tab==='ALL'?sites:sites.filter(s=>s.project===tab);
    return {
      total:f.length,
      invoiced:f.filter(s=>s.billing_category==='Invoiced').length,
      givenForBilling:f.filter(s=>s.billing_category==='Given for Billing').length,
      pending:f.filter(s=>!s.billing_category||['Photo Pending','Work/PO Pending','Billing Pending','Other'].includes(s.billing_category)).length,
      completed:f.filter(s=>s.work_category==='Completed').length,
      photoReceived:f.filter(s=>s.photo_status?.includes('Received')).length,
      photoPending:f.filter(s=>!s.photo_status||s.photo_status.includes('Pending')||s.photo_status==='').length,
    };
  },[sites,tab]);

  // Dept counts — uses leading-edge so sums are clean (each site counted once)
  // Site-level rollup over all 12 STATUS_CARDS buckets. Each site counts in exactly one bucket
  // (its linked job's classification). Sites with no linked job land in untracked.
  // 18 Apr 26: expanded from 7 production buckets to all 12 for cross-page consistency.
  const deptCounts = useMemo(() => {
    const f = tab==='ALL' ? sites : sites.filter(s => s.project===tab);
    const c = Object.fromEntries(STATUS_CARDS.map(card => [card.key, 0]));
    c.untracked = 0;
    f.forEach(s => {
      const st = siteDeptStatus(s);
      let matched = false;
      for (const card of STATUS_CARDS) {
        if (card.isLeading) {
          if (st.leading === card.key) { c[card.key]++; matched = true; break; }
        } else {
          if (st.status && card.statuses.includes(st.status)) { c[card.key]++; matched = true; break; }
        }
      }
      if (!matched) c.untracked++;
    });
    return c;
  }, [sites, tab, siteDeptStatus]);

  // Unique states for filter
  const states=useMemo(()=>{
    // Pull distinct state values present in sites data, then intersect with
    // INDIAN_STATES to enforce canonical ordering + drop any non-canonical
    // stragglers (e.g. empty string, legacy variants that slipped past cleanup).
    const present=new Set();sites.forEach(r=>{if(r.state)present.add(r.state);});
    return INDIAN_STATES.filter(s=>present.has(s));
  },[sites]);

  // Billing categories for filter
  // ── SITE ACTIONS: Delete & Move ─────────────────────────────────────────
  const deleteSite=async(site)=>{

  const moveSite=async(site,newJobNo)=>{

    if(error){show('Move failed: '+error.message,false);return;}

    setSiteAction(null);
    setMoveJobNo('');
    show('✅ Site moved to Job '+cleaned);
  };
  // ── DUPLICATE DETECTION ───────────────────────────────────────────────────
  const dupIds=useMemo(()=>{
    const seen={};const dups=new Set();const groupKeys=new Set();
    sites.forEach(s=>{
      const key=(s.atm_id||'')+'||'+(s.site_unique_id||'');
      if(key!=='||'){
        if(seen[key]){ dups.add(s.id); dups.add(seen[key]); groupKeys.add(key); }
        else seen[key]=s.id;
      }
    });
    // Attach counts as non-enumerable props so dups.has() / dups.size still work normally
    // for the row-highlighting code path at line ~6163.
    dups.groupCount = groupKeys.size;        // 1 group per unique duplicate key (int, actionable)
    dups.extraRows  = dups.size - groupKeys.size; // rows beyond the first in each group
    return dups;
  },[sites]);

  const billingCats=useMemo(()=>{
    const s=new Set();sites.forEach(r=>{if(r.billing_category)s.add(r.billing_category);});

  // Update a site field
  const updateSite=async(id,field,value)=>{

  // Export to Excel

      'Address':s.site_address||'','City':s.city||'','District':s.district||'',

  // Add new site to CRM
  const addSite=async()=>{

    const id='BS-'+Date.now()+Math.random().toString(36).slice(2,5);

    if(!error){setSites(p=>[rec,...p]);setShowAddSite(false);setCustomProject(false);setNewSite({project:'',client:'',bank:'',job_no:'',po_number:'',atm_id:'',site_unique_id:'',site_address:'',city:'',district:'',state:'',pincode:'',vendor_name:'',vendor_contact:'',installation_status:'Pending',photo_status:'',billing_category:'',work_category:'Pending',remarks:'',install_pending_remarks:'',in_progress_remarks:''});show('Site added!');}
    else show('Error: '+error.message,false);
  };

  // Project options for dropdown
  const projectOpts=['NCR SBI BRANDING','NCR SBI GSB','NCR PNB GSB','NCR BOB GSB','CMS SBI GSB+LOLLIPOP','CMS SBI BRANDING','CMS BOB GSB+BRANDING','Diebold HDFC GSB'];
  const clientBankMap={'NCR SBI BRANDING':['NCR','SBI'],'NCR SBI GSB':['NCR','SBI'],'NCR PNB GSB':['NCR','PNB'],'NCR BOB GSB':['NCR','BOB'],'CMS SBI GSB+LOLLIPOP':['CMS','SBI'],'CMS SBI BRANDING':['CMS','SBI'],'CMS BOB GSB+BRANDING':['CMS','BOB'],'Diebold HDFC GSB':['Diebold','HDFC']};

  // Paginated
  const paged=filtered.slice(page*pageSize,(page+1)*pageSize);
  const totalPages=Math.ceil(filtered.length/pageSize);

  if(loading)return <div style={{display:'flex',alignItems:'center',justifyContent:'center',padding:40}}><div className="loader"></div><span style={{marginLeft:8,color:'#64748b'}}>Loading Banking CRM...</span></div>;

    </div>

    {/* Dept Status Cards (NEW) — click to filter sites by current production stage */}
    <div style={{background:'#060810',border:'1px solid #1a2030',borderRadius:6,padding:'7px 10px',marginTop:5}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
        <p style={{fontSize:8,color:'#64748b',textTransform:'uppercase',letterSpacing:'.05em',fontWeight:600,margin:0}}>
          🏭 Production Status — click to filter
        </p>
        {deptFilter && <button className="b bs" onClick={()=>setDeptFilter(null)} style={{fontSize:8,padding:'1px 7px',color:'#f47067',borderColor:'#f47067'}}>✕ Clear filter</button>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(90px,1fr))',gap:5}}>
        {STATUS_CARDS.map(d => {
          const active = deptFilter === d.key;
          return (

              onClick={()=>setDeptFilter(active ? null : d.key)}

        </p>
      )}
    </div>

    {/* Linked ERP Jobs Summary */}
    {(()=>{
      const BANKING_CLIENTS=['DIEBOLD','CMS','OKI','NCR','NUVAMA','NUVAMA WEALTH','J M FINANCE','JM FINANCE','J.M. FINANCE','HITACHI','EDELWEISS','NIDO'];
      const isBk=(cn)=>{if(!cn)return false;const u=cn.toUpperCase();return BANKING_CLIENTS.some(b=>u.includes(b));};
      const bJobs=jobs.filter(j=>isBk(j.client_name));
      const erpActive=bJobs.filter(j=>!['Billing Done','Cash Received','No Bill','Cancelled'].includes(j.status));
      const erpBilled=bJobs.filter(j=>['Billing Done','Cash Received'].includes(j.status));
      const erpBillPend=bJobs.filter(j=>['Billing Pending','Given for Billing','Cash Pending','Proforma Invoice','IC Pending'].includes(j.status));
      return <div className="c" style={{padding:8}}>
        <p style={{fontSize:9,color:'#64748b',marginBottom:4}}>📋 ERP JOBS (Banking Clients)</p>
        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          <span style={{fontSize:11}}><strong style={{color:'#3b82f6'}}>{bJobs.length}</strong> <span style={{fontSize:9,color:'#64748b'}}>Total Jobs</span></span>
          <span style={{fontSize:11}}><strong style={{color:'#e3a008'}}>{erpActive.length}</strong> <span style={{fontSize:9,color:'#64748b'}}>Active</span></span>

        </div>
      </div>;
    })()}

    {/* Filters + Search + Export + Add */}
    <div className="c" style={{padding:8,display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
      <select className="in" value={stFilter} onChange={e=>{setStFilter(e.target.value);setPage(0);}} style={{fontSize:10,padding:'4px 6px',width:130}}>

          <textarea className="in" value={editRemarks.in_progress_remarks} onChange={e=>setEditRemarks(p=>({...p,in_progress_remarks:e.target.value}))} style={{fontSize:11,padding:'6px 8px',width:'100%',minHeight:50,resize:'vertical'}} placeholder="e.g. Material dispatched on 15-Apr"/>

        </div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="b bs" onClick={()=>setEditInvoice(null)} style={{fontSize:11}}>Cancel</button>
          <button className="b bp" onClick={async()=>{
            const v=editInvoice.newNo.trim();
            const d=(editInvoice.newDate||'').trim();
            if(!v){show('Enter invoice number',false);return;}
            if(!d){show('Enter invoice date',false);return;}
            const oldNo=editInvoice.invoice_row.invoice_no;
            const oldDate=editInvoice.invoice_row.invoice_date||'';
            const noChanged=v!==oldNo;
            const dateChanged=d!==oldDate;
            if(!noChanged&&!dateChanged){setEditInvoice(null);return;}
            const updates={};
            if(noChanged)updates.invoice_no=v;
            if(dateChanged)updates.invoice_date=d;
            const {error}=await sb.from('site_invoices').update(updates).eq('id',editInvoice.invoice_row.id);
            if(error){
              if(error.code==='23505'){show('Invoice '+v+' already exists for this site',false);return;}
              show('Error: '+error.message,false);return;
            }
            setInvoicesBySite(p=>{const np={...p};Object.keys(np).forEach(sid=>{np[sid]=np[sid].map(iv=>iv.id===editInvoice.invoice_row.id?{...iv,...updates}:iv);});return np;});
            show('Invoice updated!');
            setEditInvoice(null);

            <button className="b bp" onClick={()=>moveSite(siteAction.site,moveJobNo)} style={{fontSize:11,background:'#06b6d4',borderColor:'#06b6d4',color:'#000',fontWeight:700}}>🔀 Move Site</button>
          </div>
        </div>}
      </div>
    </div>}

              {canAddInvoice&&<button onClick={()=>{setShowAddInvoice(s);setNewInvoiceNo('');setNewInvoiceDate('');}} style={{background:'none',border:'1px dashed #06b6d466',color:'#06b6d4',cursor:'pointer',fontSize:8,padding:'1px 5px',borderRadius:3}}>+ Invoice</button>}

      <span className="mn" style={{fontSize:10,color:'#64748b'}}>/ {totalPages}</span>
    </div>}
  </div>;
}
