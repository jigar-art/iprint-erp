  <div class="footer-row">
    <div>
      <div>Company's PAN &nbsp;&nbsp;: &nbsp;<strong>${firm.pan}</strong></div>
      ${firm.msme ? '<div style="margin-top:2px">MSME Reg.No (UAN) : &nbsp;<strong>' + firm.msme + '</strong></div>' : ''}
    </div>
  </div>

  <div class="sig-box">
    <img src="${SIGNATURE_IMG}" style="width:180px;height:98px;object-fit:contain;display:block;margin-left:auto" alt="signature"/>
    <div style="font-weight:700;font-size:11px">for ${firm.short}</div>
    <div style="font-size:10px;color:#555;margin-top:2px">Authorised Signatory</div>
  </div>

  <div class="computer-gen">This is a Computer Generated Document</div>

</body></html>`;
  };

  const generatePO = async (pr) => {
    setGenerating(pr.id);
    // Reuse existing PO number when re-generating. Only mint a new number on first generation.
    // Prevents accidental PO counter increments when users click Re-generate to view/reprint.
    const poNo = pr.po_no || await genPONo(pr.firm_code);
    const firm = FIRM_DATA[pr.firm_code] || FIRM_DATA.JXT;
    // Apply Shreya's TDS% for first-time generation; re-gen keeps stored tds_pct.
    const effectiveTdsPct = pr.po_no ? (+pr.tds_pct || 0) : (+tdsByPr[pr.id] || 0);
    const subtotal = +pr.subtotal || 0;
    const enhancedPr = {
      ...pr,
      tds_pct: effectiveTdsPct,
      tds_amount: +(subtotal * effectiveTdsPct / 100).toFixed(2)
    };
    const html = buildPOHtml(enhancedPr, poNo, firm, jobs);
    setPoPreview({pr: enhancedPr, poNo, html, firm});
    setGenerating(null);
  };

  const downloadPO = (preview) => {
    const {html, poNo} = preview;
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `PO-${poNo.replace(/\//g,'-')}.html`;
    a.click(); URL.revokeObjectURL(url);
  };

  const printPO = (preview) => {
    const w = window.open('','_blank','width=900,height=700');
    w.document.write(preview.html);
    w.document.close();
    setTimeout(() => w.print(), 500);
  };

  const savePONo = async (preview) => {
    const {pr, poNo} = preview;
    const nowIso = new Date().toISOString();
    const {error} = await sb.from('purchase_requests').update({
      po_no: poNo, status: 'PO Generated',
      po_generated_by: user?.name||'', po_generated_at: nowIso,
      last_status_change_at: nowIso,
      tds_pct: +pr.tds_pct || 0,
      tds_amount: +pr.tds_amount || 0
    }).eq('id', pr.id);
    if (error) { show('⚠️ Save failed: ' + error.message, false); return; }
    setPrs(p => p.map(x => x.id === pr.id ? {...x, po_no: poNo, status:'PO Generated', po_generated_by:user?.name, po_generated_at:nowIso, last_status_change_at:nowIso, tds_pct:pr.tds_pct, tds_amount:pr.tds_amount} : x));
    setTdsByPr(prev => { const next = {...prev}; delete next[pr.id]; return next; });
    show('✅ PO ' + poNo + ' saved!');
    // Auto-notify requestor that their PR is now a PO
    const reqPhone = WA_NUMBERS[pr.created_by];
    if (reqPhone) {
      const msg = `📄 PO Generated for your PR *${pr.pr_no}*.\n\n*PO No:* ${poNo}\nVendor: ${pr.vendor_name}\nAmount: ₹${(+pr.total||0).toLocaleString('en-IN')}\n\nPO is being sent to vendor. Track status in *My PRs* tab.`;
      sendWhatsApp(reqPhone, msg, 'iprint_po_generated');
    }
  };

  const sendVendorWA = (preview) => {
    const {pr, poNo} = preview;
    const msg = `Dear *${pr.vendor_name}*,\n\nPlease find below our Purchase Order details:\n\n*PO No:* ${poNo}\n*Date:* ${new Date().toLocaleDateString('en-IN')}\n*Items:* ${(pr.items||[]).map(x=>x.product+' x'+x.qty).join(', ')}\n*Total:* ₹${(+pr.total||0).toLocaleString('en-IN')}\n*Payment Terms:* ${pr.payment_terms||'To be confirmed'}\n\nKindly confirm receipt and expected delivery date.\n\nRegards,\n*${FIRM_DATA[pr.firm_code]?.short||'iPrint'}*`;
    const phone = (pr.vendor_phone||'').replace(/\D/g,'').replace(/^0/,'91').replace(/^(?!91)/,'91');
    if (phone.length >= 10) sendWhatsApp(phone, msg, 'iprint_po_send');
    else { navigator.clipboard?.writeText(msg); show('📋 Message copied — no vendor phone on file'); }
  };

  // Cancel PO (Item 5 — 23 Apr 26)
  // Jigar-only. Reverts PR from 'PO Generated' / 'PO Sent' back to 'Approved' state,
  // clears the po_no + po_generated_by + po_generated_at + po_sent_at, and records
  // cancellation audit (who, when, why). Blocked if goods were already received.
  const [cancelPr, setCancelPr] = React.useState(null); // {pr, reason}
  const [cancelling, setCancelling] = React.useState(false);
  const canCancelPO = (pr) => {
    const isJigar = (user?.name||'').toUpperCase() === 'JIGAR';
    if (!isJigar) return false;
    if (!['PO Generated','PO Sent'].includes(pr.status)) return false;
    if (pr.received_at) return false; // goods already received — cannot cancel
    return true;
  };
  const submitCancelPO = async () => {
    if (!cancelPr || cancelling) return;
    const { pr, reason } = cancelPr;
    if (!reason || !reason.trim()) {
      show && show('Cancellation reason is required', false); return;
    }
    setCancelling(true);
    const nowIso = new Date().toISOString();
    const updates = {
      status: 'Approved',
      po_no: null,
      po_generated_by: null,
      po_generated_at: null,
      po_sent_at: null,
      po_cancelled_by: user?.name || 'Unknown',
      po_cancelled_at: nowIso,
      po_cancellation_reason: reason.trim(),
      last_status_change_at: nowIso
    };
    try {
      const { error } = await sb.from('purchase_requests').update(updates).eq('id', pr.id);
      if (error) { show && show('Cancel failed: ' + error.message, false); setCancelling(false); return; }
      setPrs(p => p.map(x => x.id === pr.id ? { ...x, ...updates } : x));
      setCancelPr(null);
      setCancelling(false);
      show && show('❌ PO cancelled — PR returned to Approved state');
    } catch (e) {
      show && show('Error: ' + (e.message || 'unknown'), false);
      setCancelling(false);
    }
  };

  return (
    <div style={{padding:12, overflowY:'auto', height:'100%'}}>
      {/* Header */}
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12, flexWrap:'wrap', gap:8}}>
        <div>
          <h2 style={{fontSize:14, fontWeight:800, color:'#06b6d4', margin:0}}>📄 PO Generator</h2>
          <p style={{fontSize:10, color:'#64748b', margin:'2px 0 0'}}>Generate Purchase Order PDFs for approved PRs</p>
        </div>
        <div style={{display:'flex', gap:4}}>
          {STATUS_FILTERS.map(f => (
            <button key={f} className={`b bs ${filter===f?'bp':''}`} onClick={() => setFilter(f)}
              style={{fontSize:9, padding:'3px 8px', ...(filter===f&&f==='Approved'?{background:'#4ade8020',borderColor:'#4ade80',color:'#4ade80'}:{})}}>
              {f}{f==='Approved'?` (${prs.filter(p=>p.status==='Approved').length})`:''}</button>
          ))}
        </div>
      </div>

      {/* PO Preview Panel */}
      {poPreview && (
        <div style={{background:'#0a0f1a', border:'1px solid #06b6d444', borderRadius:8, padding:12, marginBottom:12}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8, flexWrap:'wrap', gap:6}}>
            <div>
              <span style={{fontWeight:800, color:'#06b6d4', fontSize:12}}>{poPreview.poNo}</span>
              <span style={{marginLeft:8, fontSize:9, color:'#64748b'}}>{poPreview.pr.vendor_name} · ₹{(+poPreview.pr.total||0).toLocaleString('en-IN')}</span>
            </div>
            <div style={{display:'flex', gap:4, flexWrap:'wrap'}}>
              <button className="b bp" onClick={() => printPO(poPreview)}
                style={{fontSize:9, padding:'4px 12px', background:'#06b6d4', borderColor:'#06b6d4', color:'#000', fontWeight:700}}>
                🖨️ Print / Save PDF
              </button>
              <button className="b" onClick={() => downloadPO(poPreview)}
                style={{fontSize:9, padding:'4px 10px', borderColor:'#3b82f6', color:'#3b82f6'}}>
                📥 Download HTML
              </button>
              <button className="b" onClick={() => sendVendorWA(poPreview)}
                style={{fontSize:9, padding:'4px 10px', background:'#25d36620', borderColor:'#25d36644', color:'#25d366'}}>
                📱 Send to Vendor
              </button>
              <button className="b bp" onClick={() => savePONo(poPreview)}
                style={{fontSize:9, padding:'4px 10px', background:'#8b5cf6', borderColor:'#8b5cf6'}}>
                💾 Save PO No.
              </button>
              <button className="b bs" onClick={() => setPoPreview(null)} style={{fontSize:9, padding:'4px 8px'}}>✕ Close</button>
            </div>
          </div>
          {/* Inline preview */}
          <div style={{background:'#fff', borderRadius:6, overflow:'hidden', maxHeight:500, overflowY:'auto'}}>
            <iframe srcDoc={poPreview.html} style={{width:'100%', height:480, border:'none'}} title="PO Preview"/>
          </div>
        </div>
      )}

      {/* PR Cards */}
      {filtered.length === 0 && (
        <div style={{textAlign:'center', padding:40, color:'#64748b', fontSize:11}}>
          {filter==='Approved' ? '✅ No approved PRs waiting for PO generation' : `No ${filter} PRs`}
        </div>
      )}

      <div style={{display:'flex', flexDirection:'column', gap:6}}>
        {filtered.map(pr => {
          const sc = stCol[pr.status] || {bg:'#64748b20', c:'#64748b'};
          const rItems = Array.isArray(pr.items) ? pr.items : [];
          const firmColor = ({JPP:'#e3a008',JXT:'#3b82f6',VHD:'#8b5cf6'})[pr.firm_code]||'#64748b';
          return (
            <div key={pr.id} style={{background:'#0a0f1a', border:`1px solid ${pr.status==='Approved'?'#4ade8033':'#1a2030'}`, borderRadius:8, padding:'10px 12px'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:6}}>
                <div style={{display:'flex', alignItems:'center', gap:6, flexWrap:'wrap'}}>
                  <span style={{fontWeight:800, color:'#f59e0b', fontSize:11}}>{pr.pr_no}</span>
                  {pr.po_no && <span style={{fontWeight:700, color:'#06b6d4', fontSize:10}}>→ {pr.po_no}</span>}
                  <span style={{padding:'1px 6px', borderRadius:3, fontSize:7, fontWeight:700, background:sc.bg, color:sc.c}}>{pr.status}</span>
                  <span style={{padding:'1px 6px', borderRadius:3, fontSize:8, fontWeight:700, background:firmColor+'20', color:firmColor}}>{pr.firm_code}</span>
                  <span style={{fontSize:9, color:'#c9d1d9'}}>{pr.vendor_name}</span>
                  <span style={{fontSize:8, color:'#64748b'}}>{pr.request_type}</span>
                </div>
                <div style={{display:'flex', alignItems:'center', gap:8}}>
                  <span style={{fontWeight:800, color:'#e3a008', fontSize:12}}>₹{(+pr.total||0).toLocaleString('en-IN',{maximumFractionDigits:0})}</span>
                  {!pr.po_no && (
                    <div style={{display:'flex', alignItems:'center', gap:3}}>
                      <span style={{fontSize:8, color:'#64748b'}}>TDS</span>
                      <select value={tdsByPr[pr.id]||0} onChange={e=>setTdsByPr(prev=>({...prev,[pr.id]:+e.target.value}))}
                        style={{fontSize:9, padding:'2px 3px', width:52, background:'#0c1017', color:'#e2e8f0', border:'1px solid #1a2030', borderRadius:3}}
                        title="TDS % to deduct before payment (set by Shreya)">
                        {[0,1,2,10].map(g=><option key={g} value={g}>{g}%</option>)}
                      </select>
                    </div>
                  )}
                  {pr.po_no && (+pr.tds_pct > 0) && (
                    <span style={{fontSize:8, color:'#b91c1c', fontWeight:700}}>TDS {pr.tds_pct}%</span>
                  )}
                  <button className="b bp" onClick={() => generatePO(pr)} disabled={generating===pr.id}
                    style={{fontSize:10, padding:'5px 14px', background:'#06b6d4', borderColor:'#06b6d4', color:'#000', fontWeight:700}}>
                    {generating===pr.id ? '⏳ Generating...' : pr.po_no ? '📄 View / Print PO' : '📄 Generate PO'}
                  </button>
                  {canCancelPO(pr) && (
                    <button
                      className="b bs"
                      onClick={() => setCancelPr({pr, reason: ''})}
                      title="Cancel PO and revert PR to Approved (Jigar only)"
                      style={{fontSize:9, padding:'4px 10px', borderColor:'#f47067', color:'#f47067'}}
                    >
                      ❌ Cancel PO
                    </button>
                  )}
                </div>
              </div>
              {/* Items summary */}
              <div style={{marginTop:6, display:'flex', gap:8, flexWrap:'wrap', fontSize:9, color:'#8b949e'}}>
                {rItems.map((x,xi) => <span key={xi}>{x.product}{x.size?' ('+x.size+')':''} × {x.qty} {x.per}</span>)}
                {pr.payment_terms && <span style={{color:'#64748b'}}>· {pr.payment_terms}</span>}
                {pr.expected_delivery && <span style={{color:'#06b6d4'}}>· By {pr.expected_delivery}</span>}
              </div>
              {pr.po_generated_by && <div style={{marginTop:4, fontSize:8, color:'#64748b'}}>PO generated by {pr.po_generated_by} · {pr.po_generated_at ? new Date(pr.po_generated_at).toLocaleDateString('en-IN') : ''}</div>}
              {pr.po_cancelled_at && (
                <div style={{marginTop:4, padding:'3px 6px', background:'#f4706710', border:'1px solid #f4706733', borderRadius:4, fontSize:8, color:'#f47067'}}>
                  ❌ Previous PO cancelled by {pr.po_cancelled_by||'—'} on {new Date(pr.po_cancelled_at).toLocaleDateString('en-IN')}
                  {pr.po_cancellation_reason && <span style={{color:'#e6edf3', marginLeft:4}}>— {pr.po_cancellation_reason}</span>}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Cancel PO Confirmation Modal (Item 5 — 23 Apr 26) */}
      {cancelPr && (
        <div
          style={{position:'fixed', inset:0, background:'rgba(0,0,0,.65)', zIndex:100, display:'flex', alignItems:'flex-start', justifyContent:'center', padding:10, overflowY:'auto'}}
          onClick={() => !cancelling && setCancelPr(null)}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{background:'#0c1017', border:'1px solid #f4706733', borderRadius:12, width:'100%', maxWidth:520, padding:16, margin:'10px 0', animation:'fi .2s'}}
          >
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
              <h3 style={{fontSize:13, fontWeight:700, color:'#f47067'}}>❌ Cancel PO</h3>
              <button className="b bs" onClick={() => !cancelling && setCancelPr(null)}>✕</button>
            </div>
            <div style={{fontSize:10, color:'#e6edf3', marginBottom:10, lineHeight:1.5}}>
              This will cancel PO <strong className="mn" style={{color:'#06b6d4'}}>{cancelPr.pr.po_no}</strong> for PR <strong className="mn" style={{color:'#f59e0b'}}>{cancelPr.pr.pr_no}</strong>.
              <br/>
              Vendor: <strong>{cancelPr.pr.vendor_name}</strong> · Amount: ₹{(+cancelPr.pr.total||0).toLocaleString('en-IN')}
            </div>
            <div style={{fontSize:9, color:'#f47067', marginBottom:10, padding:'6px 8px', background:'#f4706710', border:'1px solid #f4706733', borderRadius:4, lineHeight:1.4}}>
              ⚠️ <strong>Effect:</strong> PR returns to <strong>Approved</strong> status. PO number, generated-by, generated-at and sent-at will be cleared. You (or Shreya) can then generate a fresh PO with corrected details.
              <br/>
              Cancellation will be logged permanently in the audit trail.
            </div>
            <div style={{marginBottom:10}}>
              <label style={{fontSize:8, color:'#e3a008', fontWeight:700}}>REASON FOR CANCELLATION * (required)</label>
              <textarea
                className="in"
                value={cancelPr.reason}
                onChange={e => setCancelPr(p => ({...p, reason: e.target.value}))}
                placeholder="e.g. Vendor quoted wrong rate; switching to alternate vendor"
                style={{fontSize:9, padding:'4px 6px', width:'100%', minHeight:50, fontFamily:'inherit', marginTop:2}}
              />
            </div>
            <div style={{display:'flex', gap:6, justifyContent:'flex-end'}}>
              <button className="b bs" onClick={() => !cancelling && setCancelPr(null)} disabled={cancelling} style={{fontSize:10}}>Keep PO</button>
              <button
                className="b"
                onClick={submitCancelPO}
                disabled={cancelling}
                style={{fontSize:10, fontWeight:700, background:'#f47067', borderColor:'#f47067', color:'#000'}}
              >
                {cancelling ? '⏳ Cancelling...' : '❌ Confirm Cancel PO'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════
// MY PRs PAGE — per-user PR/PO status view
// ══════════════════════════════════════════════════════════
function MyPRsPage({prs, setPrs, jobs, user, show, firms, sm}) {
  const uname = (user?.name||'').toUpperCase();
  // Resolve current user to a PR_REQUESTORS-style key (proper case) and dept tag
  const myStaffKey = React.useMemo(() => {
    if (typeof STAFF_DEPTS === 'undefined') return null;
    return Object.keys(STAFF_DEPTS).find(k => k.toUpperCase() === uname || uname.includes(k.toUpperCase())) || null;
  }, [uname]);
  const myDeptTag = myStaffKey ? STAFF_DEPTS[myStaffKey] : null;

  // Edit-and-resubmit modal state (Item 6 — 23 Apr 26)
  // Only the PR creator or Jigar can edit & resubmit a rejected PR.
  // Modal lets them fix line items, notes, transport, expected delivery, then
  // resubmit with a mandatory revision note. On save: PATCH the existing row back
  // to 'Pending Approval', clear rejection fields, increment revision_count, and
  // append an entry to revision_history jsonb.
  const [editPr, setEditPr] = React.useState(null); // {pr, items, notes, transport, expected_delivery, revisionNote}
  const [resubmitting, setResubmitting] = React.useState(false);
  const canEditResubmit = (pr) => {
    if (pr.status !== 'Rejected') return false;
    const isOwner = pr.created_by && pr.created_by.toUpperCase() === uname;
    const isJigar = uname === 'JIGAR';
    return isOwner || isJigar;
  };

  const [scope, setScope] = React.useState('mine'); // 'mine' | 'dept' | 'all'
  const [statusFilter, setStatusFilter] = React.useState('Active'); // 'Active' | 'All' | specific status

  const lvKey = 'myprs_last_viewed_' + uname;
  // Snapshot the unread cutoff once on mount so newly-arriving status changes during viewing
  // still show the dot — they only clear on next visit.
  const [unreadCutoff] = React.useState(() => {
    try { return localStorage.getItem(lvKey) || '1970-01-01T00:00:00Z'; } catch (e) { return '1970-01-01T00:00:00Z'; }
  });
  // On open: clear badge by stamping latest viewed time
  React.useEffect(() => {
    try { localStorage.setItem(lvKey, new Date().toISOString()); } catch (e) {}
  }, [lvKey]);

  const stCol = {
    'Pending Approval':{bg:'#e3a00820',c:'#e3a008'},
    'Approved':        {bg:'#4ade8020',c:'#4ade80'},
    'Rejected':        {bg:'#f4706720',c:'#f47067'},
    'PO Generated':    {bg:'#06b6d420',c:'#06b6d4'},
    'PO Sent':         {bg:'#3b82f620',c:'#3b82f6'},
    'Completed':       {bg:'#8b5cf620',c:'#8b5cf6'},
    'Cancelled':       {bg:'#64748b20',c:'#64748b'},
  };
  const firmColor = code => ({JPP:'#e3a008',JXT:'#3b82f6',VHD:'#8b5cf6'})[code] || '#64748b';

  const fmtDate = iso => {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      const dd = String(d.getDate()).padStart(2,'0');
      const mm = d.toLocaleString('en-IN',{month:'short'});
      const yy = String(d.getFullYear()).slice(-2);
      const hh = String(d.getHours()).padStart(2,'0');
      const mn = String(d.getMinutes()).padStart(2,'0');
      return `${dd} ${mm} ${yy}, ${hh}:${mn}`;
    } catch (e) { return iso; }
  };
  const relTime = iso => {
    if (!iso) return '';
    try {
      const diff = Date.now() - new Date(iso).getTime();
      if (diff < 0) return 'just now';
      const m = Math.floor(diff/60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m/60);
      if (h < 24) return h + 'h ago';
      const d = Math.floor(h/24);
      if (d < 30) return d + 'd ago';
      return Math.floor(d/30) + 'mo ago';
    } catch (e) { return ''; }
  };

  // Scope filtering
  const inScope = (pr) => {
    if (scope === 'all') return true;
    const isMine = pr.created_by && pr.created_by.toUpperCase() === uname;
    if (scope === 'mine') return isMine;
    // dept
    if (isMine) return true;
    return myDeptTag && pr.requestor_dept === myDeptTag;
  };

  const STATUS_OPTS = ['Active','All','Pending Approval','Approved','Rejected','PO Generated','Completed'];
  const passesStatus = (pr) => {
    if (statusFilter === 'All') return true;
    if (statusFilter === 'Active') return pr.status !== 'Completed' && pr.status !== 'Cancelled' && pr.status !== 'Rejected';
    return pr.status === statusFilter;
  };

  const visible = (prs || [])
    .filter(inScope)
    .filter(passesStatus)
    .sort((a,b) => {
      const ta = a.last_status_change_at || a.created_at || '';
      const tb = b.last_status_change_at || b.created_at || '';
      return tb.localeCompare(ta);
    });

  const myCount = (prs||[]).filter(p => p.created_by && p.created_by.toUpperCase() === uname).length;
  const deptCount = (prs||[]).filter(p => myDeptTag && p.requestor_dept === myDeptTag).length;

  const isUnread = (pr) => {
    if (pr.status === 'Pending Approval') return false; // never "unread" — nothing happened yet
    const ts = pr.last_status_change_at || pr.created_at || '';
    return ts > unreadCutoff;
  };

  const openJob = (jobId) => {
    if (!jobId) return;
    const j = (jobs||[]).find(x => x.id === jobId);
    if (j && sm) sm({t: 'Job ' + jobId, jobId});
  };

  const openPO = (url) => {
    if (url) window.open(url, '_blank');
  };

  const jobLabel = (jobId) => {
    if (!jobId) return '—';
    const j = (jobs||[]).find(x => x.id === jobId);
    return j && j.project ? jobId + ' (' + j.project + ')' : jobId;
  };

  // Submit a revised PR — PATCH existing row back to Pending Approval
  const submitResubmit = async () => {
    if (!editPr || resubmitting) return;
    const { pr, items, notes, transport, expected_delivery, revisionNote } = editPr;
    if (!revisionNote || !revisionNote.trim()) {
      show && show('Please add a revision note explaining the changes', false); return;
    }
    if (!items || items.length === 0) {
      show && show('Cannot resubmit — line items cannot be empty', false); return;
    }
    // Recompute totals from edited items
    const newSubtotal = items.reduce((s, it) => {
      const amt = (+it.qty||0) * (+it.rate||0);
      return s + amt;
    }, 0);
    const newGstTotal = items.reduce((s, it) => {
      const amt = (+it.qty||0) * (+it.rate||0);
      return s + (amt * (+it.gst_pct||0) / 100);
    }, 0);
    const transportAmt = +transport || 0;
    const transportGst = transportAmt * (+pr.transport_gst_pct||0) / 100;
    const roundOffAmt = +(+pr.round_off||0).toFixed(2);
    const newTotal = +(newSubtotal + newGstTotal + transportAmt + transportGst + roundOffAmt).toFixed(2);
    // Build revision history entry
    const prevHistory = Array.isArray(pr.revision_history) ? pr.revision_history : [];
    const revEntry = {
      rev: (prevHistory.length || 0) + 1,
      at: new Date().toISOString(),
      by: user?.name || 'Unknown',
      note: revisionNote.trim(),
      prev_rejection_reason: pr.rejection_reason || '',
      prev_rejected_by: pr.rejected_by || '',
      prev_total: pr.total,
      prev_items_count: Array.isArray(pr.items) ? pr.items.length : 0
    };
    const updates = {
      items: items,
      subtotal: newSubtotal,
      gst_total: newGstTotal,
      transport: transportAmt,
      total: newTotal,
      notes: notes || '',
      expected_delivery: expected_delivery || null,
      status: 'Pending Approval',
      rejection_reason: null,
      rejected_by: null,
      rejected_at: null,
      revision_count: ((+pr.revision_count) || 0) + 1,
      revision_history: [...prevHistory, revEntry],
      revision_notes: revisionNote.trim(),
      last_status_change_at: new Date().toISOString()
    };
    setResubmitting(true);
    try {
      const { error } = await sb.from('purchase_requests').update(updates).eq('id', pr.id);
      if (error) { show && show('Resubmit failed: ' + error.message, false); setResubmitting(false); return; }
      setPrs && setPrs(p => p.map(x => x.id === pr.id ? { ...x, ...updates } : x));
      setEditPr(null);
      setResubmitting(false);
      show && show('✅ PR resubmitted for approval');
    } catch (e) {
      show && show('Error: ' + (e.message || 'unknown'), false);
      setResubmitting(false);
    }
  };

  return (
    <div style={{padding:12, overflowY:'auto', height:'100%'}}>
      {/* Header */}
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12, flexWrap:'wrap', gap:8}}>
        <div>
          <h2 style={{fontSize:14, fontWeight:800, color:'#f59e0b', margin:0}}>📑 My PRs</h2>
          <p style={{fontSize:10, color:'#64748b', margin:'2px 0 0'}}>
            Track status of your purchase requests {myDeptTag ? <span>· dept: <strong style={{color:'#8b949e'}}>{myDeptTag}</strong></span> : ''}
          </p>
        </div>
        <div style={{display:'flex', gap:4, flexWrap:'wrap'}}>
          <button className={`b bs ${scope==='mine'?'bp':''}`} onClick={() => setScope('mine')}
            style={{fontSize:9, padding:'3px 8px', ...(scope==='mine'?{background:'#f59e0b20',borderColor:'#f59e0b',color:'#f59e0b'}:{})}}>
            Mine ({myCount})
          </button>
          {myDeptTag && (
            <button className={`b bs ${scope==='dept'?'bp':''}`} onClick={() => setScope('dept')}
              style={{fontSize:9, padding:'3px 8px', ...(scope==='dept'?{background:'#3b82f620',borderColor:'#3b82f6',color:'#3b82f6'}:{})}}>
              My Dept ({deptCount})
            </button>
          )}
          <button className={`b bs ${scope==='all'?'bp':''}`} onClick={() => setScope('all')}
            style={{fontSize:9, padding:'3px 8px', ...(scope==='all'?{background:'#8b5cf620',borderColor:'#8b5cf6',color:'#8b5cf6'}:{})}}>
            All ({(prs||[]).length})
          </button>
        </div>
      </div>

      {/* Status filter chips */}
      <div style={{display:'flex', gap:4, flexWrap:'wrap', marginBottom:10}}>
        {STATUS_OPTS.map(s => (
          <button key={s} className={`b bs ${statusFilter===s?'bp':''}`} onClick={() => setStatusFilter(s)}
            style={{fontSize:8, padding:'2px 6px',
              ...(statusFilter===s && stCol[s] ? {background: stCol[s].bg, borderColor: stCol[s].c, color: stCol[s].c} : {})}}>
            {s}
          </button>
        ))}
      </div>

      {/* No-data states */}
      {!myStaffKey && scope !== 'all' && (
        <div style={{background:'#161d2e', border:'1px solid #2a3548', borderRadius:8, padding:16, textAlign:'center'}}>
          <p style={{fontSize:11, color:'#f59e0b', fontWeight:700, marginBottom:4}}>👤 User not mapped</p>
          <p style={{fontSize:9, color:'#8b949e'}}>Your user name "{user?.name}" isn't in the staff/dept map. Switch to "All" to see every PR, or ask Jigar to add you to STAFF_DEPTS.</p>
        </div>
      )}

      {visible.length === 0 && (
        <div style={{background:'#0a0f1a', border:'1px solid #1a2030', borderRadius:8, padding:24, textAlign:'center'}}>
          <p style={{fontSize:11, color:'#64748b'}}>
            {scope==='mine' ? "You haven't raised any PRs yet that match this filter."
              : scope==='dept' ? `No PRs from your dept (${myDeptTag||'—'}) match this filter.`
              : 'No PRs match this filter.'}
          </p>
        </div>
      )}

      {/* PR list */}
      {visible.length > 0 && (
        <div style={{display:'flex', flexDirection:'column', gap:6}}>
          {visible.map(pr => {
            const sc = stCol[pr.status] || {bg:'#64748b20', c:'#64748b'};
            const unread = isUnread(pr);
            const isMine = pr.created_by && pr.created_by.toUpperCase() === uname;
            return (
              <div key={pr.id} style={{
                background:'#0a0f1a',
                border: `1px solid ${unread ? '#f59e0b66' : '#1a2030'}`,
                borderLeft: `3px solid ${sc.c}`,
                borderRadius:8,
                padding:'8px 12px',
                position:'relative'
              }}>
                {unread && <span title="New status update since you last viewed" style={{position:'absolute',top:6,right:6,width:7,height:7,background:'#f59e0b',borderRadius:'50%',boxShadow:'0 0 6px #f59e0b'}}/>}
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr 1fr 1fr', gap:8, alignItems:'center'}}>
                  {/* Col 1: PR No + firm */}
                  <div>
                    <div style={{fontSize:10, fontWeight:800, color:'#e3a008'}}>{pr.pr_no}</div>
                    <div style={{display:'flex', gap:4, alignItems:'center', marginTop:2}}>
                      <span className="bd" style={{background:firmColor(pr.firm_code)+'20', color:firmColor(pr.firm_code), fontSize:7}}>{pr.firm_code}</span>
                      {!isMine && <span style={{fontSize:7, color:'#64748b'}}>by {pr.created_by}</span>}
                    </div>
                  </div>

                  {/* Col 2: Job */}
                  <div>
                    <div style={{fontSize:7, color:'#64748b'}}>JOB</div>
                    {pr.job_id ? (
                      <a onClick={() => openJob(pr.job_id)} style={{fontSize:9, color:'#3b82f6', cursor:'pointer', textDecoration:'underline'}}>{jobLabel(pr.job_id)}</a>

                  </div>

                  {/* Col 3: Vendor */}
                  <div>
                    <div style={{fontSize:7, color:'#64748b'}}>VENDOR</div>
                    <div style={{fontSize:9, color:'#e6edf3'}} title={pr.vendor_name}>{pr.vendor_name||'—'}</div>
                    <div style={{fontSize:7, color:'#64748b'}}>{(pr.items||[]).length} item{(pr.items||[]).length===1?'':'s'}</div>
                  </div>

                  {/* Col 4: Amount */}
                  <div>
                    <div style={{fontSize:7, color:'#64748b'}}>AMOUNT</div>
                    <div className="mn" style={{fontSize:10, fontWeight:700, color:'#e6edf3'}}>₹{(+pr.total||0).toLocaleString('en-IN')}</div>
                  </div>

                  {/* Col 5: Status */}
                  <div>
                    <div style={{fontSize:7, color:'#64748b', marginBottom:2}}>STATUS</div>
                    <span className="bd" style={{background:sc.bg, color:sc.c, fontSize:8, fontWeight:700, padding:'2px 7px'}}>
                      {pr.status}
                    </span>
                    {pr.po_no && <div style={{fontSize:8, color:'#06b6d4', marginTop:2, fontWeight:700}}>PO: {pr.po_no}</div>}
                  </div>

                  {/* Col 6: Last update + actions */}
                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:7, color:'#64748b'}}>UPDATED</div>
                    <div style={{fontSize:9, color:'#8b949e'}} title={fmtDate(pr.last_status_change_at||pr.created_at)}>
                      {relTime(pr.last_status_change_at||pr.created_at)}
                    </div>
                    {pr.po_no && (
                      <button className="b bs" onClick={() => {
                        // Prefer stored PDF url if ever populated; otherwise re-render from data using
                        // the top-level buildPOHtml helper. Same template Shreya used to generate.
                        if (pr.po_pdf_url) { openPO(pr.po_pdf_url); return; }
                        try {
                          const firm = (typeof FIRM_DATA !== 'undefined' && FIRM_DATA[pr.firm_code]) || (typeof FIRM_DATA !== 'undefined' ? FIRM_DATA.JXT : null);
                          if (!firm || typeof buildPOHtml !== 'function') {
                            show && show('Cannot render PO — internal template missing', false);
                            return;
                          }
                          const html = buildPOHtml(pr, pr.po_no, firm, jobs);
                          const w = window.open('', '_blank', 'width=900,height=720');
                          if (!w) { show && show('Popup blocked — allow popups for this site', false); return; }
                          w.document.write(html);
                          w.document.close();
                        } catch (e) {
                          console.error('PO render failed', e);
                          show && show('Could not open PO: ' + (e.message || 'unknown error'), false);
                        }
                      }}
                        style={{fontSize:8, padding:'2px 6px', marginTop:3, borderColor:'#06b6d4', color:'#06b6d4'}}>
                        📄 View / Print PO
                      </button>
                    )}
                  </div>
                </div>

                {/* Rejection reason or notes row */}
                {pr.status === 'Rejected' && pr.rejection_reason && (
                  <div style={{marginTop:6, padding:'4px 8px', background:'#f4706715', border:'1px solid #f4706733', borderRadius:4, display:'flex', justifyContent:'space-between', alignItems:'center', gap:8, flexWrap:'wrap'}}>
                    <div style={{flex:1, minWidth:200}}>
                      <span style={{fontSize:8, color:'#f47067', fontWeight:700}}>REJECTION REASON: </span>
                      <span style={{fontSize:9, color:'#e6edf3'}}>{pr.rejection_reason}</span>
                      {pr.revision_count > 0 && <span style={{fontSize:8, color:'#e3a008', marginLeft:6}}>(prior revisions: {pr.revision_count})</span>}
                    </div>
                    {canEditResubmit(pr) && (
                      <button
                        className="b bp"
                        style={{fontSize:8, padding:'3px 8px', flexShrink:0}}
                        onClick={() => setEditPr({
                          pr,
                          items: Array.isArray(pr.items) ? JSON.parse(JSON.stringify(pr.items)) : [],
                          notes: pr.notes || '',
                          transport: +pr.transport || 0,
                          round_off: +pr.round_off || 0,
                          expected_delivery: pr.expected_delivery || '',
                          revisionNote: ''
                        })}
                      >
                        ✏️ Edit & Resubmit
                      </button>
                    )}
                  </div>
                )}
                {pr.status === 'Completed' && pr.received_at && (
                  <div style={{marginTop:4, fontSize:8, color:'#8b5cf6'}}>
                    ✅ Goods received {relTime(pr.received_at)} by {pr.received_by||'—'} {pr.grn_id?` · ${pr.grn_id}`:''}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      <p style={{fontSize:8, color:'#475569', textAlign:'center', marginTop:16}}>
        💡 Yellow dot = status changed since you last viewed this page · Click job # to open job detail
      </p>

      {/* Edit & Resubmit Modal (Item 6 — 23 Apr 26) */}
      {editPr && (
        <div
          style={{position:'fixed', inset:0, background:'rgba(0,0,0,.65)', zIndex:100, display:'flex', alignItems:'flex-start', justifyContent:'center', padding:10, overflowY:'auto'}}
          onClick={() => !resubmitting && setEditPr(null)}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{background:'#0c1017', border:'1px solid #1a2030', borderRadius:12, width:'100%', maxWidth:900, padding:16, margin:'10px 0', maxHeight:'calc(100vh - 20px)', overflowY:'auto', animation:'fi .2s'}}
          >
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10, position:'sticky', top:-16, background:'#0c1017', zIndex:2, padding:'8px 0', marginTop:-8}}>
              <h3 style={{fontSize:13, fontWeight:700, color:'#f59e0b'}}>✏️ Edit &amp; Resubmit PR — {editPr.pr.pr_no}</h3>
              <button className="b bs" onClick={() => !resubmitting && setEditPr(null)}>✕</button>
            </div>

            <div style={{background:'#f4706710', border:'1px solid #f4706733', borderRadius:4, padding:'6px 8px', marginBottom:10, fontSize:9}}>
              <span style={{color:'#f47067', fontWeight:700}}>Previous rejection:</span>{' '}
              <span style={{color:'#e6edf3'}}>{editPr.pr.rejection_reason}</span>{' '}
              <span style={{color:'#64748b'}}>— by {editPr.pr.rejected_by||'—'}</span>
            </div>

            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:10, fontSize:9}}>
              <div><span style={{color:'#64748b'}}>Firm:</span> <strong>{editPr.pr.firm_code}</strong></div>
              <div><span style={{color:'#64748b'}}>Vendor:</span> <strong>{editPr.pr.vendor_name}</strong></div>
              <div><span style={{color:'#64748b'}}>Job:</span> <strong>{editPr.pr.job_id||'—'}</strong></div>
            </div>

            {/* Line items */}
            <p style={{fontSize:8, color:'#f59e0b', fontWeight:700, marginBottom:4}}>LINE ITEMS</p>
            <div style={{overflowX:'auto', marginBottom:8}}>
              <table style={{minWidth:680}}>
                <thead><tr>
                  <th style={{fontSize:8, minWidth:150}}>Product</th>
                  <th style={{fontSize:8, width:70}}>Qty</th>
                  <th style={{fontSize:8, width:80}}>Rate ₹</th>
                  <th style={{fontSize:8, width:70}}>GST %</th>
                  <th style={{fontSize:8, width:90}}>Amount</th>
                  <th style={{width:18}}></th>
                </tr></thead>
                <tbody>
                  {editPr.items.map((it, i) => {
                    const amt = (+it.qty||0) * (+it.rate||0);
                    const gst = amt * (+it.gst_pct||0) / 100;
                    const updIt = (k, v) => setEditPr(p => ({...p, items: p.items.map((x, xi) => xi===i ? {...x, [k]:v} : x)}));
                    return (
                      <tr key={i}>
                        <td><input className="in" value={it.product||''} onChange={e=>updIt('product', e.target.value)} style={{fontSize:9, padding:'2px 4px', width:'100%'}}/></td>
                        <td><input className="in mn" type="text" inputMode="decimal" pattern="[0-9.]*" value={it.qty} onChange={e=>{const v=e.target.value;if(v===''||/^\d*\.?\d*$/.test(v))updIt('qty', v);}} style={{fontSize:9, padding:'2px 4px', width:'100%'}}/></td>
                        <td><input className="in mn" type="text" inputMode="decimal" pattern="[0-9.]*" value={it.rate} onChange={e=>{const v=e.target.value;if(v===''||/^\d*\.?\d*$/.test(v))updIt('rate', v);}} style={{fontSize:9, padding:'2px 4px', width:'100%'}}/></td>
                        <td><select className="in" value={it.gst_pct||0} onChange={e=>updIt('gst_pct', +e.target.value)} style={{fontSize:9, padding:'2px 4px', width:'100%'}}>
                          {[0,5,12,18,28].map(g => <option key={g} value={g}>{g}%</option>)}
                        </select></td>
                        <td className="mn" style={{fontSize:9, textAlign:'right'}}>₹{(amt+gst).toLocaleString('en-IN', {maximumFractionDigits:2})}</td>
                        <td>
                          {editPr.items.length > 1 && (
                            <button className="b bs" style={{fontSize:7, padding:'1px 4px', color:'#f47067', borderColor:'#f4706733'}} onClick={() => setEditPr(p => ({...p, items: p.items.filter((_, xi) => xi !== i)}))}>✕</button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <button className="b bs" style={{fontSize:8, padding:'3px 8px', marginBottom:10}} onClick={() => setEditPr(p => ({...p, items: [...p.items, {product:'', qty:1, rate:0, gst_pct:18, per:'Sheet'}]}))}>➕ Add Line</button>

            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:10}}>
              <div>
                <label style={{fontSize:8, color:'#64748b'}}>Expected Delivery</label>
                <input className="in" type="date" value={editPr.expected_delivery||''} onChange={e => setEditPr(p => ({...p, expected_delivery: e.target.value}))} style={{fontSize:9, padding:'3px 4px', width:'100%'}}/>
              </div>
              <div>
                <label style={{fontSize:8, color:'#64748b'}}>Transport ₹</label>
                <input className="in mn" type="text" inputMode="decimal" pattern="[0-9.]*" value={editPr.transport} onChange={e => {const v = e.target.value; if(v===''||/^\d*\.?\d*$/.test(v)) setEditPr(p => ({...p, transport: v}));}} style={{fontSize:9, padding:'3px 4px', width:'100%'}}/>
              </div>
            </div>

            <div style={{marginBottom:10}}>
              <label style={{fontSize:8, color:'#64748b'}}>Notes / Remarks</label>
              <textarea className="in" value={editPr.notes} onChange={e => setEditPr(p => ({...p, notes: e.target.value}))} style={{fontSize:9, padding:'4px 6px', width:'100%', minHeight:40, fontFamily:'inherit'}}/>
            </div>

            <div style={{marginBottom:10, padding:'6px 8px', background:'#e3a00810', border:'1px solid #e3a00833', borderRadius:4}}>
              <label style={{fontSize:8, color:'#e3a008', fontWeight:700}}>REVISION NOTE * (required — explain what you changed)</label>
              <textarea className="in" value={editPr.revisionNote} onChange={e => setEditPr(p => ({...p, revisionNote: e.target.value}))} placeholder="e.g. Corrected qty per Jigar's feedback; rate matched to latest quote" style={{fontSize:9, padding:'4px 6px', width:'100%', minHeight:36, fontFamily:'inherit', marginTop:2}}/>
            </div>

            <div style={{display:'flex', gap:6, justifyContent:'flex-end'}}>
              <button className="b bs" onClick={() => !resubmitting && setEditPr(null)} disabled={resubmitting} style={{fontSize:10}}>Cancel</button>
              <button className="b bp" onClick={submitResubmit} disabled={resubmitting} style={{fontSize:10, fontWeight:700}}>
                {resubmitting ? '⏳ Resubmitting...' : '✅ Resubmit for Approval'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ApprovalsPage({prs, setPrs, jobs, user, show, firms}) {
  const [filter, setFilter] = React.useState('Pending Approval');
  const [rejecting, setRejecting] = React.useState(null); // pr id being rejected
  const [rejReason, setRejReason] = React.useState('');
  const [processing, setProcessing] = React.useState(null); // pr id being processed
  const [waButtons, setWaButtons] = React.useState({}); // {prId: true} = show WA buttons
  // ─── Billing requests (New-#1) ─────────────────────────────────────────
  const [billingRequests, setBillingRequests] = React.useState([]);
  const [billingSitesMap, setBillingSitesMap] = React.useState({}); // site_id → {job_no, atm_id, address}
  const [decidingBR, setDecidingBR] = React.useState(null); // {req, action: 'approve'|'reject', note}
  const [processingBR, setProcessingBR] = React.useState(null);
  React.useEffect(() => {
    let alive = true;
    (async () => {
      const {data: reqs} = await sb.from('billing_requests')
        .select('*').order('created_at', {ascending: false});
      if (!alive || !reqs) return;
      setBillingRequests(reqs);
      const siteIds = [...new Set(reqs.map(r => r.site_id))];
      if (siteIds.length === 0) return;
      const {data: sites} = await sb.from('banking_sites')
        .select('id,job_no,atm_id,site_address,site_unique_id,payment_status')
        .in('id', siteIds);
      if (!alive || !sites) return;
      const map = {};
      for (const s of sites) map[s.id] = s;
      setBillingSitesMap(map);
    })();
    return () => {alive = false;};
  }, []);

  const STATUS_FILTERS = ['Pending Approval','Approved','Rejected','All'];
  const stCol = {
    'Pending Approval': {bg:'#e3a00820',c:'#e3a008'},
    'Approved':         {bg:'#4ade8020',c:'#4ade80'},
    'Rejected':         {bg:'#f4706720',c:'#f47067'},
    'PO Generated':     {bg:'#06b6d420',c:'#06b6d4'},
    'PO Sent':          {bg:'#3b82f620',c:'#3b82f6'},
    'Completed':        {bg:'#8b5cf620',c:'#8b5cf6'},
    'Cancelled':        {bg:'#64748b20',c:'#64748b'},
  };

  const filtered = React.useMemo(() => {
    const list = filter === 'All' ? prs : prs.filter(p => p.status === filter);
    return [...list].sort((a,b) => b.created_at > a.created_at ? 1 : -1);
  }, [prs, filter]);

  const pendingCount = (prs||[]).filter(p => p.status === 'Pending Approval').length;

  const buildApproveMsg = (pr) => {
    const items = (pr.items||[]).map(x => `${x.product}${x.size?' ('+x.size+')':''} x${x.qty}`).join(', ');
    return `✅ *PR Approved — ${pr.pr_no}*\n\nYour Purchase Request has been approved by Jigar.\n\n*Vendor:* ${pr.vendor_name}\n*Items:* ${items}\n*Total:* ₹${(+pr.total||0).toFixed(0)}\n*Urgency:* ${pr.urgency}\n\nShreya will generate the PO shortly. 📄`;
  };

  const buildVendorMsg = (pr) => {
    const items = (pr.items||[]).map(x => `• ${x.product}${x.size?' ('+x.size+')':''} — Qty: ${x.qty} ${x.per} @ ₹${x.rate}`).join('\n');
    return `Dear *${pr.vendor_name}*,\n\nThis is iPrint India. We are raising a Purchase Order for the following:\n\n${items}\n\n*PR Ref:* ${pr.pr_no}\n*Payment Terms:* ${pr.payment_terms||'To be confirmed'}\n${pr.expected_delivery?'*Expected Delivery:* '+pr.expected_delivery+'\n':''}\nOur team will send you the formal PO document shortly. Please confirm availability.\n\nThank you 🙏\n*iPrint India*`;
  };

  const buildGroupMsg = (pr, action) => {
    if (action === 'approved') {
      const items = (pr.items||[]).map(x => `${x.product} x${x.qty}`).join(', ');
      return `🛒 *PR Approved*\n\n*${pr.pr_no}* | ${pr.firm_code}\n*Vendor:* ${pr.vendor_name}\n*Items:* ${items}\n*Amount:* ₹${(+pr.total||0).toFixed(0)}\n*Requested by:* ${pr.created_by}\n*Urgency:* ${pr.urgency}\n\nApproved by Jigar ✅`;
    } else {
      return `❌ *PR Rejected*\n\n*${pr.pr_no}* | ${pr.firm_code}\n*Vendor:* ${pr.vendor_name}\n*Requested by:* ${pr.created_by}\n*Reason:* ${pr.rejection_reason||'See ERP for details'}`;
    }
  };

  const buildRejectMsg = (pr) => {
    return `❌ *PR Rejected — ${pr.pr_no}*\n\nYour Purchase Request has been rejected by Jigar.\n\n*Vendor:* ${pr.vendor_name}\n*Reason:* ${pr.rejection_reason||'Please check with Jigar for details'}\n\nPlease revise and resubmit from the ERP. You can edit the PR and resubmit for approval.`;
  };

  const approvePR = async (pr) => {
    setProcessing(pr.id);
    const nowIso = new Date().toISOString();
    const updates = {status:'Approved', approved_by:'Jigar', approved_at: nowIso, last_status_change_at: nowIso};
    const {error} = await sb.from('purchase_requests').update(updates).eq('id', pr.id);
    if (error) { show('⚠️ Update failed: ' + error.message, false); setProcessing(null); return; }
    const updated = {...pr, ...updates};
    setPrs(p => p.map(x => x.id === pr.id ? updated : x));
    setProcessing(null);
    setWaButtons(p => ({...p, [pr.id]: true}));
    show('✅ ' + pr.pr_no + ' approved! Send WhatsApp notifications below.');
    // Auto-notify requestor (in addition to manual buttons below)
    const reqPhone = WA_NUMBERS[pr.created_by];
    if (reqPhone) {
      const msg = `✅ Your PR *${pr.pr_no}* has been *APPROVED* by Jigar.\n\nVendor: ${pr.vendor_name}\nAmount: ₹${(+pr.total||0).toLocaleString('en-IN')}\n\nShreya will generate the PO shortly. Track status in *My PRs* tab.`;
      sendWhatsApp(reqPhone, msg, 'iprint_pr_approved');
    }
  };

  const rejectPR = async (pr) => {
    if (!rejReason.trim()) { show('Enter rejection reason', false); return; }
    setProcessing(pr.id);
    const nowIso = new Date().toISOString();
    const updates = {status:'Rejected', rejected_by:'Jigar', rejected_at: nowIso, rejection_reason: rejReason.trim(), last_status_change_at: nowIso};
    const {error} = await sb.from('purchase_requests').update(updates).eq('id', pr.id);
    if (error) { show('⚠️ Update failed: ' + error.message, false); setProcessing(null); return; }
    const updated = {...pr, ...updates};
    setPrs(p => p.map(x => x.id === pr.id ? updated : x));
    setProcessing(null);
    setRejecting(null);
    const reasonText = rejReason.trim();
    setRejReason('');
    setWaButtons(p => ({...p, [pr.id]: true}));
    show('PR rejected. Send WhatsApp notification to requestor.');
    // Auto-notify requestor with rejection reason
    const reqPhone = WA_NUMBERS[pr.created_by];
    if (reqPhone) {
      const msg = `❌ Your PR *${pr.pr_no}* has been *REJECTED* by Jigar.\n\nVendor: ${pr.vendor_name}\nAmount: ₹${(+pr.total||0).toLocaleString('en-IN')}\n\n*Reason:* ${reasonText}\n\nPlease revise and resubmit if needed. Track status in *My PRs* tab.`;
      sendWhatsApp(reqPhone, msg, 'iprint_pr_rejected');
    }
  };

  const job = (jobId) => (jobs||[]).find(j => j.id === jobId);
  const firmColor = (code) => ({JPP:'#e3a008',JXT:'#3b82f6',VHD:'#8b5cf6'}[code]||'#64748b');

  const approveBillingRequest = async (req, note) => {
    setProcessingBR(req.id);
    const nowIso = new Date().toISOString();
    const reqUpdates = {status: 'Approved', decided_by: user?.name || 'Jigar', decided_at: nowIso, decision_note: note || null};
    const {error: e1} = await sb.from('billing_requests').update(reqUpdates).eq('id', req.id);
    if (e1) { show('⚠️ Approve failed: ' + e1.message, false); setProcessingBR(null); return; }
    const site = billingSitesMap[req.site_id];
    const oldPmt = site?.payment_status || 'Not Started';
    if (oldPmt !== 'Invoice Raised') {
      const histEntry = {at: nowIso, by: user?.name || 'Jigar', from: oldPmt, to: 'Invoice Raised', via: 'billing_request_' + req.id};
      if (note) histEntry.note = note;
      const {data: cur} = await sb.from('banking_sites').select('payment_history').eq('id', req.site_id).single();
      const curHist = Array.isArray(cur?.payment_history) ? cur.payment_history : [];
      const siteUpdates = {
        payment_status: 'Invoice Raised',
        payment_status_changed_by: user?.name || 'Jigar',
        payment_status_changed_at: nowIso,
        payment_history: [...curHist, histEntry]
      };
      await sb.from('banking_sites').update(siteUpdates).eq('id', req.site_id);
      setBillingSitesMap(p => ({...p, [req.site_id]: {...(p[req.site_id]||{}), payment_status: 'Invoice Raised'}}));
    }
    setBillingRequests(p => p.map(r => r.id === req.id ? {...r, ...reqUpdates} : r));
    setProcessingBR(null);
    setDecidingBR(null);
    show('✅ Billing request approved');
    const reqPhone = WA_NUMBERS[req.requested_by];
    if (reqPhone && site) {
      const msg = '✅ *Billing Approved — ' + (site.job_no || '?') + '*\n\nATM: ' + (site.atm_id || '—') + '\nApproved by: ' + (user?.name || 'Jigar') + (note ? '\n\nNote: ' + note : '') + '\n\nYou can now raise the invoice.';
      sendWhatsApp(reqPhone, msg, 'iprint_billing_approved');
    }
  };

  const rejectBillingRequest = async (req, reason) => {
    if (!reason || !reason.trim()) { show('Reason required for rejection', false); return; }
    setProcessingBR(req.id);
    const nowIso = new Date().toISOString();
    const reqUpdates = {status: 'Rejected', decided_by: user?.name || 'Jigar', decided_at: nowIso, decision_note: reason.trim()};
    const {error} = await sb.from('billing_requests').update(reqUpdates).eq('id', req.id);
    if (error) { show('⚠️ Reject failed: ' + error.message, false); setProcessingBR(null); return; }
    setBillingRequests(p => p.map(r => r.id === req.id ? {...r, ...reqUpdates} : r));
    setProcessingBR(null);
    setDecidingBR(null);
    show('Billing request rejected');
    const reqPhone = WA_NUMBERS[req.requested_by];
    const site = billingSitesMap[req.site_id];
    if (reqPhone && site) {
      const msg = '❌ *Billing Request Rejected — ' + (site.job_no || '?') + '*\n\nATM: ' + (site.atm_id || '—') + '\nReviewed by: ' + (user?.name || 'Jigar') + '\n\n*Reason:* ' + reason.trim();
      sendWhatsApp(reqPhone, msg, 'iprint_billing_rejected');
    }
  };

  const pendingBillingCount = billingRequests.filter(r => r.status === 'Pending Approval').length;

  return (
    <div style={{padding:12, overflowY:'auto', height:'100%'}}>
      {/* Header */}
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12, flexWrap:'wrap', gap:8}}>
        <div>
          <h2 style={{fontSize:14, fontWeight:800, color:'#f59e0b', margin:0}}>🔔 Purchase Approvals</h2>
          <p style={{fontSize:10, color:'#64748b', margin:'2px 0 0'}}>
            {pendingCount > 0
              ? <span style={{color:'#e3a008', fontWeight:700}}>{pendingCount} pending your approval</span>
              : <span style={{color:'#4ade80'}}>✓ All clear — no pending approvals</span>}
          </p>
        </div>
        <div style={{display:'flex', gap:4}}>
          {STATUS_FILTERS.map(f => (
            <button key={f} className={`b bs ${filter===f?'bp':''}`}
              onClick={() => setFilter(f)}
              style={{fontSize:9, padding:'3px 8px',
                ...(filter===f && f==='Pending Approval' ? {background:'#e3a00820',borderColor:'#e3a008',color:'#e3a008'} : {})}}>
              {f}{f==='Pending Approval' && pendingCount > 0 ? ` (${pendingCount})` : ''}
            </button>
          ))}
        </div>
      </div>

      {/* ─── Pending Billing Approvals (New-#1) ───────────────────── */}
      {pendingBillingCount > 0 && <div style={{background:'#8b5cf610', border:'1px solid #8b5cf644', borderRadius:8, padding:10, marginBottom:12}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
          <h3 style={{fontSize:12, fontWeight:800, color:'#8b5cf6', margin:0}}>💰 Pending Billing Approvals ({pendingBillingCount})</h3>
          <span style={{fontSize:9, color:'#94a3b8'}}>Vidya/Aparna requesting Jigar's go-ahead to raise invoice</span>
        </div>
        <div style={{display:'flex', flexDirection:'column', gap:6}}>
          {billingRequests.filter(r => r.status === 'Pending Approval').map(r => {
            const site = billingSitesMap[r.site_id] || {};
            const ageMins = Math.round((Date.now() - new Date(r.created_at).getTime()) / 60000);
            const ageStr = ageMins < 60 ? ageMins + 'm' : ageMins < 1440 ? Math.round(ageMins/60) + 'h' : Math.round(ageMins/1440) + 'd';
            return <div key={r.id} style={{background:'#0a0f1a', border:'1px solid #8b5cf633', borderRadius:6, padding:8}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8, flexWrap:'wrap'}}>
                <div style={{flex:1, minWidth:200}}>
                  <div style={{fontSize:10, color:'#e3a008', fontWeight:700}}>
                    Job <span className="mn">{site.job_no || '?'}</span>
                    {site.atm_id && <span style={{color:'#8b5cf6', marginLeft:8}}>ATM: {site.atm_id}</span>}
                    {site.site_unique_id && <span className="mn" style={{color:'#06b6d4', marginLeft:8, fontSize:9}}>UID: {site.site_unique_id}</span>}
                  </div>
                  {site.site_address && <div style={{fontSize:9, color:'#94a3b8', marginTop:2}}>{site.site_address.slice(0, 100)}</div>}
                  <div style={{fontSize:9, color:'#64748b', marginTop:3}}>
                    Requested by <strong style={{color:'#c084fc'}}>{r.requested_by}</strong> · {ageStr} ago
                  </div>
                  {r.request_note && <div style={{fontSize:9, color:'#e6edf3', marginTop:4, padding:'4px 8px', background:'#0c1017', borderLeft:'2px solid #8b5cf6', borderRadius:'0 4px 4px 0'}}>📝 {r.request_note}</div>}
                </div>
                <div style={{display:'flex', gap:4, alignSelf:'center'}}>
                  <button className="b bg" disabled={processingBR===r.id} onClick={() => setDecidingBR({req:r, action:'approve', note:''})} style={{fontSize:10, padding:'4px 12px', background:'#4ade80', borderColor:'#4ade80', color:'#000', fontWeight:700}}>✓ Approve</button>
                  <button className="b" disabled={processingBR===r.id} onClick={() => setDecidingBR({req:r, action:'reject', note:''})} style={{fontSize:10, padding:'4px 12px', background:'#f4706720', borderColor:'#f47067', color:'#f47067', fontWeight:700}}>✕ Reject</button>
                </div>
              </div>
            </div>;
          })}
        </div>
      </div>}

      {/* Decision modal for billing request */}
      {decidingBR && <div onClick={() => !processingBR && setDecidingBR(null)} style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', zIndex:9999, display:'flex', alignItems:'center', justifyContent:'center', padding:20}}>
        <div onClick={e => e.stopPropagation()} style={{background:'#0a0f1a', border:'1px solid ' + (decidingBR.action==='approve'?'#4ade8066':'#f4706766'), borderRadius:8, padding:20, maxWidth:480, width:'100%'}}>
          <div style={{fontWeight:800, fontSize:14, color: decidingBR.action==='approve'?'#4ade80':'#f47067', marginBottom:8}}>
            {decidingBR.action==='approve' ? '✓ Approve Billing Request' : '✕ Reject Billing Request'}
          </div>
          <div style={{fontSize:10, color:'#94a3b8', marginBottom:12}}>
            {(billingSitesMap[decidingBR.req.site_id]?.job_no) || '?'} · ATM {(billingSitesMap[decidingBR.req.site_id]?.atm_id) || '—'}<br/>
            Requested by <strong>{decidingBR.req.requested_by}</strong>
          </div>
          <label style={{fontSize:9, color:'#64748b', display:'block', marginBottom:4}}>
            {decidingBR.action==='approve' ? 'NOTE (optional)' : 'REASON (required)'}
          </label>
          <textarea className="in" value={decidingBR.note} onChange={e => setDecidingBR(p => ({...p, note: e.target.value}))} placeholder={decidingBR.action==='approve' ? 'e.g. OK to invoice as J-2900/25-26' : 'e.g. Photos missing, please re-upload'} style={{fontSize:11, padding:'6px 8px', width:'100%', minHeight:60, resize:'vertical'}} autoFocus/>
          <div style={{display:'flex', gap:8, justifyContent:'flex-end', marginTop:12}}>
            <button className="b bs" disabled={!!processingBR} onClick={() => setDecidingBR(null)} style={{fontSize:11}}>Cancel</button>
            <button className="b bp" disabled={!!processingBR || (decidingBR.action==='reject' && !decidingBR.note.trim())} onClick={() => decidingBR.action==='approve' ? approveBillingRequest(decidingBR.req, decidingBR.note) : rejectBillingRequest(decidingBR.req, decidingBR.note)} style={{fontSize:11, background: decidingBR.action==='approve'?'#4ade80':'#f47067', borderColor: decidingBR.action==='approve'?'#4ade80':'#f47067', color: decidingBR.action==='approve'?'#000':'#fff', fontWeight:700}}>
              {processingBR===decidingBR.req.id ? '...' : (decidingBR.action==='approve' ? '✓ Approve & Notify' : '✕ Reject & Notify')}
            </button>
          </div>
        </div>
      </div>}

      {/* WhatsApp status notice */}
      <div style={{background:'#25d36610', border:'1px solid #25d36633', borderRadius:6, padding:'6px 10px', marginBottom:10, fontSize:9, color:'#25d366'}}>
        ✅ <strong>WhatsApp API active</strong> — Interakt connected. Messages send automatically on approve/reject.
      </div>

      {/* PR Cards */}
      {filtered.length === 0 && (
        <div style={{textAlign:'center', padding:40, color:'#64748b', fontSize:11}}>
          {filter === 'Pending Approval' ? '🎉 No pending approvals!' : `No ${filter.toLowerCase()} PRs`}
        </div>
      )}

      <div style={{display:'flex', flexDirection:'column', gap:8}}>
        {filtered.map(pr => {
          const sc = stCol[pr.status] || {bg:'#64748b20', c:'#64748b'};
          const rItems = Array.isArray(pr.items) ? pr.items : [];
          const jb = job(pr.job_id);
          const isPending = pr.status === 'Pending Approval';
          const isApproved = pr.status === 'Approved';
          const isRejected = pr.status === 'Rejected';
          const showWA = waButtons[pr.id] || isApproved || isRejected;
          const requestorPhone = WA_NUMBERS[pr.created_by];

          return (
            <div key={pr.id} style={{background:'#0a0f1a', border:`1px solid ${isPending?'#e3a00844':'#1a2030'}`, borderRadius:8, padding:12,
              boxShadow: isPending ? '0 0 12px #e3a00811' : 'none'}}>

              {/* PR Header row */}
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:8, flexWrap:'wrap', gap:6}}>
                <div style={{display:'flex', alignItems:'center', gap:6, flexWrap:'wrap'}}>
                  <span style={{fontWeight:800, color:'#f59e0b', fontSize:12}}>{pr.pr_no}</span>
                  <span style={{padding:'1px 6px', borderRadius:3, fontSize:7, fontWeight:700, background:sc.bg, color:sc.c}}>{pr.status}</span>
                  {pr.urgency==='Urgent' && <span style={{padding:'1px 5px', borderRadius:3, fontSize:7, fontWeight:700, background:'#f4706720', color:'#f47067'}}>🔴 URGENT</span>}
                  <span style={{padding:'1px 6px', borderRadius:3, fontSize:8, fontWeight:700, background:firmColor(pr.firm_code)+'20', color:firmColor(pr.firm_code)}}>{pr.firm_code}</span>
                  <span style={{fontSize:9, color:'#64748b'}}>{pr.request_type}</span>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontWeight:800, color:'#e3a008', fontSize:13}}>₹{(+pr.total||0).toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
                  <div style={{fontSize:8, color:'#64748b'}}>GST incl: ₹{(+pr.gst_total||0).toFixed(0)}</div>
                </div>
              </div>

              {/* Meta row */}
              <div style={{display:'flex', gap:12, flexWrap:'wrap', marginBottom:8, fontSize:9}}>
                <span>🏢 <strong style={{color:'#c9d1d9'}}>{pr.vendor_name}</strong>{pr.vendor_gstin&&<span style={{color:'#64748b'}}> · {pr.vendor_gstin}</span>}</span>
                <span>👤 <span style={{color:'#94a3b8'}}>by {pr.created_by}</span></span>
                {jb && <span>📋 <span style={{color:'#64748b'}}>Job {pr.job_id} · {jb.client_name}{jb.project ? ' · ' + (jb.project.length > 45 ? jb.project.slice(0,45) + '…' : jb.project) : ''}</span></span>}
                {pr.expected_delivery && <span>📅 <span style={{color:'#06b6d4'}}>By {pr.expected_delivery}</span></span>}
                {pr.payment_terms && <span>💳 <span style={{color:'#64748b'}}>{pr.payment_terms}</span></span>}
                <span style={{color:'#64748b', fontSize:8}}>{new Date(pr.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
              </div>

              {/* Items */}
              <div style={{background:'#060810', borderRadius:5, padding:'6px 8px', marginBottom:8}}>
                <table style={{width:'100%'}}>
                  <thead><tr>
                    <th style={{fontSize:7, color:'#64748b', textAlign:'left', paddingBottom:3}}>Item</th>
                    <th style={{fontSize:7, color:'#64748b', textAlign:'right'}}>Qty</th>
                    <th style={{fontSize:7, color:'#64748b', textAlign:'right'}}>Rate</th>
                    <th style={{fontSize:7, color:'#64748b', textAlign:'right'}}>GST</th>
                    <th style={{fontSize:7, color:'#64748b', textAlign:'right'}}>Amount</th>
                  </tr></thead>
                  <tbody>{rItems.map((x,xi) => (
                    <tr key={xi}>
                      <td style={{fontSize:9, color:'#c9d1d9', paddingRight:8}}>{x.product}{x.size ? <span style={{color:'#64748b'}}> ({x.size})</span> : ''}</td>
                      <td style={{fontSize:9, color:'#94a3b8', textAlign:'right'}}>{x.qty} {x.unit_mode || x.per || 'Unit'}</td>
                      <td style={{fontSize:9, color:'#94a3b8', textAlign:'right'}}>₹{x.rate}</td>
                      <td style={{fontSize:9, color:'#64748b', textAlign:'right'}}>{x.gst_pct}%</td>
                      <td style={{fontSize:9, color:'#e3a008', fontWeight:700, textAlign:'right'}}>₹{((+x.qty||0)*(+x.rate||0)).toFixed(0)}</td>
                    </tr>
                  ))}</tbody>
                </table>
                {(+pr.transport>0) && <div style={{textAlign:'right', fontSize:8, color:'#64748b', marginTop:3}}>+ Transport ₹{pr.transport}</div>}
              </div>

              {pr.notes && <div style={{fontSize:9, color:'#64748b', marginBottom:8, fontStyle:'italic'}}>📝 {pr.notes}</div>}
              {pr.rejection_reason && <div style={{background:'#f4706710', border:'1px solid #f4706733', borderRadius:4, padding:'4px 8px', fontSize:9, color:'#f47067', marginBottom:8}}>❌ Rejected: {pr.rejection_reason}</div>}

              {/* Action buttons — Pending Approval */}
              {isPending && rejecting !== pr.id && (
                <div style={{display:'flex', gap:6, alignItems:'center', flexWrap:'wrap'}}>
                  <button className="b bp" onClick={() => approvePR(pr)} disabled={processing===pr.id}
                    style={{fontSize:10, padding:'5px 16px', background:'#4ade80', borderColor:'#4ade80', color:'#000', fontWeight:700}}>
                    {processing===pr.id ? '...' : '✅ Approve'}
                  </button>
                  <button className="b" onClick={() => {setRejecting(pr.id); setRejReason('');}}
                    style={{fontSize:10, padding:'5px 14px', borderColor:'#f47067', color:'#f47067'}}>
                    ❌ Reject
                  </button>
                  <span style={{flex:1}}/>
                  <span style={{fontSize:8, color:'#64748b'}}>Requested by {pr.created_by} · ₹{(+pr.total||0).toFixed(0)}</span>
                </div>
              )}

              {/* Rejection reason input */}
              {isPending && rejecting === pr.id && (
                <div style={{background:'#f4706710', border:'1px solid #f4706733', borderRadius:6, padding:8}}>
                  <p style={{fontSize:9, color:'#f47067', fontWeight:700, marginBottom:6}}>❌ Rejection Reason</p>
                  <input className="in" value={rejReason} onChange={e=>setRejReason(e.target.value)}
                    placeholder="e.g. Rate too high — get 2 more quotes, Wrong vendor for this type of work..."
                    style={{fontSize:9, padding:'4px 8px', width:'100%', marginBottom:6, borderColor:'#f4706766'}}
                    onKeyDown={e => e.key==='Enter' && rejectPR(pr)}
                    autoFocus/>
                  <div style={{display:'flex', gap:4}}>
                    <button className="b bp" onClick={() => rejectPR(pr)} disabled={processing===pr.id}
                      style={{fontSize:10, padding:'4px 14px', background:'#f47067', borderColor:'#f47067', color:'#fff', fontWeight:700}}>
                      {processing===pr.id ? '...' : '❌ Confirm Reject'}
                    </button>
                    <button className="b bs" onClick={() => {setRejecting(null); setRejReason('');}}
                      style={{fontSize:9, padding:'4px 10px'}}>Cancel</button>
                  </div>
                </div>
              )}

              {/* WhatsApp buttons — shown after action OR for already approved/rejected */}
              {showWA && (
                <div style={{marginTop:8, padding:'8px 10px', background:'#0d2818', border:'1px solid #25d36633', borderRadius:6}}>
                  <p style={{fontSize:8, color:'#25d366', fontWeight:700, marginBottom:6}}>📱 WhatsApp Notifications (Auto-send via Interakt ✅)</p>
                  <div style={{display:'flex', gap:4, flexWrap:'wrap'}}>
                    {/* Notify Requestor */}
                    {requestorPhone && (
                      <button className="b" onClick={() => sendWhatsApp(requestorPhone,
                        isApproved ? buildApproveMsg(pr) : buildRejectMsg({...pr}),
                        isApproved ? 'iprint_pr_approved' : 'iprint_pr_rejected')}
                        style={{fontSize:9, padding:'4px 10px', background:'#25d36620', borderColor:'#25d36644', color:'#25d366'}}>
                        📱 Notify {pr.created_by}
                      </button>
                    )}
                    {/* Notify Vendor — only on approval */}
                    {isApproved && pr.vendor_phone && (
                      <button className="b" onClick={() => sendWhatsApp(pr.vendor_phone.replace(/\D/g,'').replace(/^0/,'91').replace(/^(?!91)/,'91'),
                        buildVendorMsg(pr), 'iprint_vendor_notify')}
                        style={{fontSize:9, padding:'4px 10px', background:'#25d36620', borderColor:'#25d36644', color:'#25d366'}}>
                        📱 Message Vendor
                      </button>
                    )}
                    {/* iPrint Group */}
                    <button className="b" onClick={() => {
                        const msg = buildGroupMsg(pr, isApproved ? 'approved' : 'rejected');
                        navigator.clipboard?.writeText(msg).catch(()=>{});
                        window.open(WA_GROUP, '_blank');
                        show('Message copied! Paste it in the group 📋');
                      }}
                      style={{fontSize:9, padding:'4px 10px', background:'#25d36620', borderColor:'#25d36644', color:'#25d366'}}>
                      👥 Post to iPrint Group
                    </button>
                    {/* Notify Shreya for PO — only on approval */}
                    {isApproved && (
                      <button className="b" onClick={() => sendWhatsApp(WA_NUMBERS['Shreya'],
                        `📄 *PO Required — ${pr.pr_no}*\n\nPlease generate a PO for:\n*Vendor:* ${pr.vendor_name}\n*Amount:* ₹${(+pr.total||0).toFixed(0)}\n*Firm:* ${pr.firm_code}\n*Payment Terms:* ${pr.payment_terms||'TBD'}\n\nApproved by Jigar ✅`, 'iprint_po_request')}
                        style={{fontSize:9, padding:'4px 10px', background:'#3b82f620', borderColor:'#3b82f644', color:'#3b82f6'}}>
                        📄 Request PO from Shreya
                      </button>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function RemPage({jobs,osItems,setOsItems,items,reqs,setReqs}){const rem=jobs.filter(j=>!j.po_number).map(j=>({...j,d:Math.max(0,Math.floor((new Date()-new Date(j.created_at))/864e5))})).sort((a,b)=>b.d-a.d);

  const pendingReqs=(reqs||[]).filter(r=>r.po_status==='Pending');

    const {error}=await sb.from('outsource_items').update({po_status:poNum?'PO Generated':'Pending',po_number:poNum}).eq('id',osId);
    if(!error&&setOsItems)setOsItems(p=>p.map(o=>o.id===osId?{...o,po_status:poNum?'PO Generated':'Pending',po_number:poNum}:o));
  };
  const updateReqPO=async(rId,poNum)=>{
    const {error}=await sb.from('requisitions').update({po_status:poNum?'PO Generated':'Pending',po_number:poNum}).eq('id',rId);
    if(!error&&setReqs)setReqs(p=>p.map(r=>r.id===rId?{...r,po_status:poNum?'PO Generated':'Pending',po_number:poNum}:r));
  };
  return <div>
  {pendingReqs.length>0&&<div className="c" style={{marginBottom:12,borderColor:"#8b5cf644"}}>

    <table><thead><tr><th>Req#</th><th>Job</th><th>Vendor</th><th>Items</th><th>Total</th><th>By</th><th>Date</th><th>PO#</th><th></th></tr></thead>
    <tbody>{pendingReqs.map(r=>{const rItems=Array.isArray(r.items)?r.items:[];
      return <tr key={r.id}>
        <td style={{fontWeight:800,color:"#8b5cf6",fontSize:11}}>#{r.req_no}</td>
        <td className="mn" style={{color:"#e3a008",fontWeight:700,fontSize:10}}>{r.job_id}</td>
        <td style={{fontSize:9}}>{r.vendor_name}</td>
        <td style={{fontSize:8,color:"#8b949e"}}>{rItems.map(x=>x.product).join(', ').slice(0,40)}</td>
        <td className="mn" style={{fontWeight:700,fontSize:10,color:"#e3a008"}}>₹{(+r.total||0).toFixed(0)}</td>
        <td style={{fontSize:8,color:"#64748b"}}>{r.created_by}</td>
        <td style={{fontSize:8,color:"#64748b"}}>{r.date}</td>
        <td><input className="in mn" placeholder="Enter PO#" style={{width:80,fontSize:9,padding:"2px 4px"}} onKeyDown={e=>{if(e.key==='Enter'&&e.target.value){updateReqPO(r.id,e.target.value);e.target.value='';}}}/></td>
        <td><button className="b bp" style={{fontSize:8,padding:"2px 6px",background:"#8b5cf6",borderColor:"#8b5cf6"}} onClick={e=>{const inp=e.target.parentElement.previousElementSibling?.querySelector('input');if(inp?.value){updateReqPO(r.id,inp.value);inp.value='';}}}>✓ PO</button></td>
      </tr>})}</tbody></table>
  </div>}
  {pendingOs.length>0&&<div className="c" style={{marginBottom:12,borderColor:"#f9731644"}}>
    <h3 style={{fontSize:12,fontWeight:700,color:"#f97316",marginBottom:8}}>🔧 Outsource PO Pending ({pendingOs.length})</h3>
    <table><thead><tr><th>Job</th><th>Item</th><th>Task</th><th>Vendor</th><th>Rate</th><th>Total</th><th>Added By</th><th>PO#</th><th></th></tr></thead>
    <tbody>{pendingOs.map(o=>{const li=(items||[]).find(i=>i.id===o.line_item_id);const jb=jobs.find(j=>j.id===o.job_id);
      return <tr key={o.id}>
        <td className="mn" style={{color:"#e3a008",fontWeight:700,fontSize:10}}>{o.job_id}</td>
        <td style={{fontSize:9}}>{li?.internal_name||'—'}</td>
        <td style={{fontWeight:600,color:"#f97316",fontSize:9}}>{o.task_type}</td>
        <td style={{fontSize:9}}>{o.vendor_name}</td>
        <td className="mn" style={{fontSize:9}}>₹{(+o.rate||0).toFixed(2)}/{o.rate_mode}</td>
        <td className="mn" style={{fontWeight:700,fontSize:10,color:"#e3a008"}}>₹{(+o.total||0).toFixed(2)}</td>
        <td style={{fontSize:8,color:"#64748b"}}>{o.created_by}</td>
        <td><input className="in mn" placeholder="Enter PO#" style={{width:80,fontSize:9,padding:"2px 4px"}} onKeyDown={e=>{if(e.key==='Enter'&&e.target.value){updateOsPO(o.id,e.target.value);e.target.value='';}}}/></td>
        <td><button className="b bp" style={{fontSize:8,padding:"2px 6px"}} onClick={e=>{const inp=e.target.parentElement.previousElementSibling?.querySelector('input');if(inp?.value){updateOsPO(o.id,inp.value);inp.value='';}}}>✓ PO</button></td>
      </tr>})}</tbody></table>
  </div>}
  <div className="c" style={{padding:0}}><table><thead><tr><th>Job</th><th>Client</th><th>Project</th><th>Days</th><th></th></tr></thead><tbody>
    {rem.map(j=><tr key={j.id}><td className="mn" style={{color:"#e3a008",fontWeight:700}}>{j.id}</td><td>{j.client_name?.slice(0,22)}</td><td style={{color:"#64748b"}}>{j.project}</td><td><span style={{color:j.d>30?"#ef4444":"#f59e0b",fontWeight:700}}>{j.d}d</span></td><td><button className="b br bs" onClick={()=>window.open(`mailto:?subject=PO Reminder-${j.id}&body=Dear ${j.contact_person},%0AReminder for PO:%0AJob:${j.id}%0AProject:${j.project}%0APending:${j.d} days%0ARegards,iPrint`)}>📧</button></td></tr>)}
    {rem.length===0&&<tr><td colSpan={5} style={{textAlign:"center",color:"#4ade80",padding:16}}>All POs received!</td></tr>}
  </tbody></table></div></div>;
}
